o a communication breakdown. For example, I once sent a proposal to an operations manager and heard nothing for four days. When I went to see them in person, it was sorted out in five minutes, because the email had been stuck in a senior manager's inbox. Since then, I always follow up face to face. So big companies can feel impersonal, but talking to people directly solves most of the problem.", 1], ["★ 溝通失靈", "a communication breakdown"], ["四天沒有回音", "heard nothing for four days"], ["當面跟進", "follow up face to face"], ["解決了", "sorted out"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "喜歡去的商店", "en": "Part 3 · 飲食、消費與經濟", "groups": [{"label": "Q1 Do people in your country go to…", "tone": "neu", "items": [["題目", "Do people in your country go to the shopping mall frequently?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "Fairly often, especially at weekends. This is mainly because malls in Taiwan aren't just for shopping. They're also places to escape from the heat and rain, with food courts and cinemas, so many families treat a visit as a day out. Personally, I prefer small boutiques. For example, my favourite jacket came from a shop in Zhongshan which I'd walked past many times before finally going in. However, instead of buying things in malls, people now tend to look around in person and then order online later, because it's so convenient. As a result, malls are becoming more about leisure than shopping.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["躲避炎熱的地方", "a place to escape from the heat"], ["出遊的一天", "a day out"], ["★ 人們不再……而傾向……因為……", "Instead of + V-ing, people tend to… because…"]]}, {"label": "Q2 How have people's shopping habit…", "tone": "neu", "items": [["題目", "How have people's shopping habits changed in recent decades?"], ["新撰寫・含個人素材（素材：朴寶劍）・講義修訂", "They've changed a lot. Instead of going to physical stores, people now tend to shop online because it's much more convenient. For example, with platforms like Shopee and momo, people can order almost anything and pick it up at a convenience store the next day. Shopping is also more influenced by algorithms and celebrities. I've noticed this myself: when Park Bo-gum advertised a skincare brand, it felt sincere, more like an introduction than an interruption. As a result, I'd say people buy more on impulse now, because buying things takes just one click.", 1], ["★ 人們不再……而傾向……因為……", "Instead of + V-ing, people tend to… because…"], ["★ 受……影響", "be influenced by"], ["比較像介紹而不是打擾", "more like an introduction than an interruption"], ["衝動購物", "buy on impulse"]]}, {"label": "Q3 Do you think shops and shopping…", "tone": "neu", "items": [["題目", "Do you think shops and shopping malls will disappear in the future?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "I don't think they'll disappear, but they'll definitely change. Since online shopping is cheaper and more convenient, fewer people visit shops that sell standard products, resulting in many of them closing down. However, people still want to touch and try things. For example, I bought my most-worn jacket in a small boutique in Zhongshan, and I only realised how well it suited me after trying it on, even though it cost far more than I'd planned. As a result, I think future shops will focus more on the experience rather than just selling things.", 1], ["★ 由於……，……，導致……", "Since…, …, resulting in…"], ["摸摸看、試試看", "touch and try things"], ["適合我", "suited me"], ["★ 而不是", "rather than"]]}, {"label": "Q4 What are the differences between…", "tone": "neu", "items": [["題目", "What are the differences between shopping in street markets and big shopping malls?"], ["相近題・可延用（F3-055）・講義修訂", "I think the main differences are price, atmosphere and choice. Compared with big shopping malls, street markets are usually cheaper and livelier, and the sellers often know their products well. Malls, on the other hand, are more comfortable, since they're air-conditioned and have a much wider range of brands. For example, people in Taiwan might buy fruit or snacks at a market but go to a mall for clothes or electronics. As a result, people tend to choose markets for everyday goods and malls for a relaxing day out.", 1], ["★ 與……相比", "Compared with…"], ["更多品牌選擇", "a wider range of brands"], ["另一方面", "on the other hand"], ["★ 結果……", "As a result,…"]]}, {"label": "Q5 What are the differences in the…", "tone": "neu", "items": [["題目", "What are the differences in the shopping habits of different age groups?"], ["原題（錄音逐字稿 Shopping & Money Q1）・講義修訂", "I think, compared with older people, younger people are more likely to spend money on things they enjoy right now rather than save for the future. This is mainly because many of them feel that buying a home is out of reach. In contrast, the older generation often values steady saving and long-term security. They grew up at a time when financial stability felt easier to achieve. As a result, younger people may spend for immediate enjoyment, while older people focus more on saving for the future.", 1], ["★ 與……相比，……更可能……而不是……", "Compared with…, … are more likely to… rather than…"], ["遙不可及", "out of reach"], ["財務穩定", "financial stability"], ["即時享樂", "immediate enjoyment"]]}, {"label": "Q6 What are the differences between…", "tone": "neu", "items": [["題目", "What are the differences between shopping online and in-store?"], ["原題（錄音逐字稿 Shopping & Money Q2）・講義修訂", "I think they're quite different. Online shopping not only saves time but also offers more variety, allowing people to buy things from the comfort of their homes. However, you can't touch or try the products beforehand. By contrast, in physical stores you can feel the texture, check the size, and make sure the color suits you. This reduces the risk of getting the wrong items. So online shopping offers speed and variety, while in-store shopping lets you check things in person. Both have pros and cons.", 1], ["★ 不僅……而且……，讓……", "not only… but also…, allowing…"], ["★ 在舒適的家中", "from the comfort of their homes"], ["★ 降低……的風險", "reduce the risk of"], ["優缺點", "pros and cons"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "有趣的健康文章", "en": "Part 3 · 媒體與科技", "groups": [{"label": "Q1 What are some things people usua…", "tone": "neu", "items": [["題目", "What are some things people usually do to stay healthy?"], ["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "Most people stick to the basics, like staying physically active and eating a balanced diet. In Taiwan, people walk or jog in riverside parks, go to the gym, or play badminton, which has become very popular here. This is partly because of players like Chou Tien-chen. When he played at the Olympics, my whole family watched him together in the living room, and moments like that inspire lots of amateur players. More people are also cutting down on sugary bubble tea. However, plenty of people still scroll on their phones until 2 a.m. instead of getting enough sleep.", 1], ["★ 保持身體活動量", "stay physically active"], ["★ 均衡飲食", "a balanced diet"], ["減少攝取", "cut down on"], ["★ 睡眠充足", "get enough sleep"]]}, {"label": "Q2 Do you think it’s easy or diffic…", "tone": "neu", "items": [["題目", "Do you think it’s easy or difficult for people to live a healthy lifestyle these days?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "I'd say it's easy in theory but difficult in practice. While information about health is everywhere, many people still struggle to maintain a healthy lifestyle. This is mainly because of modern work culture, with long hours, a heavy workload and constant screen time. For example, I work as a data engineer, and I can sit through a whole afternoon of data pipelines without noticing the time. As a result, many office workers lead a sedentary lifestyle. So people have the knowledge; what they lack is time and, to some extent, willpower.", 1], ["★ 很難維持健康生活", "struggle to maintain a healthy lifestyle"], ["★ 沉重的工作量", "a heavy workload"], ["★ 過著久坐的生活", "lead a sedentary lifestyle"], ["在某種程度上", "to some extent"]]}, {"label": "Q3 Do you think people will live he…", "tone": "neu", "items": [["題目", "Do you think people will live healthier lives in the future?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "Probably longer, but not necessarily healthier. Although wearable devices will make it much easier to find health problems early, I don't think people will be much healthier, because more people lead a sedentary lifestyle and processed food is cheap. I think city design will make a big difference. For example, growing up in Neihu, I've seen how the riverside park gets people outdoors. That's why I'd love a law that requires green corridors in every city of over half a million people. However, these spaces only help people who are willing to use them.", 1], ["★ 雖然……但因為……", "Although…, … because…"], ["★ 過著久坐的生活", "lead a sedentary lifestyle"], ["影響很大", "make a big difference"], ["綠色廊道", "green corridors"]]}, {"label": "Q4 What are some good ways for peop…", "tone": "neu", "items": [["題目", "What are some good ways for people to get reliable information about health?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "I think the most reliable way is still to ask a professional, like a family doctor or a pharmacist who knows your medical history. Government health agencies and hospital websites are also trustworthy, because experts check their content. The real danger is social media. This is mainly because people are constantly exposed to influencers who promote miracle cures. For example, I'm always careful about ads that exaggerate what a product can do, especially when the demonstration looks fake. So a useful habit is to check who is behind the information and whether they're selling something.", 1], ["★ 經常接觸到", "be constantly exposed to"], ["★ 這主要是因為……", "This is mainly because…"], ["神奇療法", "miracle cures"], ["誇大", "exaggerate"]]}, {"label": "Q5 Do you agree that it’s the schoo…", "tone": "neu", "items": [["題目", "Do you agree that it’s the school’s job—not the parents’—to teach young people how to live healthily?"], ["新撰寫・含個人素材（素材：閱讀與學習習慣）・講義修訂", "Not entirely. I think it should be a shared responsibility. Schools are in a good position to teach the science, such as a balanced diet and why exercise matters. Teachers can also support students' well-being. For example, I once made a card for my high school teacher because he helped me with problems in life and told me to stay positive. However, children form most of their habits at home, and they are strongly influenced by their parents. If a child eats instant noodles every night, the lesson won't work. As a result, I'd say parents play the bigger role.", 1], ["共同責任", "shared responsibility"], ["★ 均衡飲食", "a balanced diet"], ["★ 受……影響", "be influenced by"], ["扮演更重要的角色", "play the bigger role"]]}, {"label": "Q6 How important are government hea…", "tone": "neu", "items": [["題目", "How important are government health campaigns in helping people make healthy choices?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "I think they're fairly important, mainly for raising public awareness. For example, Taiwan's anti-smoking campaigns, with shocking pictures on cigarette packets, have really changed how people see smoking. However, campaigns alone rarely change behaviour, so practical changes work better. I've seen this in Neihu, where the riverside park makes exercise very easy. That's why I believe green space is essential, not just a nice extra. By combining campaigns with good city planning, governments can make the healthy choice the easy choice, which helps people develop healthy habits.", 1], ["★ 提升公眾意識", "raise public awareness"], ["★ 藉由……能……，進而……", "By + V-ing, … can…, which…"], ["★ 養成健康習慣", "develop healthy habits"], ["嚇人的圖片", "shocking pictures"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "二手網站", "en": "Part 3 · 媒體與科技", "groups": [{"label": "Q1 Some people think it's a waste t…", "tone": "neu", "items": [["題目", "Some people think it's a waste to buy too many clothes for children. What do you think?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "Mostly, yes. Children grow so fast that many of their clothes only get worn a few times. This is mainly because of social pressure, since many parents want to keep up with other families. Personally, I think about value in terms of cost per wear. The jacket I wear most cost much more than I'd planned, but I've worn it so often that the price now feels reasonable. Children's clothes rarely work like that. As a result, buying too much can put a financial strain on families. Still, kids get dirty quickly, so a few basic items that last longer are really necessary.", 1], ["★ 社會壓力", "social pressure"], ["跟別人比較", "keep up with"], ["每次穿著成本", "cost per wear"], ["★ 造成經濟壓力", "put a financial strain on"]]}, {"label": "Q2 How do people usually handle the…", "tone": "neu", "items": [["題目", "How do people usually handle the clothes they don't want?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "There are a few common ways. In Taiwan, many neighbourhoods have clothing recycling bins, and some people sell their clothes on second-hand apps like Carousell. However, a lot of cheap fast fashion still ends up in the rubbish. This is mainly because throwing clothes away saves people the trouble of selling or recycling them. Personally, I'd rather buy fewer but better things. For example, I bought a coat in Zhongshan that was far over my budget, but it's what I wear most, so it's already worth the money. So people mean well, but convenience often wins.", 1], ["快時尚", "fast fashion"], ["最後被丟掉", "end up in the rubbish"], ["★ 省去某人……的麻煩", "save someone the trouble of"], ["★ 值得花這筆錢", "worth the money"]]}, {"label": "Q3 Why do people buy second-hand cl…", "tone": "neu", "items": [["題目", "Why do people buy second-hand clothes?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "I think price is the main reason. You can get good brands for a much lower price, which is great value for money. Buying second-hand clothes not only saves people money but also cuts down on waste. Younger people are more and more aware of how wasteful the fashion industry is. For some people, it's also about style. For example, I love looking around small independent shops at different styles, colours and fabrics, so I understand why people like something unique. The main concern is hygiene, but most people get over that once they've tried it.", 1], ["★ 物有所值", "value for money"], ["★ 不僅……而且……", "Not only… but also…"], ["★ 減少浪費", "cut down on waste"], ["克服", "get over"]]}, {"label": "Q4 What problems will occur if peop…", "tone": "neu", "items": [["題目", "What problems will occur if people don't recycle?"], ["新撰寫・一般論述・講義修訂", "The most obvious problem is the amount of waste. Without recycling, landfills fill up quickly and more rubbish has to be burned, resulting in more air pollution. For example, Taiwan actually faced a rubbish crisis in the 1990s, with rubbish piling up in the streets. That's partly why the recycling system became so strict. In the long term, not recycling also means using more raw materials, which has a negative impact on the environment. Plastic is especially bad, because it doesn't disappear. It just breaks into tiny pieces called microplastics.", 1], ["★ 導致", "resulting in"], ["堆積", "pile up"], ["★ 對環境造成負面影響", "have a negative impact on the environment"], ["長期來說", "in the long term"]]}, {"label": "Q5 Should the government encourage…", "tone": "neu", "items": [["題目", "Should the government encourage people to recycle items?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "Definitely, but I think rewards work better than lectures. By making people pay for the rubbish they throw away, governments can encourage them to recycle more, which helps cut down on waste. Taiwan is a good example. You have to buy special rubbish bags, so the more you throw away, the more you pay. However, governments should also put pressure on companies, because individual families can only do so much.", 1], ["★ 藉由……能……，進而……", "By + V-ing, … can…, which…"], ["★ 減少浪費", "cut down on waste"], ["越……越……", "the more…, the more…"], ["對……施壓", "put pressure on"]]}, {"label": "Q6 How do people in your country re…", "tone": "neu", "items": [["題目", "How do people in your country recycle various items they don't want?"], ["新撰寫・一般論述・講義修訂", "Taiwan has quite a unique system. Rubbish trucks, which play music like Für Elise, come to each neighbourhood at set times, and people bring their bags out themselves. You sort paper, plastic, glass and food waste on the spot, often with volunteers checking. For bigger items like furniture, you need to book a separate collection. This can be inconvenient if you work late. However, since there are no bins left on the street, neighbourhoods stay very clean, resulting in a more pleasant environment.", 1], ["★ 關係子句補充細節", "which play music like Für Elise"], ["當場", "on the spot"], ["★ 因為……，導致……", "Since…, …, resulting in…"], ["另外預約清運", "separate collection"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "令你發笑的電影", "en": "Part 3 · 媒體與科技", "groups": [{"label": "Q1 How popular are comedy films in…", "tone": "neu", "items": [["題目", "How popular are comedy films in your country?"], ["新撰寫・含個人素材（素材：學英文：Friends 與 About Time）・講義修訂", "Quite popular, especially around Lunar New Year, when local studios release light-hearted family comedies that do very well at the box office. Foreign comedies are popular too, although jokes often get lost in translation. For example, when I started watching Friends without Chinese subtitles, I missed about sixty per cent of the jokes at first. Compared with older people, younger Taiwanese tend to watch comedy in short videos online rather than go to the cinema. As a result, comedy is still popular, but people watch it in different ways.", 1], ["輕鬆的", "light-hearted"], ["票房", "box office"], ["翻譯中流失", "lost in translation"], ["★ 與……相比，……傾向……而不是……", "Compared with…, … tend to… rather than…"]]}, {"label": "Q2 Why do you think people of all a…", "tone": "neu", "items": [["題目", "Why do you think people of all ages enjoy watching funny cartoons?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "I think good cartoons work on two levels. While children enjoy the silly physical jokes and bright colours, adults notice the clever jokes that are hidden for them. Pixar is brilliant at this. Cartoons are also easy to watch and don't need much energy. For example, I watch stand-up comedy to unwind for the same reason. After a long day, I just want something that makes me laugh and helps me relieve stress. As a result, people of all ages can enjoy them, especially when the story also has real emotion.", 1], ["★ 雖然／當……，……", "While…, …"], ["有兩個層次", "work on two levels"], ["放鬆", "unwind"], ["★ 紓解壓力", "relieve stress"]]}, {"label": "Q3 Do you agree that most people pr…", "tone": "neu", "items": [["題目", "Do you agree that most people prefer watching comedies rather than serious films?"], ["新撰寫・含個人素材（素材：學英文：Friends 與 About Time）・講義修訂", "For everyday viewing, probably yes. After a long day at work, most people prefer watching something light rather than something serious, because a comedy is an easy and safe choice. However, I'd disagree a little, because serious films often leave a deeper impression. For example, About Time is technically a romantic comedy, but what people remember is its message about family and time. So whether people choose a comedy or a serious film often depends on their mood. Maybe the films people love most mix humour with something deeper.", 1], ["★ 比較喜歡……而不是……", "prefer + V-ing rather than…"], ["留下更深刻的印象", "leave a deeper impression"], ["★ 是否……取決於……", "Whether… or… depends on…"], ["把幽默和更深的內涵結合", "mix humour with something deeper"]]}, {"label": "Q4 Do you think teachers should use…", "tone": "neu", "items": [["題目", "Do you think teachers should use jokes and encourage laughter in their classrooms?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "Yes, as long as it's done in the right way. Laughter reduces anxiety, and students learn much better when they feel relaxed. For example, when I volunteered in Lesotho at seventeen, simple games and songs helped break the ice with students who were reluctant to join in. They worked better than any lesson plan. That said, humour should support learning rather than replace it, and teachers should avoid jokes that embarrass individual students.", 1], ["打破僵局", "break the ice"], ["★ 不太願意……", "be reluctant to"], ["★ 而不是……", "… rather than…"], ["只要", "as long as"]]}, {"label": "Q5 Why are some people especially g…", "tone": "neu", "items": [["題目", "Why are some people especially good at making others laugh?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "Partly personality, but mostly because they notice things. Funny people notice small, silly details that others miss, and they describe them in surprising ways. Their timing is also usually very good. Shared laughter can strengthen relationships very quickly. For example, in my first week in my high school choir, a classmate and I kept missing the same high note. We looked at each other and burst out laughing, and we've been close friends ever since. As a result, I'd say humour is a skill people can improve with practice, but it works best when it's shared.", 1], ["突然大笑", "burst out laughing"], ["★ 加強關係", "strengthen relationships"], ["從那之後", "ever since"], ["靠練習進步", "improve with practice"]]}, {"label": "Q6 What do you think about the idea…", "tone": "neu", "items": [["題目", "What do you think about the idea that humor can be useful in business settings?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "I mostly agree. A bit of humour not only reduces tension but also helps people build strong relationships, which makes teamwork smoother. I noticed this at school. My closest friend from the choir and I only became friends after we both struggled with the same high note, looked at each other and burst out laughing. However, humour needs care at work. In many Taiwanese workplaces, people pay a lot of attention to rank, so a joke at the wrong moment can come across as unprofessional. So whether a joke helps or hurts depends on the situation.", 1], ["★ 不僅……而且……，進而……", "Not only… but also…, which…"], ["★ 建立穩固關係", "build strong relationships"], ["給人……的印象", "come across as"], ["★ 是否……取決於……", "Whether… or… depends on…"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "著名產品的廣告", "en": "Part 3 · 媒體與科技", "groups": [{"label": "Q1 Where do we often see advertisem…", "tone": "neu", "items": [["題目", "Where do we often see advertisements?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Almost everywhere. In Taipei, there are huge LED screens around Ximending, posters in MRT stations and ads on the sides of buses. However, most ads have now moved online, like social media feeds, ads before YouTube videos and posts paid for by influencers. As a result, people are constantly exposed to advertisements, even at home. I'd say online ads are more powerful because they're targeted using your data. Having worked with large datasets myself, I know how accurately companies can tell who you are.", 1], ["★ 經常接觸到廣告", "be constantly exposed to advertisements"], ["幾乎到處都是", "almost everywhere"], ["利用你的數據精準投放", "targeted using your data"], ["已轉移到網路上", "have moved online"]]}, {"label": "Q2 What are the benefits of adverti…", "tone": "neu", "items": [["題目", "What are the benefits of advertising?"], ["相近題・可延用（F3-017）・講義修訂", "I think advertising has a few clear benefits. It not only helps people discover products they might really want but also pays for a lot of free content online, allowing people to watch videos and read news for free. This is mainly because companies pay platforms to show their ads. For example, many YouTube videos are free because of the ads before them. As a result, both businesses and consumers can benefit. However, some ads can be misleading, so people still need to think carefully before they buy.", 1], ["★ 不僅……而且……，讓……", "Not only… but also…, allowing…"], ["★ 這主要是因為……", "This is mainly because…"], ["誤導的", "misleading"], ["仔細考慮", "think carefully"]]}, {"label": "Q3 Are advertisements good or bad f…", "tone": "neu", "items": [["題目", "Are advertisements good or bad for children?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Mostly bad, I'd say. Children are constantly exposed to advertisements, but they can't easily tell the difference between entertainment and selling. For example, even as an adult, I dislike ads that exaggerate what a product can do, and sometimes the demonstration looks completely fake. I can notice that, but a child usually can't. As a result, ads for snacks and toys can create unrealistic expectations and encourage unnecessary spending, because kids keep asking their parents to buy things. Having said that, some ads can spark their imagination, and public service ads about road safety or brushing teeth can be really educational.", 1], ["★ 經常接觸到廣告", "constantly exposed to advertisements"], ["★ 造成不切實際的期待", "create unrealistic expectations"], ["★ 鼓勵不必要的花費", "encourage unnecessary spending"], ["★ 激發他們的想像力", "spark their imagination"]]}, {"label": "Q4 How does advertising affect peop…", "tone": "neu", "items": [["題目", "How does advertising affect people?"], ["相近題・可延用（F3-024）・講義修訂", "Quite a lot, I'd say, especially when it comes to what people buy. People's buying decisions are often heavily influenced by advertising. This is mainly because people are constantly exposed to advertisements, so ads shape what we notice, and what we notice shapes what we want. For example, many ads don't really sell a product. They sell a lifestyle, so people feel they'll become a certain kind of person if they buy it. As a result, ads can encourage unnecessary spending and create unrealistic expectations. Knowing how ads work helps, but it doesn't stop them from working on us completely.", 1], ["★ 深受廣告影響", "be heavily influenced by advertising"], ["★ 經常接觸到廣告", "constantly exposed to advertisements"], ["★ 鼓勵不必要的花費", "encourage unnecessary spending"], ["★ 造成不切實際的期待", "create unrealistic expectations"]]}, {"label": "Q5 Do people pay attention to adver…", "tone": "neu", "items": [["題目", "Do people pay attention to advertisements on public transport?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "Less than advertisers would hope. On the Taipei MRT, almost everyone is looking at their phone, so posters on the walls are often ignored. For example, I've noticed that young people in Taiwan have recently been playing Pikmin Bloom, a mobile game where you walk and grow virtual flowers. So their attention stays on the screen even while they're moving. However, when people are exposed to the same ad on the same route every day, they may still remember it without realising. As a result, the brand starts to feel familiar.", 1], ["★ 接觸到", "be exposed to"], ["比廣告商希望的少", "less than advertisers would hope"], ["不知不覺", "without realising"], ["感覺熟悉", "feel familiar"]]}, {"label": "Q6 Do you think it is good to see t…", "tone": "neu", "items": [["題目", "Do you think it is good to see the same advertisements everywhere?"], ["新撰寫・含個人素材（素材：朴寶劍）・講義修訂", "From a company's point of view, yes, because seeing an ad again and again helps people remember the brand. For the public, though, it quickly becomes annoying, and people may even start to dislike the brand. Whether people accept it or not depends on how sincere the ad feels. For example, Park Bo-gum's skincare ads never bothered me, because he came across as sincere rather than performing. The ad felt more like an introduction than an interruption. But that's rare. As a result, most campaigns that repeat the same ad too often end up having a negative impact on the brand.", 1], ["★ 是否……取決於……", "Whether… or not depends on…"], ["看起來真誠而不是在表演", "come across as sincere rather than performing"], ["比較像介紹而不是打擾", "more like an introduction than an interruption"], ["★ 對……造成負面影響", "have a negative impact on"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "改變世界的發明", "en": "Part 3 · 媒體與科技", "groups": [{"label": "Q1 What do you think is the most us…", "tone": "neu", "items": [["題目", "What do you think is the most useful invention people have at home?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Probably the washing machine. It doesn't sound exciting, but it saves people a lot of time and effort. This is mainly because, in the past, people, usually women, had to wash clothes by hand. As a result, I'd say it helped more women go out to work. In my home, it's the machine we use most, several times a week, because dirty clothes pile up so quickly. A close second would be the fridge, which reduces food waste. Smartphones get more attention, but household appliances make daily life much easier.", 1], ["★ 節省時間與精力", "save time and effort"], ["堆積", "pile up"], ["家電", "household appliances"], ["★ 讓生活更輕鬆", "make life easier"]]}, {"label": "Q2 Do you think using household equ…", "tone": "neu", "items": [["題目", "Do you think using household equipment makes people lazier?"], ["新撰寫・含個人素材（素材：運動經驗）・講義修訂", "Not really. I think it makes people more efficient. A dishwasher or a robot vacuum simply takes care of repetitive chores, and people usually spend that time on work, family or hobbies. The one downside is that people move around less than previous generations did. For example, I spend most of the day sitting at a desk, so I stand on the MRT even when there's a free seat, just to stay physically active. As a result, I think laziness is more about people's lifestyle than the machines themselves.", 1], ["重複的家務", "repetitive chores"], ["★ 保持身體活動量", "stay physically active"], ["處理", "take care of"], ["唯一的缺點", "the one downside"]]}, {"label": "Q3 What kinds of equipment might pe…", "tone": "neu", "items": [["題目", "What kinds of equipment might people want to have at home in the future?"], ["新撰寫・含個人素材（素材：閱讀與學習習慣）・講義修訂", "I think people will want more smart devices that work automatically. For example, robots that can fold laundry or cook simple meals would be very popular, especially in an ageing society like Taiwan, where many elderly people may live alone. AI will probably be built into everything, too. I already rely on it: when an appliance breaks down, I ask AI for ideas on how to fix it first. However, there are privacy concerns. The more connected your home is, the more personal information is collected about you.", 1], ["高齡化社會", "ageing society"], ["★ 隱私疑慮", "privacy concerns"], ["★ 越……越……", "The more…, the more…"], ["★ 個人資訊", "personal information"]]}, {"label": "Q4 What types of technology are mos…", "tone": "neu", "items": [["題目", "What types of technology are most important in schools today?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "Laptops and reliable internet are essential now, because so much learning material has moved online. Students who have access to them can learn much more on their own. But I'd say the most important 'technology' is basic computer skills. For example, when I volunteered in Lesotho at seventeen, I taught middle-school students how to use Word, Google and Excel. Even those simple skills opened up new possibilities for them. However, technology is only a tool. Without well-trained teachers, expensive equipment often isn't used well.", 1], ["★ 能取得……", "have access to"], ["★ 開啟新的可能性", "open up new possibilities"], ["受過良好訓練的老師", "well-trained teachers"], ["只是工具", "only a tool"]]}, {"label": "Q5 Can watching television programm…", "tone": "neu", "items": [["題目", "Can watching television programmes in class be a good way of learning?"], ["新撰寫・含個人素材（素材：YouTube 雅典民主影片）・講義修訂", "It can, if teachers use it in the right way. A good documentary can make history or science come alive in a way a textbook rarely can, which sparks students' interest. For example, I watched a YouTube video about Cleisthenes' reforms and the birth of Athenian democracy three times and even took notes, because the story was so exciting. The problem is when teachers use videos just to fill time, and students only watch passively. As a result, it works best when a discussion follows, which keeps students engaged with the content.", 1], ["★ 激發某人的興趣", "spark someone's interest"], ["★ 讓某人保持投入", "keep someone engaged"], ["變得生動", "come alive"], ["打發時間", "fill time"]]}, {"label": "Q6 Will the computer one day comple…", "tone": "neu", "items": [["題目", "Will the computer one day completely replace the teacher?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "Unlikely, at least not completely. AI can already explain ideas, mark exercises and adjust to each student's speed, so it may take over a lot of the basic teaching. But teaching is about more than passing on information. A good teacher keeps students motivated, notices when a student is having a hard time, and builds trust with them. For example, my old maths teacher still meets former students twice a year, and no software can do that. As a result, I think AI will support teachers rather than replace them.", 1], ["接手", "take over"], ["★ 保持動力", "stay motivated / keep students motivated"], ["傳遞資訊", "pass on information"], ["★ 而不是……", "… rather than…"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "用手機做重要的事", "en": "Part 3 · 媒體與科技", "groups": [{"label": "Q1 What do people usually use their…", "tone": "neu", "items": [["題目", "What do people usually use their phones for in daily life?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Almost everything. People use LINE to stay in touch with friends, and they also use their phones for mobile payments, maps and booking appointments. This is mainly because phones let people do all these things at the touch of a button. Entertainment is also a big part. For example, I use my music app to match my mood: instrumental music when I need to focus, and ONE OK ROCK when I need energy. Funnily enough, phone calls have become one of the least common uses, especially among younger people, who often find them disturbing.", 1], ["★ 與……保持聯絡", "stay in touch with"], ["★ 只要按一下按鈕", "at the touch of a button"], ["行動支付", "mobile payments"], ["配合心情", "match my mood"]]}, {"label": "Q2 Do you think calling people is s…", "tone": "neu", "items": [["題目", "Do you think calling people is still the main use of phones?"], ["相近題・可延用（F3-112）・講義修訂", "No, I don't think so. Instead of calling, people tend to send messages because the other person can reply when it suits them. This is mainly because a phone call needs an immediate answer, while a message can wait. Messages also keep a record of what was said, which is useful at work. For example, in Taiwan most people use LINE for almost everything, and phone calls are often saved for urgent matters. As a result, calling is now just one of many uses, and for younger people it's one of the least common.", 1], ["★ 人們傾向……而不是……，因為……", "Instead of + V-ing, people tend to… because…"], ["方便時再回覆", "reply when it suits them"], ["留下紀錄", "keep a record of"], ["緊急的事", "urgent matters"]]}, {"label": "Q3 How do younger and older people…", "tone": "neu", "items": [["題目", "How do younger and older people use their phones differently?"], ["原題（F3-161）・講義修訂", "I think the main difference is what they use them for. Compared with older people, young people are more likely to use their phones for social media and entertainment rather than just for calls. They message friends, watch videos and post their own content. Older people, on the other hand, mainly use phones for calls, banking, maps and news. This is mainly because young people grew up with smartphones. As a result, older people use the phone as a tool, while younger people almost live through it.", 1], ["★ 與……相比，……更可能……而不是……", "Compared with…, … are more likely to… rather than…"], ["另一方面", "on the other hand"], ["從小就接觸", "grow up with"], ["當工具用 vs 生活在其中", "use it as a tool vs live through it"]]}, {"label": "Q4 Do you think it’s okay to call s…", "tone": "neu", "items": [["題目", "Do you think it’s okay to call someone late at night?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "Only in an emergency, or with someone very close. Most people find a late-night call quite disturbing. This is mainly because it makes people worried, and you immediately think something bad has happened. For example, when my mum was going through chemotherapy, every late call made my heart race. As a result, instead of calling about something that isn't urgent, I think it's better to send a message, because the other person can reply when it suits them.", 1], ["讓人心跳加速", "made my heart race"], ["★ 這主要是因為……", "This is mainly because…"], ["★ 與其……不如……，因為……", "Instead of + V-ing, … because…"], ["方便時再回覆", "reply when it suits them"]]}, {"label": "Q5 Should phone calls in public pla…", "tone": "neu", "items": [["題目", "Should phone calls in public places be banned because they disturb others?"], ["相近題・可延用（F3-164）・講義修訂", "Not completely, but in some places, yes. Whether phone calls should be banned depends on the place. In quiet places like libraries, cinemas or classrooms, calls really disturb others, so rules make sense. Banning calls while driving is also important, because it reduces the risk of accidents. However, a total ban in all public places would be very hard to enforce. For example, people sometimes need to make urgent calls on the street or on the bus. As a result, I think clear rules for specific places work better than banning calls everywhere.", 1], ["★ 是否……取決於……", "Whether… depends on…"], ["★ 降低事故風險", "reduce the risk of accidents"], ["全面禁止", "a total ban"], ["很難執行", "hard to enforce"]]}, {"label": "Q6 Do people speak more honestly on…", "tone": "neu", "items": [["題目", "Do people speak more honestly on the phone than face-to-face?"], ["新撰寫・含個人素材（素材：Email 四天沒回）・講義修訂", "To some extent, yes. Without eye contact, some people feel less nervous, so it's easier to bring up awkward topics. However, I'd say face-to-face conversations are better for solving problems. For example, during a migration project at work, I emailed a proposal to the operations manager, and he didn't reply for four days. When I went to see him in person, we sorted it out in five minutes. As a result, while the phone may make people more open, it's harder to avoid an issue or hide what you think when you're face to face.", 1], ["在某種程度上", "to some extent"], ["提起尷尬話題", "bring up awkward topics"], ["解決", "sort it out"], ["★ 雖然……，……", "While…, …"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "天空中有趣的事物", "en": "Part 3 · 自然、環境與動物", "groups": [{"label": "Q1 What are some things people can…", "tone": "neu", "items": [["題目", "What are some things people can usually see in the sky during the day?"], ["新撰寫・含個人素材（素材：S04 河邊夕陽野餐）・講義修訂", "The obvious ones are the sun and clouds, which change all the time with the weather. You can also see birds, planes and sometimes rainbows. In Taiwan, kites are popular at beaches and riverside parks too. However, the sky is often most beautiful at the end of the day. For example, at a riverside picnic with my family, the sky turned orange-gold over the water, and everything felt lit from within. But instead of looking up, most people tend to look at their phones because they're always busy.", 1], ["★ 關係子句 which", "which change all the time"], ["橘金色的", "orange-gold"], ["由內而外發光", "lit from within"], ["★ 人們傾向……而不是……，因為……", "instead of + V-ing, people tend to… because…"]]}, {"label": "Q2 Why do many people enjoy watchin…", "tone": "neu", "items": [["題目", "Why do many people enjoy watching the sunrise or sunset?"], ["新撰寫・含個人素材（素材：S04 河邊夕陽野餐）・講義修訂", "Partly because they're beautiful and don't last long. The colours only last a few minutes, so watching them feels like a small event. They also mark the start or end of a day, which makes people stop and think about their lives. Watching one also helps people slow down and relieve stress. For me, one sunset stands out. After my mum got the all-clear from chemotherapy, my family and our dog had an unplanned picnic in the riverside park, and the sky turned orange-gold over the water. Sunrises are less popular, simply because getting up early takes effort.", 1], ["很短暫", "don't last long"], ["★ 紓解壓力", "relieve stress"], ["特別突出", "stand out"], ["確定康復", "got the all-clear"]]}, {"label": "Q3 Do you think the sky looked any…", "tone": "neu", "items": [["題目", "Do you think the sky looked any different to people 100 years ago?"], ["新撰寫・一般論述・講義修訂", "Quite different, especially at night. Compared with today, there was much less light pollution 100 years ago, so even people in cities could see the Milky Way. During the day, there were no planes, although industrial areas probably had heavier air pollution from coal. Today, there are thousands of satellites up there, and some can even be seen moving across the night sky. So the sky itself hasn't changed, but what fills it certainly has.", 1], ["光害", "light pollution"], ["★ 與……相比", "Compared with…"], ["人造衛星", "satellites"], ["填滿它的東西", "what fills it"]]}, {"label": "Q4 Why are so many people intereste…", "tone": "neu", "items": [["題目", "Why are so many people interested in looking at the night sky?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "I'd say it's a mix of beauty and wonder. The night sky reminds people how huge the universe is, which makes everyday worries feel smaller. People have also looked at the same stars for thousands of years and created myths and calendars based on them. More recently, space exploration has sparked people's interest again. For example, I'm a big fan of SpaceX, and following their rocket launches makes space feel much closer. Also, since it's hard to see a really dark sky in cities, it feels special when you do.", 1], ["★ 激發人們的興趣", "spark people's interest"], ["太空探索", "space exploration"], ["讓日常煩惱變得渺小", "make everyday worries feel smaller"], ["美麗與驚奇的結合", "a mix of beauty and wonder"]]}, {"label": "Q5 Do you agree that it’s important…", "tone": "neu", "items": [["題目", "Do you agree that it’s important for people to learn about stars and planets?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "Yes, to some extent. Basic astronomy teaches scientific thinking, which means we know things through observation and evidence rather than belief. It also helps people understand seasons, tides and time zones. More importantly, it can spark children's curiosity. For example, my maths teacher once told me not to study a subject, but a question I can't stop thinking about. For many children, the night sky is exactly that kind of question. As a result, when children are exposed to it early, they may develop an interest in science. But a basic understanding is enough for most people.", 1], ["★ 激發孩子的好奇心", "spark children's curiosity"], ["★ 接觸到", "be exposed to"], ["★ 培養對……的興趣", "develop an interest in"], ["而不是靠信念", "rather than belief"]]}, {"label": "Q6 Why do you think there are so ma…", "tone": "neu", "items": [["題目", "Why do you think there are so many stories and legends about the moon?"], ["新撰寫・含個人素材（素材：YouTube 雅典民主影片）・講義修訂", "Mainly because the moon is easy to see and it keeps changing. Its shape changes in a regular cycle, which made it important for calendars and farming. People naturally created stories to explain those changes. In Chinese culture, for example, there's Chang'e and the whole Mid-Autumn Festival. Stories are also how humans remember things. I noticed this with a YouTube video on Athenian democracy. Because it told history as a story, I watched it three times. As a result, the moon, which is far away but feels close, is perfect for people's imagination.", 1], ["★ 關係子句 which", "which made it important for…"], ["規律的循環", "a regular cycle"], ["中秋節", "Mid-Autumn Festival"], ["遙遠卻感覺很近", "far away but feels close"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "看到動物的地方", "en": "Part 3 · 自然、環境與動物", "groups": [{"label": "Q1 How did animals help people in t…", "tone": "neu", "items": [["題目", "How did animals help people in the past?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "In many ways. Animals provided transport and power. For example, water buffalo worked in Taiwan's rice fields for centuries. They were also a source of food, clothing and materials like leather. Dogs guarded homes and helped with hunting, while cats protected grain from rats. So people relied on animals for hard work long before machines replaced them. Nowadays, pets mainly provide emotional support. Our dog, Oakley, for instance, is basically my alarm clock, because most mornings he wakes me up by jumping onto my bed.", 1], ["……的來源", "a source of"], ["依賴", "rely on"], ["★ 提供情緒支持", "provide emotional support"], ["根本是我的鬧鐘", "basically my alarm clock"]]}, {"label": "Q2 Do you think people should help…", "tone": "neu", "items": [["題目", "Do you think people should help animals more?"], ["新撰寫・一般論述・講義修訂", "Generally, yes. This is mainly because humans cause many of the problems animals face, like habitat loss, pollution and climate change. So I think we have a responsibility to protect them from the harm we cause. For example, in Taiwan, stray dogs are still a common problem, and more people now support adoption and neutering programmes. However, help should be sensible. Feeding wild animals, for example, can make them depend on humans. As a result, I think we should help more, but in a smart way.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["★ 保護……免於……", "protect someone from"], ["流浪狗", "stray dogs"], ["棲地喪失", "habitat loss"]]}, {"label": "Q3 Is it good for children to keep…", "tone": "neu", "items": [["題目", "Is it good for children to keep animals?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "On the whole, I think it's very good. Caring for a pet teaches children responsibility and empathy, because they learn that another living thing depends on them. Pets can also provide emotional support. For example, our dog, Oakley, was with us at the riverside picnic the day my mum got the all-clear. He ran happily between us and the water, and it felt like part of our family's recovery. However, parents need to be realistic. Young children can't take full responsibility, so the adults must be committed too.", 1], ["同理心", "empathy"], ["★ 提供情緒支持", "provide emotional support"], ["確定康復", "got the all-clear"], ["負起全部責任", "take full responsibility"]]}, {"label": "Q4 Why do stories and movies for ch…", "tone": "neu", "items": [["題目", "Why do stories and movies for children always feature animals?"], ["新撰寫・含個人素材（素材：Stranger Things）・講義修訂", "There are a few reasons. Animals are instantly appealing to children, and they make characters simple. A fox is clever and a lion is brave, so moral lessons are easy to understand. Animal characters also spark children's imagination and keep them engaged. They make sad themes, like loss, feel less scary too. Adults like that kind of story as well. For example, when I binge-watched Stranger Things, what I loved wasn't the supernatural side but the friendship and loyalty underneath it. Finally, cute animal characters make great toys, so there's a business reason as well.", 1], ["立即吸引人的", "instantly appealing"], ["★ 激發想像力", "spark their imagination"], ["★ 讓某人保持投入", "keep someone engaged"], ["一口氣追劇", "binge-watch"]]}, {"label": "Q5 Do you think people are more int…", "tone": "neu", "items": [["題目", "Do you think people are more interested in animals now than they were in the past?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "In some ways, yes. Compared with previous generations, people today are much more aware of animal welfare and conservation. This is mainly because they're exposed to lots of documentaries and social media. Pets are also treated much more like family members. For example, in my house, our dog joins in everything. Most mornings, Oakley is the one who wakes me up by jumping onto my bed. However, the interest isn't always deep. People love cute animal videos but pay little attention to endangered species.", 1], ["★ 與……相比", "Compared with…"], ["★ 接觸到", "be exposed to"], ["動物福利", "animal welfare"], ["瀕危物種", "endangered species"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "國內重要水域", "en": "Part 3 · 自然、環境與動物", "groups": [{"label": "Q1 What are some popular water spor…", "tone": "neu", "items": [["題目", "What are some popular water sports?"], ["原題（F3-082）・講義修訂", "In Taiwan, kayaking and stand-up paddleboarding have become more popular, especially on rivers and lakes. Surfing is popular on the east coast, and many people swim in pools or in special areas of rivers. This is mainly because Taiwan has mountains and a long coastline, so people have easy access to water. As a result, water sports are a fun way to stay physically active. However, swimming in the ocean can be dangerous because of strong currents.", 1], ["立槳", "stand-up paddleboarding"], ["★ 容易接觸到", "have easy access to"], ["★ 保持身體活動量", "stay physically active"], ["強勁的水流", "strong currents"]]}, {"label": "Q2 Why do people enjoy spending tim…", "tone": "neu", "items": [["題目", "Why do people enjoy spending time near water?"], ["相近題・可延用（F3-081）・講義修訂", "I think it's mainly because water makes people feel calm. The sound and movement of water help people relax and relieve stress, which is good for their mental well-being. Places near water also usually have more open space and fresh air than the rest of the city. For example, I take my dog, Oakley, for walks in the riverside park two or three times a week. It's how I get some fresh air and stop myself feeling bored. As a result, many people go to rivers or the beach at weekends to recharge.", 1], ["★ 紓解壓力", "relieve stress"], ["★ 促進心理健康", "boost mental well-being"], ["開闊的空間", "open space"], ["充電、恢復精力", "recharge"]]}, {"label": "Q3 Do you think all children should…", "tone": "neu", "items": [["題目", "Do you think all children should learn how to swim at school?"], ["新撰寫・含個人素材（素材：運動經驗）・講義修訂", "Absolutely. Taiwan is an island with many rivers, so swimming is a survival skill rather than just a hobby. Drowning is still a leading cause of accidental death among young people. Teaching swimming at school can reduce the risk of drowning, and it's also fair, since not every family can afford private lessons. For example, I learnt to swim as a child, and because everyone else in my class was much older, I sometimes struggled to keep up. That really stuck with me. However, the main challenge is that some rural schools still don't have access to pools.", 1], ["求生技能", "survival skill"], ["★ 降低……的風險", "reduce the risk of"], ["★ 很難……", "struggle to"], ["★ 能使用……", "have access to"]]}, {"label": "Q4 What kinds of jobs are related t…", "tone": "neu", "items": [["題目", "What kinds of jobs are related to rivers?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "There's quite a wide range. Traditionally, there are fishermen and ferry workers, and the Danshui River still has ferries that carry tourists. There are also engineers who manage dams and flood control. This is very important because Taiwan has typhoons. Scientists also check the water quality. More and more, there are leisure jobs too, such as looking after riverside parks and cycling paths. Riverside parks matter so much to me that I'd support a law requiring green corridors in every big city. As a result, rivers create opportunities for both traditional jobs and modern ones.", 1], ["防洪", "flood control"], ["水質", "water quality"], ["綠色廊道", "green corridors"], ["★ 創造機會", "create opportunities"]]}, {"label": "Q5 Why are rivers important for tou…", "tone": "neu", "items": [["題目", "Why are rivers important for tourism?"], ["原題（F3-084）・講義修訂", "I think rivers are very important for tourism. They not only offer beautiful scenery but also let people enjoy activities like cycling and boat trips, which attracts both local and foreign visitors. Rivers also support local food culture, such as fresh fish dishes. However, polluted or flooded rivers can have a negative impact on tourism. For example, the riverside parks along Taipei's river show how a well-managed river can attract visitors. As a result, cities should take good care of their rivers.", 1], ["★ 不僅……而且……，進而……", "Not only… but also…, which…"], ["★ 對……造成負面影響", "have a negative impact on"], ["管理得當的", "well-managed"], ["好好照顧", "take good care of"]]}, {"label": "Q6 What are the advantages and disa…", "tone": "neu", "items": [["題目", "What are the advantages and disadvantages of using rivers to transport people in cities?"], ["相近題・可延用（F3-083）・講義修訂", "There are some advantages. River transport not only avoids traffic jams but also offers a nice view, allowing people to enjoy their journey. However, a major drawback is that boats are slow and can only go where the river goes. They can also be stopped by bad weather, such as typhoons in Taiwan. For example, the Danshui River still has ferries, but they mostly carry tourists rather than commuters. As a result, in cities like Taipei, where the MRT and roads are well developed, river transport is more for fun than for daily travel.", 1], ["★ 不僅……而且……，讓……", "Not only… but also…, allowing…"], ["★ 主要缺點", "a major drawback"], ["塞車", "traffic jams"], ["通勤族", "commuters"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "喜歡的歌手", "en": "Part 3 · 社會、文化與歷史", "groups": [{"label": "Q1 What kinds of music do people in…", "tone": "neu", "items": [["題目", "What kinds of music do people in your country listen to the most?"], ["相近題・可延用（F3-149）・講義修訂", "I'd say pop music is the most popular, especially Chinese pop and K-pop. This is mainly because young people are constantly exposed to pop songs on social media and streaming apps. K-pop in particular has a huge influence here. At the same time, indie and folk music have grown a lot, and classical music and jazz have a smaller but loyal audience. As a result, live events like concerts and music festivals are very popular, especially among younger people.", 1], ["★ 經常接觸到（講義）", "be constantly exposed to"], ["★ 這主要是因為（講義 Part 3 架構）", "This is mainly because…"], ["影響很大", "have a huge influence"], ["小眾但忠實的聽眾", "a smaller but loyal audience"]]}, {"label": "Q2 Why do people enjoy listening to…", "tone": "neu", "items": [["題目", "Why do people enjoy listening to music?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "I think people enjoy music mainly because it changes their mood. They choose upbeat songs to get more energy and slower songs when they feel sad. For example, ONE OK ROCK gets me through a tough workday, while I put on Lizzy McAlpine when I'm tired or down. Music is also very social, because it brings people together at concerts or in choirs. As a result, music not only helps people relieve stress but also gives them a sense of belonging.", 1], ["★ 不僅……而且……（講義 7+ 句型）", "not only… but also…"], ["★ 紓解壓力（講義）", "relieve stress"], ["★ 歸屬感（講義）", "feel a sense of belonging"], ["幫我撐過辛苦的工作日", "get me through a tough workday"], ["凝聚人心", "bring people together"]]}, {"label": "Q3 How does listening to live music…", "tone": "neu", "items": [["題目", "How does listening to live music compare to listening to recorded music?"], ["原題（F3-152）・講義修訂", "Compared with recorded music, live music is much more exciting, but it's also harder to enjoy. At a concert, you share the energy with thousands of people, and you can actually feel the sound in your body, not just hear it. Also, every live show is different, so you can't experience the same moment twice. Recorded music, on the other hand, is convenient and accessible. You can listen from the comfort of your home and replay your favourite songs any time. So I think both have value.", 1], ["★ 和……相比（講義 7+ 句型）", "Compared with…"], ["★ 方便又容易取得（講義）", "convenient and accessible"], ["★ 在舒適的家中（講義）", "from the comfort of your home"], ["感受現場共同的氣氛", "share the energy"]]}, {"label": "Q4 Do you agree that every child sh…", "tone": "neu", "items": [["題目", "Do you agree that every child should learn to play a musical instrument at school?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "I'd support it as an opportunity, but not as something compulsory. Learning music helps children develop discipline and patience. Many Taiwanese kids already learn the recorder at primary school, which is a good start. In my case, it was singing rather than an instrument. I was in the school choir for six years, and organising around 60 members at competitions abroad taught me to solve problems quickly. However, if every child is forced into years of lessons, they may lose interest in music. So I think children should be exposed to music, but it shouldn't be required for too long.", 1], ["★ 接觸到（講義，此題為講義配對題）", "be exposed to"], ["★ 失去興趣（講義）", "lose interest in"], ["培養紀律和耐心", "develop discipline and patience"], ["快速解決問題", "solve problems quickly"]]}, {"label": "Q5 What do you think about the idea…", "tone": "neu", "items": [["題目", "What do you think about the idea that anyone can learn to sing well?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "I think it's mostly true, as long as people get proper training. Singing is mainly about breath control, pitch and confidence, and all three can be trained. Confidence is the one people often forget about, because many people struggle to sing in front of others. For example, a close friend from my high-school choir taught me that you can't hide your nerves when you perform. You have to be brave enough to show yourself. However, there's a limit. Training can help almost anyone sing well, but it can't give everyone a unique voice like a professional soloist.", 1], ["★ 很難做到（講義）", "struggle to"], ["只要", "as long as"], ["氣息控制", "breath control"], ["音準", "pitch"]]}, {"label": "Q6 How could governments help suppo…", "tone": "neu", "items": [["題目", "How could governments help support musicians who are very talented?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "There are several ways. By offering scholarships and grants, governments can help talented young musicians train or record without money worries, which reduces the financial burden on their families. Funding for concert halls and festivals also gives new artists a stage. International exposure matters too. For example, my high-school choir competed in Italy and France, and when the audience stood up after our performance, I realised how powerful that kind of stage can be. Perhaps the most important step, though, is protecting copyright, because streaming pays artists so little.", 1], ["★ 藉由……，可以……（講義 7+ 句型）", "By + V-ing, governments can…, which…"], ["★ 經濟負擔（講義）", "a financial burden"], ["獎學金與補助", "scholarships and grants"], ["保護著作權", "protecting copyright"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "慶祝重要事件", "en": "Part 3 · 社會、文化與歷史", "groups": [{"label": "Q1 What are some of the most import…", "tone": "neu", "items": [["題目", "What are some of the most important events in people’s lives?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "I'd say the traditional milestones are still the most important ones, like graduation, getting your first job, marriage and having children. This is mainly because they change people's daily lives and responsibilities. However, I think some of the most meaningful events are less traditional, like recovering from an illness. For example, when my mum finally got the all-clear after chemotherapy, it felt more important than any graduation. Nowadays, people also celebrate personal achievements, like buying a home or starting a business.", 1], ["★ 這主要是因為（講義 Part 3 架構）", "This is mainly because…"], ["傳統的人生里程碑", "traditional milestones"], ["被宣布完全康復", "got the all-clear"], ["慶祝個人成就", "celebrate personal achievements"]]}, {"label": "Q2 Do you think it’s better to cele…", "tone": "neu", "items": [["題目", "Do you think it’s better to celebrate special occasions with a large group of people?"], ["新撰寫・含個人素材（素材：S04 河邊夕陽野餐）・講義修訂", "Whether it's better to celebrate with a big group or a small one depends on the occasion. Weddings and big birthdays are usually more fun with a crowd, and in Taiwan, large banquets are part of the culture. But for very personal milestones, small gatherings are often more meaningful, because you can actually talk to each other. For example, when my family celebrated my mum's recovery, it was just us and the dog at a riverside picnic. We could really spend quality time together, and honestly, nothing could have been better.", 1], ["★ 是 A 還是 B 取決於（講義 7+ 句型）", "Whether… or… depends on…"], ["★ 共度有品質的時光（講義）", "spend quality time together"], ["大型宴席", "large banquets"], ["小型聚會", "small gatherings"]]}, {"label": "Q3 What can people do to make sure…", "tone": "neu", "items": [["題目", "What can people do to make sure an event is successful?"], ["相近題・可延用（F3-127）・講義修訂", "I think the most important things are careful planning and asking other people for help. This is mainly because even very capable people have blind spots, so others can notice things you miss. Sharing the work also means no one has to deal with a heavy workload. For example, if you're organising a big event with many people, it helps to give each person a clear task and check the details together beforehand. As a result, problems are solved early, and the event is much more likely to run smoothly.", 1], ["★ 沉重的工作量（講義）", "a heavy workload"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result,…"], ["盲點", "blind spots"], ["進行順利", "run smoothly"]]}, {"label": "Q4 In what ways do people celebrate…", "tone": "neu", "items": [["題目", "In what ways do people celebrate important national events?"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "In Taiwan, National Day is celebrated with a military parade, a ceremony in front of the Presidential Office and a fireworks show, which moves to a different city each year. But for most people, holidays are really about family. For traditional festivals like Lunar New Year, people have reunion dinners, give red envelopes and spend quality time with their relatives. In my family, for example, we all make dumplings together, which used to be my grandma's job. So the events are public, but the way people celebrate is often quite private.", 1], ["★ 共度有品質的時光（講義）", "spend quality time with"], ["閱兵", "military parade"], ["團圓飯", "reunion dinner"], ["紅包", "red envelope"]]}, {"label": "Q5 Why is it important to remember…", "tone": "neu", "items": [["題目", "Why is it important to remember national events?"], ["新撰寫・含個人素材（素材：YouTube 雅典民主影片）・講義修訂", "I think it's important because these events shape how people see their own country. Remembering key moments, including sad ones, helps people understand why their society is the way it is. For example, in Taiwan, remembering the 228 Incident reminds people how hard they fought for democracy. I find history fascinating for exactly this reason. I once watched a YouTube video about how around thirty thousand Athenian citizens invented democracy three times. In other words, history lets us learn from people in the past. Of course, remembering should make people think, not make them angry at others.", 1], ["★ 講義 Part 3 架構", "For example,… / In other words,…"], ["影響人們如何看待自己的國家", "shape how people see their own country"], ["爭取民主", "fought for democracy"], ["向過去的人學習", "learn from people in the past"]]}, {"label": "Q6 Is celebrating national events a…", "tone": "neu", "items": [["題目", "Is celebrating national events a waste of public money?"], ["新撰寫・含個人素材（素材：倫敦聖誕節塞車）・講義修訂", "Not necessarily, as long as the spending is reasonable. National celebrations not only lift people's spirits but also attract tourists, allowing local businesses to make more money. For example, fireworks events in Taiwan draw huge crowds to host cities. But big crowds also have costs. When I was in London at Christmas, a five-minute bus ride near Piccadilly Circus took almost an hour, until the driver gave up and let us all off halfway. So the question isn't whether to celebrate, but whether the budget is clear and the planning is sensible.", 1], ["★ 不僅……而且……，使得……（講義 7+ 句型）", "not only… but also…, allowing…"], ["提振士氣", "lift people's spirits"], ["吸引大批人潮", "draw huge crowds"], ["讓我們半路下車", "let us all off halfway"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "國內的名人", "en": "Part 3 · 社會、文化與歷史", "groups": [{"label": "Q1 Why are some children more popul…", "tone": "neu", "items": [["題目", "Why are some children more popular than others at school?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "I think it usually comes down to social confidence. Children who are outgoing, funny or good at sports tend to make friends easily. Unfortunately, having the latest gadgets plays a role too. But confidence can work both ways. For example, a close friend from my school choir was extremely outgoing, and at first I found her a bit too much. We only became close after laughing at a high note we both kept missing. As a result, I believe the most popular child isn't always the loudest, but the one people feel comfortable around.", 1], ["★ People who… 抽象句（講義關係子句 Part 3）", "Children who are outgoing…"], ["★ 講義 Part 3 架構", "For example,… / As a result,…"], ["歸結於", "comes down to"], ["在……身邊感到自在", "feel comfortable around"]]}, {"label": "Q2 What are the pros and cons of be…", "tone": "neu", "items": [["題目", "What are the pros and cons of being popular at school?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "On the plus side, popular students usually gain confidence and develop strong social skills, which help them later in life. They also tend to enjoy school more. However, a major drawback is the pressure. Popular kids often feel they have to keep up an image and fit in all the time. This kind of social pressure can be really tiring. As someone who's quite introverted, I need some me time to recharge, so I can imagine how exhausting that would be. Some popular students may also care more about status than studying, or leave others out to protect their position.", 1], ["★ 主要缺點（講義 14 天片語）", "a major drawback"], ["★ 社會壓力（講義 14 天片語）", "social pressure"], ["維持形象", "keep up an image"], ["充電；恢復精力", "recharge"]]}, {"label": "Q3 Do you think students who are po…", "tone": "neu", "items": [["題目", "Do you think students who are popular at school will still be popular when they grow up?"], ["新撰寫・含個人素材（素材：自學的同事）・講義修訂", "Not necessarily. School popularity often depends on surface things like looks or sports ability. These matter much less in adult life, where people value skill and reliability. For example, one of my colleagues studied business, but he taught himself data engineering through online resources and open-source projects. Now he's a team lead, and what got him there was asking the right questions and fixing mistakes fast. So popular students who rely only on their looks may struggle to stay popular as adults. Still, early social skills can give them a lasting advantage.", 1], ["★ 很難做到（講義）", "struggle to"], ["★ People who… 抽象句（講義關係子句）", "popular students who rely only on their looks"], ["重視能力與可靠", "value skill and reliability"], ["持久的優勢", "a lasting advantage"]]}, {"label": "Q4 How important is it to be popula…", "tone": "neu", "items": [["題目", "How important is it to be popular with colleagues at work?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "Being liked at work matters more than people admit, but the real goal isn't popularity; it's trust. This is mainly because projects depend on teamwork, and colleagues are much more willing to help someone they respect. For example, when I led a database migration across about 1,200 servers, it only worked because different teams trusted us enough to agree on when to roll it out. As a result, building strong relationships is really a professional skill, not just a social bonus.", 1], ["★ 建立穩固關係（講義）", "build strong relationships"], ["★ 講義 Part 3 架構", "This is mainly because… / For example,… / As a result,…"], ["願意幫忙", "be willing to help"], ["社交上的額外好處", "a social bonus"]]}, {"label": "Q5 Does a good boss have to be popu…", "tone": "neu", "items": [["題目", "Does a good boss have to be popular with his/her employees?"], ["新撰寫・含個人素材（素材：物流科技創業者（化名 Wei））・講義修訂", "A good boss doesn't need to be popular, but they definitely need to be respected. A boss who only wants to be liked may avoid tough decisions, which hurts the team in the long run. For example, I once worked as a consultant on a data project for a logistics start-up. The founder kept asking what would break first if traffic tripled, and he insisted on spending twice as long to get things right the first time. That kind of careful attitude is what earns respect. In my experience, respect comes first, and popularity follows.", 1], ["★ People who… 抽象句（講義關係子句）", "A boss who only wants to be liked"], ["艱難的決定", "tough decisions"], ["長遠來看", "in the long run"], ["一次就做對", "get things right the first time"]]}, {"label": "Q6 Are people often promoted more f…", "tone": "neu", "items": [["題目", "Are people often promoted more for their popularity than for their ability?"], ["新撰寫・含個人素材（素材：自學的同事）・講義修訂", "It happens more than it should. Promotions involve personal judgement, and managers naturally favour people who speak up in meetings. Many quiet employees are reluctant to express their opinions in front of their managers, so capable people can be overlooked. Still, in engineering, results are fairly easy to measure. For example, a colleague of mine started with a business degree, taught himself data engineering, and became a team lead because he was always willing to change his ideas quickly. So popularity can help someone move up faster, but it rarely keeps a career going without real ability.", 1], ["★ 不願意表達意見（講義）", "be reluctant to express their opinions"], ["在會議中發言", "speak up in meetings"], ["被忽略", "be overlooked"], ["升遷更快", "move up faster"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "喜歡的傳統物品", "en": "Part 3 · 社會、文化與歷史", "groups": [{"label": "Q1 What kinds of traditional produc…", "tone": "neu", "items": [["題目", "What kinds of traditional products are made in your country?"], ["新撰寫・一般論述・講義修訂", "Taiwan has quite a range. Tea is probably the best known, and high-mountain oolong tea from places like Alishan is world-class. There are also crafts like Yingge pottery, hand-made paper umbrellas from Meinong and indigenous weaving. Food products count too, such as pineapple cakes, sun cakes and locally made soy sauce. These days, many of these products come in modern packaging, which helps spark younger buyers' interest.", 1], ["★ 激發某人的興趣（講義）", "spark someone's interest"], ["世界級的", "world-class"], ["陶器", "pottery"], ["原住民編織", "indigenous weaving"]]}, {"label": "Q2 Do you think traditional product…", "tone": "neu", "items": [["題目", "Do you think traditional products are usually of better quality than modern ones?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "Often, but not always. Traditional products are usually made in small numbers by skilled craftspeople, so they tend to show more attention to detail than factory-made goods. I've noticed something similar with clothing. For example, the jacket I wear most came from a small shop in Zhongshan. It cost far more than I'd planned to spend, yet it's the piece I reach for most. In other words, it was worth the money. That said, modern factories are very consistent, and some traditional items are overpriced just because people feel nostalgic.", 1], ["★ 值得花這筆錢（講義）", "worth the money"], ["★ 講義 Part 3 架構", "For example,… / In other words,…"], ["注重細節", "attention to detail"], ["我最常拿來穿的那件", "the piece I reach for most"]]}, {"label": "Q3 How can traditional products hel…", "tone": "neu", "items": [["題目", "How can traditional products help boost a country’s tourism industry?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "Traditional products not only give tourists a real local experience but also give them something to take home, allowing rural communities to earn more income. In Taiwan, many visitors go to Yingge to try making pottery, or to tea farms in Pinglin to pick and roast tea leaves. Travellers want to feel the character of a place. For example, when I went to Italy with my school choir, what I remember most from our free time is the train through Tuscany, past cypress trees and vineyards. The key is keeping things authentic, though. Cheap, factory-made souvenirs lose their appeal.", 1], ["★ 不僅……而且……，使得……（講義 7+ 句型）", "not only… but also…, allowing…"], ["可以帶回家的東西", "something to take home"], ["感受當地特色", "feel the character of a place"], ["失去吸引力", "lose their appeal"]]}, {"label": "Q4 How important is it for people t…", "tone": "neu", "items": [["題目", "How important is it for people to know about their own country's traditions?　（原題：人們瞭解自己國家的傳統有多重要?）"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "I think it's fairly important, because traditions help people understand where they come from. Knowing why we honour our ancestors or eat certain foods at festivals helps younger people connect with older relatives, which strengthens family bonds. My mum, for instance, has kept a printed family photo album for about thirty years. It even includes ordinary photos from her treatment, because, as she says, those days happened too. That kind of record keeps a family's story alive. Still, knowing traditions doesn't mean people have to follow them blindly.", 1], ["★ 加強家庭關係（講義）", "strengthen family bonds"], ["祭祖", "honour our ancestors"], ["讓家族故事延續", "keep a family's story alive"], ["盲目遵循", "follow them blindly"]]}, {"label": "Q5 Should young people learn about…", "tone": "neu", "items": [["題目", "Should young people learn about traditions at home or at school?　（原題：年輕人是否應該在家裡或學校接受傳統教育?）"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "Whether young people should learn about traditions at home or at school depends on what they need to learn, so ideally both. School can explain why a festival exists and how it has changed over time. But traditions are really lived at home. For example, in my family we make dumplings together at festivals, which used to be my grandmother's job. Doing it with our own hands creates an emotional connection that no textbook can. As a result, school explains traditions, while families keep them alive. The risk is that busy families stop doing these things, and then school becomes the only link.", 1], ["★ 是 A 還是 B 取決於（講義 7+ 句型）", "Whether… or… depends on…"], ["★ 講義 Part 3 架構", "For example,… / As a result,…"], ["情感連結", "an emotional connection"], ["使其延續", "keep them alive"]]}, {"label": "Q6 Should tourists learn about a co…", "tone": "neu", "items": [["題目", "Should tourists learn about a country's traditions before visiting it?　（原題：遊客在參觀一個國家之前應該瞭解這個國家的傳統?）"], ["新撰寫・含個人素材（素材：YouTube 雅典民主影片）・講義修訂", "Yes, at least the basics. By learning about local traditions before a trip, tourists can avoid embarrassing mistakes, which shows respect to local people. For example, in Taiwan, sticking chopsticks straight up in a bowl of rice is linked to funerals. Knowing the background also makes a trip more interesting. I'd love to visit the Acropolis one day, and I've already watched a YouTube video about how Athenian democracy began three times. I even took notes. Learning a few words of the language helps too. Locals rarely expect perfection; they just appreciate the effort.", 1], ["★ 藉由……，可以……（講義 7+ 句型）", "By + V-ing, tourists can…, which…"], ["避免尷尬的錯誤", "avoid embarrassing mistakes"], ["和……有關", "be linked to"], ["感激付出的努力", "appreciate the effort"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "美麗的物品", "en": "Part 3 · 社會、文化與歷史", "groups": [{"label": "Q1 Do you think there are more beau…", "tone": "neu", "items": [["題目", "Do you think there are more beautiful things now than in the past? Why?"], ["新撰寫・含個人素材・講義修訂", "In some ways, yes. Compared with the past, people today have access to many more beautiful things, rather than only what is in their own town. This is mainly because of the internet and travel. For example, I bought a lamp in Vietnam that I would never have seen if I hadn't travelled there. But I think natural beauty, like sunsets or mountains, hasn't really changed. As a result, I'd say we can see more beautiful things now, but there aren't really more of them.", 1], ["★ 和……相比，……而不是……", "Compared with…, … rather than…"], ["★ 能接觸到", "have access to"], ["★ 這主要是因為……", "This is mainly because…"]]}, {"label": "Q2 What beautiful scenery spots are…", "tone": "neu", "items": [["題目", "What beautiful scenery spots are there in your country?"], ["新撰寫・含個人素材・講義修訂", "Taiwan has quite a lot, even though it's a small island. Jiufen is probably the most famous, because it's an old mining town with narrow streets and a great view of the sea. People who love mountains often go to Alishan, which is well known for its sunrise and tea fields. But you don't always need to travel far. For example, the riverside parks in Taipei can be really beautiful at sunset. My family once had a picnic there, and the sky turned orange over the river. It's one of my favourite memories.", 1], ["★ ……的人", "People who…（關係子句）"], ["以……聞名", "well known for"], ["天空變成橘色", "the sky turned orange"]]}, {"label": "Q3 Where do you think people usuall…", "tone": "neu", "items": [["題目", "Where do you think people usually come into contact with beautiful things?"], ["新撰寫・含個人素材・講義修訂", "I think it depends on the person, but nature is the most common place. People who live near mountains or rivers are exposed to beautiful views almost every day. In cities, people usually see beautiful things in museums, old buildings or nice cafés. These days, social media is another big one, because we see beautiful photos all the time on our phones. For example, one nice travel photo online can make people want to visit a place. As a result, people come into contact with beautiful things more often than before, even at home.", 1], ["★ 取決於……", "it depends on…"], ["★ 接觸到、暴露在……之中", "be exposed to"], ["接觸到", "come into contact with"]]}, {"label": "Q4 Why do you think people enjoy vi…", "tone": "neu", "items": [["題目", "Why do you think people enjoy visiting beautiful places?"], ["新撰寫・含個人素材・講義修訂", "I think the main reason is that beautiful places help people relieve stress. Since most of us have a heavy workload and spend all day looking at screens, a nice view makes us slow down and feel calm. Visiting a new place also helps people broaden their horizons. For example, when I visited Italy with my choir, seeing the Colosseum and Pompeii was a rewarding experience. I still remember how amazed I felt. So beautiful places are not only relaxing but also memorable, which is why people keep going back.", 1], ["★ 紓解壓力", "relieve stress"], ["★ 沉重的工作量", "a heavy workload"], ["★ 拓展視野", "broaden their horizons"], ["★ 有收穫的經驗", "a rewarding experience"], ["★ 不只……也……，這……", "not only… but also…, which…"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "有趣的傳統故事", "en": "Part 3 · 社會、文化與歷史", "groups": [{"label": "Q1 What kinds of stories do childre…", "tone": "neu", "items": [["題目", "What kinds of stories do children usually enjoy?"], ["新撰寫・含個人素材（素材：Stranger Things）・講義修訂", "Mostly stories with adventure, animals or magic. This is mainly because children love a clear hero and villain, lots of action and a happy ending. They'll happily hear the same story twenty times. As they grow older, stories about friendship become more appealing. For example, even as an adult, what got me into Stranger Things wasn't the horror but the loyalty between the characters. As a result, I think these stories spark children's imagination and let them feel braver than they are, although every child is different.", 1], ["★ 激發想像力（講義）", "spark their imagination"], ["★ 講義 Part 3 架構", "This is mainly because… / For example,… / As a result,…"], ["圓滿結局", "a happy ending"], ["讓我迷上", "got me into"]]}, {"label": "Q2 Why do some children like to lis…", "tone": "neu", "items": [["題目", "Why do some children like to listen to a story before going to sleep?"], ["新撰寫・一般論述・講義修訂", "Mainly for comfort and routine. A bedtime story tells children that the day is ending, which helps them relax. It's also special one-on-one time with a parent. Spending quality time with mum or dad makes them feel safe before the lights go off. On top of that, stories spark their imagination and often carry them gently into dreams. Of course, some kids simply use it to delay bedtime.", 1], ["★ 共度有品質的時光（講義）", "spend quality time with"], ["★ 激發想像力（講義）", "spark their imagination"], ["一對一相處時間", "one-on-one time"], ["拖延睡覺時間", "delay bedtime"]]}, {"label": "Q3 Do you think it is more enjoyabl…", "tone": "neu", "items": [["題目", "Do you think it is more enjoyable for children to read stories or to write them?"], ["新撰寫・含個人素材（素材：The Secret（書）與醫院候診室）・講義修訂", "Compared with writing, reading is usually more enjoyable for most children, because it's easy. They're simply carried along by the story. Writing, on the other hand, needs spelling, struc
