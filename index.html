rse because scooter riders switch to cars or taxis. Holidays can be terrible too. For example, I was in London at Christmas, and after shopping around Piccadilly Circus, I took a bus to the Tube station. A five-minute ride took almost an hour, and in the end the driver gave up and let everyone off halfway.", 1], ["尖峰時段", "rush hour"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["改用", "switch to"], ["讓大家半路下車", "let everyone off halfway"]]}, {"label": "Q2 What’s the difference between be…", "tone": "neu", "items": [["題目", "What’s the difference between being stuck in traffic in a car and on a bus?"], ["新撰寫・含個人素材（素材：倫敦聖誕節塞車）・講義修訂", "The main difference is control versus freedom. Compared with driving, taking a bus lets you relax rather than concentrate on the road. In a car, you have privacy, but the time is basically wasted and quite stressful. On a bus, you can read or just switch off, but you have no control at all. For example, in London at Christmas, a five-minute bus ride near Piccadilly Circus took almost an hour, and in the end the driver gave up and let us all off halfway. Still, buses often have their own lanes, so they're usually the better option.", 1], ["★ 講義 7+ 句型", "Compared with…, … rather than…"], ["放空、放鬆", "switch off"], ["放棄", "give up"], ["較好的選擇", "the better option"]]}, {"label": "Q3 Do you think traffic in cities w…", "tone": "neu", "items": [["題目", "Do you think traffic in cities will become worse in the future?"], ["新撰寫・含個人素材（素材：物流科技創業者（化名 Wei））・講義修訂", "Not necessarily. Whether traffic gets worse depends on government policy more than population. If cities just keep building wider roads, more people will drive, and the traffic will come back. But by investing in public transport, cities can reduce the number of cars, which makes traffic move more smoothly. A logistics founder who I worked with as a consultant always asked, 'What breaks first when traffic triples?' I think city planners need that kind of thinking. Self-driving cars are still a big unknown, though. They could make traffic smoother, or make driving so comfortable that more people do it.", 1], ["★ 講義 7+ 句型", "Whether… depends on…"], ["★ By + V-ing 句型（講義）", "by investing in…, cities can…, which…"], ["很大的未知數", "a big unknown"], ["更順暢", "move more smoothly"]]}, {"label": "Q4 Do highways help traffic move mo…", "tone": "neu", "items": [["題目", "Do highways help traffic move more smoothly?"], ["原題（F3-119）・講義修訂", "Only partly, and only for a while. New highways can reduce traffic at first, but one unintended consequence is that they encourage more people to drive. This is mainly because when driving becomes easier, people move further away from the city and use their cars more. For example, a new highway may be quite empty in its first year, but a few years later it can be just as busy as the old roads. As a result, highways help people travel between cities, but they don't really solve traffic problems inside cities.", 1], ["★ 非預期的後果（講義 14 天片語）", "an unintended consequence"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["只是一時", "only for a while"], ["解決交通問題", "solve traffic problems"]]}, {"label": "Q5 How can public transport help re…", "tone": "neu", "items": [["題目", "How can public transport help reduce traffic jams?"], ["原題（F3-118）・講義修訂", "By providing fast and frequent public transport, cities can take many cars off the road, which reduces traffic jams. This is mainly because people will only leave their cars at home if public transport is really convenient. The problem in many cities is that there are gaps, especially in outer areas and outside rush hour. When a car is the only practical option, people use cars. Good public transport not only reduces traffic but also cuts carbon emissions, allowing people to travel in a cheaper and greener way. As a result, cities should fill those gaps rather than just expand what already exists.", 1], ["★ 講義 7+ 句型", "By + V-ing, cities can…, which…"], ["★ 講義 7+ 句型（本題是講義例題）", "not only… but also…, allowing…"], ["★ 減少碳排放（講義搭配詞）", "cut carbon emissions"], ["唯一可行的選擇", "the only practical option"]]}, {"label": "Q6 Can traffic problems only be sol…", "tone": "neu", "items": [["題目", "Can traffic problems only be solved by government action?"], ["相近題・可延用（F3-117）・講義修訂", "No, I don't think so, although the government plays the biggest role. It can build better public transport, charge drivers for entering busy areas and create more cycling lanes. For example, Taipei has made real progress with the MRT. However, ordinary people also matter. Instead of driving everywhere, people can take the MRT, walk or ride a bike for short trips, which really helps. Companies can help too by letting staff work flexible hours. As a result, traffic problems are best solved when the government and ordinary people work together.", 1], ["★ 講義 7+ 句型", "Instead of + V-ing, …"], ["扮演最重要的角色", "plays the biggest role"], ["有真正的進展", "made real progress"], ["★ 講義 Part 3 架構", "As a result, …"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "宜居之地", "en": "Part 3 · 地點、建築、旅遊與交通", "groups": [{"label": "Q1 What kinds of places do people p…", "tone": "neu", "items": [["題目", "What kinds of places do people prefer to live in?"], ["原題（F3-091）・講義修訂", "In Taiwan, most people, especially young people, live in apartments in big cities like Taipei. This is mainly because they want to be close to their jobs, public transport and friends. Whether people prefer a city apartment or a house depends on their age and income. For example, older people and those with higher incomes often prefer a house which has a garden or some outdoor space. As a result, I think most people dream of a home that offers both convenience and peace.", 1], ["★ 講義 7+ 句型", "Whether people prefer A or B depends on…"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["靠近", "be close to"], ["既方便又安靜", "both convenience and peace"]]}, {"label": "Q2 What are the advantages of livin…", "tone": "neu", "items": [["題目", "What are the advantages of living close to where you work?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "The biggest advantage is saving time. A short commute can save people an hour a day, which they can spend on exercise, family or sleep. It also reduces stress and travel costs. This matters most during difficult periods. For example, when my mum was having chemotherapy, I was working full-time, but I came home as much as possible, so every minute I saved on travel counted. However, a major drawback is that housing near business areas tends to be expensive. Some people also prefer to keep work and home separate.", 1], ["通勤", "commute"], ["★ 主要缺點（講義 14 天片語）", "a major drawback"], ["每分鐘都很重要", "every minute counted"], ["工作與家庭分開", "keep work and home separate"]]}, {"label": "Q3 What are the differences between…", "tone": "neu", "items": [["題目", "What are the differences between the places older and younger people prefer to live in?"], ["相近題・可延用（F3-097）・講義修訂", "Compared with older people, young people are more likely to live in big cities rather than quiet areas. This is mainly because cities offer more jobs, education and nightlife, and it's easier to meet friends there. Older people, on the other hand, usually prefer quieter places which have fresh air, parks and good hospitals. For example, many retired people in Taiwan move to the suburbs or the countryside. As for me, I'd like a slower-paced city which still has good facilities, like Tainan. As a result, people's choices often change as they get older.", 1], ["★ 講義 7+ 句型", "Compared with…, … are more likely to… rather than…"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["另一方面", "on the other hand"], ["步調較慢的", "slower-paced"]]}, {"label": "Q4 Why do some people choose to mov…", "tone": "neu", "items": [["題目", "Why do some people choose to move to a different area?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Usually for practical reasons, like a new job, cheaper housing or better schools. In Taiwan, many young people move to Taipei or Hsinchu for career opportunities. At the same time, others move out to New Taipei or Taoyuan because Taipei rents put a financial strain on them. Lifestyle matters too. For example, even though I love Neihu, where I grew up, I can imagine moving somewhere slower-paced but still convenient, like Tainan. And sometimes it's emotional, because people simply want a fresh start after a difficult period.", 1], ["職涯機會", "career opportunities"], ["★ 對……造成經濟壓力（講義搭配詞）", "put a financial strain on"], ["步調慢但仍方便", "slower-paced but still convenient"], ["重新開始", "a fresh start"]]}, {"label": "Q5 What should people prepare befor…", "tone": "neu", "items": [["題目", "What should people prepare before moving to a new place?"], ["新撰寫・含個人素材（素材：決定離職、出國念書）・講義修訂", "First, people should do some research on the cost of living, transport and nearby facilities. They also need to plan their money carefully. In my case, I'm preparing to study abroad, so I had to think about the financial pressure. I might even need to borrow money, but I decided the long-term benefits were more important than the short-term costs. People also need a plan for making friends, because loneliness is a challenge that many people don't expect. This helps them feel a sense of belonging much faster.", 1], ["★ 生活成本（講義搭配詞）", "the cost of living"], ["★ 感受到歸屬感（講義搭配詞）", "feel a sense of belonging"], ["長期好處", "long-term benefits"], ["很多人沒預料到的挑戰", "a challenge that many people don't expect"]]}, {"label": "Q6 Do you think choosing where to l…", "tone": "neu", "items": [["題目", "Do you think choosing where to live is the most important decision in a person’s life?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "It's one of the most important, but I wouldn't say it's the most important. Where you live affects your commute, your friends and your daily routine, so its effects build up over time. However, I think choosing a career or a partner has a bigger impact. For example, my career choice was influenced by my maths teacher, who told me to study a question I couldn't stop thinking about. That's why I chose computer science. Also, it's easier to change where you live, because you can always move. So it's an important decision, but rarely the most important one.", 1], ["★ 受……影響（講義）", "be influenced by"], ["隨時間累積", "build up over time"], ["影響更大", "has a bigger impact"], ["隨時都能搬家", "you can always move"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "穿著不尋常的人", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 How do people usually dress for…", "tone": "neu", "items": [["題目", "How do people usually dress for work in your country?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "It really depends on the industry. In Taiwan, banks, government offices and law firms still expect quite formal clothes, like shirts and blazers. But in the tech industry, most people dress casually. This is mainly because our hot, humid weather makes suits uncomfortable for most of the year. Personally, I'm passionate about fashion, and I enjoy looking around independent little shops for outfit ideas, so I like having that freedom. Overall, Taiwanese workwear tends to be practical rather than fancy, unless you have to meet clients.", 1], ["★ 講義 Part 3 架構", "This is mainly because…"], ["★ 對……充滿熱情（講義搭配詞）", "be passionate about"], ["實用而非花俏", "practical rather than fancy"], ["穿著休閒", "dress casually"]]}, {"label": "Q2 Why do you think older and young…", "tone": "neu", "items": [["題目", "Why do you think older and younger people often wear different styles of clothing at work?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "Mostly because they were influenced by different workplace rules. Older employees started working when a suit showed professionalism and respect, so that habit has stayed with them. Younger people grew up with social media, where expressing yourself is important. I'm a good example. One of my favourite pieces is a slightly oversized coat from a small shop in Zhongshan, and it's what I wear most. That said, the gap seems to be getting smaller because dress codes are becoming more relaxed everywhere.", 1], ["★ 受……影響（講義）", "be influenced by"], ["表達自我", "express yourself"], ["略寬鬆的", "slightly oversized"], ["服裝規定", "dress codes"]]}, {"label": "Q3 Do you agree that it’s more impo…", "tone": "neu", "items": [["題目", "Do you agree that it’s more important to feel comfortable than to look smart at work?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "To a large extent, yes. In Taiwan's heat, feeling uncomfortable makes it hard to stay focused, which can lead to a decline in productivity. Nobody thinks clearly in a tight collar on a 35-degree day. For example, the piece I wear most is a slightly loose jacket in a neutral colour, which looks smart but still feels comfortable. However, it doesn't have to be one or the other. In jobs where you meet clients, appearance affects first impressions. As a result, the best choice is something that's both comfortable and smart.", 1], ["★ 保持專注（講義搭配詞）", "stay focused"], ["★ 生產力下降（講義 14 天片語）", "a decline in productivity"], ["二選一", "one or the other"], ["第一印象", "first impressions"]]}, {"label": "Q4 What are the most important thin…", "tone": "neu", "items": [["題目", "What are the most important things people should think about when buying new clothes?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "I think practicality comes first. Many people in Taiwan are tempted by cheap trends, but things they buy on impulse often end up forgotten at the back of the wardrobe. In my opinion, fit and quality matter more than price. For example, I bought a jacket from a small boutique in Zhongshan which cost far more than my budget. However, it's now the item I wear most, so it was definitely worth the money. Of course, not everyone can spend that much, especially people on a tight budget, and the waste from fast fashion matters too.", 1], ["衝動購買", "buy on impulse"], ["★ 值得花這筆錢（講義搭配詞）", "worth the money"], ["★ 預算有限（講義搭配詞）", "a tight budget"], ["快時尚", "fast fashion"]]}, {"label": "Q5 What do you think about the idea…", "tone": "neu", "items": [["題目", "What do you think about the idea of buying clothes online?"], ["相近題・可延用（錄音逐字稿 Shopping & Money Q2）・講義修訂", "I think it's convenient, but it's not perfect. Online shopping saves people the trouble of going to physical stores, so they can buy clothes from the comfort of their homes. However, a major drawback is that you can't touch or try on the clothes first. In physical stores, by contrast, you can feel the fabric, check the size and make sure the color suits you, which reduces the risk of buying the wrong items. As a result, I think online shopping is great for speed and variety, but shopping in person is safer for clothes.", 1], ["★ 省去……的麻煩（講義搭配詞）", "save people the trouble of"], ["★ 在舒適的家中（講義搭配詞）", "from the comfort of their homes"], ["★ 主要缺點（講義 14 天片語）", "a major drawback"], ["★ 降低……的風險（講義搭配詞）", "reduce the risk of"]]}, {"label": "Q6 Why do so many people enjoy shop…", "tone": "neu", "items": [["題目", "Why do so many people enjoy shopping for clothes in their free time?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Mainly because it's a fun and easy way to relax. Looking around shops feels exciting because people can always find something new, and it helps them relieve stress. In Taipei, it's often combined with coffee or a meal. I do this myself. In the evenings, I like walking around Zhongshan's boutiques and independent cafés, and a quick look easily turns into an evening out. However, for some people it can become an unhealthy habit, especially now that they can buy clothes online at the touch of a button.", 1], ["★ 紓解壓力（講義搭配詞）", "relieve stress"], ["★ 不健康的習慣（講義 14 天片語）", "an unhealthy habit"], ["★ 按一下就好（講義搭配詞）", "at the touch of a button"], ["出門玩的一晚", "an evening out"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "想看的體育比賽", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What kinds of sports events are…", "tone": "neu", "items": [["題目", "What kinds of sports events are broadcast on TV or other media in your country?"], ["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "Baseball is definitely the most popular. The CPBL is shown on TV almost every day during the season, and international tournaments like the Premier12 attract huge audiences. Badminton also gets a lot of coverage during the Olympics. For example, my whole family watched Chou Tien-chen's matches in our living room. Basketball is widely shown as well. However, compared with the past, people are more likely to stream games online rather than watch them on TV, which is changing the way people watch sport.", 1], ["吸引大批觀眾", "attract huge audiences"], ["大量轉播報導", "get a lot of coverage"], ["★ 講義 7+ 句型", "Compared with the past, people are more likely to… rather than…"], ["線上串流看比賽", "stream games online"]]}, {"label": "Q2 Do people in your country enjoy…", "tone": "neu", "items": [["題目", "Do people in your country enjoy watching football games?"], ["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "Not really, to be honest. Football has never become as popular in Taiwan as baseball and basketball, and the national team rarely qualifies for major tournaments. This is mainly because most people here grow up watching baseball instead. For example, in my house, badminton gets far more attention. During the Olympics, my whole family watched Chou Tien-chen's matches in the living room. Although the World Cup creates a short wave of interest, it usually fades once the tournament ends because people go back to their usual sports.", 1], ["取得大賽資格", "qualify for major tournaments"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["★ 講義 7+ 句型", "Although…, … because…"], ["一波短暫熱潮", "a short wave of interest"]]}, {"label": "Q3 Does encouragement and applause…", "tone": "neu", "items": [["題目", "Does encouragement and applause from the audience have an impact on athletes?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "Absolutely, although the effect can go both ways. Athletes are strongly influenced by the crowd. This is mainly because a supportive crowd boosts their energy and confidence, which is why teams usually play better at home. For example, I felt a small version of this in my high-school choir. After one of our performances at an international competition, there was a moment of complete silence, then the whole audience stood up and applauded, and we were all grinning. On the other hand, the same pressure can make less experienced athletes nervous and make mistakes, so it mostly helps those who stay calm under pressure.", 1], ["★ 受觀眾影響", "be influenced by the crowd"], ["有利也有弊", "go both ways"], ["提升信心", "boost their confidence"], ["在壓力下保持冷靜", "stay calm under pressure"]]}, {"label": "Q4 Do you prefer to watch live spor…", "tone": "neu", "items": [["題目", "Do you prefer to watch live sports or watch it on TV?"], ["相近題・可延用（F3-027）・講義修訂", "Honestly, I usually watch sports on TV, but I'd prefer to watch live if I had the chance. Watching on TV is more convenient, because you can watch events from any country without travelling, and the commentary helps you understand what's going on. However, a major drawback is that you miss the atmosphere of being in a crowd. For example, I've watched Chou Tien-chen's badminton matches on TV with my family for years, but I'd love to see him play live at the Taipei Open. As a result, I'd say TV is better for everyday watching, while live games are better for special occasions.", 1], ["★ 主要缺點", "a major drawback"], ["身處人群的氣氛", "the atmosphere of being in a crowd"], ["不用出門遠行", "without travelling"], ["特別的場合", "for special occasions"]]}, {"label": "Q5 Why do some people like to watch…", "tone": "neu", "items": [["題目", "Why do some people like to watch live sports?"], ["原題（F3-025）・講義修訂", "I think there are three main reasons. First, a live match is unpredictable, and nobody knows what will happen next. This is mainly because, unlike a film, there's no script, so the tension feels real. Second, it's inspiring to watch athletes push themselves to their physical and mental limits. Finally, people enjoy the shared experience. For example, when thousands of fans cheer at the same moment, everyone feels connected. As a result, people feel a sense of belonging that is hard to get at home.", 1], ["無法預測的", "unpredictable"], ["挑戰自己的極限", "push themselves to their limits"], ["共同的經驗", "the shared experience"], ["★ 感受到歸屬感", "feel a sense of belonging"]]}, {"label": "Q6 What kinds of sports do Chinese…", "tone": "neu", "items": [["題目", "What kinds of sports do Chinese people like to watch?"], ["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "From what I know, table tennis and badminton are very popular in mainland China. This is mainly because China has been the best in the world at those sports for decades, and success attracts more viewers. Basketball is also huge, thanks to the NBA. More generally, people like watching sports when national pride is involved, and that's true in Taiwan too. For example, when Chou Tien-chen saved a match point with a cross-court return, my whole family gasped at the same time. Of course, I'm judging from a distance, so I might be oversimplifying.", 1], ["★ 講義 Part 3 架構", "This is mainly because…"], ["國家榮譽感", "national pride"], ["從遠處判斷", "judge from a distance"], ["同時倒抽一口氣", "gasp at the same time"]]}, {"label": "Q7 Do you think competition is good…", "tone": "neu", "items": [["題目", "Do you think competition is good for students?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "In moderation, yes. Healthy competition not only motivates students to push themselves but also teaches them to handle both winning and losing, which prepares them for adult life. For example, while I was preparing for international choir competitions, a close friend in the choir taught me that you can't hide behind your nerves. You have to be brave and show yourself on stage. However, I'd say Taiwan's system focuses too much on rankings and exam scores, which creates a lot of anxiety. As a result, competition should be one source of motivation rather than the only way to judge a student.", 1], ["適度地", "in moderation"], ["★ 講義 7+ 句型", "not only… but also…, which…"], ["逼自己更努力", "push themselves"], ["★ 而不是……", "… rather than…"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "想嘗試的戶外運動", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What are the differences between…", "tone": "neu", "items": [["題目", "What are the differences between indoor sports and outdoor sports?"], ["相近題・可延用（錄音逐字稿 Lifestyles & Leisure Q3）・講義修訂", "From my perspective, the main difference is the environment. Outdoor sports feel more natural and open, because people can enjoy fresh air and nice scenery, which makes them feel refreshed and relaxed. In contrast, indoor sports, like gym workouts, are more structured, and people can control things like the weights. This is mainly because indoor spaces aren't affected by the weather, so people can train the same way every day. As a result, both have their own value. Whether people prefer indoor or outdoor sports depends on their personality and lifestyle.", 1], ["神清氣爽、放鬆", "feel refreshed and relaxed"], ["相反地", "in contrast"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["★ 講義 7+ 句型", "Whether… or… depends on…"]]}, {"label": "Q2 Which outdoor sports are popular…", "tone": "neu", "items": [["題目", "Which outdoor sports are popular in China?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "From what I've seen, hiking and running are very popular, and city marathons in China often sell out quickly. Among older people, square dancing and tai chi in public parks are a very common sight. This is mainly because people are paying more attention to their health. It's similar in Taiwan. For example, I've noticed young people playing Pikmin Bloom, which is a mobile game that encourages you to walk and grow virtual flowers. However, air pollution in some cities has a negative impact on how often people can exercise outdoors.", 1], ["報名額滿", "sell out"], ["常見的景象", "a common sight"], ["更注意健康", "pay more attention to their health"], ["★ 對……有負面影響", "have a negative impact on"]]}, {"label": "Q3 Which sports are popular among e…", "tone": "neu", "items": [["題目", "Which sports are popular among elderly people?"], ["新撰寫・一般論述・講義修訂", "Low-impact activities are the most popular. This is mainly because they're gentle on the joints. For example, in Taiwan, you'll see older people doing tai chi, brisk walking or group stretching in parks early in the morning, before it gets too hot. Swimming is also popular, and gateball and golf have many loyal fans among retirees too. What these sports have in common is that they're social as well as physical. As a result, for many elderly people, spending time with friends is just as important as the exercise itself.", 1], ["低衝擊的", "low-impact"], ["對關節溫和", "gentle on the joints"], ["★ 有共同點", "have something in common"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result…"]]}, {"label": "Q4 Which outdoor sports are popular…", "tone": "neu", "items": [["題目", "Which outdoor sports are popular with children?"], ["新撰寫・含個人素材（素材：運動經驗）・講義修訂", "I'd say football, cycling and running games are the most common. This is mainly because they don't need much equipment. In Taiwan, many children also join school baseball teams, and swimming lessons are popular too. For example, I learnt to swim as a child myself. Everyone else in my class was much older, so I sometimes couldn't keep up, and I still remember that feeling. However, children in crowded areas like Taipei don't always have easy access to outdoor space, so they have fewer chances to play outside.", 1], ["器材", "equipment"], ["跟上", "keep up"], ["★ 容易取得／使用", "have easy access to"], ["★ 講義 Part 3 架構", "This is mainly because…"]]}, {"label": "Q5 How do weather affect outdoor sp…", "tone": "neu", "items": [["題目", "How do weather affect outdoor sports?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "Quite a lot, especially in a place like Taiwan. This is mainly because the summer heat and humidity make exercising at midday quite dangerous, so people tend to exercise early in the morning or in the evening instead. Typhoons and the plum rain season can also cancel events completely. For example, I take my dog, Oakley, to the riverside park two or three times a week, and honestly, the weather decides when we go far more than my schedule does. On the other hand, autumn and winter are mild, so more people go hiking and cycling then.", 1], ["高溫潮濕", "heat and humidity"], ["梅雨季", "the plum rain season"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["天氣決定我們何時去", "the weather decides when we go"]]}, {"label": "Q6 Which sports can children do on…", "tone": "neu", "items": [["題目", "Which sports can children do on rainy days?"], ["新撰寫・含個人素材（素材：運動經驗）・講義修訂", "Indoor sports are the obvious answer. Badminton, basketball in a school gym and table tennis are all practical, and martial arts classes are popular in Taiwan too. Volleyball is another good choice, because it's fairly easy to pick up and it teaches teamwork. For example, I loved volleyball at high school and even played in a competition. By playing indoor sports, children can stay physically active, which is especially important in Taiwan's rainy season. Honestly, though, a bit of light rain shouldn't stop children from playing outside. It's often parents, not children, who worry about the weather.", 1], ["武術", "martial arts"], ["學會、上手", "pick up"], ["★ 講義 7+ 句型", "By + V-ing, children can…, which…"], ["★ 保持身體活動量", "stay physically active"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "和他人一起計劃活動", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What kind of plans do young peop…", "tone": "neu", "items": [["題目", "What kind of plans do young people often make?"], ["新撰寫・含個人素材（素材：小時候想當老師）・講義修訂", "Most young people make social, short-term plans, like meals with friends, weekend trips or concerts. They also make career plans, such as taking exams, doing internships or studying abroad. However, their bigger plans often change along the way. For example, I wanted to be a teacher when I was younger, because I was inspired by my maths teacher. But at university, I became really interested in data systems, so I changed direction. As a result, young people's plans tend to be flexible. Long-term plans like buying a home are often delayed, because high housing prices put a financial strain on young people.", 1], ["短期計畫", "short-term plans"], ["改變方向", "change direction"], ["★ 對……造成經濟壓力", "put a financial strain on"], ["★ 講義 Part 3 架構", "For example… / As a result…"]]}, {"label": "Q2 Why can't people always follow t…", "tone": "neu", "items": [["題目", "Why can't people always follow their plans?"], ["相近題・可延用（F3-005）・講義修訂", "I think the main reason is that unexpected things can come up. This is mainly because people make plans without knowing everything that will happen. For example, when my choir went to a competition in Italy, our bus was late, so we had to run to the venue. In situations like that, people simply can't stick to their original plans. Some people also struggle to make up their minds, so they keep changing their plans. However, I don't think being flexible is a weakness. As long as the main goal stays the same, changing the plan is often the smart thing to do.", 1], ["★ 意外狀況可能發生", "unexpected things can come up"], ["★ 照原計畫進行", "stick to their original plans"], ["★ 難以下定決心", "struggle to make up their minds"], ["只要主要目標不變", "as long as the main goal stays the same"]]}, {"label": "Q3 Why do people make plans?", "tone": "neu", "items": [["題目", "Why do people make plans?"], ["相近題・可延用（F3-177）・講義修訂", "I think people make plans mainly to reduce stress and feel more in control. This is mainly because planning helps people spot problems before they happen, especially for important things like their career, travel or big projects. For example, at work, I standardised our database across about 1,200 servers, and it only worked because I mapped every difference first. As a result, people feel more confident and waste less time. However, planning too much can be a waste of time, because sometimes it's better to react to what's actually happening.", 1], ["更有掌控感", "feel more in control"], ["事先發現問題", "spot problems before they happen"], ["★ 浪費時間", "a waste of time"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result…"]]}, {"label": "Q4 Is it important to make plans?", "tone": "neu", "items": [["題目", "Is it important to make plans?"], ["原題（F3-177）・講義修訂", "Yes, I think it's important, especially for big things like career, travel or important projects. This is mainly because planning gives people time to spot risks before they become real problems. For example, if you plan a trip early, you can book cheaper flights and avoid last-minute stress. However, planning too much can have the opposite effect. Some of the best results come from reacting to what's actually happening, rather than following a fixed script. So the key is knowing when to plan carefully and when to be flexible.", 1], ["發現風險", "spot risks"], ["最後一刻的壓力", "last-minute stress"], ["適得其反", "have the opposite effect"], ["★ 而不是……", "… rather than…"]]}, {"label": "Q5 Are there any people who never m…", "tone": "neu", "items": [["題目", "Are there any people who never make plans?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "Very few people never plan at all, but some are much more spontaneous than others. This is mainly because some people struggle to stick to strict schedules and prefer to decide things as they go, while people with unstable jobs may feel planning is pointless. My work is the opposite. For example, standardising our database across about 1,200 servers only worked because I mapped every difference first and rolled out changes step by step. Still, even spontaneous people make small plans without realising it, and outside work, being flexible can feel freeing.", 1], ["隨性的", "spontaneous"], ["★ 難以照嚴格行程走", "struggle to stick to strict schedules"], ["邊走邊決定", "decide things as they go"], ["循序漸進地", "step by step"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "在公共場所遺失物品", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What kinds of things do people u…", "tone": "neu", "items": [["題目", "What kinds of things do people usually lose in public places?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Phones, wallets, keys and umbrellas are the most common ones. Umbrellas are especially easy to lose in Taiwan, because the weather changes so quickly. People bring one in the morning, the sun comes out, and they leave it on the MRT. Small accessories go missing too. For example, as a child, I had a watch, but I often forgot to put it on and sometimes even lost it. Fortunately, the Taipei MRT has a very efficient lost-and-found service, which means people often get their things back.", 1], ["遺失、不見", "go missing"], ["失物招領", "lost-and-found"], ["找回東西", "get their things back"], ["★ which 補充整件事（講義）", "…, which means…"]]}, {"label": "Q2 Why do some people tend to lose…", "tone": "neu", "items": [["題目", "Why do some people tend to lose things more often than others?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "I think it's partly personality and partly lifestyle. Some people don't pay much attention to details, so they put things down without noticing where. But I think the bigger reason is how busy people are. This is mainly because adults with a heavy workload have so many things to keep track of. For example, I found it easier to remember things as a child, partly because I had fewer and simpler things to think about. As a result, busy adults simply have more chances to forget. So I'd say it's less about being careless and more about having too much on your plate.", 1], ["掌握、記住", "keep track of"], ["★ 沉重的工作量", "a heavy workload"], ["事情太多", "have too much on your plate"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result…"]]}, {"label": "Q3 What can people do to avoid losi…", "tone": "neu", "items": [["題目", "What can people do to avoid losing things?"], ["新撰寫・含個人素材（素材：我的家與房間）・講義修訂", "By building simple routines, people can lose things less often, which saves a lot of stress. For example, I keep my everyday essentials in a little tray on my dressing table. Since I do my make-up there every morning, I see them before I leave, and I put everything back when I get home. Checking your seat before you get off a train helps too, and tracking tags can help people find bags or wallets. Most importantly, though, people should slow down. This is mainly because rushing is exactly when people forget things, as I learnt when I left my laptop at a restaurant.", 1], ["★ 講義 7+ 句型", "By + V-ing, people can…, which…"], ["日常必需品", "everyday essentials"], ["追蹤標籤", "tracking tags"], ["★ 講義 Part 3 架構", "This is mainly because…"]]}, {"label": "Q4 What are some different ways peo…", "tone": "neu", "items": [["題目", "What are some different ways people can try to find something they have lost?"], ["新撰寫・一般論述・講義修訂", "The most natural first step is retracing your steps, which means thinking back carefully to where you last had the item. After that, people usually contact the lost-and-found at stations, shops or restaurants. For example, when I left my laptop at a restaurant, I called them straight away, and the staff had already found it. In Taiwan, many people also post on social media or in local community groups, which can work surprisingly well. For phones, tracking apps like Find My iPhone are really useful, and for important things like ID cards, people can report the loss to the police.", 1], ["循原路回想", "retrace your steps"], ["出奇地有效", "work surprisingly well"], ["報失", "report the loss"], ["★ which 補充（講義關係子句）", "…, which means…"]]}, {"label": "Q5 How useful is it to offer a rewa…", "tone": "neu", "items": [["題目", "How useful is it to offer a reward for finding a lost object?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "To some extent, yes. A reward gives people a clear reason to make an effort, especially for something precious, like a pet. This is mainly because finding an animal means actively searching for it, rather than just handing something in. For example, if our dog, Oakley, ever went missing, I'd happily offer a reward. However, in Taiwan, many people return lost items simply because they're honest. As a result, for wallets or phones, a reward often isn't necessary.", 1], ["努力的明確理由", "a clear reason to make an effort"], ["交出（失物）", "hand something in"], ["★ 而不是……", "… rather than…"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result…"]]}, {"label": "Q6 Why do people sometimes try real…", "tone": "neu", "items": [["題目", "Why do people sometimes try really hard to find things they’ve lost?"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "Usually because the value is emotional rather than financial. This is mainly because a gift from a loved one or something passed down in the family can't be replaced, no matter how much money you have. For example, my mum has kept a family photo album for around thirty years, and it even has ordinary photos from her treatment. If it went missing, we'd turn the house upside down to find it. There's also a practical side. Replacing an ID card or a work laptop is time-consuming and stressful.", 1], ["情感上而非金錢上", "emotional rather than financial"], ["把家裡翻遍", "turn the house upside down"], ["★ 耗費時間的", "time-consuming"], ["★ 講義 Part 3 架構", "This is mainly because…"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "節省時間的改變", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What are some ways that people t…", "tone": "neu", "items": [["題目", "What are some ways that people try to save time in daily life?"], ["新撰寫・含個人素材（素材：Email 四天沒回）・講義修訂", "Technology is the most common way. Instead of cooking or going out, many people in Taiwan order food through delivery apps, because it saves them time and effort. They also pay by phone and use map apps to avoid traffic. But sometimes the old-fashioned way is quicker. For example, I once waited four days for a reply to an email proposal at work, then walked over in person and sorted it out in five minutes. Now I always follow up face to face by day three. Ironically, smartphones, which are meant to save time, often end up wasting it.", 1], ["★ 講義 7+ 句型", "Instead of + V-ing, people… because…"], ["★ 節省時間與精力", "save time and effort"], ["解決", "sort it out"], ["當面跟進", "follow up face to face"]]}, {"label": "Q2 Who do you think is better at sa…", "tone": "neu", "items": [["題目", "Who do you think is better at saving time, younger people or older people?"], ["新撰寫・含個人素材（素材：閱讀與學習習慣）・講義修訂", "I think it's a trade-off. Younger people are generally better at using technology to save time. For example, I use AI to plan my schedule and gather information, and when a home appliance breaks down, I ask AI first. However, older people often spend less time on their phones, so they may waste less time in the first place. This is mainly because they're less exposed to digital distractions. In other words, young people are better at saving time, while older people tend to be better at not wasting it.", 1], ["取捨", "trade-off"], ["★ 接觸到……", "be exposed to"], ["一開始就", "in the first place"], ["★ 講義 Part 3 架構", "In other words,…"]]}, {"label": "Q3 Do people waste a lot of time th…", "tone": "neu", "items": [["題目", "Do people waste a lot of time these days?"], ["新撰寫・含個人素材（素材：Stranger Things）・講義修訂", "To a large extent, yes, although it depends on how you define 'waste'. Many people spend hours scrolling through short videos without really enjoying them, which can easily become an unhealthy habit. Long commutes also take up a lot of time. That said, not every free moment is wasted. For example, when I was under a lot of stress, I watched the whole first season of Stranger Things in two days, and what stayed with me was the loyalty between the characters, not the horror. So the real problem is mindless scrolling, not rest itself.", 1], ["★ 不健康的習慣", "an unhealthy habit"], ["佔用很多時間", "take up a lot of time"], ["讓我印象深刻的", "what stayed with me"], ["無意識地滑手機", "mindless scrolling"]]}, {"label": "Q4 Do you think schools should teac…", "tone": "neu", "items": [["題目", "Do you think schools should teach children how to manage their time?"], ["新撰寫・含個人素材（素材：閱讀與學習習慣）・講義修訂", "Definitely. Time management is an important life skill, yet schools rarely teach it directly. This is mainly because children in Taiwan often have busy schedules arranged by their parents and cram schools, so they get little practice organising their own time. For example, I've only really learnt it as an adult. On study days, I get up early, leave my phone by my bedroom door and take a short break every hour. As a result, I can stay focused much better. However, lessons should be practical and suitable for the children's age, not just another subject to memorise.", 1], ["補習班", "cram schools"], ["★ 保持專注", "stay focused"], ["安排自己的時間", "organise their own time"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result…"]]}, {"label": "Q5 Does technology always make it e…", "tone": "neu", "items": [["題目", "Does technology always make it easier for people to manage their time?"], ["相近題・可延用（F3-008）・講義修訂", "Not always. Technology definitely helps in many ways. For example, calendars, reminders and project apps make planning much easier, and I use AI to plan my own study schedule. However, technology can also have a negative impact on how we use our time. This is mainly because the same phone that holds our calendar is full of distractions, like short videos and messages. Also, some people spend so much time organising their plans in apps that they forget the actual goal. As a result, technology only helps if people use it with self-discipline.", 1], ["★ 對……有負面影響", "have a negative impact on"], ["充滿干擾", "full of distractions"], ["★ 自律", "self-discipline"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result…"]]}, {"label": "Q6 Are people who learn to manage t…", "tone": "neu", "items": [["題目", "Are people who learn to manage time efficiently more successful in life?"], ["新撰寫・含個人素材（素材：物流科技創業者（化名 Wei））・講義修訂", "Generally, yes, but being efficient isn't everything. In Taiwan's fast-paced workplaces, people who manage their time effectively are more likely to meet deadlines and feel less stressed, which helps their career. However, being efficient doesn't mean rushing. For example, a logistics founder I advised as a consultant would rather spend twice as long getting something right the first time, because doing it again always costs more. As a result, if people only care about speed, they may become productive but burnt out, which is hardly success.", 1], ["★ 講義 Efficiency 例句", "people who manage their time effectively are more likely to meet deadlines"], ["不是全部", "isn't everything"], ["一次做對", "get something right the first time"], ["身心俱疲", "burnt out"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "忙碌的時刻", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 Do very young children in your c…", "tone": "neu", "items": [["題目", "Do very young children in your country study too hard at school?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "In many cases, unfortunately, yes. Even primary school children in Taiwan often go to cram schools after regular classes, sometimes until eight or nine in the evening. This is mainly because parents worry their children won't keep up, and these unrealistic expectations put a lot of pressure on children. In contrast, my high-school maths teacher had a better idea. He told me not to study a subject, but a question I couldn't stop thinking about, and that led me to computer science. Schools are slowly changing, but many people still believe that long hours guarantee success.", 1], ["補習班", "cram schools"], ["跟上進度", "keep up"], ["★ 不切實際的期待", "unrealistic expectations"], ["★ 講義 Part 3 架構", "This is mainly because…"]]}, {"label": "Q2 Do you think young children lear…", "tone": "neu", "items": [["題目", "Do you think young children learn more from playing than from classroom lessons?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "At a very young age, I'd say yes. Play helps children develop creativity, social skills and control over their emotions. This is mainly because games keep children engaged, so they learn without feeling bored. It works with older children too. For example, when I volunteered in Lesotho at seventeen, I started with simple games and songs to break the ice, and the students opened up much more quickly. That said, normal lessons are still important for basic skills like reading, writing and maths. So early education should mix the two, rather than treating play as a break from learning.", 1], ["★ 讓某人保持投入", "keep someone engaged"], ["打破僵局", "break the ice"], ["敞開心胸", "open up"], ["★ 而不是……", "… rather than…"]]}, {"label": "Q3 Do children need long school hol…", "tone": "neu", "items": [["題目", "Do children need long school holidays?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "Yes, I'd say they do, although perhaps not as long as in some countries. This is mainly because Taiwanese children have a heavy workload during term time, so holidays give them time to rest, enjoy hobbies and travel. For example, some of my own most memorable learning happened outside school. On a choir trip to Italy, we visited the Colosseum and Pompeii in our free time, which really broadened my horizons. However, very long holidays can make children forget what they've learnt, especially those from poorer families. So I think fairly long breaks with some fun learning are ideal.", 1], ["★ 沉重的工作量", "a heavy workload"], ["★ 拓展視野", "broaden one's horizons"], ["最難忘的", "most memorable"], ["★ 講義 Part 3 架構", "This is mainly because…"]]}, {"label": "Q4 What are the advantages and disa…", "tone": "neu", "items": [["題目", "What are the advantages and disadvantages of having a heavy workload?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "A heavy workload has both advantages and disadvantages. On the plus side, it can help people learn faster, because they're forced to decide what matters most. For example, leading a database project across about 1,200 servers taught me to break problems down and move in small, safe steps. On the other hand, a major drawback is that long-term overwork often leads to burnout, mistakes and emotional exhaustion, which is common in Taiwan's long-hours culture. As a result, a heavy workload is fine for a short time, but as a permanent situation, it's bad for both employees and companies.", 1], ["★ 沉重的工作量", "a heavy workload"], ["★ 主要缺點", "a major drawback"], ["★ 情緒耗竭", "emotional exhaustion"], ["好處是", "on the plus side"]]}, {"label": "Q5 How can companies reward employe…", "tone": "neu", "items": [["題目", "How can companies reward employees who work long hours?"], ["新撰寫・含個人素材（素材：產品大改版與生日加班）・講義修訂", "Financial rewards are the most direct way, like overtime pay, bonuses or extra days off. But recognition matters just as much. For example, in the first half of this year, my company did a big product update. My team worked overtime and was on call 24/7, and I even spent my birthday at the office past midnight, releasing a new version. After a period like that, time off or flexible working hours really show appreciation, which helps employees stay motivated. However, companies should reward results rather than just long hours.", 1], ["肯定", "recognition"], ["全天候待命", "on call 24/7"], ["★ 保持動力", "stay motivated"], ["★ 而不是……", "… rather than…"]]}, {"label": "Q6 What does the impact of time pre…", "tone": "neu", "items": [["題目", "What does the impact of time pressure have on the quality of work people do?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "It depends on how much pressure there is. A little pressure helps people stay focused and stops them from putting things off. In Taiwanese offices, deadlines are often what get things finished. But when the pressure is too high, people cut corners, skip testing and make careless mistakes. For example, on our database project, we avoided that by rolling out changes server by server when traffic was low, with an automatic rollback if any check failed, and we finished with zero downtime. As a result, I'd say a little time pressure is helpful, but too much of it has a negative impact on the quality of work.", 1], ["★ 保持專注", "stay focused"], ["拖延", "put things off"], ["偷工減料", "cut corners"], ["★ 對……有負面影響", "have a negative impact on"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "近期改善生活的變動", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What changes do people make in t…", "tone": "neu", "items": [["題目", "What changes do people make in their daily routines?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "Common changes include waking up earlier, exercising more or cutting down on screen time. Since the pandemic, many people in Taiwan have also reorganised their days around working partly from home. However, the biggest changes are usually caused by something unexpected, like a health problem. For example, when my mum was diagnosed with cancer, our whole family's routine changed around her chemotherapy, and I took over cooking dinner on treatment days. As a result, I think changes without that kind of push tend to be smaller and harder to keep up.", 1], ["減少螢幕使用時間", "cut down on screen time"], ["接手", "take over"], ["較難持續", "harder to keep up"], ["★ 講義 Part 3 架構", "For example… / As a result…"]]}, {"label": "Q2 Do younger people enjoy changing…", "tone": "neu", "items": [["題目", "Do younger people enjoy changing their daily routines more than older people do?"], ["新撰寫・含個人素材（素材：媽媽鼓勵我出國念書）・講義修訂", "Generally, yes. Younger people tend to enjoy new experiences and have fewer responsibilities, so trying new things feels exciting rather than stressful. For example, my mum encouraged me to study abroad by saying I'm still young, so I should try it now rather than wait until it's too late and regret it. In contrast, older people are often reluctant to change their routines, because their lives are closely tied to family and work. That said, it's a generalisation. Plenty of retirees completely change their lives once they have the freedom.", 1], ["★ 不願意……", "be reluctant to"], ["★ 而不是……", "… rather than…"], ["責任較少", "have fewer responsibilities"], ["概括的說法", "generalisation"]]}, {"label": "Q3 Do you think it’s a good thing f…", "tone": "neu", "items": [["題目", "Do you think it’s a good thing for people to keep changing their daily routines?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "To some extent. Changing your routine now and then can stop you from getting bored and help you break bad habits, which is why many people in Taiwan try new routines every New Year. But changing it all the time can backfire. This is mainly because routines save us from making too many decisions every day. For example, my mornings always start the same way: our dog, Oakley, usually jumps on the bed to wake me up, and I find that strangely comforting. So the best idea is a stable routine with small changes from time to time.", 1], ["戒除壞習慣", "break bad habits"], ["適得其反", "backfire"], ["偶爾", "now and then / from time to time"], ["★ 講義 Part 3 架構", "This is mainly because…"]]}, {"label": "Q4 Do you think people should chang…", "tone": "neu", "items": [["題目", "Do you think people should change jobs from time to time?"], ["新撰寫・含個人素材（素材：自學的同事）・講義修訂", "It can be good, but not just for the sake of it. In Taiwan's tech industry, changing jobs not only helps people learn new skills but also often leads to a pay rise, which improves their career prospects. Some changes are even bigger than a new employer. For example, one colleague of mine studied business, taught himself data engineering through online resources and open-source projects, and is now a team lead. Still, staying in one job helps people build deep knowledge, so I think people should move when they stop learning.", 1], ["為了換而換", "for the sake of it"], ["★ 講義 7+ 句型", "not only… but also…, which…"], ["★ 改善職涯前景", "improve career prospects"], ["加薪", "a pay rise"]]}, {"label": "Q5 Is getting promoted at work alwa…", "tone": "neu", "items": [["題目", "Is getting promoted at work always a positive change?"], ["新撰寫・含個人素材（素材：我的主管）・講義修訂", "Not necessarily. A promotion brings higher pay and status, but it often moves someone away from what they're actually good at. A great engineer might end up in meetings all day instead of solving technical problems. My manager, for example, analyses problems with me, guides me towards a solution and protects me from unreasonable tasks, which is a very different job from writing code. So while promotions are usually positive, people should think about whether the new role really suits their strengths.", 1], ["地位", "status"], ["最後整天開會", "end up in meetings all day"], ["★ which 補充（講義關係子句）", "…, which is a very different job"], ["★ 講義 7+ 句型", "While…, …"]]}, {"label": "Q6 In what ways can working in a di…", "tone": "neu", "items": [["題目", "In what ways can working in a different country change someone’s way of seeing the world?"], ["新撰寫・含個人素材（素材：決定離職、出國念書）・講義修訂", "I'd say it can change people a lot. Living in another culture makes people question ideas they never knew they had, about things like hierarchy, communication or politeness. This is mainly because they are exposed to different cultures and perspectives every day. As a result, Taiwanese people who work abroad often come back with a broader view of the world. I'm preparing to study abroad myself, so I'm hoping to experience that kind of change first-hand. Of course, some people only mix with people from their own country, so they change very little.", 1], ["★ 接觸不同文化與觀點", "be exposed to different cultures and perspectives"], ["更寬廣的世界觀", "a broader view of the world"], ["親身", "first-hand"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result…"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "保持健康的方法", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What are some popular ways peopl…", "tone": "neu", "items": [["題目", "What are some popular ways people in your country stay fit?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "Hiking is very popular in Taiwan, because mountains are so easy to reach. In Taipei, you can even get to a hiking trail by MRT. Running and cycling along riverside paths have also become much more popular, and more and more young professionals go to the gym. If I could pass one law, it would require every city of over half a million people to have green areas like our riverside parks. This is mainly because people who have easy access to parks are more likely to stay physically active. Still, having parks nearby doesn't guarantee that people will actually exercise.", 1], ["★ 容易取得／使用", "have easy access to"], ["★ 保持身體活動量", "stay physically active"], ["登山步道", "a hiking trail"], ["★ 講義 Part 3 架構", "This is mainly because…"]]}, {"label": "Q2 Is it easy to do exercise where…", "tone": "neu", "items": [["題目", "Is it easy to do exercise where you live?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "Yes, very easy, actually. Taipei has plenty of affordable sports centres run by the city government. In my case, I've lived in Neihu all my life, and I have easy access to hiking trails and riverside parks just minutes away. For example, I take my dog, Oakley, for walks by the river two or three times a week. The main problem is the weather. In summer, the heat and humidity make outdoor exercise quite unpleasant, unless you go early in the morning or in the evening.", 1], ["★ 負擔得起的", "affordable"], ["★ 容易取得／使用", "have easy access to"], ["只要幾分鐘路程", "just minutes away"], ["高溫潮濕", "heat and humidity"]]}, {"label": "Q3 Where do you think young people…", "tone": "neu", "items": [["題目", "Where do you think young people should do physical exercise at school?"], ["新撰寫・含個人素材（素材：運動經驗）・講義修訂", "Ideally, in a mix of indoor and outdoor spaces. Outdoor fields and tracks are great for team sports and fresh air, which is also good for children's eyes. This is mainly because short-sightedness is a growing concern among Taiwanese students. But because of our climate, schools also need gyms and covered courts, so PE isn't cancelled every time it rains. Team sports are worth the space. For example, I loved volleyball at high school because of the teamwork, and I even played in a competition. As a result, I think flexibility matters more than any single location.", 1], ["★ 日益受到關注的問題", "a growing concern"], ["有遮蔽的球場", "covered courts"], ["近視", "short-sightedness"], ["★ 講義 Part 3 架構", "This is mainly because… / As a result…"]]}, {"label": "Q4 What are the best ways to teach…", "tone": "neu", "items": [["題目", "What are the best ways to teach children how to stay fit and healthy?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Leading by example is probably the most powerful way. This is mainly because children's behaviour is often influenced by their parents, so children who see their parents exercising and eating well tend to copy them. Getting children involved in cooking helps too. For example, in my family, we take turns cooking, and I cook two or three times a month, so we can control the ingredients and seasoning. Making exercise fun also matters, because games are far more effective than lectures about calories. As a result, children develop healthy habits without feeling forced.", 1], ["以身作則", "lead by example"], ["★ 受……影響", "be influenced by"], ["輪流", "take turns"], ["★ 養成健康習慣", "develop healthy habits"]]}, {"label": "Q5 What are some ways of giving adu…", "tone": "neu", "items": [["題目", "What are some ways of giving adults information about health issues?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "There are several ways. Doctors are the most trusted source, so short advice during regular check-ups works well. Public health campaigns on TV, on the MRT and on social media can also reach lots of people. For example, Taiwan's COVID response showed how powerful clear messages and good data can be. At my company, our location data was actually used for contact tracing. However, a major challenge is fake news online. Since people are exposed to an overwhelming amount of information, reliable sources need to be interesting enough to get people's attention.", 1], ["公共衛生宣導", "public health campaigns"], ["疫調、接觸者追蹤", "contact tracing"], ["★ 重大挑戰", "a major challenge"], ["★ 接觸龐大資訊量", "be exposed to an overwhelming amount of information"]]}, {"label": "Q6 Is there is too much advertising…", "tone": "neu", "items": [["題目", "Is there is too much advertising of unhealthy food on television?"], ["新撰寫・含個人素材（素材：朴寶劍）・講義修訂", "I'd say yes. In Taiwan, children are constantly exposed to advertisements for fast food, sugary drinks and snacks, and these ads often use cartoons and celebrities to attract them. This is mainly because children are easily influenced by what they see, so the ads shape their eating habits early. They also encourage unnecessary spending. To be fair, advertising isn't always bad. For example, when Park Bo-gum promoted a skincare brand, it felt sincere rather than fake. But children can't judge junk food ads carefully. As a result, I think there should be some limits, together with better education about healthy eating.", 1], ["★ 不斷接觸廣告", "constantly exposed to advertisements"], ["★ 受……影響", "be influenced by"], ["★ 鼓勵不必要的消費", "encourage unnecessary spending"], ["影響飲食習慣", "shape their eating habits"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "經濟實惠的外出", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 Where do people in your country…", "tone": "neu", "items": [["題目", "Where do people in your country usually go for a day out?"], ["相近題・可延用（F3-122）・講義修訂", "In Taiwan, people usually go to riverside parks, night markets or shopping areas for a day out. Compared with older people, young people are more likely to go to busy areas with cafes, shops and cinemas rather than quiet places. This is mainly because they want to hang out with friends. In contrast, older people often prefer parks or hiking trails, where they can spend quality time with their family in a more relaxed way.", 1], ["★ 講義 7+ 句型", "Compared with…, … are more likely to… rather than…"], ["和朋友出去玩", "hang out with friends"], ["★ 共度有品質的時光", "spend quality time with"], ["外出一日遊", "for a day out"]]}, {"label": "Q2 Why do people like going out for…", "tone": "neu", "items": [["題目", "Why do people like going out for the day?"], ["相近題・可延用（F3-121）・講義修訂", "I think people like going out mainly to relax and get a break from their daily routine. This is mainly because most people spend all week at work or school, so a day out feels refreshing. In Taiwan, people love going to parks, night markets and cafes, and there's a strong culture of enjoying evenings and weekends out. It's also a good chance to spend quality time with friends and family. For example, one of my best days was a simple picnic by the river with my mum and our dog. As a result, a day out helps people relieve stress and feel closer to each other.", 1], ["暫時擺脫日常", "get a break from their daily routine"], ["……的風氣很盛", "a strong culture of…"], ["★ 共度有品質的時光", "spend quality time with"], ["★ 紓解壓力", "relieve stress"]]}, {"label": "Q3 How can people enjoy a day out w…", "tone": "neu", "items": [["題目", "How can people enjoy a day out without actually going outside?"], ["相近題・可延用（F3-123）・講義修訂", "I think technology makes this much easier. Instead of going out, people tend to stay at home and use streaming services or video calls, because it's cheaper and more comfortable. For example, people can watch a live sports match from the comfort of their home, just like my family does when we watch Chou Tien-chen's badminton matches on TV. Some people also take online museum tours or cook a special meal with friends at home. As a result, they can still have a special day without leaving the house, although it's not quite the same as being outside in the fresh air.", 1], ["★ 講義 7+ 句型", "Instead of + V-ing, people tend to… because…"], ["★ 在舒適的家中", "from the comfort of their home"], ["串流平台", "streaming services"], ["不太一樣", "not quite the same as"]]}, {"label": "Q4 How does the weather affect how…", "tone": "neu", "items": [["題目", "How does the weather affect how much people enjoy going out?"], ["新撰寫・含個人素材（素材：S04 河邊夕陽野餐）・講義修訂", "A lot. Nice weather makes people much more likely to go out for picnics, hikes or walks by the river. In contrast, Taiwan's summer heat and sudden heavy rain often push people into shopping malls with air conditioning. For example, I saw how much weather matters on the day my mum got the all-clear. We took our dog to the riverside park, and as the sky turned golden-orange, a simple picnic became unforgettable. As a result, I'd say bad weather rarely stops people going out. It just changes where they go.", 1], ["更可能", "much more likely to"], ["突如其來的大雨", "sudden heavy rain"], ["康復通知", "the all-clear"], ["★ 講義 Part 3 架構", "For example… / As a result…"]]}, {"label": "Q5 What is the difference between g…", "tone": "neu", "items": [["題目", "What is the difference between going out alone to going out with friends?"], ["相近題・可延用（錄音逐字稿 Travel & Transport Q2）・講義修訂", "I think going out alone gives people much more freedom and flexibility, because they can change their plans without having to ask anyone else. It also lets them be more spontaneous and do whatever they want. In contrast, going out with friends is usually more fun and memorable, because people can share conversations and funny moments together. However, going out in a group needs more planning and compromise, while people on their own can simply follow their own preferences. So whether people prefer going out alone or with friends depends on their personality and mood.", 1], ["自由與彈性", "freedom and flexibility"], ["隨性的", "spontaneous"], ["妥協", "compromise"], ["★ 講義 7+ 句型", "Whether… or… depends on…"]]}, {"label": "Q6 Does spending money make a day o…", "tone": "neu", "items": [["題目", "Does spending money make a day out more enjoyable?　（原題：花錢能使外出的一天更愉快嗎?）"], ["相近題・可延用（延伸討論題 E13）・講義修訂", "Up to a point, yes. Having some money to spend can make a day out easier and more comfortable, like eating at a nice restaurant or going to a concert. However, I don't think more money always means more fun, and expensive activities aren't always worth the money. This is mainly because what really matters is who you're with. For example, one of my best days out was a simple picnic by the river with my family and our dog, after my mum got the all-clear. It only cost us some market food, but I'll never forget it. As a result, I'd say money can help, but it isn't the key.", 1], ["在一定程度上", "up to a point"], ["★ 值得花這筆錢", "worth the money"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["真正重要的是……", "what really matters is…"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "想參加的比賽", "en": "Part 3 · 生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What are some popular competitio…", "tone": "neu", "items": [["題目", "What are some popular competitions that ordinary people can take part in?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "I'd say marathons and fun runs are the most popular. This is mainly because anyone can join, and in Taiwan there seems to be one almost every weekend. Singing, cooking and photography contests also attract ordinary people, and online, many people join gaming competitions. Amateur choir competitions are common too. For example, I sang in my school choir for six years, and we competed in Italy and France with around sixty members. As a result, ordinary people can have a rewarding experience without being professionals, which makes these competitions so popular.", 1], ["趣味路跑", "fun runs"], ["★ 這主要是因為……", "This is mainly because…"], ["業餘合唱比賽", "amateur choir competitions"], ["★ 有收穫的經驗", "a rewarding experience"]]}, {"label": "Q2 What kinds of people are more li…", "tone": "neu", "items": [["題目", "What kinds of people are more likely to join competitions?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "I think people who are competitive and enjoy comparing themselves with others are the most likely to join. Confident, outgoing people also tend to feel more comfortable performing in front of others. For example, my closest friend from choir was very outgoing, and she taught me that you can't hide behind your nerves on stage. However, many people join competitions just for the experience or to make friends. In Taiwan, school clubs also give quieter students a chance to step outside their comfort zones.", 1], ["★ 好勝的人（關係子句）", "people who are competitive"], ["外向的", "outgoing"], ["躲在緊張後面", "hide behind your nerves"], ["★ 走出舒適圈", "step outside their comfort zones"]]}, {"label": "Q3 Why are TV competitions becoming…", "tone": "neu", "items": [["題目", "Why are TV competitions becoming more popular?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "I think it's because these shows not only create drama and suspense but also feature ordinary people, which makes viewers feel emotionally involved. I understand that feeling from performing. For example, when our choir finished singing at a competition in Italy, there was a moment of complete silence, and then the whole audience stood up to give us a standing ovation. On top of that, social media makes these shows even more popular, since people can discuss episodes and even vote online. As a result, viewers feel like part of the competition themselves.", 1], ["★ 不僅……而且……，這使得……", "not only… but also…, which…"], ["投入感情的", "emotionally involved"], ["起立鼓掌", "a standing ovation"], ["★ 結果……", "As a result,…"]]}, {"label": "Q4 In what kinds of jobs is it usef…", "tone": "neu", "items": [["題目", "In what kinds of jobs is it useful to be competitive?"], ["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "Sales is the most obvious example. This is mainly because performance is measured directly against targets and other salespeople, so being competitive can really improve people's career prospects. Law, finance and professional sport are also fields where a drive to win pays off. For example, when Chou Tien-chen saved a match point with a cross-court shot at the Olympics, my whole family gasped at once. That's what being competitive under pressure looks like. However, in most jobs, including tech in Taiwan, competitiveness works best when people can also work well in a team.", 1], ["★ 改善職涯前景", "improve people's career prospects"], ["求勝的動力", "a drive to win"], ["得到回報", "pays off"], ["在壓力下", "under pressure"]]}, {"label": "Q5 Do you think people can learn to…", "tone": "neu", "items": [["題目", "Do you think people can learn to become more competitive?"], ["新撰寫・含個人素材（素材：妹妹）・講義修訂", "To some extent, yes. Personality plays a role, but competitiveness is closely linked to confidence, which grows through practice and small successes. This is mainly because the more people succeed, the more confident they become. For example, my sister wanted to drop a statistics course in her first year, and I told her the difficulty showed she was learning, not failing. She stayed. As a result, I think anyone can learn to perform better under pressure, even if it's hard to change someone's personality completely.", 1], ["與……密切相關", "closely linked to"], ["★ 越……就越……", "the more…, the more…"], ["小小的成功經驗", "small successes"], ["在壓力下表現更好", "perform better under pressure"]]}, {"label": "Q6 Is it always a good idea to enco…", "tone": "neu", "items": [["題目", "Is it always a good idea to encourage competition at work?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "Not always. A bit of competition can push people to work harder and come up with new ideas. However, when there's too much, colleagues start hiding information or working against each other, which has a negative impact on teamwork. For example, our database migration only succeeded because I worked closely with the operations team on every rollout. As a result, I think companies get the best results by encouraging people to compete against goals rather than against their own teammates.", 1], ["想出新點子", "come up with new ideas"], ["★ 對……有負面影響", "have a negative impact on"], ["密切合作", "work closely with"], ["★ 而不是", "rather than"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "教別人的技能", "en": "Part 3 · 教育、工作與職涯", "groups": [{"label": "Q1 What personal qualities or skill…", "tone": "neu", "items": [["題目", "What personal qualities or skills do you think a good teacher should have?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "I think subject knowledge is necessary, but it's not enough. A good teacher also needs patience and the ability to explain things in more than one way. This is mainly because students learn in different ways. For example, my high school maths teacher always prepared different explanations depending on how we reacted, and he would remember something you'd said six months earlier. As a result, every student felt they had access to help when they needed it. Good teachers also give honest feedback, because encouragement alone doesn't help people improve.", 1], ["用不只一種方式解釋", "explain things in more than one way"], ["★ 這主要是因為……", "This is mainly because…"], ["★ 能得到幫助", "have access to help"], ["誠實的回饋", "honest feedback"]]}, {"label": "Q2 Do you think anyone can become a…", "tone": "neu", "items": [["題目", "Do you think anyone can become a good teacher,or is it something only some people are suited for?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "To some extent, anyone can become a good teacher, because most teaching skills, like planning lessons and giving feedback, can be learnt. For example, when I volunteered in Lesotho at seventeen, I had no training at all, but simple games and songs helped me break the ice with the students. However, becoming a great teacher needs qualities like a real interest in people and patience, which are much harder to learn. So whether someone becomes a good teacher or a great one depends on their personality as much as their training.", 1], ["打破僵局", "break the ice"], ["★ 是……還是……取決於……", "Whether… or… depends on…"], ["對人真心感興趣", "a real interest in people"], ["可以學會", "can be learnt"]]}, {"label": "Q3 Is it important for teachers to…", "tone": "neu", "items": [["題目", "Is it important for teachers to make their lessons fun and enjoyable?"], ["原題（F3-074）・講義修訂", "Yes, I think it's very important. This is mainly because students who are interested in a subject remember it much better, while bored students forget it quickly. For example, when I volunteered in Lesotho, simple games and songs helped me spark my students' interest and keep them engaged. As a result, they learnt more easily. So making lessons fun isn't about entertainment. It's about making learning feel less difficult.", 1], ["★ 對科目有興趣的學生（who 子句）", "students who are interested in a subject"], ["★ 激發興趣", "spark someone's interest"], ["★ 讓人保持投入", "keep someone engaged"], ["★ 結果……", "As a result,…"]]}, {"label": "Q4 At what age do you think people…", "tone": "neu", "items": [["題目", "At what age do you think people learn new skills most easily?"], ["相近題・可延用（F3-072）・講義修訂", "I think children learn new skills most easily. This is mainly because their brains are more flexible, and they're less worried about making mistakes, so they practise more. For example, children usually pick up a new language faster and speak it more naturally than adults. Adults have some advantages too, because they have access to more learning resources and can spot patterns more easily. However, they tend to think too much and practise too little. As a result, the problem for adults is often more psychological than physical.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["學會一門新語言", "pick up a new language"], ["★ 能取得、使用", "have access to"], ["想太多、練太少", "think too much and practise too little"]]}, {"label": "Q5 Which types of skills are more u…", "tone": "neu", "items": [["題目", "Which types of skills are more useful in daily life—practical skills or academic knowledge?"], ["新撰寫・含個人素材（素材：妹妹）・講義修訂", "For daily life, I think practical skills are more useful, like cooking, managing money and communicating clearly. However, academic knowledge shouldn't be ignored. For example, my younger sister wanted to drop her statistics course in her first year at university, but I encouraged her to see the difficulty as a sign that she was learning, and she stayed. Statistics not only trains logical thinking but also helps people spot misleading information, which is useful in everyday life. So ideally, the two kinds of skills should support each other.", 1], ["理財", "managing money"], ["★ 不僅……而且……，這……", "not only… but also…, which…"], ["看出誤導的資訊", "spot misleading information"], ["互相支持", "support each other"]]}, {"label": "Q6 Do you agree that people always…", "tone": "neu", "items": [["題目", "Do you agree that people always learn better when they study in a group?"], ["相近題・可延用（F3-135）・講義修訂", "Not always. Whether people learn better alone or in a group depends on the stage of learning. Studying alone is better for building a foundation, like vocabulary and grammar, because people can stay focused. Group study is more useful for practice, since you have to speak and respond in real time. However, some quiet people are reluctant to speak up in a group, so they may not benefit as much. As a result, most people need both: solo study first, and group practice after that.", 1], ["★ 是……還是……取決於……", "Whether… or… depends on…"], ["打基礎", "build a foundation"], ["★ 保持專注", "stay focused"], ["★ 不願意……", "be reluctant to"], ["即時回應", "respond in real time"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "未來想一起工作的家人", "en": "Part 3 · 教育、工作與職涯", "groups": [{"label": "Q1 What are common kinds of family…", "tone": "neu", "items": [["題目", "What are common kinds of family businesses?"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "In Taiwan, family businesses are everywhere. The most common ones are small food businesses, like breakfast shops, noodle stalls and night-market stands, which are often passed down through generations. These little shops are part of daily life. For example, after my mum finished chemotherapy, the first thing she wanted was dumplings from a little shop near our home. There are also family-run factories in cities like Taichung, and some of Taiwan's biggest companies are still controlled by the families who started them. So family businesses range from tiny stalls to huge company groups.", 1], ["代代相傳", "passed down through generations"], ["家族經營的工廠", "family-run factories"], ["★ 創辦它們的家族（who 子句）", "the families who started them"], ["從……到……都有", "range from… to…"]]}, {"label": "Q2 What are the benefits of working…", "tone": "neu", "items": [["題目", "What are the benefits of working in a family business?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "I think the main benefit is mutual trust. This is mainly because you know the people you work with very well, so decisions can be made quickly without lots of meetings and paperwork. Families also adapt when someone needs support. For example, when my mum was going through chemotherapy, our whole routine changed around her treatment, and I took over evening meals on treatment days so she could rest. A family business can offer that same flexibility. However, it only works if the family communicates well. Otherwise, a communication breakdown can quickly turn trust into anger.", 1], ["★ 相互信任", "mutual trust"], ["★ 這主要是因為……", "This is mainly because…"], ["接手晚餐", "took over evening meals"], ["★ 溝通失靈", "a communication breakdown"]]}, {"label": "Q3 Why might some people not enjoy…", "tone": "neu", "items": [["題目", "Why might some people not enjoy working in a family business?"], ["新撰寫・含個人素材（素材：妹妹）・講義修訂", "I think the main reason is that work and family get mixed up. For example, a disagreement about the business can easily carry on at the dinner table. Younger family members may also feel social pressure to join, even if they're not interested. I think people need the freedom to choose. When my sister was choosing her university subject, she asked for my opinion but chose finance for her own reasons, and that made it feel like her own decision. Also, promotion can depend on family position rather than ability, which feels unfair to outsiders.", 1], ["混在一起", "get mixed up"], ["★ 社會壓力", "social pressure"], ["延續到餐桌上", "carry on at the dinner table"], ["★ 而不是", "rather than"]]}, {"label": "Q4 What are the advantages of worki…", "tone": "neu", "items": [["題目", "What are the advantages of working for a big company?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "Mainly stability and structure. Large companies tend to offer better benefits, job security, clear career paths and formal training, which can improve people's career prospects. You also get to work on much bigger projects than smaller companies can offer. For example, I helped standardise the database structure on around 1,200 servers without any downtime. That taught me to trust careful planning over quick shortcuts. A major drawback is that decisions can be slow, but for people early in their careers, big companies are hard to beat.", 1], ["工作保障", "job security"], ["★ 改善職涯前景", "improve career prospects"], ["零停機", "without any downtime"], ["★ 主要缺點", "a major drawback"], ["難以超越", "hard to beat"]]}, {"label": "Q5 What are some reasons why it is…", "tone": "neu", "items": [["題目", "What are some reasons why it is better not to stay too long with one company?"], ["新撰寫・含個人素材（素材：決定離職、出國念書）・講義修訂", "I think there are a few reasons. Staying in one place too long can lead to a lack of motivation, because people stop learning once the work becomes routine. Changing jobs also means people are exposed to different systems and ways of thinking. For example, I've decided to leave a job I've been in for three years to study abroad. I've learnt a lot there, so it's hard to let go, but I believe the long-term benefits are bigger than the short-term costs. However, changing jobs too often can make people look unreliable.", 1], ["★ 缺乏動力", "a lack of motivation"], ["★ 接觸到", "be exposed to"], ["放手", "let go"], ["長期好處", "long-term benefits"]]}, {"label": "Q6 Is working in a large company to…", "tone": "neu", "items": [["題目", "Is working in a large company too impersonal?"], ["新撰寫・含個人素材（素材：Email 四天沒回）・講義修訂", "It can be, but it doesn't have to be. In large companies, decisions often come from managers people never meet, and messages get lost between different levels, which can lead t
