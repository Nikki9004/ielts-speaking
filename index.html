kward at all, which says a lot about our friendship.", 1], ["她教我，在台上不能躲在緊張後面；你必須願意勇敢展現自己。", "She taught me that you can't hide behind your nerves on stage; you have to be willing to put yourself out there.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "童年／老朋友、聊得來的朋友、由不喜歡到喜歡的朋友"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "媽媽的其他素材", "en": "人物", "groups": [{"label": "細節", "tone": "neu", "items": [["一直在家裡擺花（春天芍藥），化療期間也持續買便宜的小花放餐桌。", "My mum has always kept flowers at home – peonies in spring – and even during chemotherapy she kept buying small, inexpensive flowers for the dining table.", 1], ["維持一本約三十年的實體家庭相簿，連治療期間的平凡照片也收進去：“Because those days happened too. They’re ours.”", "She has kept a physical family photo album for about thirty years, and she even added ordinary photos from her treatment period: ‘Because those days happened too. They’re ours.’", 1], ["康復後第一個生日：你訂了她只提過一次的抹茶蛋糕，她說 “Matcha — you remembered.”", "For her first birthday after she recovered, I ordered a matcha cake she had mentioned only once, and she said, ‘Matcha — you remembered.’", 1], ["化療結束後想吃家附近小店的水餃；家族過節會一起包水餃（以前是奶奶做）。", "After chemo ended, she wanted dumplings from a little shop near our home; at family celebrations we all make dumplings together, which used to be my grandma's job.", 1], ["康復隔天早上她久違地下廚，一起吃豆漿和水餃。", "The morning after she recovered, she cooked for the first time in ages, and we had soy milk and dumplings together.", 1]]}, {"label": "金句", "tone": "neu", "items": [["微小而持續的關心，會改變周遭一切的品質。", "Small, consistent acts of care change the quality of everything around them."]]}, {"label": "實用片語", "tone": "pos", "items": [["微小而持續的關心", "small, consistent acts of care"], ["讓空間明亮起來", "brighten up a room"], ["出於愛的付出", "a labour of love"], ["對某人意義重大", "mean the world to someone"], ["記錄日常的時刻", "capture everyday moments"], ["家族傳統", "a family tradition"], ["代代相傳", "be passed down through generations"], ["久違地", "for the first time in ages"]]}, {"label": "單字", "tone": "pos", "items": [["體貼的", "thoughtful"], ["念舊的；重感情的", "sentimental"], ["儀式；固定習慣", "ritual"], ["平凡的；日常的", "mundane"], ["由衷的", "heartfelt"], ["懷舊的", "nostalgic"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["即使在化療期間，媽媽仍持續買便宜的小花放在餐桌上，這讓我看到這種小事有多重要。", "Even during chemotherapy my mum kept buying small, cheap flowers for the dining table, which showed me how much little things like that matter.", 1], ["她維持一本家庭相簿大約三十年，連治療期間的平凡照片也收進去，因為那些日子也是我們的。", "She's kept a family photo album for about thirty years, and she even included ordinary photos from her treatment, because those days were ours too.", 1], ["她康復後的第一個生日，我訂了她只提過一次的抹茶蛋糕，她只說了一句：「抹茶——你記得。」", "For her first birthday after recovering, I ordered a matcha cake she'd only mentioned once, and she simply said, ‘Matcha — you remembered.’", 1], ["她康復隔天早上久違地下廚，我們一起坐下來吃豆漿和水餃。", "The morning after she recovered, she cooked for the first time in ages, and we sat down together to soy milk and dumplings.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "種植物的人、家中珍藏的物品、特別的蛋糕、節慶食物、早起、驕傲的家人"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "周天成羽球比賽", "en": "活動", "groups": [{"label": "細節", "tone": "neu", "items": [["奧運期間全家在客廳看他比賽。", "During the Olympics, my whole family watched his matches in the living room."], ["頂級羽球一個回合幾秒內十幾拍；他救下賽末點的斜線回球讓全家同時驚呼。", "In top-level badminton, a single rally can have a dozen or more shots in just a few seconds; when he saved a match point with a cross-court return, the whole family gasped at once.", 1], ["從沒在現場看過他——想看的比賽。", "I've never seen him play live – that's the match I'd most like to watch."]]}, {"label": "金句", "tone": "neu", "items": [["運動在最精彩的時候，是看著一個人在人類身體與心智能力的極限邊緣發揮。", "Sport, at its best, is about watching a person operate at the absolute edge of what a human body and mind can do.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["緊張得坐立難安", "on the edge of our seats"], ["救下賽末點", "save a match point"], ["在一瞬間", "in a split second"], ["同時驚呼", "gasp in unison"], ["扣人心弦的結局", "a nail-biting finish"], ["處於巔峰狀態", "at the top of one's game"], ["挑戰…的極限", "push the limits of"], ["在我的人生清單上", "be on my bucket list"]]}, {"label": "單字", "tone": "pos", "items": [["令人振奮的；扣人心弦的", "electrifying"], ["反射神經", "reflexes"], ["敏捷", "agility"], ["精準", "precision"], ["腎上腺素", "adrenaline"], ["令人著迷的", "spellbinding"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["奧運期間，我們全家聚在客廳看周天成比賽。", "During the Olympics my whole family gathered in the living room to watch Chou Tien-chen."], ["他用一記斜線回球救下賽末點時，我們全家同時驚呼。", "When he saved a match point with a cross-court return, we all gasped at the same time."], ["在頂尖層級，一個回合幾秒內就能打十幾拍，可見選手的反應有多敏銳。", "At the top level, a rally can include a dozen shots in just a few seconds, which shows how sharp the players' reflexes are.", 1], ["我其實從沒在現場看過他打球，所以親眼看他比賽絕對在我的人生清單上。", "I've never actually seen him play live, so watching one of his matches in person is definitely on my bucket list.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "看過的比賽、想看的比賽、名人、運動節目"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "朴寶劍", "en": "人物", "groups": [{"label": "細節", "tone": "neu", "items": [["韓國演員，代表作《請回答1988》《青春紀錄》。", "Park Bo-gum is a Korean actor best known for Reply 1988 and Record of Youth."], ["簽名會待了四個半小時、給約 200 位粉絲每人完整的注意力。", "At one fan signing, he stayed for four and a half hours and gave each of the roughly 200 fans his full attention.", 1], ["名言：“I hope I can be a reason that makes people feel this world can still be gentle.”", "One of his well-known quotes is: ‘I hope I can be a reason that makes people feel this world can still be gentle.’", 1], ["代言保養品廣告，看起來真誠而非表演。", "He has appeared in skincare adverts, and he comes across as sincere rather than putting on a performance.", 1]]}, {"label": "金句", "tone": "neu", "items": [["偶爾當代言人和產品契合到一定程度，廣告就不再像是打擾，而更像是一種介紹。", "Occasionally the person and the product align well enough that the advertisement feels less like an interruption and more like an introduction.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["以…最為人所知", "best known for"], ["全神貫注地對待某人", "give someone your undivided attention"], ["做得超出預期", "go above and beyond"], ["給人…的印象", "come across as"], ["引起…的共鳴", "strike a chord with"], ["真誠的連結", "a genuine connection"], ["不像打擾，更像介紹", "feel less like an interruption and more like an introduction"]]}, {"label": "單字", "tone": "pos", "items": [["真誠的", "sincere"], ["真實不做作的", "authentic"], ["親切有禮的", "gracious"], ["代言", "endorsement"], ["正面健康的", "wholesome"], ["個人魅力", "charisma"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["朴寶劍是韓國演員，代表作是《請回答1988》和《青春紀錄》，我很欣賞他對待粉絲的方式。", "Park Bo-gum is a Korean actor best known for Reply 1988 and Record of Youth, and I really admire the way he treats his fans.", 1], ["有一次簽名會他待了四個半小時，給大約兩百位粉絲每個人全心的注意力。", "At one fan signing he stayed for four and a half hours, giving each of about two hundred fans his undivided attention.", 1], ["他曾說希望自己能成為讓人覺得這個世界依然溫柔的理由，我覺得這句話完全代表了他。", "He once said he hoped to be a reason people feel the world can still be gentle, and I think that sums him up.", 1], ["即使在保養品廣告裡，他看起來也是真誠而不是在表演，所以廣告感覺更像介紹而不是打擾。", "Even in his skincare adverts he comes across as sincere rather than performing, so the ad feels more like an introduction than an interruption.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "想見的名人、有名人的廣告、啟發你的人"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "中山區精品小店的外套", "en": "物品", "groups": [{"label": "細節", "tone": "neu", "items": [["一年前在中山區一家常經過卻沒進去的小店買的。", "I bought it a year ago from a small shop in Zhongshan that I'd walked past many times but never gone into.", 1], ["結構感、略寬版、中性色；試穿前沒看價格，比預算貴很多。", "It's structured, slightly oversized and a neutral colour; I didn't look at the price before trying it on, and it turned out to be far more than my budget.", 1], ["是你穿最多次的衣服，cost per wear 已經很合理。", "It's the piece of clothing I wear most, so the cost per wear is already quite reasonable."]]}, {"label": "金句", "tone": "neu", "items": [["有一種價值和價格無關——而在於一樣東西有多精準地符合你真正的需要。", "There’s a version of value that isn’t about price — it’s about how accurately a thing fits what you actually need.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["一時興起", "on a whim"], ["花大錢買…", "splash out on"], ["大幅超出預算", "go well over budget"], ["每次穿著的成本", "cost per wear"], ["每一分錢都值得", "worth every penny"], ["衣櫃裡的必備單品", "a wardrobe staple"], ["幾乎什麼都能搭", "go with almost everything"]]}, {"label": "單字", "tone": "pos", "items": [["精品小店", "boutique"], ["低調有質感的", "understated"], ["百搭的；用途多的", "versatile"], ["衝動購物", "impulse purchase"], ["值得投資的單品", "investment piece"], ["寬版的", "oversized"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["大約一年前，我終於走進中山區一家經過無數次的小店，就在那裡找到了這件外套。", "About a year ago I finally walked into a little boutique in Zhongshan that I'd passed countless times, and I found this coat.", 1], ["我犯了一個錯，就是沒先看價格就試穿，結果它遠遠超出我的預算。", "I made the mistake of trying it on before checking the price tag, and it turned out to be way over my budget.", 1], ["它有結構感、略寬版、又是中性色，幾乎什麼都能搭，所以我一直穿它。", "It's structured, slightly oversized and a neutral colour, so it goes with almost everything, which is why I wear it constantly.", 1], ["它現在是我穿最多次的衣服，所以算一下每次穿著的成本，其實是很划算的一筆消費。", "It's now the piece of clothing I wear most, so when you work out the cost per wear, it was actually a sensible purchase.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "花太多錢的東西、喜歡的商店、衣服"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "音樂與降噪耳機", "en": "物品", "groups": [{"label": "細節", "tone": "neu", "items": [["降噪耳機在開放式辦公室創造專注空間。", "My noise-cancelling headphones create a space where I can focus in our open-plan office."], ["專注時聽純音樂、需要能量時聽 ONE OK ROCK、累或難過時聽 Lizzy McAlpine、除錯時保持安靜。", "When I need to concentrate, I listen to instrumental music; when I need energy, it's ONE OK ROCK; when I'm tired or sad, it's Lizzy McAlpine; and when I'm debugging, I keep it silent.", 1], ["把音樂串流 app 當成調節情緒的「基礎設施」。", "I treat my music streaming app as a kind of ‘infrastructure’ for regulating my mood."]]}, {"label": "金句", "tone": "neu", "items": [["好耳機不只關乎音質——更關乎你和你所聽的東西之間的關係。", "Good headphones aren’t just about sound quality — they’re about the relationship you have with what you’re hearing.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["隔絕干擾", "block out distractions"], ["進入專注狀態", "get into the zone"], ["在自己的小世界裡", "in a bubble of my own"], ["依心情選音樂", "match the music to my mood"], ["提振心情的東西", "a mood booster"], ["放鬆下來", "wind down"], ["帶來巨大改變的東西", "a game-changer"]]}, {"label": "單字", "tone": "pos", "items": [["沉浸式的", "immersive"], ["純音樂的；器樂的", "instrumental"], ["撫慰人心的", "soothing"], ["令人振奮的", "invigorating"], ["不可或缺的", "indispensable"], ["開放式的（辦公室）", "open-plan"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["在開放式辦公室裡，降噪耳機徹底改變了我的工作狀態，因為它幫我創造出一個能專注的私人空間。", "In an open-plan office, my noise-cancelling headphones are a game-changer, because they basically create a private space where I can focus.", 1], ["我會依需要選音樂：專注時聽純音樂，需要能量時聽 ONE OK ROCK，心情低落時聽 Lizzy McAlpine。", "I match the music to what I need: instrumental tracks for focus, ONE OK ROCK for energy, and Lizzy McAlpine when I'm feeling low.", 1], ["有趣的是，除錯時我會把音樂完全關掉，因為我需要絕對的安靜來理清邏輯。", "Funnily enough, when I'm debugging I switch the music off completely, because I need total silence to follow the logic.", 1], ["身為資料工程師，我半開玩笑地把串流 app 稱為基礎設施，因為它是我用來調節情緒的系統。", "As a data engineer, I half-jokingly call my streaming app infrastructure, because it's the system I rely on to regulate my mood.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "想擁有的科技產品、不能沒有的東西、手機 app、幫助專注的東西、音樂"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "自學的同事", "en": "人物", "groups": [{"label": "細節", "tone": "neu", "items": [["原本商科畢業，靠線上資源與開源專案自學成資料工程師，現在是 team lead。", "He originally graduated in business, taught himself to be a data engineer through online resources and open-source projects, and is now a team lead.", 1], ["先問「這到底要做什麼」再問「怎麼做」；不怕犯錯、很快修正。", "He always asks ‘What is this actually for?’ before ‘How do we do it?’; he isn't afraid of making mistakes and corrects them quickly.", 1]]}, {"label": "金句", "tone": "neu", "items": [["他不執著於自己的解法，而且修正得很快。", "He held his solutions loosely and updated them fast."]]}, {"label": "實用片語", "tone": "pos", "items": [["轉換跑道", "switch careers"], ["做中學", "learn by doing"], ["一步步往上爬", "work one's way up"], ["從「為什麼」開始", "start with the why"], ["不執著於自己的想法", "hold your ideas loosely"], ["快速試錯並及時修正", "fail fast and course-correct"], ["成長型思維", "a growth mindset"]]}, {"label": "單字", "tone": "pos", "items": [["自學的", "self-taught"], ["開源的", "open-source"], ["務實的", "pragmatic"], ["好奇愛問的", "inquisitive"], ["反覆迭代", "iterate"], ["適應力強的", "adaptable"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我很欣賞的一位同事是商科出身，但他靠線上資源和開源專案自學資料工程，現在已經是 team lead。", "One colleague I really admire studied business, but he taught himself data engineering through online resources and open-source projects, and now he's a team lead.", 1], ["在問怎麼做之前，他總會先問這到底是要做什麼，這讓團隊避免解錯問題。", "Before asking how to build something, he always asks what it's actually for, which saves the team from solving the wrong problem.", 1], ["他不怕犯錯；他不執著於自己的解法，修正得很快，這是我還在學習的地方。", "He's not afraid of getting things wrong; he holds his solutions loosely and updates them fast, which is something I'm still learning to do.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "自學的朋友、聰明的人、成功的人"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "物流科技創業者（化名 Wei）", "en": "人物", "groups": [{"label": "細節", "tone": "neu", "items": [["你曾以顧問身分參與他公司的資料專案；公司處理台灣數十家物流的即時配送資料。", "I worked as a consultant on a data project at his company, which handles real-time delivery data for dozens of logistics firms across Taiwan.", 1], ["他總問「流量變三倍時什麼會先壞」；寧可花兩倍時間第一次就做對。", "He always asks, \"What breaks first when traffic triples?\" and he would rather spend twice as long getting it right the first time.", 1]]}, {"label": "金句", "tone": "neu", "items": [["第二次重建永遠比第一次就好好做來得昂貴。", "The second rebuild is always more expensive than doing the first one properly."]]}, {"label": "實用片語", "tone": "pos", "items": [["第一次就做對", "get it right the first time"], ["偷工減料、走捷徑", "cut corners"], ["對一個想法做壓力測試", "stress-test an idea"], ["提前想好幾步", "think several steps ahead"], ["長遠來看會有回報", "pay off in the long run"], ["打好穩固的基礎", "build on solid foundations"], ["擴展性的瓶頸", "a scalability bottleneck"], ["短痛換長期收穫", "short-term pain for long-term gain"]]}, {"label": "單字", "tone": "pos", "items": [["遠見", "foresight"], ["可擴展性", "scalability"], ["一絲不苟的", "meticulous"], ["穩健性", "robustness"], ["務實的", "pragmatic"], ["即時的", "real-time"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我以顧問身分參與他的資料專案時，Wei 一直問流量變三倍時什麼會先壞，這個問題讓我印象非常深刻。", "When I consulted on his data project, Wei kept asking what would break first if traffic tripled, and that question really stuck with me.", 1], ["他寧可花兩倍時間第一次就把事情做對，因為第二次重建永遠比一開始好好做更昂貴。", "He would rather spend twice as long getting something right the first time, because the second rebuild is always more expensive than doing it properly.", 1], ["他的公司處理台灣數十家物流業者的即時配送資料，所以對他來說，偷工減料根本不是選項。", "His company handles real-time delivery data for dozens of logistics firms in Taiwan, so cutting corners simply isn't an option for him.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "成功的生意人、聰明的人、解決問題"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "學英文：Friends 與 About Time", "en": "經歷", "groups": [{"label": "細節", "tone": "neu", "items": [["不看中文字幕看 Friends，一開始漏掉六成笑點，慢慢能預測台詞。", "I watched Friends without Chinese subtitles; at first I missed about sixty per cent of the jokes, but gradually I could predict the lines.", 1], ["About Time（Richard Curtis）讓你哭：主題是選擇活在平凡的當下，連結到河邊野餐。", "About Time by Richard Curtis made me cry: it's about choosing to live in the ordinary present, and it reminded me of a riverside picnic.", 1]]}, {"label": "金句", "tone": "neu", "items": [["英文不再像一個要破解的密碼，而更像一個我可以學著住進去的房間。", "English became less like a code to crack and more like a room I could learn to live in."]]}, {"label": "實用片語", "tone": "pos", "items": [["拿掉字幕", "ditch the subtitles"], ["聽懂笑點", "pick up on the jokes"], ["陡峭的學習曲線", "a steep learning curve"], ["逐漸上手", "get the hang of it"], ["讓自己沉浸在……之中", "immerse myself in"], ["引起我的共鳴", "strike a chord with me"], ["感動落淚", "be moved to tears"], ["細細品味平凡的時刻", "savour the ordinary moments"]]}, {"label": "單字", "tone": "pos", "items": [["沉浸式學習", "immersion"], ["細微差異", "nuance"], ["令人心酸動容的", "poignant"], ["平凡的、日常的", "mundane"], ["直覺的", "intuitive"], ["苦樂參半的", "bittersweet"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我剛開始不看中文字幕看 Friends 時，漏掉了大約六成的笑點，但慢慢地我竟然能預測台詞。", "When I first watched Friends without Chinese subtitles, I missed about sixty per cent of the jokes, but gradually I could actually predict the lines.", 1], ["Richard Curtis 的 About Time 真的讓我哭了，因為它關於選擇活在平凡當下的訊息，讓我想起一次河邊野餐。", "About Time by Richard Curtis genuinely made me cry, because its message about choosing to live in the ordinary present reminded me of a riverside picnic.", 1], ["一點一點地，英文不再像一個要破解的密碼，而更像一個我可以學著住進去的房間。", "Little by little, English became less like a code to crack and more like a room I could learn to live in.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "學語言、喜歡的電影、讓你發笑／感動的電影"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "YouTube 雅典民主影片", "en": "媒體", "groups": [{"label": "細節", "tone": "neu", "items": [["講 Cleisthenes 改革、雅典約三萬公民如何發明民主；以敘事方式講歷史。", "It covered Cleisthenes' reforms and how roughly thirty thousand Athenian citizens invented democracy, telling history as a story.", 1], ["你看了三次還做筆記。", "I watched it three times and took notes."]]}, {"label": "金句", "tone": "neu", "items": [["歷史是一座濃縮的人類行為實驗室。", "History is a compressed laboratory of human behaviour."]]}, {"label": "實用片語", "tone": "pos", "items": [["讓歷史活起來", "bring history to life"], ["敘事式的手法", "a narrative approach"], ["民主的誕生", "the birth of democracy"], ["為……奠定基礎", "lay the groundwork for"], ["做大量筆記", "take copious notes"], ["與現今做類比", "draw parallels with the present"], ["一頭栽進去、越看越深入", "go down a rabbit hole"]]}, {"label": "單字", "tone": "pos", "items": [["引人入勝的", "compelling"], ["有啟發性的", "enlightening"], ["公民的", "civic"], ["改革", "reform"], ["說故事、敘事", "storytelling"], ["重看", "rewatch"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["那支影片講解了 Cleisthenes 的改革，以及約三萬名雅典公民如何發明民主，而且整個用說故事的方式呈現。", "The video explained Cleisthenes' reforms and how roughly thirty thousand Athenian citizens invented democracy, and it told the whole thing like a story.", 1], ["我覺得它太引人入勝，看了三次還認真做筆記，這是我看 YouTube 影片幾乎從來不會做的事。", "I found it so compelling that I watched it three times and actually took notes, which I almost never do with YouTube videos.", 1], ["對我來說，歷史是一座濃縮的人類行為實驗室，而像這樣的敘事手法真的讓這座實驗室活了起來。", "To me, history is a compressed laboratory of human behaviour, and a narrative approach like this really brings that laboratory to life.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "有趣的影片、網站、歷史"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "Stranger Things", "en": "媒體", "groups": [{"label": "細節", "tone": "neu", "items": [["壓力大時一口氣兩天看完第一季；你喜歡的是角色之間的友情與忠誠，而不是恐怖元素。", "When I was under a lot of stress, I binge-watched the whole first season in two days; what I loved was the friendship and loyalty between the characters, not the horror elements.", 1]]}, {"label": "金句", "tone": "neu", "items": [["在超自然元素底下，它其實是一個關於忠誠的故事。", "Underneath the supernatural elements, it’s really a story about loyalty."]]}, {"label": "實用片語", "tone": "pos", "items": [["一口氣追完一整季", "binge-watch a whole season"], ["壓力很大", "under a lot of pressure"], ["讓自己暫時不去想煩心事", "take my mind off things"], ["關係緊密的一群人", "a tight-knit group"], ["彼此不離不棄", "stick by each other"], ["本質上、核心是", "at its heart"], ["在表面之下", "beneath the surface"]]}, {"label": "單字", "tone": "pos", "items": [["逃避現實（的娛樂）", "escapism"], ["同伴情誼", "camaraderie"], ["忠誠", "loyalty"], ["超自然的", "supernatural"], ["扣人心弦的", "gripping"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我壓力很大的時候，只花兩天就一口氣看完了 Stranger Things 的整個第一季。", "When I was under a lot of stress, I binge-watched the entire first season of Stranger Things in just two days.", 1], ["吸引我的根本不是恐怖元素，而是角色之間的友情與忠誠，以及他們彼此不離不棄的樣子。", "What drew me in wasn't the horror at all; it was the friendship and loyalty between the characters, the way they stick by each other.", 1], ["在超自然元素底下，它其實是一個關於忠誠的故事，我想這就是它在我壓力大的時候讓我那麼安心的原因。", "Underneath the supernatural elements, it's really a story about loyalty, and I think that's why it felt so comforting during a stressful time.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "故事／書、影集"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "The Secret（書）與醫院候診室", "en": "經歷", "groups": [{"label": "細節", "tone": "neu", "items": [["陪媽媽化療時在候診室讀完 The Secret；你偏好紙本、慢慢讀並做筆記。", "I finished The Secret in a hospital waiting room while I was accompanying my mum to her chemotherapy; I prefer paper books, reading slowly and taking notes.", 1], ["候診室的無聊其實是「被恐懼填滿的空白」。", "The boredom of a waiting room is really an empty space filled with fear."]]}, {"label": "金句", "tone": "neu", "items": [["在醫院候診室裡，無聊其實是一種保護。", "In a hospital waiting room, boredom is protective."]]}, {"label": "實用片語", "tone": "pos", "items": [["讓腦袋有事可做", "keep my mind occupied"], ["一種應對機制", "a coping mechanism"], ["令人感激的分心", "a welcome distraction"], ["依照自己的步調", "at my own pace"], ["經歷一段艱難時期", "go through a difficult period"], ["躲進書本裡尋求慰藉", "take refuge in a book"], ["填補沉默", "fill the silence"]]}, {"label": "單字", "tone": "pos", "items": [["化療", "chemotherapy"], ["觸感的", "tactile"], ["憂慮、不安", "apprehension"], ["沉思的", "contemplative"], ["分散注意力的事物", "distraction"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我其實是在陪媽媽做化療時，在醫院候診室裡讀完 The Secret 的。", "I actually finished The Secret in a hospital waiting room while I was accompanying my mum to her chemotherapy sessions.", 1], ["我比較喜歡紙本書，因為我喜歡依自己的步調慢慢讀，邊讀邊做筆記。", "I much prefer paper books, because I like reading slowly at my own pace and jotting down notes as I go along.", 1], ["候診室裡的無聊其實是被恐懼填滿的空白，所以在那種情境下，我會說無聊其實是一種保護。", "The boredom in a waiting room is really an empty space filled with fear, so in that setting, I'd say boredom is protective.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "無聊的地方、閱讀、書"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "台北101", "en": "地點", "groups": [{"label": "細節", "tone": "neu", "items": [["工程上了不起（660 噸阻尼器），但你對建築本身無感；它的價值在於地標與「回家」的象徵。", "It's an engineering marvel, with a 660-tonne damper, but the architecture itself doesn't really move me; its value lies in being a landmark and a symbol of coming home.", 1]]}, {"label": "金句", "tone": "neu", "items": [["對我來說，它的價值在於導航與象徵意義，而不是美感。", "Its value, for me, is navigational and symbolic rather than aesthetic."]]}, {"label": "實用片語", "tone": "pos", "items": [["工程壯舉", "an engineering feat"], ["讓我無感", "leave me cold"], ["參考點、指標", "a point of reference"], ["主宰天際線", "dominate the skyline"], ["家的象徵", "a symbol of home"], ["對……無感", "be indifferent to"], ["而不是因為外觀", "rather than for its looks"]]}, {"label": "單字", "tone": "pos", "items": [["地標", "landmark"], ["阻尼器", "damper"], ["美學的", "aesthetic"], ["具代表性的", "iconic"], ["象徵性的", "symbolic"], ["天際線", "skyline"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["從工程角度來看，台北101很了不起，尤其是那個 660 噸的阻尼器，但老實說建築本身讓我無感。", "From an engineering point of view, Taipei 101 is remarkable, especially its 660-tonne damper, but the architecture itself honestly leaves me cold.", 1], ["對我來說，它的價值在於導航與象徵，而非美感；它是一個地標，看到它基本上就代表我要回家了。", "For me, its value is navigational and symbolic rather than aesthetic; it's a landmark, and seeing it basically tells me I'm coming home.", 1], ["我不會說它很美，但作為家的象徵，它對我的意義遠超過任何我真心欣賞的建築。", "I wouldn't call it beautiful, but as a symbol of home it means far more to me than any building I genuinely admire.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "高樓、建築"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "妹妹", "en": "人物", "groups": [{"label": "細節", "tone": "neu", "items": [["選大學科系時問你意見，最後選了金融（出於自己的理由）。", "When she was choosing her degree subject, she asked for my opinion, and in the end she chose finance for her own reasons.", 1], ["大一想退選統計課，你用遷移專案的經驗鼓勵她：困難代表你在學習，而不是失敗。她最後留下來。", "In her first year she wanted to drop her statistics course, so I drew on my experience from the migration project to encourage her: difficulty means you're learning, not failing. She ended up staying.", 1]]}, {"label": "金句", "tone": "neu", "items": [["困難是你正在學習的證據，而不是你正在失敗的證據。", "The difficulty is evidence you’re learning, not evidence you’re failing."]]}, {"label": "實用片語", "tone": "pos", "items": [["可以討論、給意見的對象", "a sounding board"], ["自己做決定", "make up her own mind"], ["借鏡自己的經驗", "draw on my own experience"], ["認輸放棄", "throw in the towel"], ["堅持到底", "stick it out"], ["重新詮釋困境", "reframe the struggle"], ["成長型思維", "a growth mindset"]]}, {"label": "單字", "tone": "pos", "items": [["毅力", "perseverance"], ["自主性", "autonomy"], ["挫折", "setback"], ["安心的保證、鼓勵", "reassurance"], ["韌性", "resilience"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我妹妹選大學科系時問過我的意見，但最後她是出於自己的理由選了金融。", "When my sister was choosing her degree subject, she asked for my opinion, but in the end she chose finance for her own reasons.", 1], ["她大一時想退選統計，所以我用遷移專案的經驗，告訴她困難代表她在學習，而不是失敗。", "In her first year she wanted to drop statistics, so I drew on my migration project and told her the difficulty meant she was learning, not failing.", 1], ["她決定堅持下去，留在那門課，我想重新詮釋那份困難，幫助她換了個角度看待它。", "She decided to stick it out and stayed on the course, and I like to think that reframing the struggle helped her see it differently.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "給建議、鼓勵別人、被詢問意見"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "Email 四天沒回", "en": "經歷", "groups": [{"label": "細節", "tone": "neu", "items": [["遷移專案寄提案給維運主管四天沒回，當面去找五分鐘就解決（信卡在上級的收件匣）。", "During the migration project, I emailed a proposal to the head of operations and heard nothing for four days; when I went to see them in person, it was sorted in five minutes, because the email had got stuck in a senior manager's inbox.", 1], ["之後跨部門請求第三天一定當面追。", "Since then, I always follow up in person on the third day for any cross-departmental request.", 1]]}, {"label": "金句", "tone": "neu", "items": [["會得到回覆的訊息，是送到對的人手上的那一封。", "The message that gets a reply is the one that reaches the right person."]]}, {"label": "實用片語", "tone": "pos", "items": [["當面跟進", "follow up in person"], ["被遺漏、沒人處理", "fall through the cracks"], ["追進度", "chase something up"], ["簡短的當面談話", "a quick face-to-face chat"], ["對的聯絡窗口", "the right point of contact"], ["一個簡單的經驗法則", "a simple rule of thumb"], ["主動出擊", "take the initiative"]]}, {"label": "單字", "tone": "pos", "items": [["積極主動的", "proactive"], ["跨部門的", "cross-departmental"], ["沒有回應的", "unresponsive"], ["瓶頸", "bottleneck"], ["上呈、升級處理", "escalate"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["在我們的遷移專案期間，我寄了一份提案給維運主管，整整四天完全沒有回音。", "During our migration project, I emailed a proposal to the head of operations and heard absolutely nothing back for four whole days.", 1], ["我最後當面去找他們，五分鐘就解決了，原來那封信卡在上級主管的收件匣裡。", "When I finally went to see them in person, it was sorted in five minutes, because the email had got stuck in a senior manager's inbox.", 1], ["從那之後，我的經驗法則很簡單：任何跨部門的請求，我都會在第三天當面追，沒有例外。", "Since then, my rule of thumb is simple: for any cross-departmental request, I follow up in person on the third day, without exception.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "傳訊息沒回、溝通"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "小時候想當老師", "en": "經歷", "groups": [{"label": "細節", "tone": "neu", "items": [["受數學老師影響想當老師；大學時發現對資料系統著迷而改變計畫。", "Inspired by my maths teacher, I wanted to become a teacher, but at university I discovered I was fascinated by data systems and changed my plans.", 1]]}, {"label": "金句", "tone": "neu", "items": [["計畫改變了，但底下的價值沒有變。", "The plan changed. The value underneath it didn’t."]]}, {"label": "實用片語", "tone": "pos", "items": [["榜樣", "a role model"], ["在……心中留下深刻印象", "leave a lasting impression on"], ["改變方向", "change course"], ["發現對……的熱情", "discover a passion for"], ["被……吸引", "be drawn to"], ["支撐一個決定的價值觀", "the values underpinning a decision"]]}, {"label": "單字", "tone": "pos", "items": [["抱負、志向", "aspiration"], ["影響深遠的、塑造性的", "formative"], ["志業、天職", "vocation"], ["著迷", "fascination"], ["轉向", "pivot"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我小時候想當老師，主要是因為我的數學老師對我影響很深。", "As a child, I wanted to become a teacher, mainly because my maths teacher had such a strong influence on me.", 1], ["不過到了大學，我發現自己完全著迷於資料系統，所以改變方向，走上了那條路。", "At university, though, I discovered I was completely fascinated by data systems, so I changed course and followed that path instead.", 1], ["回頭看，計畫改變了，但底下的價值沒有變，我覺得這比職稱本身更重要。", "Looking back, the plan changed, but the value underneath it didn't, and I think that matters more than the job title itself.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "改變的計畫、目標、夢想"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "想推動的法律", "en": "想法", "groups": [{"label": "細節", "tone": "neu", "items": [["所有高中與大學生做至少兩週社區服務（來自賴索托經驗）。", "I'd make all secondary school and university students do at least two weeks of community service, an idea that comes from my experience in Lesotho.", 1], ["人口五十萬以上城市必須有綠色廊道（來自淡水河河濱公園）。", "I'd require every city with a population of over 500,000 to have green corridors, inspired by the riverside parks along the Tamsui River.", 1]]}, {"label": "金句", "tone": "neu", "items": [["綠地是不可或缺的基礎建設，而不是可有可無的附加設施。", "Green space is essential infrastructure, not an optional amenity."]]}, {"label": "實用片語", "tone": "pos", "items": [["讓它成為強制性的", "make it compulsory"], ["回饋社區", "give back to the community"], ["開闊視野", "broaden their horizons"], ["公民責任感", "a sense of civic responsibility"], ["城市之肺", "the green lungs of a city"], ["不可或缺的基礎建設", "essential infrastructure"], ["可有可無的附加品", "an optional extra"]]}, {"label": "單字", "tone": "pos", "items": [["強制的", "mandatory"], ["立法、法規", "legislation"], ["宜居性", "liveability"], ["便利設施", "amenity"], ["廊道", "corridor"], ["公民的", "civic"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["如果我能通過一條法律，我會讓所有高中與大學生強制做至少兩週的社區服務。", "If I could pass one law, I'd make at least two weeks of community service compulsory for all secondary school and university students.", 1], ["這個想法直接來自我自己在賴索托的經驗，我真心認為每個年輕人都應該有機會回饋社區。", "That idea comes directly from my own experience in Lesotho, and I genuinely believe every young person deserves a chance to give back to a community.", 1], ["我也會要求每個人口超過五十萬的城市都要有綠色廊道，因為綠地是不可或缺的基礎建設，而不是可有可無的設施。", "I'd also require every city with over half a million people to have green corridors, because green space is essential infrastructure, not an optional amenity.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "新法律、環保法、社會議題"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "倫敦聖誕節塞車", "en": "經歷・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["去倫敦時，在 Piccadilly Circus 附近買了很多聖誕節的東西，想搭公車到地鐵站。", "When I was in London, I did loads of Christmas shopping around Piccadilly Circus and wanted to catch a bus to the Tube station.", 1], ["因為人實在太多、交通堵塞，原本 5 分鐘的車程塞了快一個小時。", "Because it was so crowded and the traffic was gridlocked, what should have been a five-minute ride took almost an hour.", 1], ["最後司機也放棄了，在半路直接讓大家下車。", "In the end, even the driver gave up and let everyone off halfway."]]}, {"label": "金句", "tone": "neu", "items": [["原本在 Piccadilly Circus 附近五分鐘的公車車程，拖了快一個小時，最後司機乾脆放棄，讓我們全部在半路下車。", "What should have been a five-minute bus ride near Piccadilly Circus dragged on for almost an hour, until the driver simply gave up and let us all off halfway.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["卡在嚴重塞車中", "be stuck in gridlock"], ["車子一輛接一輛的車陣", "bumper-to-bumper traffic"], ["以龜速前進", "crawl along at a snail's pace"], ["節慶期間的人潮", "the festive rush"], ["放棄、認輸", "throw in the towel"], ["拖了很久", "drag on for ages"], ["提著大包小包的購物袋", "laden with shopping bags"]]}, {"label": "單字", "tone": "pos", "items": [["交通癱瘓的", "gridlocked"], ["壅塞", "congestion"], ["擠滿人的", "heaving"], ["令人惱火的", "exasperating"], ["停滯、動彈不得", "standstill"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我聖誕節去倫敦時，Piccadilly Circus 附近的街道擠滿了人，五分鐘的公車車程變成將近一小時。", "When I was in London at Christmas, the streets around Piccadilly Circus were so heaving that a five-minute bus ride turned into almost an hour.", 1], ["交通糟到最後連公車司機都放棄了，讓我們全部在半路下車。", "The traffic was so bad that, in the end, even the bus driver threw in the towel and let all of us off halfway.", 1], ["這讓我體會到大城市在節慶期間真的很讓人抓狂，因為人潮多到連短程移動都無法預測。", "It showed me that big cities can be really exasperating during the festive season, because the sheer number of people makes even short journeys unpredictable.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "塞車、交通、旅行、等待／耐心、大城市的缺點、聖誕節"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "決定離職、出國念書", "en": "經歷・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["決定離開待了三年的工作（目前還在職，正在準備）；在那裡學到很多、累積寶貴經驗，所以很難割捨。", "I've decided to leave a job I've been in for three years; I've learnt a lot and gained valuable experience there, so it's hard to let go.", 1], ["出國念書曾經像是不可能的夢想，仔細權衡利弊後，做了清醒的決定。", "Studying abroad once felt like an impossible dream, but after carefully weighing up the pros and cons, I made a clear-headed decision.", 1], ["考量過財務壓力，可能需要借錢；但長期好處大於短期成本，所以決定去做。", "I took the financial pressure into account, and I might need to borrow money, but the long-term benefits outweigh the short-term costs, so I decided to go for it.", 1], ["做重要決定時會先列優缺點，再聽朋友或爸媽的意見，但最後自己做決定。", "When I make important decisions, I list the pros and cons first and listen to my friends' or parents' views, but in the end I make the decision myself.", 1]]}, {"label": "金句", "tone": "neu", "items": [["決定離開待了三年的工作很難，但仔細權衡利弊之後，我發現出國念書的長期好處大於短期的財務成本。", "Deciding to leave a job I've been in for three years was tough, but once I'd weighed up the pros and cons, I realised the long-term benefits of studying abroad outweighed the short-term financial cost.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["權衡利弊", "weigh up the pros and cons"], ["不切實際的夢想", "a pipe dream"], ["清醒理性的決定", "a clear-headed decision"], ["鼓起勇氣放手一搏", "take the plunge"], ["大於短期成本", "outweigh the short-term costs"], ["把某事納入考量", "take something into account"], ["拍板做決定", "make the call"]]}, {"label": "單字", "tone": "pos", "items": [["令人卻步的", "daunting"], ["深思熟慮的", "deliberate"], ["取捨", "trade-off"], ["極其寶貴的", "invaluable"], ["難以割捨的痛苦", "wrench"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["決定離開待了三年的工作真的很難割捨，因為我在那裡學到很多，也累積了非常寶貴的經驗。", "Deciding to leave a job I've been in for three years is a real wrench, because I've learnt so much and gained invaluable experience there.", 1], ["出國念書以前像是遙不可及的夢想，但權衡利弊之後，我做了清醒的決定，放手一搏。", "Studying abroad used to feel like a pipe dream, but after weighing up the pros and cons, I made a clear-headed decision to take the plunge.", 1], ["雖然我可能得借錢，但我真心相信長期的好處會大於短期的成本。", "Even though I might have to borrow money, I genuinely believe the long-term benefits will outweigh the short-term costs.", 1], ["每當面臨重大決定，我會列出優缺點，也會問朋友或爸媽的意見，但最後還是由我自己拍板。", "Whenever I face a big decision, I list the pros and cons and ask my friends or parents for advice, but ultimately I make the call myself.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "困難的決定、重要決定、目標、改變、出國"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "媽媽鼓勵我出國念書", "en": "人物・經歷・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["媽媽鼓勵我出國念書：她覺得我現在還年輕，應該去嘗試，不要等時間晚了才後悔。", "My mum is the one who encouraged me to study abroad. She said I'm still young, so I should give it a try now rather than wait until it's too late and regret it.", 1], ["我原本覺得錢不夠，但媽媽表示會支持我，讓這個決定變得可能。", "I'd originally thought I couldn't afford it, but she told me she'd support me, which made the decision possible.", 1], ["現在已經慢慢在準備，還在申請中，結果還沒確定。", "I'm now preparing step by step and I'm still in the middle of my applications, so nothing is confirmed yet.", 1], ["很謝謝媽媽鼓勵我、支持我。", "I'm really grateful to her for encouraging me and backing me."]]}, {"label": "金句", "tone": "neu", "items": [["你還年輕，現在就去試，不要等到太晚才後悔。", "You're still young — try it now, rather than wait until it's too late and live with regret.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["試試看", "give it a try"], ["趁還來得及", "before it's too late"], ["帶著遺憾過日子", "live with regret"], ["遙不可及的夢想", "a pipe dream"], ["說服自己打消念頭", "talk myself out of it"], ["支持我", "back me"], ["卸下心中大石", "take a huge weight off my shoulders"], ["放手去做", "go for it"]]}, {"label": "單字", "tone": "pos", "items": [["鼓勵", "encouragement"], ["使人安心的話", "reassurance"], ["負擔得起的", "affordable"], ["感激的", "grateful"], ["申請", "application"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["是媽媽說服我出國念書的；她說我還年輕，不該等到太晚。", "My mum was the one who persuaded me to study abroad; she said I'm still young and shouldn't wait until it's too late.", 1], ["我一直以為自己負擔不起，所以當她說會支持我時，我心裡的大石頭放下了。", "I'd always assumed I couldn't afford it, so when she said she'd support me, it took a huge weight off my shoulders.", 1], ["我還在申請中，但已經很感謝她推了我一把。", "I'm still in the middle of my applications, but I'm already grateful that she gave me the push I needed.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "被勸說／被鼓勵的時刻、啟發你的人、家人、重要決定、未來計畫、感謝"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "產品大改版與生日加班", "en": "經歷・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["今年上半年公司產品大改版，團隊要提供技術支援、加班，甚至 24 小時待命。", "In the first half of this year, my company did a major product overhaul, so my team had to provide technical support, work overtime and even be on call 24/7.", 1], ["生日當天半夜還在公司部署新版本、維護系統、修 bug。", "On my birthday, I was still at the office in the middle of the night, deploying a new version, maintaining the system and fixing bugs.", 1], ["寫程式時犯過錯、差點造成正式環境的問題，學會更注意細節、反覆檢查。", "I once made a mistake while coding that nearly caused a problem in production, which taught me to pay closer attention to detail and double-check everything.", 1]]}, {"label": "金句", "tone": "neu", "items": [["我生日那天其實是在公司待到半夜，部署新版本、修 bug，這件事我永遠不會忘記。", "I actually spent my birthday at the office past midnight, deploying a new release and fixing bugs, which is something I'll never forget.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["大規模改版", "a major overhaul"], ["24 小時待命", "be on call around the clock"], ["熬夜工作", "burn the midnight oil"], ["推出新版本", "roll out a new version"], ["差點出事的狀況", "a near miss"], ["注重細節", "pay close attention to detail"], ["每件事都反覆確認", "double-check everything"], ["承受龐大壓力", "under immense pressure"]]}, {"label": "單字", "tone": "pos", "items": [["部署", "deployment"], ["一絲不苟的", "meticulous"], ["忙亂的", "hectic"], ["小故障", "glitch"], ["全面翻修、大改版", "overhaul"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["今年上半年公司產品大改版，所以我們團隊得加班，甚至 24 小時待命。", "In the first half of this year, my company overhauled its product, so my team had to work overtime and even be on call around the clock.", 1], ["我生日當天其實是半夜還在公司部署新版本、修 bug。", "I actually spent my birthday at the office in the middle of the night, deploying a new version and fixing bugs.", 1], ["我曾經寫程式出錯，差點造成正式環境的問題，從那之後我在反覆檢查工作這件事上變得細心許多。", "I once made a coding mistake that nearly caused a problem in production, and since then I've become far more meticulous about double-checking my work.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "忙碌的時刻、工作壓力、犯錯與學習、生日"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "我的主管", "en": "人物・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["遇到問題時會主動陪我一起分析，引導我想出方法，再讓我自己去解決。", "Whenever I run into a problem, my manager proactively analyses it with me and guides me towards a solution, then lets me sort it out myself.", 1], ["會幫我擋掉不合理的工作內容，讓我不浪費時間。", "My manager also shields me from unreasonable tasks, so I don't waste my time."]]}, {"label": "金句", "tone": "neu", "items": [["每當我遇到問題，主管會陪我一起分析、引導我找到解法，但最後讓我自己去解決。", "Whenever I hit a problem, my manager works through it with me and guides me towards a solution, but then lets me solve it myself.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["陪我一步步釐清問題", "talk me through a problem"], ["給我正確的方向", "point me in the right direction"], ["自己想辦法解決", "figure things out for myself"], ["幫我擋掉不合理的要求", "shield me from unreasonable demands"], ["親力親為的作法", "a hands-on approach"], ["讓某人有能力、有信心去做某事", "empower someone to do something"], ["從做中學", "learn by doing"]]}, {"label": "單字", "tone": "pos", "items": [["給予支持的", "supportive"], ["主動積極的", "proactive"], ["良師、指導者", "mentor"], ["自主權", "autonomy"], ["緩衝、屏障", "buffer"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我最欣賞主管的一點是，他不會直接給答案，而是陪我釐清問題，再讓我自己解決。", "What I appreciate most about my manager is that, instead of just giving me the answer, they talk me through the problem and let me solve it.", 1], ["主管也像一道屏障，幫我擋掉不合理的工作，讓我能把時間花在真正重要的事情上。", "My manager also acts as a buffer, shielding me from unreasonable tasks so that I can focus my time on work that really matters.", 1], ["被引導而不是被餵答案，讓我有更多自主空間，也學會自己想辦法解決問題。", "Being guided rather than spoon-fed has given me more autonomy, and I've learnt to figure things out for myself.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "幫助你的人、工作、好主管、領導"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "我的家與房間", "en": "地點・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["住公寓：相對好整理、空間不會過大、有溫馨感。", "I live in a flat, which is relatively easy to keep tidy, not too big, and feels cosy."], ["最喜歡自己的房間，擺了很多自己買的擺設；其中一盞燈是在越南買的，由很多片壓克力組成，中間挖圓洞放燈泡，很漂亮。", "My favourite place is my own room, which is full of decorations I've bought myself; one of them is a lamp I bought in Vietnam, made of lots of acrylic pieces with a round hole cut in the middle for the bulb, and it's really beautiful.", 1], ["家具和牆壁是淡淡的灰白色；天氣好時陽光灑進房間的感覺很舒服。", "The furniture and walls are a soft greyish-white, and when the weather's nice, the sunlight streaming into the room feels lovely.", 1], ["最喜歡坐在家裡 L 型沙發的角落，可以兩邊靠著，窩著看電視、滑手機或放空。", "My favourite spot at home is the corner of our L-shaped sofa, where I can lean on both sides and curl up to watch TV, scroll on my phone or just zone out.", 1], ["每天在化妝桌化妝，用小托盤放出門要帶的東西，回家再放回去。", "Every day I do my make-up at my dressing table, and I keep the things I need to take out with me in a little tray, then put them back when I get home.", 1]]}, {"label": "金句", "tone": "neu", "items": [["我最喜歡的位置是 L 型沙發的角落，兩邊都可以靠著，整個人窩著放空。", "My favourite spot is the corner of our L-shaped sofa, where I can lean back on both sides and just curl up and switch off.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["溫馨又好整理", "cosy and easy to maintain"], ["沐浴在陽光中", "bathed in sunlight"], ["窩在沙發上", "curl up on the sofa"], ["放空", "zone out"], ["旅行帶回來的紀念品", "a souvenir from my travels"], ["沉穩的中性色調", "a calm, neutral colour palette"], ["讓東西井然有序", "keep things in order"], ["我的小小避風港", "my little sanctuary"]]}, {"label": "單字", "tone": "pos", "items": [["溫馨舒適的", "cosy"], ["低調素雅的", "understated"], ["擺飾", "ornaments"], ["壓克力", "acrylic"], ["舒適溫暖的", "snug"], ["不雜亂的", "clutter-free"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我很喜歡一盞在越南買的燈，它由壓克力片組成，中間挖了一個圓洞放燈泡。", "One piece I really love is a lamp I bought in Vietnam, made of acrylic pieces with a round hole in the middle for the bulb.", 1], ["牆壁和家具都是淡淡的灰白色，所以天氣好、陽光灑進來時，整個房間感覺很平靜。", "The walls and furniture are a soft greyish-white, so when the weather's nice and sunlight streams in, the whole room feels really calm.", 1], ["每當我想放鬆，就會窩在家裡 L 型沙發的角落，看看電視或放空。", "Whenever I want to unwind, I curl up in the corner of our L-shaped sofa and just watch TV or zone out.", 1], ["我在化妝桌上放了一個小托盤，裝出門要帶的東西，這樣我總是知道東西在哪裡。", "I keep a little tray on my dressing table for everything I take out with me, so I always know where my things are.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "家、房間、喜歡的地方、物品擺設、旅行紀念品"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "遠距離戀愛", "en": "人物・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["和男朋友遠距離戀愛，幾乎每天拍照片——吃的東西、日常生活——傳給對方分享近況。", "My boyfriend and I are in a long-distance relationship, and almost every day we take photos of what we eat and our daily lives and send them to each other to keep up with each other's news.", 1], ["覺得這是簡單卻有意義的方式，讓彼此即使分隔兩地也保持連結。", "I think it's a simple but meaningful way for us to stay connected even though we're apart."]]}, {"label": "金句", "tone": "neu", "items": [["我和男朋友是遠距離戀愛，所以我們幾乎每天互傳吃了什麼的照片；這是一種簡單卻有意義的保持連結方式。", "My boyfriend and I are in a long-distance relationship, so we send each other photos of what we're eating almost every day; it's a simple but meaningful way to stay connected.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["讓彼此掌握近況", "keep each other in the loop"], ["即使相隔兩地也保持聯繫", "stay connected despite the distance"], ["隨手拍張照", "snap a quick photo"], ["分享生活中的小片段", "share the little moments"], ["簡單卻有意義的舉動", "a simple yet meaningful gesture"], ["拉近距離", "bridge the distance"], ["相隔遙遠", "be miles apart"]]}, {"label": "單字", "tone": "pos", "items": [["遠距離的", "long-distance"], ["平凡日常的", "mundane"], ["親密感", "intimacy"], ["固定的小儀式、習慣", "ritual"], ["令人安心的", "reassuring"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我和男朋友是遠距離戀愛，所以幾乎每天互傳照片，大多是吃的東西和日常生活。", "My boyfriend and I are in a long-distance relationship, so we send each other photos almost every day, mostly of our food and daily routines.", 1], ["聽起來或許微不足道，但分享這些生活小片段，是讓我們即使相隔兩地也保持連結的簡單又有意義的方式。", "It might sound trivial, but sharing those little moments is a simple yet meaningful way for us to stay connected despite the distance.", 1], ["對我來說，拍照與其說是拍出完美的照片，不如說是讓在乎的人知道我的近況。", "For me, taking photos is less about creating perfect images and more about keeping the people I care about in the loop.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "拍照、手機、溝通、保持聯絡、科技"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "狗狗撞壞手機", "en": "經歷・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["有一次手機突然發出很大的聲響，嚇到狗狗，牠跳起來不小心把手機撞到地上摔壞。", "Once my phone suddenly made a really loud noise, which startled my dog; it jumped up and accidentally knocked my phone onto the floor, and the phone broke.", 1], ["因為日常生活太依賴手機，當天就買了新手機。", "Because I rely so heavily on my phone in everyday life, I bought a new one that same day."]]}, {"label": "金句", "tone": "neu", "items": [["我的手機突然發出很大的聲響，狗狗嚇得跳起來把手機撞到地上；因為我太依賴手機，當天就買了新的。", "My phone suddenly made a loud noise, my dog jumped up in fright and knocked it onto the floor, and because I rely on it so much, I bought a new one that very day.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["嚇了一大跳", "jump out of its skin"], ["把東西撞飛", "knock something flying"], ["離奇的意外", "a freak accident"], ["離不開手機", "be glued to my phone"], ["沒有…就無法正常生活", "can't function without"], ["馬上換新", "replace it straight away"], ["突如其來地", "out of the blue"]]}, {"label": "單字", "tone": "pos", "items": [["受到驚嚇的", "startled"], ["碎裂的", "shattered"], ["依賴的", "reliant"], ["不可或缺的", "indispensable"], ["小意外", "mishap"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我的手機突然發出很大的聲響，把狗狗嚇得跳起來，結果把手機撞到地上。", "My phone suddenly made a really loud noise, which startled my dog so much that it jumped up and knocked the phone onto the floor.", 1], ["因為我日常生活太依賴手機，沒有它不行，所以當天就買了新手機。", "Because I'm so reliant on my phone for everyday life, I couldn't go without it and bought a new one that very day.", 1], ["回想起來那是場離奇的意外，但也讓我看到智慧型手機在我們日常生活中有多不可或缺。", "Looking back, it was a freak accident, but it really showed me how indispensable smartphones have become in our daily lives.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "手機、寵物、意外、科技依賴"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "運動經驗", "en": "經歷・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["小時候學游泳；同班學員年紀都比我大很多，有時跟不上，所以印象深刻。", "I learnt to swim as a child; everyone else in my class was much older than me, so I sometimes couldn't keep up, which is why it really stuck with me.", 1], ["喜歡打排球，覺得相對容易上手、喜歡團隊合作；高中參加過排球比賽。", "I love playing volleyball because it's relatively easy to pick up and I enjoy the teamwork; I even took part in a volleyball competition in high school.", 1], ["未來想學匹克球：最近在台灣很流行，規則簡單、初學者容易上手。", "In the future I'd like to learn pickleball; it's really popular in Taiwan at the moment, the rules are simple and it's easy for beginners to pick up.", 1], ["通勤搭捷運時即使有位子也會站著，平衡上班久坐的時間。", "When I commute on the MRT, I stand even if there's a free seat, to balance out all the time I spend sitting at work.", 1]]}, {"label": "金句", "tone": "neu", "items": [["我很喜歡打排球，因為相對容易上手，而且我喜歡團隊合作；高中時我還參加過排球比賽。", "I'm really into volleyball because it's fairly easy to pick up and I love the teamwork; I even played in a competition back in high school.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["容易上手", "easy to pick up"], ["很難跟上", "struggle to keep up"], ["很有團隊精神的人", "a real team player"], ["正流行", "all the rage"], ["對新手友善的", "beginner-friendly"], ["抵消久坐的生活型態", "offset a sedentary lifestyle"], ["把運動擠進一天的行程裡", "squeeze exercise into my day"]]}, {"label": "單字", "tone": "pos", "items": [["久坐的", "sedentary"], ["同伴情誼", "camaraderie"], ["協調性", "coordination"], ["容易入門的", "accessible"], ["通勤", "commute"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我小時候學游泳時，同班的人年紀都比我大很多，所以我有時很難跟上。", "When I learnt to swim as a child, everyone in my class was much older than me, so I sometimes struggled to keep up.", 1], ["我很想試試匹克球，因為它最近在台灣很流行，而且規則簡單，初學者也能上手。", "I'm really keen to try pickleball, because it's all the rage in Taiwan right now and the rules are simple enough for beginners.", 1], ["因為上班大部分時間都坐著，所以我搭捷運時就算有空位也一定站著。", "Since I spend most of my working day sitting down, I always stand on the MRT, even when there's a free seat.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "運動、童年、學校、健康、想嘗試的事"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "閱讀與學習習慣", "en": "經歷・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["看了日本推理電影《嫌疑犯X的獻身》，劇情太精彩，之後去讀了原著小說。", "I watched the Japanese mystery film The Devotion of Suspect X, and the plot was so gripping that I went on to read the original novel.", 1], ["大多用手機看電子書，大約每月買一本，讀完再買下一本。", "I mostly read e-books on my phone, buying roughly one a month and only getting the next one once I've finished it.", 1], ["讀書日會早起吃早餐、把手機放在房門口避免一直滑；一天念八小時，每小時休息一下。", "On study days I get up early and have breakfast, and I leave my phone by my bedroom door so I don't keep scrolling; I study for eight hours a day, taking a short break every hour.", 1], ["用 AI 幫忙規劃進度、即時回答問題、統整資料；遇到家電故障也會先問 AI。", "I use AI to help me plan my schedule, answer questions instantly and pull information together; when a household appliance breaks down, I ask AI first, too.", 1], ["曾補過家教，老師會指導方向、引導我思考。", "I've had a private tutor before, who gave me direction and guided me to think things through.", 1], ["做過卡片送給高中老師道謝：他不只教專業知識，也開導我人生的問題，要多為自己想、要 positive。", "I once made a card for my high school teacher to thank him; he didn't just teach me subject knowledge but also helped me with problems in life, telling me to think more about myself and stay positive.", 1]]}, {"label": "金句", "tone": "neu", "items": [["讀書日我會把手機放在房門外，不然我只會一直滑，沒辦法專心。", "On study days I leave my phone outside my bedroom door, otherwise I'd just keep scrolling instead of focusing.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["讓人欲罷不能的書", "a real page-turner"], ["讓我深深著迷", "keep me hooked"], ["忍住滑手機的衝動", "resist the urge to scroll"], ["定時休息", "take regular breaks"], ["統整資料", "pull information together"], ["引導我走對方向", "steer me in the right direction"], ["多為自己著想", "put myself first"], ["凡事往好處想", "look on the bright side"]]}, {"label": "單字", "tone": "pos", "items": [["扣人心弦的", "gripping"], ["自律的", "disciplined"], ["讓人分心的事物", "distraction"], ["排除故障", "troubleshoot"], ["心懷感激的", "grateful"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我看了日本電影《嫌疑犯X的獻身》，劇情太扣人心弦，所以接著就去讀了原著小說。", "I watched the Japanese film The Devotion of Suspect X, and the plot was so gripping that I went straight on to read the original novel.", 1], ["讀書日我會把手機放在房門口，這樣才能忍住滑手機的衝動，專心念八個小時。", "On study days, I leave my phone by my bedroom door, so I can resist the urge to scroll and stay focused for eight hours.", 1], ["現在我靠 AI 規劃讀書進度、即時回答問題；連家電壞了我都會先問 AI。", "These days I rely on AI to plan my study schedule and answer questions instantly; I even ask it first when an appliance breaks down.", 1], ["我曾做卡片感謝高中老師，他不只教我課業，也教我要多為自己著想、保持正向。", "I once made a thank-you card for my high school teacher, who taught me not only the subject but also to put myself first and stay positive.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "閱讀、書與電影、學習方法、AI、老師、道謝"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "個性與休閒", "en": "個人・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["個性偏內向，喜歡有 me time，可以充電，不用配合別人的時間。", "I'm fairly introverted, so I like having some me time to recharge, without having to fit around other people's schedules.", 1], ["喜歡時尚：逛特色小店、看不同的款式、顏色、設計和布料，找穿搭靈感；也喜歡看脫口秀放鬆。", "I love fashion: I enjoy browsing independent little shops and looking at different styles, colours, designs and fabrics for outfit inspiration; I also like watching stand-up comedy to unwind.", 1], ["放假喜歡慢步調、不排滿行程；比較喜歡隨性，而不是事先計畫好一切。", "On holiday I prefer a slow pace rather than a packed schedule; I'd rather be spontaneous than plan everything in advance.", 1], ["旅行或特別的出遊比較喜歡和朋友一起，比較熱鬧、難忘。", "For trips or special outings, I prefer going with friends, because it's livelier and more memorable.", 1], ["觀察到台灣年輕人最近在玩 Pikmin Bloom（鼓勵走路、種虛擬花的手機遊戲）。", "I've noticed that young people in Taiwan have recently been playing Pikmin Bloom, a mobile game that encourages you to walk and grow virtual flowers.", 1]]}, {"label": "金句", "tone": "neu", "items": [["我個性有點內向，所以很需要 me time 來充電，不必配合別人的時間。", "I'm a bit of an introvert, so I really need some me time to recharge without having to fit around anyone else's schedule.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["充電、恢復精力", "recharge my batteries"], ["隨遇而安、順其自然", "go with the flow"], ["排得滿滿的行程", "a packed itinerary"], ["逛有特色的小店", "browse quirky little shops"], ["從…汲取靈感", "draw inspiration from"], ["放鬆下來", "wind down"], ["創造難忘的回憶", "make lasting memories"], ["在年輕人之間流行起來", "catch on among young people"]]}, {"label": "單字", "tone": "pos", "items": [["內向的", "introverted"], ["隨性的", "spontaneous"], ["悠閒的", "leisurely"], ["多元、不拘一格的", "eclectic"], ["脫口秀", "stand-up"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我會說自己算內向，所以擁有 me time 對我充電來說是必要的。", "I'd describe myself as fairly introverted, so having some me time is essential for me to recharge my batteries.", 1], ["我很喜歡逛特色小店，從不同的款式、顏色和布料中找自己穿搭的靈感。", "I love browsing quirky little shops and drawing inspiration from different styles, colours and fabrics for my own outfits.", 1], ["放假時我比較喜歡隨性，而不是照著排滿的行程走，因為慢步調讓我能放鬆。", "When I'm on holiday, I'd much rather go with the flow than follow a packed itinerary, because a slower pace helps me relax.", 1], ["最近我觀察到很多台灣年輕人在玩 Pikmin Bloom，這款手機遊戲讓你種虛擬花，藉此鼓勵大家走路。", "Lately, I've noticed lots of young people in Taiwan playing Pikmin Bloom, a mobile game that encourages walking by letting you grow virtual flowers.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "空閒時間、獨處、購物／時尚、假期、休閒的改變"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "狗狗在百貨公司被小孩摸", "en": "經歷・2026-10 自己補充（Part 2「熊孩子」）", "groups": [{"label": "細節", "tone": "neu", "items": [["我在百貨公司排隊買珍珠奶茶，我的喜樂蒂狗狗坐在寵物推車裡。", "I was waiting in line for bubble tea at a department store while Oakley, my Shetland Sheepdog, sat in his pet stroller.", 1], ["一個小女孩沒問就開始摸 Oakley，媽媽提醒她要先問之後，她竟然一邊問一邊繼續摸。", "A little girl started petting Oakley without asking, and even after her mother told her to ask first, she kept petting my dog while asking.", 1], ["Oakley 很膽小，所以我在牠更害怕之前就帶牠離開了。", "Oakley is timid, so I took him away before he became more frightened."]]}, {"label": "可用題型", "tone": "neu", "items": [["", "寵物／動物令你生氣或沮喪的事好笑的經驗購物經驗需要有耐心的時候給別人的建議"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "朋友的外婆誤開直播", "en": "經歷・2026-10 自己補充（Part 2「有趣的老人」）", "groups": [{"label": "細節", "tone": "neu", "items": [["朋友的外婆會看 YouTube、喜歡拍影片，我有時會陪她喝茶或帶她去運動。", "My friend's grandmother watches YouTube and enjoys making videos, and I sometimes have tea with her or take her out to exercise.", 1], ["她想視訊給朋友看凌亂的房間，卻不小心開了 IG 直播，讓大家看到散落在地上和床上的衣服。", "She wanted to video-call my friend about their messy bedroom, but she accidentally went live on Instagram and showed clothes scattered across the floor and bed.", 1], ["她不知道怎麼關掉直播，觀眾還開玩笑說乾脆一起整理房間。", "She didn't know how to end the livestream, and viewers joked that they might as well tidy the room together.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "你欣賞的人好笑的經驗科技／手機社群媒體尷尬的時刻學習新事物"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "朋友爭論男友該怎麼慶祝節日", "en": "經歷・2026-10 自己補充（Part 2「朋友的爭論」）", "groups": [{"label": "細節", "tone": "neu", "items": [["我朋友 Maggie 認為生日和週年紀念日要有五樣東西：花、蛋糕、餐廳、禮物和卡片。", "My friend Maggie expected five things for birthdays and anniversaries: flowers, a cake, a restaurant meal, a gift and a card.", 1], ["Mina 認為花費太多，而且花錢不一定代表有用心。", "Mina thought it cost too much and that spending money didn't necessarily mean someone had put thought into it.", 1], ["我比較認同 Mina，最後我們決定這應該由 Maggie 和她男友自己溝通。", "I agreed with Mina, and in the end we decided it was something for Maggie and her boyfriend to work out.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "意見不合的經驗送禮慶祝／節日朋友金錢觀感情關係"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "當業餘健身教練的室內設計師鄰居", "en": "經歷・2026-10 自己補充（Part 2「有趣的鄰居」）", "groups": [{"label": "細節", "tone": "neu", "items": [["我的鄰居是自己開公司的室內設計師，會跟我分享他的設計理念。", "My neighbour is an interior designer who runs his own company and shares the ideas behind his designs with me.", 1], ["他背部受傷後開始學肌力訓練，後來成為業餘健身教練。", "After injuring his back, he started learning strength training and became an amateur fitness coach.", 1], ["他現在在運動中心教長輩，幫助他們鍛鍊日常活動所需的肌力。", "He now teaches older adults at a sports centre to help them build strength for everyday activities.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "你欣賞的人健康的生活方式運動／健身成功的人喜歡的工作幫助他人的人"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "跟合唱團去西西里島比賽", "en": "經歷・2026-10 自己補充（Part 2「宜居之地」）", "groups": [{"label": "細節", "tone": "neu", "items": [["高中時我 const r1 = v => Math.round(v * 10) / 10;
function elbow(x1, y1, x2, y2){
  x1 = r1(x1); y1 = r1(y1); x2 = r1(x2); y2 = r1(y2);
  if (Math.abs(y1 - y2) < 0.7) return 'M' + x1 + ',' + y1 + 'H' + x2;
  const mx = r1(x1 + (x2 - x1) / 2), dir = y2 > y1 ? 1 : -1;
  const r = r1(Math.min(8, Math.abs(y2 - y1) / 2, Math.abs(mx - x1), Math.abs(x2 - mx)));
  return 'M' + x1 + ',' + y1 + 'H' + r1(mx - r) +
         'Q' + mx + ',' + y1 + ' ' + mx + ',' + r1(y1 + r * dir) +
         'V' + r1(y2 - r * dir) + 'Q' + mx + ',' + y2 + ' ' + r1(mx + r) + ',' + y2 + 'H' + x2;
}
function drawMap(m){
  if (m.mapEl.offsetParent === null) return;
  const mr = m.mapEl.getBoundingClientRect();
  const ox = mr.left - m.mapEl.scrollLeft, oy = mr.top - m.mapEl.scrollTop;
  const box = el => { const r = el.getBoundingClientRect();
    return {l:r.left - ox, r:r.right - ox, y:r.top - oy + r.height / 2}; };
  const W = m.mapEl.scrollWidth, H = m.mapEl.scrollHeight;
  m.svg.setAttribute('width', W); m.svg.setAttribute('height', H);
  m.svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const R = box(m.root), d = [];
  m.branches.forEach(b => {
    if (b.branchEl.hidden) return;
    const G = box(b.groupEl);
    d.push(elbow(R.r + 3, R.y, G.l - 3, G.y));
    if (b.branchEl.dataset.open !== 'true') return;
    b.leafRows.forEach(row => {
      if (row.hidden) return;
      const L = box(row);
      d.push(elbow(G.r + 3, G.y, L.l - 3, L.y));
    });
  });
  m.svg.innerHTML = d.map(p => '<path d="' + p + '"/>').join('');
}
const drawAll = () => { if (view === 'map') maps.forEach(drawMap); };

  if (!term) { node.textContent = text; return; }
  const i = text.toLowerCase().indexOf(term);
  if (i < 0) { node.textContent = text; return; }
  node.innerHTML = esc(text.slice(0, i)) + '<mark>' +
    esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
}
const anyVisible = (root, sel) => [...root.querySelectorAll(sel)].some(x => !x.hidden);

function apply(){
  const term = q.value.trim().toLowerCase();
  let shown = 0;

  store.forEach(s => {
    const ok = (tone === 'all' || s.view === 'prompt' || s.tone === tone) &&
               (cat === 'all' || s.view === 'prompt' || s.cat === cat) &&
               (curSet === 'all' || s.view === 'prompt' || s.set === curSet) &&
               (!term || s.enText.toLowerCase().includes(term) ||
                s.zhText.includes(term) || s.extra.includes(term));
    s.row.hidden = !ok;
    if (ok) {
      paint(s.enNode, s.enText, term); paint(s.zhNode, s.zhText, term);
      if (s.view === view) shown++;
    }
  });

  if (CONFIG.showList) {
    listView.querySelectorAll('.group').forEach(g => g.hidden = !anyVisible(g, 'li'));
    listView.querySelectorAll('.topic').forEach(t => t.hidden = !anyVisible(t, '.group'));
    listView.querySelectorAll('.catsec').forEach(s => s.hidden = !anyVisible(s, '.topic'));
  }
  mapView.querySelectorAll('.branch').forEach(b => b.hidden = !anyVisible(b, '.leafrow'));
  mapView.querySelectorAll('.mapwrap').forEach(w => w.hidden = !anyVisible(w, '.branch'));
  mapView.querySelectorAll('.catsec').forEach(s => s.hidden = !anyVisible(s, '.mapwrap'));
  if (PROMPTS) promptView.querySelectorAll('.ptype').forEach(s => s.hidden = !anyVisible(s, '.prow'));

  maps.forEach(m => m.branches.forEach(b => {
    const open = term ? true : b.open;
    b.branchEl.dataset.open = open;
    b.groupEl.setAttribute('aria-expanded', String(open));
    b.badge.textContent = b.leafRows.filter(x => !x.hidden).length;
  }));

  nav.querySelectorAll('button[data-set]').forEach(b =>
    b.hidden = !(curSet === 'all' || b.dataset.set === curSet));
  nav.querySelectorAll('.sep').forEach(el => el.hidden = curSet !== 'all');

  document.querySelectorAll('.empty').forEach(x => x.remove());
  const host = view === 'map' ? mapView : (view === 'list' ? listView : promptView);
  if (!shown && view !== 'study') host.insertAdjacentHTML('beforeend', '<p class="empty">沒有符合的內容</p>');
  countEl.textContent = view === 'study' ? '單題練習' : shown + ' / ' + (view === 'prompt' ? PROMPTS_N : TOTAL) +
                        (view === 'prompt' ? ' 題' : ' 條');
  expandBtn.hidden = view !== 'map';
  expandBtn.textContent = maps.some(m => m.branches.some(b => b.open)) ? '全部收合' : '全部展開';
  drawAll();
}
const PROMPTS_N = PROMPTS ? PROMPTS.reduce((a, p) => a + p.items.length, 0) : 0;

/* ---------- controls ---------- */
q.addEventListener('input', apply);
document.querySelectorAll('#toneSeg button').forEach(b => b.addEventListener('click', () => {
  tone = b.dataset.tone;
  document.querySelectorAll('#toneSeg button').forEach(o => o.setAttribute('aria-pressed', o === b));
  apply();
}));
document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view;
  document.querySelectorAll('#viewSeg button').forEach(o => o.setAttribute('aria-pressed', o === b));
  mapView.hidden = view !== 'map';
  listView.hidden = view !== 'list';
  promptView.hidden = view !== 'prompt';
  document.getElementById('studyView').hidden = view !== 'study';
  document.getElementById('toneSeg').hidden = !CONFIG.showTone || view === 'prompt';
  nav.hidden = view === 'prompt' || view === 'study';
  apply();
  if(view === 'study') renderStudy();
}));
nav.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  cat = (cat === b.dataset.cat) ? 'all' : b.dataset.cat;
  nav.querySelectorAll('button').forEach(o =>
    o.setAttribute('aria-pressed', o.dataset.cat === cat));
  apply();
});
setSeg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  curSet = b.dataset.set;
  setSeg.querySelectorAll('button').forEach(o =>
    o.setAttribute('aria-pressed', o === b));
  const chip = nav.querySelector('button[data-cat="' + cat + '"]');
  if (chip && chip.dataset.set && curSet !== 'all' && chip.dataset.set !== curSet) {
    cat = 'all';
    nav.querySelectorAll('button').forEach(o =>
      o.setAttribute('aria-pressed', o.dataset.cat === 'all'));
  }
  apply();
});

expandBtn.addEventListener('click', () => {
  const open = !maps.some(m => m.branches.some(b => b.open));
  maps.forEach(m => m.branches.forEach(b => b.open = open));
  apply();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); q.blur(); }
});

mapView.addEventListener('click', e => {
  const gn = e.target.closest('.group-node');
  if (gn) { const b = branchByEl.get(gn); b.open = !b.open; apply(); return; }
  const rt = e.target.closest('.root');
  if (rt) {
    const m = mapByEl.get(rt.closest('.mapwrap'));
    const open = !m.branches.some(b => b.open);
    m.branches.forEach(b => b.open = open);
    apply();
  }
});

/* ---------- copy ---------- */
let timer;
document.querySelector('main').addEventListener('click', e => {
  const btn = e.target.closest('.item');
  if (!btn) return;
  const row = btn.parentElement;
  const flash = () => {
    document.querySelectorAll('.is-copied').forEach(x => x.classList.remove('is-copied'));
    row.classList.add('is-copied');
    clearTimeout(timer);
    timer = setTimeout(() => row.classList.remove('is-copied'), 1400);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(btn.dataset.en).then(flash, () => {});
});

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawAll, 120); });
document.querySelectorAll('.map').forEach(m => m.addEventListener('scroll', drawAll));
if (document.fonts) document.fonts.ready.then(drawAll);


/* ---------- independent study / recall mode ---------- */
const studyHost=document.getElementById('studyView');
const STUDY_KEY='ielts-speaking-study-v1';
const studyItems=[];
const isAns=it=>it[2]===1;
CATS.forEach((c,ci)=>c.idx.forEach(ti=>{
 const t=DATA[ti];
 const cards=t.groups.filter(g=>/^題卡/.test(g.label));
 if(cards.length){
  /* Part 2: card + 我的答案 + 好用詞彙 belong together */
  const ansAll=t.groups.filter(g=>g.label==='我的答案').flatMap(g=>g.items);
  const answers=ansAll.filter(isAns);
  const vocab=t.groups.filter(g=>g.label==='好用詞彙').flatMap(g=>g.items)
   .concat(ansAll.filter(it=>!isAns(it)));
  cards.forEach((g,k)=>{
   const n=(g.label.match(/\d+/)||[String(k+1)])[0];
   const tagged=answers.filter(a=>/題卡\s*\d/.test(a[0]));
   const mine=cards.length===1?answers:answers.filter(a=>{
    const m=a[0].match(/題卡\s*(\d+)/);return m?m[1]===n:true;});
   studyItems.push({id:`${ti}-c${n}`,cat:ci,catName:c.zh,topic:t.zh,
    question:(g.items.find(it=>it[0]==='題目')||[])[1]||g.label,
    hints:g.items.filter(it=>it[0]==='提示點').map(it=>it[1]),
    answers:mine.length?mine:answers,vocab,group:g.label});
  });
  return;
 }
 const qa=t.groups.some(g=>g.items.some(it=>it[0]==='題目'));
 if(!qa){
  /* 核心故事／素材庫: one card per story, sections kept in order */
  const answers=[],vocab=[];
  t.groups.forEach(g=>g.items.forEach(it=>{
   if(isAns(it))answers.push([g.label,it[1],1]);
   else vocab.push([g.label+'・'+it[0],it[1]]);
  }));
  studyItems.push({id:`${ti}-all`,cat:ci,catName:c.zh,topic:t.zh,
   question:t.zh+(t.en?'\n'+t.en:''),hints:[],answers,vocab,group:'',story:true});
  return;
 }
 t.groups.forEach((g,gi)=>{
  const question=(g.items.find(it=>it[0]==='題目')||[])[1]||g.label;
  const answers=g.items.filter(isAns);
  const vocab=g.items.filter(it=>it[0]!=='題目'&&!isAns(it));
  studyItems.push({id:`${ti}-${gi}`,cat:ci,catName:c.zh,topic:t.zh,question,hints:[],
    answers,vocab,group:g.label});
 });
}));
let studyProgress={};
try{studyProgress=JSON.parse(localStorage.getItem(STUDY_KEY)||'{}')||{}}catch(e){}
let studyFilter='all',studyOrder=[],studyIndex=0,studyRevealed=false,studyOnlyReview=false;
function saveStudy(){
 try{localStorage.setItem(STUDY_KEY,JSON.stringify(studyProgress))}catch(e){}
}
function filteredStudy(){
 return studyItems.filter(it=>(studyFilter==='all'||String(it.cat)===studyFilter)
  &&(!studyOnlyReview||studyProgress[it.id]==='review'));
}
function rebuildStudy(keepId){
 studyOrder=filteredStudy();
 const pos=studyOrder.findIndex(it=>it.id===keepId);
 studyIndex=pos<0?0:pos;studyRevealed=false;renderStudy();
}
function renderStudy(){
 if(view!=='study')return;
 const it=studyOrder[studyIndex];
 const mastered=studyItems.filter(x=>studyProgress[x.id]==='mastered').length;
 const review=studyItems.filter(x=>studyProgress[x.id]==='review').length;
 const filters='<option value="all">全部分類</option>'+CATS.map((c,i)=>`<option value="${i}" ${studyFilter===String(i)?'selected':''}>${esc(c.zh)}</option>`).join('');
 const controls=`<div class="study-controls"><select id="studyCat" aria-label="題目分類">${filters}</select>
  <label><input type="checkbox" id="studyReviewOnly" ${studyOnlyReview?'checked':''}>只練待複習</label>
  <button id="studyShuffle">隨機排序</button></div>`;
 if(!it){studyHost.innerHTML=controls+`<div class="study-card">目前沒有符合的題目。可以取消「只練待複習」或切換分類。</div><p class="study-note">進度儲存在此裝置的瀏覽器，清除網站資料可能會遺失。</p>`;return;}
 const answered=studyProgress[it.id]||'';
 const showLab=it.story||it.answers.length>1;
 const answerHtml=it.answers.length?it.answers.map(a=>(showLab?`<h4 class="study-label">${esc(a[0])}</h4>`:'')+`<p>${esc(a[1])}</p>`).join(''):'<p>原始資料沒有標記示範答案，請自行練習回答。</p>';
 const hintHtml=it.hints&&it.hints.length?`<div class="study-cue">You should say:<ul>${it.hints.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>`:'';
 const vocabHtml=it.vocab.map(a=>`<div><strong>${esc(a[1])}</strong><span>${esc(a[0])}</span></div>`).join('');
 studyHost.innerHTML=controls+`
 <div class="study-progress"><div style="width:${100*(studyIndex+1)/studyOrder.length}%"></div></div>
 <article class="study-card">
  <div class="study-meta">${esc(it.catName)} · ${esc(it.topic)} · 第 ${studyIndex+1} / ${studyOrder.length} 題</div>
  <div class="study-question">${esc(it.question)}</div>
  ${hintHtml}
  <div class="study-hint">先試著用英文口說回答，再揭曉答案與片語。</div>
  <button id="studyReveal" class="study-reveal" aria-expanded="${studyRevealed}">${studyRevealed?'隱藏答案':'顯示答案與片語'}</button>
  ${studyRevealed?`<div class="study-answer"><h3>${it.story?'故事內容':'我的答案'}</h3>${answerHtml}<h3>重要片語與中文</h3><div class="study-vocab">${vocabHtml||'此題沒有額外片語'}</div></div>`:''}
  <div class="study-actions">
   <button id="studyMarkReview" aria-pressed="${answered==='review'}">需要複習</button>
   <button id="studyMarkMastered" aria-pressed="${answered==='mastered'}">已熟悉</button>
  </div>
 </article>
 <div class="study-nav"><button id="studyPrev" ${studyIndex===0?'disabled':''}>上一題</button>
  <div class="study-stats">已熟悉 ${mastered} · 待複習 ${review}<br>共 ${studyItems.length} 題</div>
  <button id="studyNext" ${studyIndex===studyOrder.length-1?'disabled':''}>下一題</button></div>
 <p class="study-note">進度只保存在目前瀏覽器的本機儲存空間；不同手機或瀏覽器不會自動同步。離線開啟 HTML 時，部分瀏覽器可能不保留進度。</p>`;
}
function initStudy(){
 studyOrder=filteredStudy();
 studyHost.addEventListener('change',e=>{
  if(e.target.id==='studyCat'){studyFilter=e.target.value;rebuildStudy();}
  if(e.target.id==='studyReviewOnly'){studyOnlyReview=e.target.checked;rebuildStudy();}
 });
 studyHost.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.id;
  if(id==='studyReveal')studyRevealed=!studyRevealed;
  else if(id==='studyPrev'){studyIndex=Math.max(0,studyIndex-1);studyRevealed=false;}
  else if(id==='studyNext'){studyIndex=Math.min(studyOrder.length-1,studyIndex+1);studyRevealed=false;}
  else if(id==='studyShuffle'){
   for(let i=studyOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[studyOrder[i],studyOrder[j]]=[studyOrder[j],studyOrder[i]];}
   studyIndex=0;studyRevealed=false;
  }else if(id==='studyMarkReview'||id==='studyMarkMastered'){
   const it=studyOrder[studyIndex],value=id==='studyMarkReview'?'review':'mastered';
   if(studyProgress[it.id]===value)delete studyProgress[it.id];
   else studyProgress[it.id]=value;
   saveStudy();
   if(studyOnlyReview&&value==='mastered'){rebuildStudy();return;}
  }
  renderStudy();
 });
 renderStudy();
}

apply();
initStudy();
</script>
</body>
</html>
