y in the late afternoon or early evening. Sometimes it's just a quick walk with Oakley; at weekends I might bring a picnic and stay for a couple of hours.\n\nWhat I love about it is the sense of space. In the city you're always surrounded by buildings, scooters and noise, but by the river the sky suddenly feels much bigger. The only sounds are the water, the wind and the occasional cyclist passing by. It's a place which helps me relieve stress without having to leave the city.\n\nIt also has a lot of personal meaning. After my mum finished her cancer treatment, our first outing as a family was a picnic there, watching the sunset. So whenever I go back, it reminds me to slow down and enjoy ordinary moments. For me, it isn't just a quiet place. It's where I go to reset.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 which", "a small mountainous country which is completely surrounded by South Africa"], ["★ where 子句", "the area where we stayed"], ["看著光線變化", "watch the light change"], ["感覺時間變慢", "feel time slow down"], ["★ 關係子句 who", "my dog, Oakley, who is a Shetland Sheepdog"], ["★ which 子句＋紓解壓力", "a place which helps me relieve stress"], ["幾乎是無意間", "almost by accident"], ["偶然發現", "come across"], ["讓我重新充電的地方", "where I go to reset"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "鄉村一隅", "en": "地點、建築、旅遊與交通", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a place in the countryside that you enjoyed visiting"], ["提示點", "Where you went"], ["提示點", "Why you went to this place"], ["提示點", "What you saw and did there"], ["提示點", "And explain why you enjoyed visiting this place in the countryside."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "When I was seventeen, I spent two weeks in Lesotho, a small mountain country which sits completely inside South Africa. It's still the most memorable countryside I've ever visited.\n\nI didn't go there as a tourist. Through a club at my high school, I applied to be an international volunteer, and I was lucky enough to be selected. My job was to teach local middle-school students maths, Chinese and some basic computer skills, like Word, Excel and how to use Google.\n\nMost of my days were spent in the classroom. I started with simple games and songs to break the ice, because many of the kids weren't used to formal lessons. But I also clearly remember the landscape around us. There were open hills and mountains in every direction, and a huge sky that made everything feel very calm. After class, I'd often stand outside and watch the light change over the mountains. The evenings were incredibly quiet. Coming from Taipei, with its rush-hour traffic and endless scooters, I found that silence quite surprising.\n\nThere was one boy who refused to join in at first and always sat at the back. I spent extra time with him one-on-one and found out he loved drawing, so I used that to bring him into the lessons. On the final day, he gave me a picture and waved until our bus disappeared.\n\nI think I enjoyed it so much because the place and the people were connected. The peaceful countryside gave me space to think, and the students gave me something worth thinking about. It was a rewarding experience which completely changed my idea of what 'making an impact' really means.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["打破僵局；破冰", "break the ice"], ["四面八方", "in every direction"], ["★ who 子句補充人物（講義 Part 2 升級法）", "one boy who refused to join in"], ["★ 有收穫的經驗（講義）＋ which 子句", "a rewarding experience which…"], ["一對一地", "one-on-one"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "交通擁堵的時刻", "en": "地點、建築、旅遊與交通", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time when you spent a long time in a traffic jam."], ["提示點", "When it happened"], ["提示點", "Where it happened"], ["提示點", "What you did while you were in the traffic jam"], ["提示點", "And explain how you felt about it."]]}, {"label": "我的答案", "tone": "pos", "items": [["原題（MAP-041｜原題：Describe a time when you were stuck in a traffic jam for a very long time）・講義修訂", "The traffic jam I'd like to describe wasn't just one bad day. It happened again and again while my mum was having cancer treatment, when I was driving to the hospital several times a week.\n\nTaipei traffic is always bad during rush hour. There are so many cars and scooters that you never know what will happen. You can sit without moving for twenty minutes, and then suddenly drive freely for five kilometres. Not knowing is just as tiring as the delay itself.\n\nBefore that period, traffic jams always made me frustrated. They were a constant source of stress, and I felt like they were stealing my time.\n\nBut during my mum's treatment, they started to feel different. They became a forced pause, when I could do nothing except sit with my thoughts. My mum was unwell, and the situation needed my patience in a way that my work almost never did. On the way to or from the hospital, I'd think about her, about what I was afraid of, and about what I was grateful for.\n\nSo I started using that time on purpose. I listened to music which helped me deal with my feelings, or I just sat quietly without feeling I had to be productive.\n\nThe traffic jams didn't change, but the way I saw them did. Looking back, I think that was the most important thing that happened to me during that difficult time.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["一再發生", "again and again"], ["★ 持續的壓力來源（講義 14 天片語）", "a constant source of stress"], ["被迫的停頓", "a forced pause"], ["★ which 子句（講義 Part 2 升級法）", "music which helped me deal with my feelings"], ["刻意地", "on purpose"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "宜居之地", "en": "地點、建築、旅遊與交通", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a place you have visited that you would recommend as a good place to live."], ["提示點", "Where it is"], ["提示點", "What you know about this place"], ["提示點", "What people can do there"], ["提示點", "And explain why you would recommend this place as a good place to live."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "A place I've visited that I would recommend as a good place to live is Sicily, an island in Italy. I went there during a summer holiday in high school because my choir was taking part in a music festival competition. It was my first time travelling abroad with friends without my parents, so I was really excited. We also had opportunities to meet people from other countries and sing together, which really broadened my horizons.\n\nWhat struck me most was the scenery. The air felt fresh, and the sea was an incredible shade of blue. The pace of life seemed relaxed, so I felt I could slow down and enjoy my surroundings. I loved the seafood and pasta, and the locals, who were really friendly, made us feel welcome.\n\nTo be honest, I also noticed quite a few good-looking guys, which was a bonus! If I had the chance, I'd love to try living there. I imagine even walking to and from work would be enjoyable with such beautiful scenery. In my free time, I could walk along the coast.\n\nVisiting is obviously different from living somewhere, but based on my experience, Sicily is somewhere I'd love to spend more time.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["最讓我印象深刻的是", "What struck me most"], ["★ 拓展視野（講義搭配詞）", "broaden my horizons"], ["★ who 子句（講義 Part 2 升級法）", "the locals, who were really friendly"], ["生活步調", "The pace of life"], ["不可思議的藍色", "an incredible shade of blue"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "穿著不尋常的人", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a person who wears clothes that you think are unusual."], ["提示點", "Who the person is"], ["提示點", "What kind of clothes he/she wears"], ["提示點", "Why you think these clothes are unusual"], ["提示點", "And explain how you feel about the clothes that this person wears."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "I'd like to talk about my friend Andrew, who I met at church in my final year of university. My first impression was that he had a great sense of style. Wherever he goes, he always looks well put together. His clothes are unusual because of their cut, fabric and shape, even when the colours are simple.\n\nFor example, he chooses T-shirts made from heavier cotton, so they hold their shape rather than looking thin or getting wrinkled easily. He also wears loose-fitting trousers with pleats at the waist. Sometimes, he chooses balloon trousers to create a more unusual look. He's very particular about quality.\n\nWhen you touch his clothes, you can feel the difference in the fabric, and even the stitching is neat and carefully finished. I'd describe his style as simple but classic. I enjoy listening to him talk about clothes and brands because he notices details I would probably miss. He also wears a woody perfume, which adds to the calm, mature impression he gives.\n\nI find his style interesting because he doesn't need bright colours to stand out. It's the small details that make his outfits special.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ who 子句（講義 Part 2 升級法）", "my friend Andrew, who I met at church"], ["很有品味", "a great sense of style"], ["打扮得很得體", "well put together"], ["★ which 子句（講義 Part 2 升級法）", "a woody perfume, which adds to…"], ["引人注目", "stand out"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "想看的體育比賽", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a sports event that you would like to go and watch as part of the audience"], ["提示點", "What sports event you would like to go and watch"], ["提示點", "Who you would choose to go with"], ["提示點", "Why you would like to go and watch this sports event"], ["提示點", "And explain how you would feel about being a part of the audience watching this sports event."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：周天成（MAP-007））・講義修訂", "The sports event I'd love to watch in person is a badminton match with Chou Tien-chen, who is Taiwan's top men's singles player. Ideally, it would be at the Taipei Open, so I could watch him play at home in front of a Taiwanese crowd.\n\nI'd go with my family. We've watched him together on TV for years, especially during the Olympics, with my parents, my sister and me all on the sofa. So it would feel natural to share the live experience with the same people.\n\nThe main reason I want to go is that TV can't really show how fast the game is. Top-level badminton is unbelievably quick. A single rally can have fifteen or twenty shots in just a few seconds. On TV, you miss the speed, the footwork and the sound of the smash. In the stadium, I could see the whole court and follow the tactics, rather than just following the shuttle.\n\nAs for how I'd feel in the audience, I imagine the atmosphere would be amazing. With a home crowd, thousands of people hold their breath on a match point and then burst into cheers at the same moment. That's something you just can't get in your living room. I think I'd be nervous for him, which is a bit silly, but that's part of the fun.\n\nHonestly, watching him live has been on my list for a long time. I think it would be a rewarding experience, because it would turn something I've loved from a distance into a real memory.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ who 補充人物（講義 Part 2 升級）", "Chou Tien-chen, who is…"], ["★ which 補充整件事", "which is a bit silly"], ["★ 而不只是盯著球", "rather than just following the shuttle"], ["屏息以待／爆出歡呼", "hold their breath / burst into cheers"], ["★ 有收穫的經驗", "a rewarding experience"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "想嘗試的戶外運動", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an outdoor sport you would like to try for the first time."], ["提示點", "what the outdoor sport is"], ["提示點", "where you would try this sport"], ["提示點", "how easy it would be to learn this sport"], ["提示點", "and explain why you would like to try this outdoor sport for the first time."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：運動經驗）・講義修訂", "An outdoor sport I'd really love to try is pickleball. If you haven't come across it, it's a bit like a mix of tennis and badminton. You play it with a solid paddle and a light plastic ball on a smaller court. It's really popular in Taiwan at the moment, and it seems to be everywhere on social media.\n\nAs for where, I haven't looked into it properly yet, but I'd probably try it at one of the new outdoor courts around Taipei. I'd definitely go with a couple of friends rather than on my own, because sport is much more fun when you have friends who can laugh at your mistakes with you.\n\nIn terms of how easy it would be to learn, I think it'd be fairly easy. From what I've heard, the rules are simple and it's very beginner-friendly, so you can enjoy a proper game on your first day instead of spending weeks just learning to hit the ball.\n\nThe main reason I want to try it, though, is my love of volleyball. I got really into volleyball at high school, partly because it was easy to pick up and partly because of the teamwork, and I even played in a competition. Pickleball seems to have the same mix: it's quick to learn, sociable and a little bit competitive. On top of that, as a data engineer, I spend about eight hours a day at my desk, which isn't great for my body. So I need a fun way to stay physically active.\n\nI've realised that finding a sport you'll actually stick with matters more than finding the 'perfect' one, and I think pickleball could be exactly that.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["對新手友善的", "beginner-friendly"], ["學會；上手", "pick up"], ["★ 一個 who＋一個 which（講義 Part 2）", "friends who… / my desk, which…"], ["★ 保持身體活動量", "stay physically active"], ["堅持下去", "stick with"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "和他人一起計劃活動", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time when you made plans to do an activity with other people."], ["提示點", "What activity you planned to do"], ["提示點", "Who you planned to do this activity with"], ["提示點", "When and where you planned to do it"], ["提示點", "And explain why you made plans to do this activity with other people."]]}, {"label": "我的答案", "tone": "pos", "items": [["相近題・可延用（MAP-043｜原題：Describe a time when you organized a happy event successfully）・講義修訂", "The activity I planned with others was a guitar camp which our university guitar club organised. I was one of the group leaders, and we spent a whole semester preparing for it.\n\nThe planning was a real group effort. Besides preparing the guitar lessons, we also had to plan a drama performance. Our goal was for the students to learn a song and perform it by themselves on the last day. We also had to help them rehearse a play near the end of the camp.\n\nDuring the camp itself, I hardly slept. Most nights I only got one or two hours of sleep. But every day was exciting and really fulfilling.\n\nAt first, I was worried that the students in my group would be hard to manage. Luckily, they weren't. Everyone was very cooperative. I also worked really well with my partner, who led the group with me. We helped each other solve problems and always tried to get the best results for our group.\n\nLooking back, it was exhausting, but it was one of the most rewarding experiences I had at university. I learned that good planning matters, but working well with people matters even more.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 which", "a guitar camp which our university guitar club organised"], ["★ 關係子句 who", "my partner, who led the group with me"], ["真正的團隊合作", "a real group effort"], ["幾乎沒睡", "hardly slept"], ["★ 有收穫的經驗", "a rewarding experience"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "在公共場所遺失物品", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an occasion when you lost something in a public place"], ["提示點", "Where you lost this thing"], ["提示點", "What you lost"], ["提示點", "What you did"], ["提示點", "And explain how you felt about it."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "I'd like to describe a time when I left my laptop at a restaurant. I'm a little forgetful, and I was even worse when I was younger. I often left umbrellas at restaurants, libraries or school, but this experience was more stressful because it involved my laptop, which is much more valuable than an umbrella. It happened on the last day of term.\n\nI went for a meal with friends and had several things to carry home, including my laptop, a water bottle and an umbrella. We were enjoying ourselves when we realised our train was about to arrive. I quickly gathered my things and rushed to the station. We arrived with only seconds to spare, but just as I was about to get on, I had a feeling I'd forgotten something.\n\nThen it hit me: my laptop was still at the restaurant. I was so annoyed with myself. After all that rushing, I had to let the train go and go back. I called the restaurant right away, and thankfully the staff confirmed they had found it.\n\nI went straight back to collect it and felt incredibly relieved. This experience taught me to make a checklist of the things that I take with me and check it before leaving a place.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["有點健忘", "a little forgetful"], ["只剩幾秒鐘", "with only seconds to spare"], ["我突然想到", "Then it hit me"], ["非常鬆一口氣", "incredibly relieved"], ["★ which 補充（講義關係子句）", "my laptop, which is much more valuable…"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "節省時間的改變", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a change you made in your daily life that saved lots of time."], ["提示點", "When you made this change"], ["提示點", "What it was"], ["提示點", "Is it easy to make this change"], ["提示點", "And explain how you felt about it."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：閱讀與學習習慣）・講義修訂", "One change that's saved me a surprising amount of time is using AI in my everyday life. I can't say exactly when it started, but over the past year or so, it's slowly become part of almost everything I do.\n\nThe change itself is quite simple. Whenever I need to plan something, look something up or understand a lot of information, I ask an AI assistant first. For my IELTS preparation, for example, I use it to plan my study progress and set a realistic workload for each day. If I get stuck on a question, I get an answer instantly instead of searching through endless websites. It also summarises and organises information for me, which is a huge help when I'm revising. Even at home, when an appliance breaks down, I ask AI for some basic ideas to fix it before calling a technician. And at work, I use it to help with my coding.\n\nWas it easy? Mostly, yes. I'm quite comfortable with technology, so getting started wasn't difficult at all. The harder part was learning not to trust every answer. I still check things myself, especially at work, where one small mistake can cause real problems.\n\nAs for how I feel about it, I'm really pleased. It hasn't just helped me save time and effort; it's also taken away lots of small, tiring tasks that used to pile up. So I have more energy for the things that really need my attention. These days, it feels less like a tool and more like a very patient assistant who's always there to help.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 節省時間與精力", "save time and effort"], ["卡在……", "get stuck on"], ["★ which 補充（講義 Part 2）", "…, which is a huge help"], ["★ who 補充（講義 Part 2）", "an assistant who's always there to help"], ["堆積", "pile up"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "忙碌的時刻", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time when you were busy."], ["提示點", "When this time was"], ["提示點", "Why you were so busy"], ["提示點", "What you did"], ["提示點", "And explain how you felt about it."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "The busiest period I can remember was a few months at work, when I was leading a project to standardise our database structure across about 1,200 servers.\n\nI was so busy because the project was both huge and risky. Over the years, the database on each server had changed slightly, with different column names and different data types. This was causing hidden errors in our data analysis. To fix it, I had to change every live server without any downtime, while still doing my normal daily work.\n\nSo I broke the problem down step by step. First, I mapped every difference across all the servers and ranked them by how serious they were. Then I wrote scripts that could automatically undo the changes, so if any check failed, the server would go back to its original state. Finally, I worked with the operations team to roll out changes in small batches when traffic was low. That often meant late nights and early mornings, and I watched each batch closely as it happened.\n\nFor several weeks, my days were completely full: meetings in the morning, writing scripts in the afternoon and rolling out changes in the evening.\n\nHonestly, it was exhausting, and sometimes I felt overwhelmed. But it was also one of the most satisfying periods of my career. When the last server was updated with zero downtime, I felt hugely relieved. It taught me that being busy is manageable when you have a clear process. What really wears you out is chaos, not a heavy workload.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["一步步拆解問題", "break the problem down step by step"], ["★ that 補充（講義關係子句）", "scripts that could automatically undo the changes"], ["分批上線", "roll out changes in small batches"], ["★ 沉重的工作量", "a heavy workload"], ["真正讓人疲憊的是混亂", "what really wears you out is chaos"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "近期改善生活的變動", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a change you made recently that was positive."], ["提示點", "What it was"], ["提示點", "Why do you make this change"], ["提示點", "Whether anyone helped you to make this change"], ["提示點", "And explain why it was a good change"]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：閱讀與學習習慣）・講義修訂", "I'd like to talk about a change I've made quite recently: the way I organise my study days.\n\nAs a bit of background, I've decided to leave my job as a data engineer and apply to study abroad, and my mum was the one who encouraged me to go for it. So I'm preparing for IELTS, and I quickly realised my old habits weren't going to work. I often stayed up late, and when I was tired, I'd end up scrolling on my phone or watching a series instead of studying.\n\nSo now, on study days, I follow a much more structured routine. I get up early and have breakfast first. Then, and this is the key part, I leave my phone by my bedroom door, so I can't reach it, which really helps me reduce distractions. If it's on my desk, I'll keep picking it up without even noticing. I aim to study for about eight hours, with a short break every hour so I don't burn out.\n\nNobody really helped me in person, but AI played a big role. I use it to plan my schedule and set realistic daily goals, so I make steady progress without too much pressure. In a way, my mum helped too, because her encouragement is the reason I'm doing this at all.\n\nI think it's been a good change because I can stay focused much better than before, and I'm much less exhausted at the end of the day. It's also taught me something simple: it's much easier to change your environment, like moving your phone a few metres away, than to rely on willpower alone.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ who 補充（講義 Part 2）", "my mum was the one who…"], ["★ 減少干擾", "reduce distractions"], ["★ 保持專注", "stay focused"], ["精疲力竭", "burn out"], ["只靠意志力", "rely on willpower alone"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "保持健康的方法", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe something important you do for keeping healthy."], ["提示點", "What you do"], ["提示點", "Who you do it with"], ["提示點", "How often you do it"], ["提示點", "And explain why you think this activity is important for keeping healthy."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：運動經驗、Oakley（我的狗））・講義修訂", "Something I do to stay healthy might sound quite small, but for me it really matters: I try hard to balance out how much time I spend sitting down.\n\nAs a data engineer, I can easily spend eight hours a day at my desk, writing code and staring at a screen. So I've built a few habits into my day. When I take the MRT, I stand even if there's a free seat. At work, I get up regularly to walk around, refill my water bottle and stretch my calves, and sometimes I use a standing desk for a while. Outside work, I also take my dog, Oakley, for walks in the riverside park, which gets me moving and outdoors after a long day at my desk.\n\nI do most of this on my own, apart from Oakley's walks, of course. It's a quiet, personal routine that fits into a busy schedule.\n\nAs for how often, the small desk habits are every working day, and Oakley's walks are two or three times a week. None of it takes long, so it's really just about being consistent.\n\nI think it's important because leading a sedentary lifestyle seems harmless, but it slowly has a negative impact on your health. These small movements stop me from getting stiff and remind me to look after myself, even on busy days. To be honest, I know it's not as good as proper exercise, and if I had more time, I'd love to work out for an hour a day. But for now, I believe the healthiest habit is the one you can actually keep up.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["抵消；平衡", "balance out"], ["★ 配合忙碌的行程", "fit into a busy schedule"], ["★ 過著久坐的生活", "lead a sedentary lifestyle"], ["★ 對健康造成負面影響", "have a negative impact on health"], ["持續下去", "keep up"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "經濟實惠的外出", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a special day out when you spent not much money."], ["提示點", "Where and when you went"], ["提示點", "What you did"], ["提示點", "What you spent money on"], ["提示點", "And explain why you enjoyed this special day out."]]}, {"label": "我的答案", "tone": "pos", "items": [["原題（MAP-042｜原題：Describe a special day out that cost you little money）・講義修訂", "I'd like to talk about an afternoon that cost almost nothing, but I'll remember it for the rest of my life.\n\nMy mum had just finished her last round of chemotherapy and got the all-clear. It was the first day she really felt strong enough to go outside properly. We hadn't planned anything. We just bought some food from a nearby market, brought our dog, Oakley, and drove to the riverside park.\n\nWe spread a blanket by the water and just sat there. There was no plan and no special occasion. Oakley ran happily between us and the river. We talked about simple things, like trips we wanted to take, food we were craving and funny memories. As the sun went down, the water, the grass and even my mum's face turned a deep golden-orange.\n\nI didn't say anything at that moment. I don't think I needed to. After months of hospitals, treatments and quiet fear, we were just a family sitting outside in the sunshine with our dog. It was perfect.\n\nThat afternoon only cost us some market food and a blanket that we already owned. But it was a day which reminded me what really matters, and I wouldn't trade it for anything.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["一輪化療", "a round of chemotherapy"], ["檢查結果無異狀", "the all-clear"], ["★ that 補充（講義關係子句）", "a blanket that we already owned"], ["★ which 補充（講義關係子句）", "a day which reminded me what really matters"], ["拿什麼都不換", "I wouldn't trade it for anything"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "想參加的比賽", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a competition you would like to take part in."], ["提示點", "What the competition is"], ["提示點", "Where and when it happens"], ["提示點", "What you have to do to win the competition"], ["提示點", "And explain why you would like to join in this competition."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "A competition I'd like to enter is a cybersecurity competition called Capture the Flag, or CTF. I studied computer science, and I've always thought cybersecurity was an important and interesting field. I'd love a chance to put my knowledge into practice. In this kind of competition, you work in a team to solve technical challenges within a time limit.\n\nParticipants might need to crack a code or find a weakness in a system, which is set up just for the competition. Some formats also involve attacking other teams' systems while defending your own, but only inside the competition. What appeals to me is the mix of technical skills, creative thinking and teamwork. You need to look at problems from different angles, and teammates who think differently can really help when you're stuck.\n\nI think working towards a clear goal under pressure would be exciting. It would also help me gain valuable experience and find out which areas I need to improve. I don't feel fully prepared yet, but if I had the chance to develop the necessary skills, I'd definitely step outside my comfort zone and give it a try.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["把所學付諸實踐", "put my knowledge into practice"], ["在時限內", "within a time limit"], ["從不同角度看問題", "look at problems from different angles"], ["★ 獲得寶貴經驗", "gain valuable experience"], ["★ 走出舒適圈", "step outside my comfort zone"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "教別人的技能", "en": "教育、工作與職涯", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a skill you have that you think you would be good at teaching other people"], ["提示點", "What the skill is"], ["提示點", "Who you could teach this skill to"], ["提示點", "What you would need to teach it"], ["提示點", "And explain why you think you'd be good at teaching other people this skill."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：S01 賴索托志工＋資料工程師工作）・講義修訂", "A skill I think I'd be good at teaching is using spreadsheets, like Excel or Google Sheets, to organise and analyse information.\n\nI could teach it to pretty much anyone who's just starting out. Many people use spreadsheets every day but only know the basics. They don't realise how much time a few simple functions could save them.\n\nTo teach it, I wouldn't need much: a laptop, a shared screen and, most importantly, real data that means something to the learner, such as their household budget or their sports team's results. People quickly forget general examples, but personal ones stick.\n\nI think I'd be good at it for two reasons. First, I use these tools every day as a data engineer, so I understand them well enough to explain them simply. Second, I've actually done it before. When I was seventeen, I volunteered in Lesotho and taught basic computer skills to middle-school students who had barely used a computer. One boy refused to join in for the whole first week. I only reached him when I found out he loved drawing, so I started adding drawing to my lessons.\n\nThat experience taught me that good teaching starts with connection, not content. If someone feels comfortable and sees why a skill matters to them, the technical part becomes much easier. I'd bring that patience to anyone I taught, which I think would make it a rewarding experience for both of us.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 幾乎沒用過電腦的學生（who 子句）", "students who had barely used a computer"], ["深入淺出地解釋", "explain them simply"], ["切身的例子才記得住", "personal ones stick"], ["先連結，再內容", "connection, not content"], ["★ 有收穫的經驗", "a rewarding experience"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "未來想一起工作的家人", "en": "教育、工作與職涯", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a family member you like to work with in the future."], ["提示點", "Who he/she is"], ["提示點", "Have you worked with him/her before"], ["提示點", "What work you like to do with him/her"], ["提示點", "And explain why you like to work with this family member in the future."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "A family member I'd like to work with in the future is my younger sister. We'd love to open a boutique which sells clothes and accessories, especially unique silver jewellery. We both love clothes with interesting designs and enjoy discovering pieces that are different from what we usually see in shops. Running a store would give us a chance to explore the things we love and share our taste with other people.\n\nWe'd choose the products together so we could exchange ideas and help each other pick the best pieces. My sister would handle social media and promotion, which aren't really my strengths. We'd both help customers in the shop. Because we'd personally select the products, we could explain what we liked about them and suggest different ways to style them.\n\nI think that would be one of the most enjoyable parts of the job. What appeals to me most is turning a shared interest into a business. Running a shop would involve much more than buying things we like, but I'd love to build something with my sister and earn a living doing something we both enjoy.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 賣衣服配件的小店（which 子句）", "a boutique which sells clothes and accessories"], ["分享我們的品味", "share our taste"], ["★ （which 補充說明）", "social media and promotion, which aren't really my strengths"], ["把共同興趣變成事業", "turning a shared interest into a business"], ["謀生", "earn a living"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "喜歡去的商店", "en": "飲食、消費與經濟", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a shop/store that you enjoy going to."], ["提示點", "What this shop/store is called"], ["提示點", "Where this shop/store is"], ["提示點", "What you can buy in this shop/store"], ["提示點", "And explain why you enjoy going to this shop/store."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：中山區精品小店（MAP-027））・講義修訂", "The shop I really enjoy going to is a small independent clothing boutique in the Zhongshan district of Taipei. It doesn't have a famous name. It's the kind of place you'd walk past without noticing, and I passed it for months before I finally went in.\n\nIt's tucked away on a quiet lane among cafés and other small shops, which is part of the reason I like the area. I often go for an evening walk around Zhongshan and end up looking around there.\n\nThe shop sells a small, carefully chosen selection of clothes and accessories, mostly simple, minimalist pieces in neutral colours, plus a few bags and scarves. Everything looks like it's been picked by someone who has a very clear sense of style.\n\nI enjoy going there for a few reasons. First, unlike big chain stores, where you have to dig through racks of identical clothes, every piece there feels special. Second, the staff really know what they're selling. They'll tell you where the fabric comes from or how a coat should fit on the shoulders. And third, it's where I bought my favourite coat. I didn't check the price before trying it on, which was a mistake for my wallet. But I've worn it more than anything else I own, so it has turned out to be worth the money.\n\nFor me, shopping there feels less like spending money and more like discovering something new. It's a small, quiet pleasure that big malls just can't offer.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["隱身在……", "tucked away"], ["精挑細選的商品", "a carefully chosen selection"], ["★ 風格很明確的人（who 子句）", "someone who has a very clear sense of style"], ["★ 值得花這筆錢", "worth the money"], ["不像花錢，更像探索", "less like spending money and more like discovering something new"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "有趣的健康文章", "en": "媒體與科技", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an interesting article on health that you have read."], ["提示點", "When you read this article"], ["提示點", "Why you read this article"], ["提示點", "What it was about"], ["提示點", "And explain why you found this article interesting."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "An interesting health article I read was about the importance of sleep, especially its connection with memory and learning. I came across it on my phone after someone shared it online. What caught my attention was the idea that sleep isn't just a break from being awake. The article explained that it helps the body recover, and it also helps the brain organise and strengthen the things we have learned.\n\nI found that particularly interesting because I used to stay up late studying. I thought that spending more hours with my books would help me learn more, but I often struggled to concentrate when I was tired. The article made me question that habit. It helped me see that time spent resting could also support my learning, rather than simply taking time away from it.\n\nWhat I took away from it was the importance of finding a balance between studying and getting enough sleep. I liked the article because it connected a familiar everyday habit with something that mattered to me personally. It encouraged me to think about the quality of my study time instead of just counting the hours.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["偶然看到", "came across it"], ["引起我的注意", "caught my attention"], ["熬夜", "stay up late"], ["★ 很難專心", "struggled to concentrate"], ["★ 睡眠充足", "get enough sleep"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "二手網站", "en": "媒體與科技", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a website you know about where people can buy second-hand or recycled things."], ["提示點", "How you know about this website"], ["提示點", "What kinds of second-hand or recycled things it sells"], ["提示點", "How often you buy things from this website"], ["提示點", "And explain how you feel about this website where people can buy second-hand or recycled things."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "A website I know where people can buy second-hand things is Facebook, particularly its second-hand clothing groups. I also know about platforms such as Shopee, but Facebook is the one I've personally used to buy pre-owned clothes. People post items that they no longer need, sometimes because the size doesn't suit them or they haven't had many chances to wear them. Some pieces have barely been worn, and others are still brand new.\n\nWhat I like is that I can ask the seller about the fit and their experience of wearing the item. If I'm unsure about the size or the fabric, that information helps me decide whether it would suit me. I sometimes ask about their height or body shape to get a better idea of the fit. Another advantage is the price.\n\nI can buy something I like for less than its original price, so even if it doesn't fit perfectly, I don't lose much money. I also like the idea of giving clothes a second life. For me, these groups make shopping more affordable, and they help people avoid wasting things that are still in good condition, which helps cut down on waste.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["二手衣", "pre-owned clothes"], ["幾乎沒穿過", "barely been worn"], ["★ 負擔得起的", "affordable"], ["★ 減少浪費", "cut down on waste"], ["狀況仍然良好", "still in good condition"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "令你發笑的電影", "en": "媒體與科技", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a film/movie you saw that made you laugh."], ["提示點", "When and where you saw the film/movie"], ["提示點", "What it was about"], ["提示點", "Who you saw it with"], ["提示點", "And explain why this film/movie made you laugh."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "A film that made me laugh was Zootopia. The scene I remember most clearly is when Judy, the rabbit, and Nick, the fox, visit an office to get information for an investigation. They're in a hurry, but the staff who serve them are sloths. Everything happens incredibly slowly, from speaking to handling the request.\n\nWhat makes it so funny is the contrast between how urgent the investigation is and how relaxed the sloths are. Even a simple conversation seems to take forever. The jokes make the delay even more ridiculous, because the characters have to wait for the sloth to react. I found that mix of awkward timing and extreme slowness hilarious.\n\nThere's also a later scene that makes the joke even better. The characters stop a car for speeding, only to discover that the driver is the same sloth. After seeing him do everything so slowly, you don't expect him to drive that fast. I loved that unexpected contrast.\n\nIt's such a simple idea, but it makes the character even more memorable. Those two scenes are why this is the first film that comes to mind when I think of something that made me laugh.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who", "the staff who serve them"], ["★ 關係子句 that", "a later scene that makes the joke even better"], ["好像要花一輩子", "seems to take forever"], ["出乎意料的反差", "unexpected contrast"], ["浮現腦海", "comes to mind"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "著名產品的廣告", "en": "媒體與科技", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time when you saw an advertisement for a well-known product."], ["提示點", "When and where you saw the advertisement"], ["提示點", "Which well-known product this advertisement was for"], ["提示點", "What you saw in this advertisement"], ["提示點", "And explain how you felt about the advertisement you saw for this well-known product."]]}, {"label": "我的答案", "tone": "pos", "items": [["相近題・可延用（MAP-005｜原題：Describe an advertisement with a famous person in it）・講義修訂", "I'd like to talk about an advertisement for Stranger Things, the Netflix series. Netflix is a really well-known product, and Stranger Things is one of my favourite shows, so the ad caught my attention straight away.\n\nWhat I loved was the way it was made. Instead of just showing clips from the show, it mixed the story and the characters into the ad itself. It felt like a short extra episode, a kind of spin-off. Even people who had never seen the show could enjoy it.\n\nThe ad also felt interactive. The characters seemed to talk directly to the people watching in front of the TV, as if they were inviting the audience to join them.\n\nI think it was really effective. Fans like me enjoyed it because it was like a bonus scene, and people who had never watched the show would probably feel curious enough to sign up for Netflix. Personally, it reminded me of the time I binge-watched the whole first season in two days.\n\nMost ads just try to sell you something, but this one felt like part of the story, which is why I still remember it. It showed me that a creative ad can spark people's imagination rather than just push a product.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who", "people who had never seen the show"], ["★ 激發想像力", "spark people's imagination"], ["★ 而不是", "rather than"], ["★ 這就是為什麼（which 補充）", "…, which is why I still remember it"], ["一下就吸引我", "caught my attention straight away"], ["註冊、訂閱", "sign up for"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "改變世界的發明", "en": "媒體與科技", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an invention you think changes the world in a good way."], ["提示點", "What it is"], ["提示點", "What it does"], ["提示點", "How popular it is with people of different ages"], ["提示點", "And explain how you think this invention has changed the world in a good way."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：閱讀與學習習慣）・講義修訂", "The invention I'd choose is generative AI, which is the kind of AI assistant you can talk to in everyday language.\n\nIt can do a really wide range of things. It can answer questions instantly, help you plan, summarise long pieces of information, and even help with coding and fixing problems. Personally, I use it almost every day. When I'm studying, it helps me plan a realistic schedule and explains things I don't understand. At work, as a data engineer, I use it alongside my coding. And at home, when an appliance breaks down, I ask AI for basic tips before deciding whether to call a technician.\n\nIn terms of popularity, it's very popular with younger people. Students use it for their studies, and people my age use it for work without thinking twice. Older people, on the other hand, seem more reluctant to use it, perhaps because it feels unfamiliar or they're not sure how far they can trust it. But I think that's slowly changing as it becomes easier to use.\n\nAs for how it's changed the world for the better, I think the biggest difference is access. In the past, if you had a question, you needed a teacher, an expert or hours of research. Now almost anyone has access to a clear explanation in seconds, which makes learning easier for everyone.\n\nThat said, I don't think it should replace people. In my view, the best way is to work alongside AI. It can handle the repetitive parts, which saves us time and effort, while we stay in charge of the important decisions. Used that way, it makes people more capable rather than less.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["毫不猶豫地", "without thinking twice"], ["★ 不太願意……", "be reluctant to"], ["★ 能取得……", "have access to"], ["★ 節省時間與精力", "save time and effort"], ["保有主導權", "stay in charge of"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "用手機做重要的事", "en": "媒體與科技", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time you used a phone to do something important."], ["提示點", "What you used the phone for"], ["提示點", "When and where it happened"], ["提示點", "Why it was important"], ["提示點", "And explain what happened as a result of using the phone."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "A time I used my phone to do something important was when I bought concert tickets for ONE OK ROCK, one of my favourite bands. I'd wanted to see them perform live for a long time, so getting tickets meant a lot to me. Unfortunately, I was going out with friends on the day tickets went on sale, which meant I couldn't use my computer as I normally would. Instead, I had to try booking on my phone for the first time.\n\nWe were all nervous and even set a countdown so we wouldn't miss the start of the sale. When I tried to book, the screen just kept loading. I watched the spinning circle and had no idea whether my request was going through. After about three minutes, I discovered that I'd actually managed to get tickets.\n\nI was incredibly excited and relieved. What made the experience memorable was that I'd never expected to succeed using my phone, especially while I was out. It showed me how useful a phone can be when I need to do something urgent and don't have access to a computer. More importantly, it gave me the chance to see a band I'd always wanted to hear live.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["對我意義重大", "meant a lot to me"], ["開賣", "went on sale"], ["★ 關係子句 which", "which meant…"], ["成功買到票", "managed to get tickets"], ["★ 能使用……", "have access to"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "天空中有趣的事物", "en": "自然、環境與動物", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time when you watched something interesting in the sky"], ["提示點", "What you watched in the sky"], ["提示點", "When and where you watched this thing in the sky"], ["提示點", "How long you watched it for"], ["提示點", "And explain how you felt when you were watching this interesting thing in the sky."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：S04 河邊夕陽野餐）・講義修訂", "The most interesting thing I've watched in the sky was a sunset over the Danshui River in Taipei. It isn't an unusual event, but the situation made it unforgettable.\n\nIt happened on the afternoon my family went for a picnic at the riverside park with my mum, who had just finished her last round of chemotherapy and got the all-clear. It was the first day in months that she felt strong enough to go outside properly.\n\nWe spread a blanket by the water, and our dog, Oakley, ran back and forth along the bank. As the afternoon went on, the sky slowly began to change. First it turned pale gold, then deep orange, and finally the clouds near the horizon turned pink and purple. The colours reflected on the river, which made it feel as if the whole scene was lit from within.\n\nI watched it from the moment the light started to soften until the sun disappeared behind the buildings on the other side of the river. None of us said much. We didn't need to.\n\nWhile I was watching, I felt a mix of relief, gratitude and quiet joy. After all the hospital visits and worry, it felt as if the sky was marking the end of a very long chapter.\n\nI've seen more dramatic skies since then, but none that meant as much. It taught me that what makes something beautiful is often less about the thing itself and more about the moment you're in.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who", "my mum, who had just finished…"], ["★ 關係子句 which", "which made it feel as if…"], ["確定康復", "got the all-clear"], ["由內而外發光", "lit from within"], ["象徵漫長篇章的結束", "mark the end of a long chapter"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "看到動物的地方", "en": "自然、環境與動物", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a place you visited where you saw some animals."], ["提示點", "Where the place was"], ["提示點", "Why you went to this place"], ["提示點", "What animals you saw there"], ["提示點", "And explain how you felt about seeing animals at this place."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "A place I visited where I saw some animals was a wildlife park in South Africa. I went there while I was in high school, during an international volunteer trip. It was my first time exploring a wildlife park in a jeep, which made the experience really exciting. We saw a group of lions, including some very small cubs.\n\nI thought they were adorable, and they were one of the highlights of the visit for me. We were also lucky enough to see giraffes, rhinos and a leopard. Some of the animals were quite close to our vehicle, which made the experience feel especially memorable. What stayed with me was the chance to see several different kinds of wildlife in a single visit.\n\nI was particularly happy that we got to see both adult lions and their cubs, because I'd never had an experience like that before. Even now, the trip stands out as one of my most unforgettable travel experiences. If I had another opportunity, I'd love to go back and spend more time watching the animals.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["國際志工之旅", "international volunteer trip"], ["★ 關係子句 which", "which made the experience really exciting"], ["這趟參觀的亮點之一", "one of the highlights of the visit"], ["很幸運能看到", "lucky enough to see"], ["脫穎而出成為", "stands out as"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "國內重要水域", "en": "自然、環境與動物", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an important river or lake in your country."], ["提示點", "Where it is"], ["提示點", "How big it is"], ["提示點", "What it looks like"], ["提示點", "And explain why this river or lake is important."]]}, {"label": "我的答案", "tone": "pos", "items": [["原題（MAP-032｜原題：Describe an important river or lake in your country）・講義修訂", "The river I'd like to describe is the Danshui River, which runs through Taipei. Along the river, there are some of the city's most important riverside parks.\n\nI go to these parks regularly, usually with my dog, Oakley. There's lots of open space, you can hear the water, and the sky feels much bigger there than it does between buildings. It's a place where I always feel calm, and it helps me relieve stress.\n\nThe most important afternoon I've spent there was after my mum finished her cancer treatment. It was the first day she felt well enough to go outside properly. We packed food from a nearby market, brought Oakley, and drove to the riverside. We didn't plan anything. We just spread a blanket and sat down.\n\nAs the afternoon turned into evening, the light turned golden over the water. Oakley ran between us and the river. My mum said almost nothing, but she was relaxed and comfortable in a way that I hadn't seen for months.\n\nI don't think that afternoon would have felt the same anywhere else. There's something about a river, with its wide horizon and moving water, that makes people slow down and feel peaceful.\n\nThe Danshui River isn't the most impressive river in the world. But for me, it holds my most important memory, which is the day our normal life finally came back.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 which", "which runs through Taipei"], ["★ 關係子句 where", "a place where I always feel calm"], ["★ 紓解壓力", "relieve stress"], ["光線變成金色", "the light turned golden"], ["平凡生活終於回來了", "normal life finally came back"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "喜歡的歌手", "en": "社會、文化與歷史", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a person whose music or singing you like."], ["提示點", "Who this person is"], ["提示點", "What kind of music he/she plays or sings"], ["提示點", "When and where you have heard this person's music"], ["提示點", "And explain why you like this person's music."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "The musicians I'd like to talk about are ONE OK ROCK, a Japanese rock band. Strictly speaking, they're a group rather than one person, but their sound is so unique that they feel like a single voice to me.\n\nTheir music is loud, high-energy rock, with strong guitars and really powerful vocals, which wake me up the moment they start.\n\nI mostly listen to them on my noise-cancelling headphones, usually when I need a boost of energy, for example to get through a tough day in our open-plan office. I actually choose my music based on my mood. If I need to concentrate, I play instrumental music. If I'm tired or a bit low, I put on Lizzy McAlpine. When I'm debugging, I keep it completely silent. But when I need to push through, it's always ONE OK ROCK.\n\nI think the reason I love them goes beyond the energy, though. Singing has always been part of my life. I sang in my school choir for six years, and my mum and I are both quite good at singing. I think I take after her in that way. Because of that, I really notice vocals. Choir taught me how hard it is to sing with both power and control, so when I hear a singer who manages both, I really appreciate the skill behind it.\n\nSo for me, their music isn't just background noise. It's a reminder of how much a voice can carry, and it gets me through the days when my own energy runs out.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 一個 who 補充人（講義 Part 2 升級法）", "a singer who manages both"], ["★ 一個 which 補充（講義 Part 2 升級法）", "powerful vocals, which wake me up the moment they start"], ["提振精神", "a boost of energy"], ["撐過去", "push through"], ["像（父母）", "take after"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "慶祝重要事件", "en": "社會、文化與歷史", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an important event you celebrated."], ["提示點", "What this event was"], ["提示點", "Where it happened"], ["提示點", "How you celebrated the event"], ["提示點", "And explain why the event was important to you."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：S04 河邊夕陽野餐）・講義修訂", "The important event I'd like to talk about is the end of my mum's cancer treatment. It was the day we celebrated her getting the all-clear.\n\nIt happened at a riverside park along the Danshui River in Taipei, which is where I often walk our dog, Oakley.\n\nWe celebrated in a very simple way, and that was the point. After months of hospital visits, none of us wanted anything big or noisy. We packed some food from a nearby market, brought a blanket and Oakley, and spent the whole afternoon by the water. We talked about trips we wanted to take and food we'd been craving, and we laughed about silly family memories. As the sun went down, the sky and the river turned golden-orange, and we just sat there watching it.\n\nThe event was important to me for several reasons. Most obviously, it marked the end of the most frightening time our family had ever been through. It was also the first time in months that I saw my mum fully relaxed and comfortable, instead of exhausted. And it changed my idea of what a celebration should be. I used to think celebrations needed a big meal, decorations or lots of guests. But that afternoon showed me that what really matters is spending quality time with the people who have been through hard times with you.\n\nIt cost almost nothing, but it's one of the most valuable memories I have.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 共度有品質的時光（講義）", "spend quality time with"], ["★ 一個 who 補充人（講義 Part 2 升級法）", "the people who have been through hard times with you"], ["★ 一個 which 補充地點（講義）", "…, which is where I often walk our dog"], ["這正是重點", "that was the point"], ["象徵……的結束", "mark the end of"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "國內的名人", "en": "社會、文化與歷史", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a well-known person in your country."], ["提示點", "Who this person is"], ["提示點", "What you know about him/her"], ["提示點", "Why he/she is so popular"], ["提示點", "And explain how you feel about him/her"]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "Rather than a politician or a pop star, I'd like to talk about Chou Tien-chen, who is Taiwan's top men's singles badminton player.\n\nMost of what I know about him comes from watching him play. He's represented Taiwan on the international stage for a long time, including at the Olympics. Top-level badminton is incredibly fast. A single rally can involve a dozen or more shots in just a few seconds, but he somehow stays calm in the middle of all that.\n\nI think he's so popular for two main reasons. The first is simply his skill. He's one of the best in the world at what he does. The second is his long career. He's been representing Taiwan for years, and people here really respect someone who stays at the top for so long.\n\nOne moment I'll never forget is watching his Olympic matches with my whole family in our living room. At one point, he saved a match point with a cross-court return, which made the whole family gasp at exactly the same time.\n\nAs for how I feel about him, I'm a big fan. I've never actually seen him play live, so that's the match I'd most like to watch, ideally at the Taipei Open with my family beside me. For me, the best sport is about watching someone push their body and mind to the limit, and he's exactly that kind of athlete.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 一個 who 補充人（講義 Part 2 升級法）", "Chou Tien-chen, who is Taiwan's top…"], ["★ 一個 which 補充事情（講義 Part 2 升級法）", "…, which made the whole family gasp"], ["保持冷靜", "stay calm"], ["把身心推到極限", "push their body and mind to the limit"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "喜歡的傳統物品", "en": "社會、文化與歷史", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a traditional product made in your country which you like."], ["提示點", "What it is"], ["提示點", "When you first tried this product"], ["提示點", "How this product is made"], ["提示點", "And explain why you like it."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "One traditional food I absolutely love is dumplings, or shuijiao, the boiled kind. They're such an everyday part of life in Taiwan that it's hard to imagine a family celebration without them.\n\nTo be honest, I can't remember the first time I tried them, because they've always been part of my life. When I was younger, making dumplings at family celebrations was my grandma's job. These days, we all sit around the table and fold them together, which has become a little tradition of its own.\n\nThe process is fairly simple, but it takes patience. You mix flour and water into a dough, then roll it out into thin, round wrappers. You put a spoonful of filling in the middle, usually minced meat and vegetables. Then you fold the wrapper over and press the edges tightly so nothing leaks out. Finally, you boil them until they float to the surface.\n\nWhat makes them special to me, though, is what they mean. When my mum finished her chemotherapy, the first thing she wanted was dumplings from a little shop near our home. And the morning after she got the all-clear, my mum, who hadn't cooked in ages, made breakfast for us. We sat down together to soy milk and dumplings. It was such an ordinary breakfast, but it felt like life was finally returning to normal.\n\nSo for me, dumplings aren't just food. They taste like family, and they remind me that the simplest things are often the ones that hold us together.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 一個 who 補充人（講義 Part 2 升級法）", "my mum, who hadn't cooked in ages"], ["★ 一個 which 補充事情（講義 Part 2 升級法）", "…, which has become a little tradition of its own"], ["被宣布康復", "get the all-clear"], ["很久以來", "in ages"], ["恢復正常", "return to normal"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "美麗的物品", "en": "社會、文化與歷史", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an object that you think is very beautiful."], ["提示點", "What the object is"], ["提示點", "Where you first saw the object"], ["提示點", "What it looks like"], ["提示點", "And explain how you feel about this beautiful object."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：Braun Atelier 3 音響）・講義修訂", "The object I'd like to talk about is a Braun Atelier 3. It's an old German stereo system, with a radio and a record player built into one, and it was designed by Dieter Rams in the early 1960s.\n\nI first saw it in a post from a vintage audio shop that repairs old Braun stereos. They had just fixed one for a customer, and the photos really caught my eye. I ended up reading a lot about it afterwards.\n\nIt looks very simple and modern, even though it's more than sixty years old. The body is light-coloured, with aluminium side panels, and the buttons and dials are arranged in a clean, neat way, without any extra decoration. When you lift the top lid, there's a record player hidden inside, which I think is a lovely surprise.\n\nI find it beautiful because it's not only good-looking but also practical. Back then, most stereos were big wooden boxes that looked like old furniture, but Rams turned a stereo into something that looks like a piece of modern art. His idea was 'less, but better', and I really agree with it. I prefer simple things in my own room too, so this stereo feels like my taste in one object. If I ever have the chance, I'd love to own one and listen to records on it.", 1], ["備用・含個人素材（素材：我的家與房間－越南買的燈）・講義修訂", "The object I'd like to talk about is a lamp that I bought in Vietnam. It now sits in my bedroom, and I think it's the most beautiful thing I own.\n\nI first saw it in a small shop during my trip to Vietnam. I wasn't planning to buy anything big, but this lamp caught my eye straight away. I stood there looking at it for a while, and in the end I decided it was worth the money, even though I had to carry it carefully all the way home.\n\nIt's made of lots of thin acrylic pieces, which are fitted together around the bulb. There's a round hole cut in the middle, so the bulb sits right in the centre. When the lamp is off, it looks like a simple piece of art. When I switch it on, the light comes through all the acrylic pieces, and the whole thing glows softly.\n\nI really like it for two reasons. First, it goes well with my room, which has soft grey and white colours, so it makes the space feel calm and cosy. Second, it's a souvenir that reminds me of my trip. Every time I turn it on in the evening, I remember walking around Vietnam and finding it by chance. It's a small thing, but it makes my room feel like a place that is really mine.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["吸引我的目光", "caught my eye"], ["★ 關係子句 that", "a vintage audio shop that repairs old Braun stereos"], ["★ which 補充", "…, which I think is a lovely surprise"], ["★ 不只……也……", "not only… but also…"], ["少，但更好（Dieter Rams 的設計理念）", "less, but better"], ["一眼就吸引我", "caught my eye straight away"], ["★ 值得花這筆錢", "worth the money"], ["環繞燈泡組在一起", "fitted together around the bulb"], ["柔和地發光", "glows softly"], ["讓我想起……的紀念品", "a souvenir that reminds me of…"], ["★ 關係子句：真正屬於我的地方", "a place that is really mine"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "有趣的傳統故事", "en": "社會、文化與歷史", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a traditional story that you think is interesting (e.g. a fairy tale, a legend, a story about heroes)."], ["提示點", "What the traditional story is about"], ["提示點", "How you know it"], ["提示點", "How you felt when you first read or heard it"], ["提示點", "And explain why you think this traditional story is interesting."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "A traditional story I find interesting is a Taiwanese folk belief which says you shouldn't point at the moon, or it will cut your ear while you're asleep. My parents used to tell me this when I was little. I didn't completely believe it, but it was frightening enough to make me hesitate. Strangely, I remember sometimes feeling that my ear was a little sore the next day after I'd pointed at the moon.\n\nThat childhood memory made the story even harder to forget, although I don't take it as proof that the moon actually caused it. My own interpretation is that the warning might be connected to teaching children to be respectful and not point at others. I don't know whether that's its original meaning, but it made me wonder why adults sometimes use scary stories to teach manners. What interests me most is that the belief keeps being passed down.\n\nEven people who no longer believe it may repeat it to children. To me, that shows how a story can survive across generations. It's memorable, and it's tied to people's childhood experiences, even when they don't take it literally anymore.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 一個 which 補充事情（講義 Part 2 升級法）", "a Taiwanese folk belief which says…"], ["★ 一個 who 補充人（講義）", "people who no longer believe it"], ["讓我猶豫", "make me hesitate"], ["流傳下來", "passed down"], ["照字面相信", "take it literally"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "別人幫助下做的重要決定", "en": "抽象概念、心理與情感", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an important decision that you made with the help of another person."], ["提示點", "What your decision was"], ["提示點", "Who helped you make this decision"], ["提示點", "Why the decision was important"], ["提示點", "And explain whether you think this person helped you make the right decision."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：數學老師（MAP-047／A1-051））・講義修訂", "The decision I'd like to talk about is choosing to study computer science at university. I made it with the help of my high school maths teacher.\n\nAt the time, I was torn between two paths. One was a more practical route that felt safe. The other was computer science, which really excited me but also felt risky, because I wasn't sure I was talented enough for it.\n\nI went to my maths teacher because he was the one adult who seemed to see students as people, not just exam results. I expected him to give me a list of pros and cons. Instead, he said something I've never forgotten: \"Don't study a subject. Study a question you can't stop thinking about.\" Then he asked me what I thought about when nobody was making me. The honest answer was logic puzzles, systems and how things fit together.\n\nThat conversation changed the way I looked at the whole decision. It was no longer about which option was safer, but about which questions I wanted to spend years working on.\n\nIt was important because it shaped everything that followed: my degree, my career as a data engineer, and even the way I solve problems now.\n\nAnd yes, I'm sure he helped me make the right decision. He's still part of my life, too. He meets his former students twice a year for a meal, which shows how much he still cares about us. Every time I see him, I'm reminded that the best advice doesn't tell you what to do. It helps you hear what you already know.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 一個 who 補充人（講義 Part 2 升級法）", "the one adult who seemed to see students as people"], ["★ 一個 which 補充事情（講義 Part 2 升級法）", "computer science, which really excited me"], ["在兩條路之間掙扎", "be torn between two paths"], ["影響之後的一切", "shape everything that followed"], ["聽見內心早有的答案", "hear what you already know"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "制定過的目標", "en": "抽象概念、心理與情感", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time when you set yourself a goal and did your best to achieve it."], ["提示點", "What the goal was"], ["提示點", "Why you set yourself this goal"], ["提示點", "What you did to try to achieve this goal"], ["提示點", "And explain how well you achieved this goal."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "I'd like to talk about a goal which I set for myself at work. It was a big database migration project across about 1,200 servers, and my goal was to finish it with zero downtime.\n\nWhen the project was given to me, the easy target was just to get it done. But I set myself a stricter goal: no downtime at all and not a single error that users could see. This was mainly because the database structures on our servers had become different over the years, and that was causing hidden data errors. I knew a rushed fix could cause even bigger problems for the thousands of users who relied on our systems.\n\nTo achieve it, I worked step by step. First, I listed every difference between the servers and sorted them by how serious they were. Then I wrote migration scripts with automatic rollback, so if any check failed, the server would simply go back to its old version. I also worked closely with the operations team, and we updated the servers in small batches when traffic was low. I watched every batch in real time, which meant quite a few late nights.\n\nIn the end, I achieved the goal completely. All 1,200 servers now use the same structure, there was zero downtime, and our data became much more reliable. The on-call team also reported fewer data problems.\n\nLooking back, I'm really proud of it. What I learned is that big goals don't need clever shortcuts. You just need to break the problem into small, safe steps and trust the process. That's a lesson which I've used in almost every challenge since then.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 我給自己設的目標（which 子句）", "a goal which I set for myself"], ["給自己設更嚴格的目標", "set myself a stricter goal"], ["★ 這主要是因為……", "This was mainly because…"], ["零停機", "zero downtime"], ["把問題拆成小而安全的步驟", "break the problem into small, safe steps"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "令你驚喜而又開心的事物", "en": "抽象概念、心理與情感", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe something that surprised you and made you happy."], ["提示點", "What it was"], ["提示點", "How you found out about the surprise"], ["提示點", "What you did"], ["提示點", "And explain why the surprise made you happy."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "Something which surprised me and made me incredibly happy was the news that my mum was cancer-free after her treatment.\n\nA few years ago, she was diagnosed with cancer and went through several rounds of chemotherapy. Our whole family's routine was planned around her treatment. Even when the treatment came to an end, none of us dared to believe it had worked. We had learned not to get our hopes up.\n\nI found out at work. My mum had a follow-up appointment that day, and I was expecting a careful, \"let's wait and see\" kind of update. Instead, she called me and simply said, \"The doctor says it's clear.\" I asked her to repeat it, because I really thought I'd heard it wrong.\n\nAs soon as I could, I went home. We didn't have a big party, because that wasn't what any of us needed. Instead, once she felt strong enough, we packed some food from the market, took our dog, Oakley, and had a picnic by the river. We watched the sunset together.\n\nThe news made me so happy because it took away a weight which I hadn't even realised I was carrying. It also changed how I see happiness. It wasn't loud or dramatic. It was simply sitting next to my mum on an ordinary afternoon without being afraid. It's still the best news I've ever received.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 讓我驚訝的事（which 子句）", "Something which surprised me"], ["抱太大希望", "get our hopes up"], ["回診", "a follow-up appointment"], ["卸下重擔", "take away a weight"], ["不再害怕", "without being afraid"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "被讚揚的時刻", "en": "抽象概念、心理與情感", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an occasion when somebody said something positive about some work that you did."], ["提示點", "Who said something positive?"], ["提示點", "What kind of work you did"], ["提示點", "Why this person was positive about your work"], ["提示點", "And explain how you felt when you heard this positive comment."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "I'd like to talk about a time when my manager praised the work which I did on a large database migration project.\n\nThe project was about making the database structure the same across roughly 1,200 production servers. Over time, the structures had become different, and this caused data errors that nobody could easily trace. I designed the migration and wrote scripts with automatic rollback, so any failure would undo itself. I also worked with the operations team to update the servers in small batches when traffic was low.\n\nAfter the final batch was done, my manager mentioned the project in our team meeting. He didn't just say it was finished. He pointed out that there had been zero downtime, and that the on-call team had already seen fewer data problems. He also said the most impressive part wasn't the technical solution itself. It was how careful the process was: mapping everything first and never taking shortcuts.\n\nHe was so positive because the risk had been very real. A rushed approach could have broken the systems for thousands of users. Instead, nobody outside the team even noticed it had happened.\n\nWhen I heard his comments, I felt proud but also a bit surprised, because for weeks the work had felt invisible. It reminded me that careful, behind-the-scenes work does get noticed. What stayed with me most was that he valued how I did it, not just the result. That's a principle which I try to follow in everything I do.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 我做的工作（which 子句）", "the work which I did"], ["零停機", "zero downtime"], ["走捷徑", "take shortcuts"], ["幕後的工作", "behind-the-scenes work"], ["讓我最難忘的是", "what stayed with me most"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "困難的決定", "en": "抽象概念、心理與情感", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a difficult decision you made that had a good result."], ["提示點", "What the decision was"], ["提示點", "Why it was difficult to make the decision"], ["提示點", "What helped you to decide"], ["提示點", "And explain why the decision you made had a good result."]]}, {"label": "我的答案", "tone": "pos", "items": [["相近題・可延用（MAP-006｜原題：Describe an important decision that you made）・講義修訂", "A difficult decision I made, which turned out really well, was applying to be an international volunteer in Lesotho when I was in high school.\n\nI applied through a school club, went through a selection process, and raised part of the funding myself. Nobody pushed me to do it. I wanted to do something truly useful, not just something that looked good on a CV.\n\nThe decision was harder than it sounds. I was only seventeen, and I'd never been to Africa. Lesotho is a small country inside South Africa, and I would be teaching maths, Chinese and basic computer skills to middle-school students who were rarely exposed to technology.\n\nI almost pulled out twice. The planning was complicated, and to be honest, I was really scared.\n\nBut I went, and the result was amazing. During those two weeks, one boy refused to take part in class, so I spent extra time with him and found out he loved drawing. I used that to bring him into the lesson. By the last week, he was coming to class early. On the last day, he drew me a picture and waved until our bus disappeared.\n\nLooking back, I'm so glad I didn't pull out. It changed how I understand learning, and it taught me that connection comes before content. Going was the easiest hard decision I've ever made.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 結果很好（which 子句）", "which turned out really well"], ["★ 很少接觸科技的學生（who 子句＋be exposed to）", "students who were rarely exposed to technology"], ["退出", "pull out"], ["先建立連結，再談內容", "connection comes before content"], ["我做過最容易的困難決定", "the easiest hard decision I've ever made"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "幫助你集中注意力的事物", "en": "抽象概念、心理與情感", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe something that helps you to concentrate better on work or study."], ["提示點", "What it is"], ["提示點", "Where you do this"], ["提示點", "Do you always do it"], ["提示點", "And explain how much this helps you to concentrate on work or study."]]}, {"label": "我的答案", "tone": "pos", "items": [["相近題・可延用（MAP-029｜原題：Describe a piece of technology (not a phone) that you would like to own）・講義修訂", "Something which really helps me concentrate at work is my pair of noise-cancelling headphones.\n\nI'm a data engineer, so my work needs long periods of focus on difficult problems, like debugging systems or writing migration scripts. But I work in an open-plan office, which isn't an easy place to focus. Conversations, people walking past and other background noise can break my concentration all the time.\n\nMy headphones changed that. Sometimes I wear them without any music, just to block out the noise around me. When I put them on, I feel like I'm in my own private space, and my thinking becomes much clearer. It's like having a quiet room that I can take anywhere.\n\nUsually, though, I add music, and I choose it based on the task. I listen to instrumental music when I need to read or write carefully, and ONE OK ROCK when I need energy. When I'm debugging, I keep it completely silent, because I need to hear my own thinking.\n\nDo I always use them? Almost always when I work. I was in the choir throughout high school, so I've always been a careful listener, and good sound really matters to me.\n\nThe headphones themselves are nothing special. But they help me reduce distractions and stay focused anywhere, which is why they're worth far more than their price.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 幫我專心的東西（which 子句）", "Something which really helps me concentrate"], ["★ 減少干擾", "reduce distractions"], ["★ 保持專注", "stay focused"], ["隔絕噪音", "block out the noise"], ["在自己的私人空間裡", "in my own private space"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "熊孩子", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What are some common things youn…", "tone": "neu", "items": [["題目", "What are some common things young children do when they’re behaving badly?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "The most common ones are tantrums in public, like scr
