ture and patience, so it can feel like homework. Even for adults, reading can be really engaging. For example, I still prefer paper books, and I read slowly, taking notes as I go. However, creative children often find writing a rewarding experience, because they get to control the story. In other words, reading builds imagination, and writing gives children a way to express it.", 1], ["★ 和……相比（講義 7+ 句型）", "Compared with…"], ["★ 有收穫的經驗（講義）", "a rewarding experience"], ["★ 換句話說（講義 Part 3 架構）", "In other words,…"], ["被情節帶著走", "be carried along by the story"]]}, {"label": "Q4 Do you agree that films need to…", "tone": "neu", "items": [["題目", "Do you agree that films need to have a good story to be successful?"], ["相近題・可延用（F3-193）・講義修訂", "Mostly, yes. I think a good story is the most important thing for a film's success. This is mainly because people remember how a film made them feel, not how much it cost. In other words, the audience needs characters they care about and a story that feels real. For example, a small film with real emotions is often remembered longer than a big-budget film with nothing to say. As a result, the best films help people understand their own feelings. Of course, good acting and filming also help keep the audience in the story.", 1], ["★ 講義 Part 3 架構", "This is mainly because… / In other words,… / For example,… / As a result,…"], ["觀眾在乎的角色", "characters they care about"], ["大成本電影", "a big-budget film"], ["讓觀眾沉浸在故事裡", "keep the audience in the story"]]}, {"label": "Q5 How popular are films or movies…", "tone": "neu", "items": [["題目", "How popular are films or movies that are based on true stories?"], ["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "Very popular, especially films about real people and historical dramas, because audiences know the events actually happened. Sports stories do especially well. For example, when Chou Tien-chen saved a match point at the Olympics with a cross-court return, my whole family gasped at the same moment. So I think a film about a Taiwanese badminton player would probably fill cinemas here. However, a major drawback is that film studios often exaggerate scenes for drama, so viewers shouldn't treat them as accurate history.", 1], ["★ 主要缺點（講義 14 天片語）", "a major drawback"], ["真人真事改編的電影", "films about real people"], ["座無虛席", "fill cinemas"], ["誇大", "exaggerate"]]}, {"label": "Q6 Do you agree that films based on…", "tone": "neu", "items": [["題目", "Do you agree that films based on famous books are never as good as the books themselves?"], ["新撰寫・含個人素材（素材：閱讀與學習習慣）・講義修訂", "'Never' is too strong. Books usually have more depth, because they can show characters' inner thoughts in a way a two-hour film can't. But a film can also lead people to the book. For example, I watched The Devotion of Suspect X, and the mystery was so exciting that I went on to read the novel. The novel gave me a different view of the characters. While films can't show as much detail, they have their own strengths, like music and visuals. So a film is really a different kind of art, not a worse one.", 1], ["★ 雖然……，但……（講義 7+ 句型）", "While…, …"], ["內心想法", "inner thoughts"], ["引導人們去讀原著", "lead people to the book"], ["對……不同的看法", "a different view of"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "別人幫助下做的重要決定", "en": "Part 3 · 抽象概念、心理與情感", "groups": [{"label": "Q1 What are some important decision…", "tone": "neu", "items": [["題目", "What are some important decisions that teenagers often have to make?"], ["自己準備（相近題）・講義修訂", "One of the most important decisions is choosing which university to attend and what major to study after high school. Many teenagers struggle to make this decision because they don't know much about different jobs yet. If you make the wrong choice, switching majors later can cost a lot of time and money.", 1], ["★ 很難做到（講義）", "struggle to"], ["要讀哪所大學", "which university to attend"], ["做錯選擇", "make the wrong choice"], ["轉換主修科系", "switching majors"]]}, {"label": "Q2 Why do some people take longer t…", "tone": "neu", "items": [["題目", "Why do some people take longer than others to make decisions?"], ["自己準備（相近題）・講義修訂", "I think it often comes down to how willing they are to take risks. Some people aren't as afraid of making mistakes, so they spend less time worrying about what could go wrong. Others struggle to make up their minds because they worry too much. Also, some people have more experience in certain situations, which gives them the confidence to decide without overthinking every detail.", 1], ["★ 害怕犯錯（講義配對題用語）", "be afraid of making mistakes"], ["★ 難以下定決心（講義配對題用語）", "struggle to make up their minds"], ["往往取決於", "it often comes down to"], ["對每個細節都想太多", "overthinking every detail"]]}, {"label": "Q3 Do you agree that making quick d…", "tone": "neu", "items": [["題目", "Do you agree that making quick decisions is always a bad idea?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "Not at all. Quick decisions are often based on gut feeling, which is really just experience working fast. For example, I saw this when I coordinated my high-school choir on a competition trip to Italy. Someone forgot their formal shoes, the bus was late, and the hall sounded too dry. Each problem needed a fix within minutes, not a long discussion. However, quick decisions can be risky when people don't have enough experience. As a result, decisions in unfamiliar situations, especially ones you can't undo, need much more care.", 1], ["★ 講義 Part 3 架構", "For example,… / As a result,…"], ["直覺", "gut feeling"], ["需要在幾分鐘內解決", "needed a fix within minutes"], ["無法挽回的決定", "ones you can't undo"]]}, {"label": "Q4 Why do people often ask others f…", "tone": "neu", "items": [["題目", "Why do people often ask others for advice before making a decision?"], ["自己準備（相近題）・講義修訂", "I think people ask for advice mainly because they want to feel more confident. When it comes to important decisions, I sometimes hesitate to decide entirely on my own because I worry my judgment may not be good enough. So I seek advice from family and close friends to see things from different perspectives and consider things I might have missed. In the end, I weigh up their opinions and make the final decision myself.", 1], ["★ 從不同角度看事情（講義）", "see things from different perspectives"], ["說到、談到", "When it comes to"], ["向……徵詢意見", "seek advice from"], ["衡量他們的意見", "weigh up their opinions"]]}, {"label": "Q5 Do people usually ask for advice…", "tone": "neu", "items": [["題目", "Do people usually ask for advice more when it comes to personal issues or work-related problems?"], ["新撰寫・含個人素材（素材：妹妹）・講義修訂", "I'd say personal issues, because people want emotional support as much as solutions, so they turn to family and friends. For example, my younger sister asked for my opinion when she was choosing her university major, although in the end she chose finance for her own reasons. At work, people ask for advice all the time too, but they don't usually call it that. In Taiwan, saving face is also important, so some people are reluctant to admit they're struggling. They would rather quietly search online.", 1], ["★ 不願意（講義）", "be reluctant to"], ["★ 情緒支持（講義）", "emotional support"], ["求助於", "turn to"], ["顧及面子", "saving face"]]}, {"label": "Q6 Do you think people only follow…", "tone": "neu", "items": [["題目", "Do you think people only follow the advice they already agree with?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "To a large extent, yes. People often ask for advice when they've already half-decided, so what they really want is someone to agree with them. But I wouldn't say 'only'. For example, my high-school maths teacher once told me not to study a subject but a question I couldn't stop thinking about, and that's partly why I chose computer science. I think the best advice doesn't decide for you; it helps you hear what you already know. As a result, whether people follow advice or not depends on how much they trust the person giving it.", 1], ["★ 是否……取決於（講義 7+ 句型）", "Whether… or not depends on…"], ["已經半決定了", "half-decided"], ["替你決定", "decide for you"], ["聽見內心早有的答案", "hear what you already know"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "制定過的目標", "en": "Part 3 · 抽象概念、心理與情感", "groups": [{"label": "Q1 Do people in your country set go…", "tone": "neu", "items": [["題目", "Do people in your country set goals?"], ["相近題・可延用（F3-001）・講義修訂", "Yes, I think most people in Taiwan set goals, especially young people. This is mainly because there is a lot of social pressure to study hard, find a good job and buy a house. For example, students usually set goals for their exams, and many adults make New Year's resolutions. However, many people struggle to stick to their goals because of a heavy workload or a lack of motivation. As a result, the goals that work best are clear but flexible enough to change.", 1], ["★ 社會壓力", "social pressure"], ["★ 難以堅持目標", "struggle to stick to their goals"], ["★ 沉重的工作量", "a heavy workload"], ["★ 缺乏動力", "a lack of motivation"], ["新年新希望", "New Year's resolutions"]]}, {"label": "Q2 Do people usually set long-term…", "tone": "neu", "items": [["題目", "Do people usually set long-term goals or short-term ones?"], ["相近題・可延用（F3-004）・講義修訂", "I think people usually set short-term goals rather than long-term ones. This is mainly because short-term goals feel more realistic, and they give people a quick sense of achievement. For example, people might aim to pass an exam or save money for a trip this year. Long-term goals, like buying a house, can feel too far away, especially with the rising cost of living. As a result, many people use short-term goals as small steps towards a bigger plan.", 1], ["★ ……而不是……", "… rather than …"], ["★ 成就感", "a sense of achievement"], ["★ 生活成本", "the cost of living"], ["存錢去旅行", "save money for a trip"]]}, {"label": "Q3 Why is setting goals important i…", "tone": "neu", "items": [["題目", "Why is setting goals important in the workplace?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "I think goals are important at work because they turn vague ideas into clear targets. This is mainly because, without a clear target, teams tend to lose direction, and it's hard to tell if anyone is making progress. Goals also help people manage their time effectively and meet deadlines, since they know what to focus on. For example, when I led a project across about 1,200 servers, our goal of zero downtime shaped every decision we made. However, badly chosen targets can create unrealistic expectations.", 1], ["★ 有效管理時間", "manage their time effectively"], ["★ 在期限內完成", "meet deadlines"], ["★ 不切實際的期待", "unrealistic expectations"], ["把模糊的想法變成明確目標", "turn vague ideas into clear targets"], ["零停機", "zero downtime"]]}, {"label": "Q4 What is the difference between g…", "tone": "neu", "items": [["題目", "What is the difference between goals set by old people and young people?"], ["相近題・可延用（F3-002）・講義修訂", "I think young people and older people set quite different goals. Compared with older people, young people are more likely to focus on their careers and new experiences rather than stability. For example, people my age often want career growth, travel, or maybe to start a family. Older people, on the other hand, usually care more about their health and spending quality time with their families. As a result, young people's goals are mostly about building a life, while older people's goals are more about enjoying it.", 1], ["★ 和……相比，……比較可能……而不是……", "Compared with…, … are more likely to … rather than …"], ["★ 共度有品質的時光", "spend quality time with"], ["職涯成長", "career growth"], ["成家", "start a family"]]}, {"label": "Q5 How do people set goals?", "tone": "neu", "items": [["題目", "How do people set goals?"], ["新撰寫・含個人素材（素材：媽媽鼓勵我出國念書）・講義修訂", "It depends on the situation. In companies, goal-setting is usually quite formal, and targets need to be specific and have a deadline. On a personal level, it's much more relaxed, like New Year's resolutions. I'd say the best way is to break a big goal into small steps. By doing this, people can stay motivated, which makes the goal feel less scary. For example, studying abroad once felt like an impossible dream to me, so now I'm preparing for it step by step with realistic daily goals. Most resolutions fail not because of a lack of ambition, but because of a lack of planning.", 1], ["★ 藉由……，人們可以……，這……", "By doing this, people can…, which…"], ["★ 保持動力", "stay motivated"], ["把大目標拆成小步驟", "break a big goal into small steps"], ["一步一步地", "step by step"]]}, {"label": "Q6 Do you think people should have…", "tone": "neu", "items": [["題目", "Do you think people should have personal life goals?"], ["相近題・可延用（F3-001）・講義修訂", "Yes, I think everyone should have some personal life goals. This is mainly because goals give people a direction, so they know what to focus on. Without goals, it's easy to just follow the same daily routine and stop growing. For example, my goal of studying abroad keeps me motivated to practise English every day. However, goals shouldn't be too strict, because unexpected things can come up. As a result, the best goals are clear about the 'why' but leave room for change.", 1], ["★ 意外狀況可能會發生", "unexpected things can come up"], ["★ 這主要是因為……", "This is mainly because…"], ["讓我保持動力", "keep me motivated"], ["保留改變的空間", "leave room for change"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "令你驚喜而又開心的事物", "en": "Part 3 · 抽象概念、心理與情感", "groups": [{"label": "Q1 How do people in your culture us…", "tone": "neu", "items": [["題目", "How do people in your culture usually show that they are happy?"], ["新撰寫・含個人素材（素材：S04 河邊夕陽野餐）・講義修訂", "In Taiwan, people usually show happiness through actions rather than words. This is mainly because Taiwanese people tend to be quite reserved, so they don't often talk about their feelings. Food is the big one: when something good happens, people treat friends to a meal, or the whole family eats out together. For example, when my mum was told she was cancer-free, nobody made speeches. We just packed some food, took our dog and had a picnic by the river. Younger people, of course, are more likely to share their happiness online.", 1], ["★ ……而不是……", "… rather than …"], ["★ 這主要是因為……", "This is mainly because…"], ["請朋友吃飯", "treat friends to a meal"], ["在網路上分享快樂", "share their happiness online"]]}, {"label": "Q2 Do you think shopping can make p…", "tone": "neu", "items": [["題目", "Do you think shopping can make people feel happy?"], ["相近題・可延用（延伸討論題 E13）・講義修訂", "Yes, but only up to a point. Shopping can make people feel happy for a short time, especially when they buy something they really need or have saved up for. This is mainly because it feels like a small reward after a stressful week. However, people are constantly exposed to advertisements, which encourage unnecessary spending. As a result, if people shop too much, it can put a financial strain on them. I think spending money on experiences, like trips, makes people happier in the long run.", 1], ["★ 不斷接觸廣告", "be constantly exposed to advertisements"], ["★ 鼓勵不必要的消費", "encourage unnecessary spending"], ["★ 造成經濟壓力", "put a financial strain on"], ["在一定程度上", "up to a point"], ["長遠來看", "in the long run"]]}, {"label": "Q3 Do you think happiness is good f…", "tone": "neu", "items": [["題目", "Do you think happiness is good for people’s health?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "Definitely. This is mainly because long-term stress can make it hard to sleep well, while happy people tend to recover faster. Happier people are also more likely to stay physically active and stay in touch with friends. For example, when my mum was going through chemotherapy, I tried to keep the atmosphere at home light by bringing back flowers and playing music she liked. However, we shouldn't blame illness on a bad attitude. Plenty of cheerful people get seriously ill, so happiness helps, but it's not a cure.", 1], ["★ 保持身體活動量", "stay physically active"], ["★ 與……保持聯絡", "stay in touch with"], ["★ 這主要是因為……", "This is mainly because…"], ["讓氣氛輕鬆", "keep the atmosphere light"], ["把生病歸咎於心態不好", "blame illness on a bad attitude"]]}, {"label": "Q4 How does a person’s attitude to…", "tone": "neu", "items": [["題目", "How does a person’s attitude to life affect how happy they feel?"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "A lot. Two people can live almost the same life but feel completely different. This is mainly because of how they see events and whether they notice small pleasures. The more people notice small pleasures, the happier they feel. My mum is a good example. Even during chemotherapy, she kept buying cheap little flowers for the dining table. She also put ordinary photos from those months into our family album because, as she said, those days happened too. Still, attitude has its limits, because it can't fully make up for real hardship like poverty or illness.", 1], ["★ 越……就越……", "The more…, the happier…"], ["★ 這主要是因為……", "This is mainly because…"], ["小確幸", "small pleasures"], ["彌補", "make up for"]]}, {"label": "Q5 Can people learn to be happy?", "tone": "neu", "items": [["題目", "Can people learn to be happy?"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "To some extent, yes. Our basic mood partly comes from our genes, but habits make a real difference. By exercising, getting enough sleep and spending time with close friends, people can boost their mental well-being, which makes them happier. Even small habits help. My mum, for example, has always kept flowers at home, even during chemotherapy. In Taiwan, mindfulness classes have also become more popular. However, trying too hard to be happy can backfire, because you start checking your mood all the time.", 1], ["★ 藉由……，人們可以……，這……", "By + V-ing, people can…, which…"], ["★ 睡眠充足", "get enough sleep"], ["★ 促進心理健康", "boost their mental well-being"], ["適得其反", "backfire"]]}, {"label": "Q6 Can periods of unhappiness have…", "tone": "neu", "items": [["題目", "Can periods of unhappiness have positive results for some people?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "Yes, quite often. This is mainly because difficult times make people think again about what really matters, which comfortable times rarely do. For example, when my mum was going through cancer treatment, our whole family's routine was planned around her. Watching her keep going while she was exhausted completely changed how I see strength. It's not about being loud or in control; it's about showing up every day and still being kind. Having said that, I don't think suffering is always good. Some hard times have a lasting negative effect, so growth is a possibility, not a guarantee.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["★ 持久的負面影響", "a lasting negative effect"], ["每天都在、持續出現", "show up every day"], ["是可能，不是保證", "a possibility, not a guarantee"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "被讚揚的時刻", "en": "Part 3 · 抽象概念、心理與情感", "groups": [{"label": "Q1 When should parents give encoura…", "tone": "neu", "items": [["題目", "When should parents give encouragement to their children?"], ["原題（F3-146）・講義修訂", "I think parents should encourage their children most when they are about to give up on something important. This is mainly because children often struggle to keep going when a task gets hard, and a few kind words can help them stay motivated. For example, if a child wants to quit piano after a difficult lesson, encouragement can help them push through. However, parents should also notice when an activity is simply not a good fit. As a result, good encouragement helps children grow without forcing them down the wrong path.", 1], ["★ 難以堅持下去", "struggle to keep going"], ["★ 保持動力", "stay motivated"], ["放棄某事", "give up on something"], ["撐過去", "push through"], ["不適合", "not a good fit"]]}, {"label": "Q2 Why do children need encourageme…", "tone": "neu", "items": [["題目", "Why do children need encouragement?"], ["相近題・可延用（F3-147）・講義修訂", "I think children need encouragement because it builds their confidence. This is mainly because children are still learning, so they make a lot of mistakes and can easily feel like failures. For example, saying 'You worked hard on that' is more useful than 'You're so smart', because it links the result to something the child can do again. As a result, children stay motivated and are more willing to try difficult things.", 1], ["★ 保持動力", "stay motivated"], ["★ 這主要是因為……", "This is mainly because…"], ["建立自信", "build their confidence"], ["願意嘗試困難的事", "be willing to try difficult things"]]}, {"label": "Q3 Do you think it’s possible to en…", "tone": "neu", "items": [["題目", "Do you think it’s possible to encourage children too much?"], ["新撰寫・含個人素材（素材：妹妹）・講義修訂", "Yes, if the encouragement is empty. When children are praised for everything, the praise loses its value. Some children even become reluctant to try difficult tasks, because they don't want to lose the 'smart' label. What works better is honest encouragement about effort. For example, when my sister wanted to drop a statistics course in her first year, I told her the difficulty showed she was learning, not failing, and she stayed. In Taiwan, though, the more common problem has been too much criticism rather than too much praise.", 1], ["★ 不願嘗試困難的事", "be reluctant to try difficult tasks"], ["★ ……而不是……", "… rather than …"], ["誠實的鼓勵", "honest encouragement"], ["失去價值", "lose its value"]]}, {"label": "Q4 How important are positive and n…", "tone": "neu", "items": [["題目", "How important are positive and negative feedback in the way people work?"], ["相近題・可延用（F3-145）・講義修訂", "I think both are very important, but in different ways. Positive feedback helps people stay motivated, because they feel their work is noticed. Negative feedback, on the other hand, shows people what they need to improve. For example, when my manager praised my database project in a team meeting, it made me want to keep working carefully. However, if feedback is only negative, it can have a negative impact on people's confidence. As a result, good managers mention what someone does well before asking for more.", 1], ["★ 保持動力", "stay motivated"], ["★ 對……有負面影響", "have a negative impact on"], ["另一方面", "on the other hand"], ["覺得工作被看見", "feel their work is noticed"]]}, {"label": "Q5 When do people say nice things t…", "tone": "neu", "items": [["題目", "When do people say nice things that they don’t really mean?"], ["新撰寫・含個人素材（素材：朴寶劍）・講義修訂", "Mostly in social situations where honesty would be awkward, like telling a host the meal was delicious. This is mainly because, in Taiwan, being polite and keeping the peace matter a lot, so these white lies are almost expected. People also say nice things to someone when they want a favour. That's why real sincerity stands out. Park Bo-gum, for example, once stayed at a fan signing for four and a half hours and gave each of about 200 fans his full attention. Small polite lies aren't harmful, but if nobody is ever sincere, it becomes hard to recognise real praise.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["善意的謊言", "white lies"], ["維持和氣", "keep the peace"], ["顯得突出", "stand out"], ["全神貫注對待某人", "give someone their full attention"]]}, {"label": "Q6 Why do some people believe posit…", "tone": "neu", "items": [["題目", "Why do some people believe positive comments about themselves more than negative comments?"], ["新撰寫・含個人素材（素材：產品大改版與生日加班）・講義修訂", "It's mainly about protecting self-esteem. Many people are reluctant to accept criticism, because it means admitting a weakness. Praise, on the other hand, matches the image which we'd like to have of ourselves. But negative feedback is often more useful. For example, I once made a coding mistake that nearly caused a problem in production, and it taught me to pay closer attention to detail and double-check everything. Interestingly, people with low self-esteem often do the opposite: they ignore compliments and keep thinking about every criticism.", 1], ["★ 不願接受批評", "be reluctant to accept criticism"], ["自尊心", "self-esteem"], ["更注意細節", "pay closer attention to detail"], ["每件事都再檢查一次", "double-check everything"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "困難的決定", "en": "Part 3 · 抽象概念、心理與情感", "groups": [{"label": "Q1 What kinds of important decision…", "tone": "neu", "items": [["題目", "What kinds of important decisions do young people usually have to make?"], ["自己準備（相近題）・講義修訂", "I think one of the most important decisions is choosing which university to attend and what major to study after high school. If you make the wrong choice, switching majors later can cost a lot of time and money, which can put a financial strain on many families. Also, many teenagers are influenced by their parents' expectations rather than their own interests, so it's not always easy to choose the right path.", 1], ["要讀哪所大學", "which university to attend"], ["轉換主修科系", "switching majors"], ["★ 造成經濟壓力", "put a financial strain on"], ["★ 受……影響而不是……", "be influenced by … rather than …"]]}, {"label": "Q2 Who are the best people to help…", "tone": "neu", "items": [["題目", "Who are the best people to help teenagers make important decisions?"], ["原題（F3-023）・講義修訂", "Ideally, I think parents are the best people, along with teachers who know the student well. This is mainly because they understand the teenager's strengths and can give honest advice. However, if teenagers don't feel safe talking to them, they usually turn to their friends instead, and friends aren't always reliable. For example, my sister asked for my opinion when she was choosing her degree, but in the end she chose finance for her own reasons. As a result, I think good advisers guide teenagers rather than decide for them.", 1], ["★ 了解學生的老師（who 子句）", "teachers who know the student well"], ["★ 這主要是因為……", "This is mainly because…"], ["★ ……而不是……", "… rather than …"], ["求助於", "turn to"]]}, {"label": "Q3 Do you think children of all age…", "tone": "neu", "items": [["題目", "Do you think children of all ages should be allowed to make some decisions on their own?"], ["原題（F3-021）・講義修訂", "Yes, within limits. Children can decide things like who to make friends with, how to spend their free time, or which after-school clubs to join. This is mainly because children learn good judgment by making their own choices. For example, if a child picks a club and doesn't enjoy it, they learn to think more carefully next time. As a result, adults who make every decision for children take away the practice they need to grow up.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["★ 替孩子做所有決定的大人（who 子句）", "adults who make every decision"], ["在一定範圍內", "within limits"], ["學會好的判斷力", "learn good judgment"]]}, {"label": "Q4 In what ways do other young peop…", "tone": "neu", "items": [["題目", "In what ways do other young people influence the decisions teenagers make?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "In almost every way, from what they wear to which subjects they choose. This is mainly because teenagers are at a stage where fitting in feels really important, so their decisions are easily influenced by their friends, sometimes more than by their parents. It isn't always negative, though. For example, my closest friend from my high-school choir was very outgoing. She taught me that you can't hide behind your nerves when you perform. That changed how I approached competitions. So friends can push teenagers to grow, not just copy others.", 1], ["★ 受……影響", "be influenced by"], ["★ 這主要是因為……", "This is mainly because…"], ["融入群體", "fit in"], ["躲在緊張後面", "hide behind your nerves"]]}, {"label": "Q5 How far does advertising influen…", "tone": "neu", "items": [["題目", "How far does advertising influence people’s everyday decisions?"], ["原題（F3-024）・講義修訂", "Quite a lot, I'd say. This is mainly because people are constantly exposed to advertisements on their phones, on the MRT and on TV. Ads don't just sell products; they sell a lifestyle. For example, beauty ads often create unrealistic expectations about how people should look, and online sales encourage unnecessary spending. To be fair, some ads are creative and can spark people's imagination. As a result, knowing how ads work helps, but it doesn't stop us from being influenced by them completely.", 1], ["★ 不斷接觸廣告", "be constantly exposed to advertisements"], ["★ 造成不切實際的期待", "create unrealistic expectations"], ["★ 鼓勵不必要的消費", "encourage unnecessary spending"], ["★ 激發想像力", "spark people's imagination"], ["★ 受……影響", "be influenced by"]]}, {"label": "Q6 Is it hard to make decisions bec…", "tone": "neu", "items": [["題目", "Is it hard to make decisions because there is too much information on the internet?"], ["新撰寫・含個人素材（素材：決定離職、出國念書）・講義修訂", "In some ways, yes. The more options and reviews people see, the more anxious they become about making the wrong choice. This is mainly because of information overload, and some sponsored posts are mixed in with real advice. What helps is having a method. For example, when I decided to leave my job to study abroad, I listed the pros and cons and listened to my parents' views, but I made the final decision myself. On the other hand, the internet has made big decisions, like choosing a university, much easier to research.", 1], ["★ 越……就越……", "The more…, the more…"], ["★ 資訊超載", "information overload"], ["利弊", "pros and cons"], ["做最後決定", "make the final decision"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "幫助你集中注意力的事物", "en": "Part 3 · 抽象概念、心理與情感", "groups": [{"label": "Q1 Why is it important for children…", "tone": "neu", "items": [["題目", "Why is it important for children to learn how to concentrate?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "I think it's very important, because concentration is the base of almost all learning. It also helps children build self-discipline later in life. This matters more than ever now, because children are constantly exposed to short videos which are designed to grab their attention. But children usually focus better when they're interested. For example, when I volunteered as a teacher in Lesotho, one boy refused to take part at all, until I found out he loved drawing and used that to bring him into the lesson. Still, we shouldn't expect young children to sit still for hours.", 1], ["★ 不斷接觸", "be constantly exposed to"], ["自律", "self-discipline"], ["吸引注意力", "grab their attention"], ["把他帶進課堂", "bring him into the lesson"]]}, {"label": "Q2 Why do children have to concentr…", "tone": "neu", "items": [["題目", "Why do children have to concentrate when doing sports?"], ["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "Partly to reduce the risk of injury, because a moment's distraction in football or swimming can easily lead to an accident. But it's also about performance. In top-level badminton, for example, players hit a dozen shots in a few seconds. When my family watched Chou Tien-chen at the Olympics, he saved a match point with a cross-court shot, and we all gasped at the same time. That kind of split-second decision is all about focus. As a result, sport is a great way to teach concentration, because the feedback is immediate: if you lose focus, you miss the shot.", 1], ["★ 降低……的風險", "reduce the risk of"], ["片刻的分心", "a moment's distraction"], ["瞬間的決定", "a split-second decision"], ["賽末點", "match point"]]}, {"label": "Q3 Do you think technology is harmf…", "tone": "neu", "items": [["題目", "Do you think technology is harmful to children’s concentration?"], ["相近題・可延用（延伸討論題 E03）・講義修訂", "Yes, I think too much technology can have a negative impact on children's concentration. This is mainly because many apps and games are designed to keep people using them for as long as possible. For example, short videos only last a few seconds, so children get used to switching quickly from one thing to another. As a result, they may develop a short attention span and struggle to concentrate on longer tasks, like reading a book. However, technology itself isn't the problem. It depends on how much time children spend on it.", 1], ["★ 對……有負面影響", "have a negative impact on"], ["★ 注意力持續時間短", "a short attention span"], ["★ 難以專心", "struggle to concentrate"], ["快速切換", "switch quickly from one thing to another"]]}, {"label": "Q4 Which types of jobs is being abl…", "tone": "neu", "items": [["題目", "Which types of jobs is being able to concentrate particularly important?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "Obviously, jobs where mistakes put lives at risk, like surgeons, pilots or air traffic controllers. But concentration is also very important in office jobs that deal with data, where mistakes are less dramatic but costly and hard to spot. For example, as a data engineer, I once ran a migration across about 1,200 servers. I updated them batch by batch and checked each one in real time, because one small mistake could have caused hidden data errors. As a result, both kinds of jobs need a lot of focus, even though the risks are different.", 1], ["危及生命", "put lives at risk"], ["很難發現", "hard to spot"], ["一批一批地", "batch by batch"], ["即時地", "in real time"]]}, {"label": "Q5 Why do some people find it hard…", "tone": "neu", "items": [["題目", "Why do some people find it hard to concentrate at work?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Constant interruptions are probably the main reason. Open-plan offices, endless notifications and back-to-back meetings mean people rarely get time to focus without being disturbed, which can lead to a decline in productivity. In my case, noise-cancelling headphones help me focus in our open-plan office. I listen to instrumental music when I need to concentrate, and keep it completely quiet when I'm debugging. Personal reasons matter too, such as poor sleep, stress or a heavy workload. To be fair, some of it is our own fault, as many of us check our phones without even thinking.", 1], ["★ 生產力下降", "a decline in productivity"], ["★ 沉重的工作量", "a heavy workload"], ["一個接一個的會議", "back-to-back meetings"], ["降噪耳機", "noise-cancelling headphones"]]}, {"label": "Q6 What can employers do to help th…", "tone": "neu", "items": [["題目", "What can employers do to help their staff concentrate?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Quite a lot, actually. The simplest step is protecting focus time, for example meeting-free mornings, or agreeing that messages don't need an instant reply. By reducing distractions, companies can boost productivity, which benefits everyone. The office space matters too. Our office is open-plan, so I rely on noise-cancelling headphones: instrumental music when I need to concentrate, and silence when I'm debugging. Quiet rooms would help people like me. Above all, though, it's about company culture. If managers expect immediate replies at all hours, no amount of quiet rooms will fix the problem.", 1], ["★ 藉由……，公司可以……，這……", "By + V-ing, companies can…, which…"], ["★ 減少干擾", "reduce distractions"], ["★ 提高生產力", "boost productivity"], ["專注時間", "focus time"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "口說練習：Thank you", "en": "自己準備", "groups": [{"label": "Q1 When are you especially thankful…", "tone": "neu", "items": [["題目", "When are you especially thankful to your parents?"], ["自己準備・講義修訂", "I'm very thankful to my parents, especially when I'm on my own and things get tough. When I feel sick or need comfort, their support means a lot. Even when I'm making important decisions, they never force me to do anything I don't want to do. They give me a lot of freedom, which I really appreciate.", 1], ["獨自一人", "on my own"], ["遇到困難的時候", "things get tough"], ["他們的支持意義重大", "their support means a lot"], ["★ 我很感激這一點（which 子句）", "…, which I really appreciate"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "口說練習：Decisions", "en": "自己準備", "groups": [{"label": "Q1 What difficult choice have you m…", "tone": "neu", "items": [["題目", "What difficult choice have you made recently?"], ["自己準備・講義修訂", "One difficult choice I've made recently is deciding to leave a job which I've had for three years. I've learned so much and gained valuable experience there. It's hard to walk away because this job has been such a big part of my life.", 1], ["★ 做了三年的工作（which 子句）", "a job which I've had for three years"], ["★ 獲得寶貴經驗", "gain valuable experience"], ["離開、放下", "walk away"], ["我生活中很重要的一部分", "such a big part of my life"]]}, {"label": "Q2 How do you make important decisi…", "tone": "neu", "items": [["題目", "How do you make important decisions?"], ["自己準備", "When I'm making an important decision, I first list all the pros and cons. If I'm still unsure, I'll talk it through with friends or my parents to hear their perspectives. But in the end, I make the final decision myself. It's important not to let others decide for me.", 1], ["列出所有優缺點", "list all the pros and cons"], ["好好討論一番", "talk it through"], ["聽聽他們的看法", "hear their perspectives"], ["做最後決定", "make the final decision"]]}, {"label": "Q3 What life-changing decision have…", "tone": "neu", "items": [["題目", "What life-changing decision have you made?"], ["自己準備・講義修訂", "One life-changing decision I've made is choosing to study abroad, which means leaving my job. For a long time, studying overseas felt like an impossible dream. But after weighing the pros and cons, I made a carefully considered decision to step outside my comfort zone and take that step.", 1], ["改變人生的決定", "life-changing decision"], ["遙不可及的夢想", "an impossible dream"], ["權衡利弊", "weigh the pros and cons"], ["★ 走出舒適圈", "step outside my comfort zone"]]}, {"label": "Q4 What factors do you consider whe…", "tone": "neu", "items": [["題目", "What factors do you consider when making important decisions?"], ["自己準備・講義修訂", "When I make big decisions, I first think about how they'll affect me, especially in the long run. For example, studying abroad could put a financial strain on me and my family, and I might even need to borrow money. But if the long-term benefits outweigh the short-term costs, I'll go for it.", 1], ["長遠來看", "in the long run"], ["★ 造成經濟壓力", "put a financial strain on"], ["長期效益大於短期成本", "the long-term benefits outweigh the short-term costs"], ["放手去做", "go for it"]]}, {"label": "Q5 What do you do when you make a w…", "tone": "neu", "items": [["題目", "What do you do when you make a wrong decision?"], ["自己準備", "When I realize I've made a wrong decision, the first thing I do is admit that I was wrong and stop going down that path. If it affected someone else, I'll apologize. Then I try to learn from it, face the issue, and make sure it doesn't happen again. It's important not to just let it slide.", 1], ["不再繼續錯下去", "stop going down that path"], ["從中學習", "learn from it"], ["正視問題", "face the issue"], ["放任不管", "let it slide"]]}, {"label": "Q6 Do you prefer making decisions q…", "tone": "neu", "items": [["題目", "Do you prefer making decisions quickly or taking your time?"], ["自己準備", "Given the choice, I prefer to take my time. I like to think through the long-term impact, check the details, and compare the advantages and disadvantages carefully. Rushing makes me anxious, so taking time helps me feel confident that nothing important gets overlooked.", 1], ["如果可以選擇", "given the choice"], ["仔細思考長遠影響", "think through the long-term impact"], ["讓我焦慮", "make me anxious"], ["被忽略", "get overlooked"]]}, {"label": "Q7 Do young people and older people…", "tone": "neu", "items": [["題目", "Do young people and older people make decisions differently?"], ["自己準備", "I think older people often have more life experience to draw on when making decisions. They can look back on what worked and what didn't in the past. Younger people may not have as much experience, so they often have to learn through trial and error and sometimes from their own mistakes.", 1], ["可以借鏡的人生經驗", "life experience to draw on"], ["回顧", "look back on"], ["哪些可行、哪些不可行", "what worked and what didn't"], ["從嘗試錯誤中學習", "learn through trial and error"]]}, {"label": "Q8 Have you ever regretted a decisi…", "tone": "neu", "items": [["題目", "Have you ever regretted a decision you made?"], ["自己準備・講義修訂", "Yes, definitely. I sometimes look back on situations and wish I'd handled them differently. For example, after an argument, I may regret my choice of words. At work, I've also made mistakes when changing code, which could have caused production issues. Those experiences remind me to double-check my work and learn from my mistakes.", 1], ["希望當初換個方式處理", "wish I'd handled them differently"], ["後悔自己的措辭", "regret my choice of words"], ["★ 這可能造成正式環境問題（which 子句）", "…, which could have caused production issues"], ["再三檢查自己的工作", "double-check my work"]]}, {"label": "Q9 Do you think older people are be…", "tone": "neu", "items": [["題目", "Do you think older people are better at making decisions than younger people?"], ["自己準備", "Not necessarily. It depends on the individual. Older people may have more experience, but that doesn't automatically make them better decision-makers. They might overthink things because they have more factors to consider. Younger people may be more willing to try new things and less afraid of failure, so they can sometimes be more decisive.", 1], ["不見得就讓他們成為", "doesn't automatically make them"], ["想太多", "overthink things"], ["比較不怕失敗", "less afraid of failure"], ["更果斷", "more decisive"]]}, {"label": "Q10 Why do some people find it diffi…", "tone": "neu", "items": [["題目", "Why do some people find it difficult to make decisions?"], ["自己準備・講義修訂", "I think many people are afraid of making the wrong choice. They worry that failure could waste their time or lead to financial losses. Some also care a lot about what others think and fear being judged if they make a mistake. As a result, they overthink possible outcomes and struggle to make up their minds.", 1], ["★ 害怕做錯選擇", "be afraid of making the wrong choice"], ["導致金錢損失", "lead to financial losses"], ["害怕被批評", "fear being judged"], ["★ 難以下定決心", "struggle to make up their minds"]]}, {"label": "Q11 Why do people sometimes regret t…", "tone": "neu", "items": [["題目", "Why do people sometimes regret their decisions?"], ["自己準備", "People often look back on mistakes and wish they had handled things differently. If their decision hurt someone, they might feel guilty when they see that person's disappointment. They may also feel embarrassed and keep replaying the situation in their minds, wondering what they could have done differently.", 1], ["希望當初換個方式處理", "wish they had handled things differently"], ["感到內疚", "feel guilty"], ["腦中不斷重播那個情境", "keep replaying the situation in their minds"]]}, {"label": "Q12 Do you think making mistakes hel…", "tone": "neu", "items": [["題目", "Do you think making mistakes helps people make better decisions in the future?"], ["自己準備・講義修訂", "Yes, definitely. Mistakes can teach people lessons they remember and help them understand what to consider next time. For example, as a data engineer, I've run into problems while writing code, and those experiences taught me to pay closer attention to details and double-check changes. Learning through trial and error can improve people's judgment and help them avoid making the same mistakes again.", 1], ["給人教訓", "teach people lessons"], ["更注意細節", "pay closer attention to details"], ["從嘗試錯誤中學習", "learn through trial and error"], ["提升判斷力", "improve people's judgment"]]}, {"label": "Q13 Do you think people should alway…", "tone": "neu", "items": [["題目", "Do you think people should always stick to their decisions, even when things become difficult?"], ["自己準備・講義修訂", "It depends on how serious the difficulties are. If it's a minor setback, people should keep pushing forward, because challenges are a normal part of pursuing a goal and can help them grow. But unexpected things can come up. If the plan is no longer realistic, it's better to reassess the situation and change direction rather than stick to their original plan without thinking.", 1], ["小挫折", "a minor setback"], ["持續前進", "keep pushing forward"], ["★ 意外狀況可能會發生", "unexpected things can come up"], ["★ 堅持原本的計畫", "stick to their original plan"], ["重新評估情況", "reassess the situation"]]}, {"label": "Q14 Do you think people make better…", "tone": "neu", "items": [["題目", "Do you think people make better decisions when they are under pressure?"], ["自己準備・講義修訂", "It depends on how well someone handles pressure. For people who are sensitive to stress, too much pressure makes it hard to think clearly, and they may need time to calm down. Others are better at handling stress and find that pressure helps them focus and decide quickly. So pressure can either motivate people or hold them back.", 1], ["應對壓力", "handle pressure"], ["★ 對壓力敏感的人（who 子句）", "people who are sensitive to stress"], ["清楚思考", "think clearly"], ["拖累他們", "hold them back"]]}, {"label": "Q15 Do you think emotions influence…", "tone": "neu", "items": [["題目", "Do you think emotions influence the decisions people make?"], ["自己準備・講義修訂", "Definitely. When people are angry, they may act without thinking things through and later regret their actions. When they're sad, they may focus too much on the negative side of things. In a better mood, they may approach situations more calmly and positively, which can help them make more balanced decisions.", 1], ["把事情想清楚", "think things through"], ["後悔自己的行為", "regret their actions"], ["事情的負面", "the negative side of things"], ["★ 這能幫他們做出更平衡的決定（which 子句）", "…, which can help them make more balanced decisions"]]}, {"label": "Q16 Do you think people should make…", "tone": "neu", "items": [["題目", "Do you think people should make decisions based on logic or emotions?"], ["自己準備", "It depends on the situation. Emotions are subjective and can change quickly, but in personal relationships it's important to consider feelings. During an argument, both sides should calm down before communicating. At work, logical thinking should take priority: I need to analyze technical problems, compare possible solutions, and find the most efficient approach. I think the key is balancing both.", 1], ["情緒是主觀的", "Emotions are subjective"], ["應以邏輯思考為優先", "logical thinking should take priority"], ["最有效率的方法", "the most efficient approach"], ["關鍵在於兩者兼顧", "the key is balancing both"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "Spare time", "en": "自己準備", "groups": [{"label": "Q1 Do you prefer spending your free…", "tone": "neu", "items": [["題目", "Do you prefer spending your free time alone or with other people?"], ["自己準備", "It depends on what I’m doing. I usually enjoy time alone because I can go at my own pace. But for trips abroad or special outings, I’d rather go with friends because sharing the experience makes it more enjoyable.", 1], ["按照自己的步調", "go at my own pace"], ["出國旅行", "trips abroad"], ["特別的出遊", "special outings"], ["分享經驗", "share the experience"]]}, {"label": "Q2 Do you think having free time is…", "tone": "neu", "items": [["題目", "Do you think having free time is important?"], ["自己準備", "Yes, because everyone needs time to relax and recover from work or study. Without a break, it’s hard to keep your energy up. Having free time also allows people to do things they enjoy, which helps them feel more balanced.", 1], ["從工作中恢復", "recover from work"], ["保持精力", "keep your energy up"], ["★ 這讓他們感覺更平衡（which 子句）", "…, which helps them feel more balanced"]]}, {"label": "Q3 Do you think people have enough…", "tone": "neu", "items": [["題目", "Do you think people have enough free time nowadays?"], ["自己準備", "It depends on their work and responsibilities. Some people work long hours and have very little time left for themselves. Others have free time but spend much of it scrolling through their phones. So both the amount of time and how it’s used matter.", 1], ["責任、要負擔的事", "responsibilities"], ["工時很長", "work long hours"], ["留給自己的時間", "time left for themselves"], ["滑手機", "scroll through their phones"]]}, {"label": "Q4 Do you prefer to plan your free…", "tone": "neu", "items": [["題目", "Do you prefer to plan your free time or be spontaneous?"], ["自己準備", "I prefer to be spontaneous. I might have a few ideas, like shopping or trying a restaurant, but I don’t like a strict schedule. Free time feels more relaxing when I can decide what to do as I go.", 1], ["隨興", "be spontaneous"], ["嚴格的行程", "a strict schedule"], ["邊走邊決定", "decide as I go"]]}, {"label": "Q5 What do people in your country u…", "tone": "neu", "items": [["題目", "What do people in your country usually do in their free time?"], ["自己準備", "In Taiwan, visiting night markets is a popular choice because people can try different kinds of street food. Hiking with friends is another option. It gives people a chance to get some exercise and catch up at the same time.", 1], ["熱門選擇", "a popular choice"], ["小吃、街頭美食", "street food"], ["運動一下", "get some exercise"], ["敘舊、聊近況", "catch up"]]}, {"label": "Q6 Do you think people's leisure ac…", "tone": "neu", "items": [["題目", "Do you think people's leisure activities have changed compared to the past?"], ["自己準備", "Yes. In the past, people often met in person to play sports or have a picnic. Now they can also play games together online or watch videos at home. Technology has given people more options, although outdoor activities are still popular.", 1], ["親自見面", "meet in person"], ["野餐", "have a picnic"], ["更多選擇", "more options"], ["戶外活動", "outdoor activities"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "Sitting", "en": "自己準備", "groups": [{"label": "Q1 Do you prefer to sit or stand wh…", "tone": "neu", "items": [["題目", "Do you prefer to sit or stand when you are working?"], ["自己準備", "I prefer sitting because I’m an engineer and spend a lot of time typing. It’s easier to concentrate at a desk, although I try to get up regularly. If there’s a standing desk available, I sometimes use it to change position.", 1], ["在桌前專心", "concentrate at a desk"], ["定時起身", "get up regularly"], ["站立式辦公桌", "a standing desk"], ["換個姿勢", "change position"]]}, {"label": "Q2 Do you often sit for long period…", "tone": "neu", "items": [["題目", "Do you often sit for long periods of time?"], ["自己準備", "Yes, I spend most of my eight-hour working day at a computer. That’s why I try to stand on the MRT, even when seats are available. It gives me a small break from sitting.", 1], ["八小時的工作日", "an eight-hour working day"], ["有空位", "seats are available"], ["從久坐中稍作休息", "a small break from sitting"]]}, {"label": "Q3 What do you usually do when you…", "tone": "neu", "items": [["題目", "What do you usually do when you have been sitting for too long?"], ["自己準備", "I usually get up and walk around for a few minutes. Sometimes I'll refill my water bottle or go to the restroom, just to give myself a short break. I also like doing some simple stretches, especially for my calves, because my legs can feel quite stiff after sitting for hours.", 1], ["裝水", "refill my water bottle"], ["讓自己稍微休息一下", "give myself a short break"], ["簡單的伸展", "simple stretches"], ["感覺相當僵硬", "feel quite stiff"]]}, {"label": "Q4 Do you think people nowadays spe…", "tone": "neu", "items": [["題目", "Do you think people nowadays spend too much time sitting?"], ["自己準備", "It depends on their job and lifestyle. Office workers tend to sit for hours, while people in shops or restaurants may spend most of the day standing. So it’s a common issue for some groups, rather than everyone.", 1], ["一坐就是好幾個小時", "sit for hours"], ["常見的問題", "a common issue"], ["★ ……而不是所有人", "…, rather than everyone"]]}, {"label": "Q5 Where do you usually like to sit…", "tone": "neu", "items": [["題目", "Where do you usually like to sit when you want to relax?"], ["自己準備", "My favourite place is definitely the sofa at home. It has soft cushions and provides good support for my back, so I can sit comfortably without feeling any strain. I love settling into the sofa after a long day at work, especially when I just want to unwind and watch something entertaining.", 1], ["給背部良好的支撐", "provides good support for my back"], ["不會感到任何負擔", "without feeling any strain"], ["窩進沙發", "settle into the sofa"], ["工作一整天之後", "after a long day at work"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "S01 South Africa Volunteer", "en": "Experience / Giving Back", "groups": [{"label": "Situation", "tone": "neu", "items": [["高中十七歲那年，我透過學校社團申請並獲選，到賴索托（位於南非境內的小國）擔任兩週的國際志工，教當地國中生數學、中文和基礎電腦技能——Word、Google、Excel。", "High school, age 17. Through a school club I applied and was selected to go to Lesotho (a small country inside South Africa) for two weeks as an international volunteer. I taught maths, Chinese and basic computer skills – Word, Google, Excel – to local middle-school students.", 1]]}, {"label": "Task", "tone": "neu", "items": [["讓幾乎沒接觸過正規教育的學生願意投入課堂，讓學習變得安心又有趣。", "Engage students who had little exposure to structured education and make learning feel safe and enjoyable.", 1]]}, {"label": "Action", "tone": "neu", "items": [["1) 我先用簡單的遊戲和歌曲來破冰。2) 有個男孩特別抗拒每一堂課，坐在最後面、拒絕參與——我花額外的時間一對一陪他，發現他很愛畫畫，就用這一點把他帶進課堂。3) 到了最後一週，他會提早來上課，最後一天還畫了一張畫送我。", "1) I started with simple games and songs to break the ice. 2) One boy in particular resisted every class, sat at the back, and refused to participate – I spent extra time with him one-on-one, found he loved drawing, and used that to bring him into the lesson. 3) By the last week he was coming early to class and drew me a picture on the final day.", 1]]}, {"label": "Result", "tone": "neu", "items": [["最後一天道別時，很多學生都哭了。那個原本拒絕參與的男孩送了我一張畫，一直揮手到我們的巴士消失在視線裡。回家時，我對「影響力」的意義有了完全不同的理解。", "On the last day many students cried at the farewell. The boy who had refused to engage gave me a drawing and waved until our bus disappeared. I returned home with a completely different understanding of what 'impact' means.", 1]]}, {"label": "Reflection", "tone": "neu", "items": [["這讓我明白，連結比內容更重要。在眼前的人覺得自己被看見之前，任何課程都不會真正被吸收。我把這個體悟帶進了職涯——好的資料基礎建設關乎依賴它的人，而不只是程式碼。", "It taught me that connection comes before content. No lesson lands until the person in front of you feels seen. I carried this into my career – good data infrastructure is about the people who depend on it, not just the code.", 1]]}, {"label": "60 秒關鍵字", "tone": "neu", "items": [["", "Lesotho | reluctant boy | drawing | farewell tears | connection before content | two weeks"]]}, {"label": "9–12 月可套用題目", "tone": "neu", "items": [["", "幫助小孩（MAP-025）、困難的決定（MAP-006）、教別人的技能"]]}, {"label": "Band 8 用語", "tone": "pos", "items": [["破冰", "break the ice"], ["一對一", "one-on-one"], ["先建立連結，再談內容", "connection comes before content"], ["覺得被看見", "feel seen"]]}, {"label": "實用片語", "tone": "pos", "items": [["破冰；打破僵局", "break the ice"], ["連結比內容更重要", "connection comes before content"], ["多付出一點；格外用心", "go the extra mile"], ["引導某人敞開心房", "draw someone out of their shell"], ["從對方的程度與需要出發", "meet people where they are"], ["讓某人覺得被看見、被重視", "make someone feel seen"], ["在…心中留下深刻印象", "leave a lasting impression on"], ["重新定義影響力的意義", "redefine what impact means"]]}, {"label": "單字", "tone": "pos", "items": [["不投入的；疏離的", "disengaged"], ["融洽的關係；默契", "rapport"], ["不情願的；勉強的", "reluctant"], ["突破", "breakthrough"], ["同理心", "empathy"], ["帶來轉變的", "transformative"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我十七歲時，在賴索托當了兩週志工，教當地國中生數學、中文和基礎電腦技能。", "When I was seventeen, I spent two weeks volunteering in Lesotho, teaching maths, Chinese and basic computer skills to local middle-school students.", 1], ["有個男孩一直拒絕參與，但我發現他很愛畫畫之後，就用這點慢慢把他帶進課堂。", "There was one boy who refused to join in, but once I discovered he loved drawing, I used that to gradually bring him into the lesson.", 1], ["最後一天他送我一張畫，一直揮手到我們的巴士消失，老實說，那個畫面我到現在都忘不了。", "On the final day he gave me a drawing and kept waving until our bus disappeared, and honestly, that image has stayed with me ever since.", 1], ["我學到最重要的一課是：連結比內容更重要；在眼前的人覺得被看見之前，任何課程都不會真正被吸收。", "The biggest lesson I took away was that connection comes before content; no lesson really lands until the person in front of you feels seen.", 1]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "S02 Mum's Cancer & Courage", "en": "Family / Resilience", "groups": [{"label": "Situation", "tone": "neu", "items": [["幾年前，我媽媽被診斷出癌症，開始接受化療。全家人的作息都跟著她的療程改變。當時我在全職工作，但會盡可能回家。", "A few years ago my mum was diagnosed with cancer and began chemotherapy. The whole family's routine changed around her treatment schedule. I was working full-time but came home as much as possible.", 1]]}, {"label": "Task", "tone": "neu", "items": [["在媽媽經歷一輪又一輪讓她筋疲力盡的療程時，陪在她身邊，並讓家裡的氣氛保持穩定。", "Stay present and keep the family atmosphere stable while mum went through treatment cycles that left her exhausted.", 1]]}, {"label": "Action", "tone": "neu", "items": [["1) 治療日的晚餐由我接手，讓她可以好好休息。2) 我讓日常對話保持輕鬆正向——帶花回家、放她喜歡的音樂。3) 她掉頭髮的時候，我坐在她身邊，告訴她她看起來很勇敢，而不是變得不一樣。", "1) I took over evening meals on treatment days so she could rest. 2) I kept daily conversation light and positive – brought flowers home, put on music she liked. 3) When she lost her hair I sat with her and told her she looked brave, not different.", 1]]}, {"label": "Result", "tone": "neu", "items": [["她完成了所有療程。確定康復的那天，我們一起去河濱野餐——我們的狗、全家人、陽光。那是我人生中最快樂的一個平凡午後。", "She completed all treatment cycles. The day she got the all-clear we went for a riverside picnic together – our dog, the whole family, sunshine. It was the happiest ordinary afternoon of my life.", 1]]}, {"label": "Reflection", "tone": "neu", "items": [["她的韌性改變了我對堅強的定義。堅強不是大聲或掌控一切——而是即使筋疲力盡，仍然每天出現，並且依然選擇溫柔待人。我現在也努力這樣生活。", "Her resilience changed how I define strength. Strength isn't loudness or control – it's showing up every day when you're exhausted and still choosing to be kind. I try to live that now.", 1]]}, {"label": "60 秒關鍵字", "tone": "neu", "items": [["", "Diagnosis | chemo cycles | flowers & music | all-clear | riverside picnic | ordinary happiness", 1]]}, {"label": "9–12 月可套用題目", "tone": "neu", "items": [["", "令你驚喜而又開心的事物、忙碌的時刻、交通擁堵的時刻（MAP-041）"]]}, {"label": "Band 8 用語", "tone": "pos", "items": [["被診斷出", "be diagnosed with"], ["療程", "treatment cycles"], ["陪在身邊", "stay present"], ["韌性", "resilience"], ["檢查結果無異狀", "the all-clear"]]}, {"label": "實用片語", "tone": "pos", "items": [["被診斷出（某疾病）", "be diagnosed with"], ["以…為中心運轉", "revolve around"], ["陪伴、支持某人", "be there for someone"], ["接手（某項責任）", "take over (a responsibility)"], ["讓氣氛保持輕鬆", "keep things light"], ["得到完全康復的確認", "get the all-clear"], ["日復一日地出現、堅持", "show up day after day"], ["重新定義堅強的意義", "redefine what strength means"]]}, {"label": "單字", "tone": "pos", "items": [["韌性；復原力", "resilience"], ["堅毅；剛毅", "fortitude"], ["折磨人的；累人的", "gruelling"], ["沉著；鎮定", "composure"], ["堅定不移的", "unwavering"], ["化療", "chemotherapy"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["幾年前我媽媽被診斷出癌症，全家的作息突然都繞著她的化療時程轉。", "A few years ago my mum was diagnosed with cancer, and our whole family's routine suddenly revolved around her chemotherapy schedule.", 1], ["治療日由我接手煮晚餐讓她休息，我也努力讓家裡的氣氛保持輕鬆正向。", "On treatment days I took over cooking dinner so she could rest, and I tried to keep the atmosphere at home light and positive.", 1], ["她掉頭髮時，我坐在她身邊告訴她，她看起來很勇敢，不是變得不一樣，而且每個字都是真心的。", "When she lost her hair, I sat with her and told her she looked brave, not different, and I meant every word.", 1], ["看著她讓我明白，堅強不是大聲或掌控一切，而是每天都出現，並且依然選擇善良。", "Watching her taught me that strength isn't about being loud or in control; it's about showing up every day and still choosing kindness.", 1]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "S03 Database Schema Standardisation", "en": "Career / Problem Solving", "groups": [{"label": "Situation", "tone": "neu", "items": [["在我的資料工程工作中，我們有一個產品的資料庫結構（schema）隨著時間在大約 1,200 台伺服器上逐漸出現偏差。不同伺服器上的欄位名稱、資料型別和結構都略有不同，造成不易察覺的資料錯誤，也讓分析結果變得不可靠。", "At my data engineering job we had a product whose database schema had drifted across roughly 1,200 servers over time. Different servers held slightly different column names, data types, and structures, which caused silent data errors and made analytics unreliable.", 1]]}, {"label": "Task", "tone": "neu", "items": [["設計並執行一次遷移，在不中斷正式環境服務的前提下，把全公司的 schema 標準化。", "Design and execute a migration that standardised the schema company-wide without taking down production services.", 1]]}, {"label": "Action", "tone": "neu", "items": [["1) 我盤點了每一台伺服器上所有的 schema 變體，並依類型和嚴重程度把偏差分類。2) 我寫了可以逐台伺服器部署的遷移腳本，只要任何檢查失敗就會自動回滾。3) 我和維運團隊協調，把部署排在低流量時段，並即時監控每一個批次。", "1) I mapped all schema variants across every server and categorised the drift by type and severity. 2) I wrote migration scripts that could be rolled out server-by-server with automatic rollback if any check failed. 3) I coordinated with the operations team to schedule rollouts during low-traffic windows and monitored each batch in real time.", 1]]}, {"label": "Result", "tone": "neu", "items": [["全部 1,200 台伺服器都統一成一致的 schema，正式環境零停機。分析的準確度大幅提升，值班團隊也回報資料相關事故明顯減少。", "All 1,200 servers converged to one consistent schema with zero production downtime. Analytics accuracy improved significantly and the on-call team reported a measurable drop in data-related incidents.", 1]]}, {"label": "Reflection", "tone": "neu", "items": [["複雜的問題很少有單一的聰明解法——它們需要有條理的盤點、安全的漸進步驟，以及持續的溝通。我學會了相信流程，而不是靠小聰明。", "Complex problems rarely have a single clever solution – they require methodical mapping, safe incremental steps, and constant communication. I learned to trust process over cleverness.", 1]]}, {"label": "60 秒關鍵字", "tone": "neu", "items": [["", "1,200 servers | schema drift | migration scripts | rollback | zero downtime | methodical process", 1]]}, {"label": "9–12 月可套用題目", "tone": "neu", "items": [["", "忙碌的時刻、被讚揚的時刻、制定過的目標"]]}, {"label": "Band 8 用語", "tone": "pos", "items": [["結構逐漸不一致", "schema drift"], ["自動回滾", "automatic rollback"], ["低流量時段", "low-traffic windows"], ["零停機", "zero downtime"], ["相信流程勝過小聰明", "trust process over cleverness"]]}, {"label": "實用片語", "tone": "pos", "items": [["隨著時間逐漸偏移", "drift over time"], ["被忽略、沒被發現", "slip through the cracks"], ["依類型和嚴重程度分類", "categorise by type and severity"], ["逐步推出、分批上線", "roll out incrementally"], ["內建的安全網", "a built-in safety net"], ["讓所有人隨時掌握狀況", "keep everyone in the loop"], ["零停機地", "with zero downtime"], ["相信流程勝過小聰明", "trust process over cleverness"]]}, {"label": "單字", "tone": "pos", "items": [["有條理的；按部就班的", "methodical"], ["漸進的；逐步的", "incremental"], ["回滾；還原", "rollback"], ["不一致", "inconsistency"], ["收斂；匯聚成一致", "converge"], ["一絲不苟的", "meticulous"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["在工作上，我主導了一次遷移，把大約 1,200 台伺服器的資料庫結構標準化，而且正式環境完全沒有停機。", "At work I led a migration that standardised the database schema across roughly 1,200 servers, and we managed it with zero production downtime.", 1], ["棘手的是，這些偏差造成不易察覺的資料錯誤，在沒有明顯警訊的情況下悄悄讓分析變得不可靠。", "The tricky part was that the drift caused silent data errors, which quietly made our analytics unreliable without anyone getting an obvious warning.", 1], ["我寫的腳本會逐台伺服器部署，任何檢查失敗就自動回滾，所以單一錯誤永遠不會擴散。", "I wrote scripts that rolled out server by server, with automatic rollback if any check failed, so a single mistake could never spread.", 1], ["那個專案讓我明白，複雜的問題很少有單一的聰明解法；它們需要仔細盤點、小而安全的步驟，以及持續的溝通。", "That project taught me that complex problems rarely have one clever fix; they need careful mapping, small safe steps and constant communication.", 1]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "S04 Sunset Picnic by the River", "en": "Family / Gratitude", "groups": [{"label": "Situation", "tone": "neu", "items": [["媽媽做完最後一次化療、確定康復後，那是她第一次覺得身體夠有力氣、可以好好出門的日子。我們沒有特別計畫什麼——只是打包了食物、帶上我們的狗，就去了河濱公園。", "After mum finished her last chemotherapy session and received the all-clear, it was the first day she felt strong enough to go outside properly. We hadn't planned anything special – just packed food, brought our dog, and went to the riverside park.", 1]]}, {"label": "Task", "tone": "neu", "items": [["單純地待在一起，在好幾個月往返醫院之後，給媽媽一個平凡又快樂的午後。", "Simply be together and give mum a normal, joyful afternoon after months of hospital visits.", 1]]}, {"label": "Action", "tone": "neu", "items": [["1) 我們在水邊鋪了一條毯子，拿出在附近市場買的食物。2) 我們的狗在我們和河邊之間跑來跑去，開心得不得了。3) 我們聊些不重要的事——以後的旅行、食物、好笑的回憶——太陽慢慢西沉，光線變成了金黃色。", "1) We spread a blanket by the water and unpacked food from the nearby market. 2) Oakley ran between us and the river, completely joyful. 3) We talked about nothing important – future trips, food, funny memories – as the sun moved lower and the light turned golden.", 1]]}, {"label": "Result", "tone": "neu", "items": [["當河面上的天空變成橘金色，一切彷彿從內而外發著光。沒有人說什麼深刻的話，但我想我們都懂：這就是我們一直在等的。就只是這樣。", "As the sky turned orange-gold over the river, everything felt lit from within. Nobody said anything profound, but I think we all understood: this is what we were waiting for. Just this.", 1]]}, {"label": "Reflection", "tone": "neu", "items": [["最珍貴的時刻很少是計畫出來的。看著媽媽與病魔奮戰之後，河邊一個簡單的午後成了我最重要的回憶之一。它幾乎沒花什麼錢，卻意義非凡。", "The most valuable moments are rarely the ones you plan. After watching mum fight through illness, a simple afternoon by the river became one of the most important memories I own. It cost almost nothing and meant everything.", 1]]}, {"label": "60 秒關鍵字", "tone": "neu", "items": [["", "Riverside | golden light | dog running | ordinary afternoon | after illness | presence over plans", 1]]}, {"label": "9–12 月可套用題目", "tone": "neu", "items": [["", "經濟實惠的外出（MAP-042）、國內重要水域（MAP-032）、天空中有趣的事物、安靜的地方、慶祝重要事件"]]}, {"label": "Band 8 用語", "tone": "pos", "items": [["鋪上野餐墊", "spread a blanket"], ["由內而外發光", "lit from within"], ["深刻的", "profound"], ["活在當下勝過計畫", "presence over plans"]]}, {"label": "實用片語", "tone": "pos", "items": [["臨時起意地", "on the spur of the moment"], ["回歸日常的感覺", "a sense of normality"], ["隨意閒聊", "talk about nothing in particular"], ["沐浴在金黃色的光線中", "bathed in golden light"], ["細細品味當下", "savour the moment"], ["期待已久的時刻", "a long-awaited moment"], ["深深刻在我的記憶裡", "be etched in my memory"], ["幾乎不花錢卻意義非凡", "cost almost nothing but mean everything"]]}, {"label": "單字", "tone": "pos", "items": [["寧靜的；安詳的", "serene"], ["從容不迫的", "unhurried"], ["發光的；明亮的", "luminous"], ["無憂無慮的", "carefree"], ["珍視的；珍愛的", "cherished"], ["深刻的", "profound"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["媽媽確定康復後，我們只是打包了一些食物、帶上狗，沒什麼計畫就去了河濱公園。", "After mum got the all-clear, we simply packed some food, brought our dog and headed to the riverside park without any real plan.", 1], ["我們在水邊鋪了毯子，聊以後的旅行、食物和好笑的回憶，狗狗則開心地跑來跑去。", "We spread a blanket by the water and chatted about future trips, food and funny memories while our dog dashed happily back and forth.", 1], ["當河面上的天空變成橘金色，沒有人說什麼深刻的話，但我想我們都懂，這就是我們一直在等的。", "As the sky turned orange-gold over the river, nobody said anything profound, but I think we all understood this was what we'd been waiting for.", 1], ["這讓我明白，最珍貴的時刻很少是計畫出來的；那個午後幾乎沒花什麼錢，卻是我最珍惜的回憶之一。", "It taught me that the most valuable moments are rarely planned; that afternoon cost almost nothing, yet it's one of the memories I treasure most.", 1]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "個人基本資料", "en": "素材", "groups": [{"label": "細節", "tone": "neu", "items": [["住台北內湖（東區），從小在這裡長大；喜歡它兼具都市便利與自然（科技園區、步道、河濱公園）。缺點是尖峰時段塞車、機車多。", "I was born and raised in Neihu, in eastern Taipei. I love that it combines city convenience with nature – the tech park, hiking trails and riverside parks – although the downside is rush-hour traffic and the sheer number of scooters.", 1], ["資料工程師，任職電信與數據分析公司，處理大規模位置資料；COVID 期間資料用於疫調。大學讀資工（演算法、資料結構）。", "I'm a data engineer at a telecom and data analytics company, where I work with large-scale location data; during COVID, our data was used for contact tracing. At university I studied computer science, including algorithms and data structures.", 1], ["家人：爸媽、妹妹（讀金融）、一隻狗（公的喜樂蒂，叫 Oakley）。早上多半是狗跳上床叫醒你。", "My family is my parents, my younger sister, who studies finance, and our dog, Oakley, a male Shetland Sheepdog. Most mornings, it's the dog jumping onto my bed that wakes me up.", 1], ["休閒：傍晚去中山區逛精品小店與獨立咖啡店、帶狗去河濱公園、看 YouTube 歷史影片、聽音樂。", "In my free time I like wandering around the boutique shops and independent cafés in Zhongshan in the early evening, taking my dog to the riverside park, watching history videos on YouTube and listening to music.", 1], ["喜歡的東西：羽球（周天成）、SpaceX、古希臘（想去雅典衛城）、山勝過海、紙本書（The Secret）。", "Things I love include badminton – I'm a big fan of Chou Tien-chen – SpaceX, ancient Greece (I'd love to visit the Acropolis in Athens), the mountains more than the sea, and physical books, such as The Secret.", 1], ["理想居住地：步調慢但機能好的城市，國內台南、國外京都。", "My ideal place to live would be a slower-paced city that still has good amenities – Tainan if I stayed in Taiwan, or Kyoto abroad.", 1], ["大學在桃園念：學校不大，但有很多漂亮的設計建築，因為設計系很強。", "I went to university in Taoyuan. The campus isn’t very big, but it has lots of beautifully designed buildings, because the university has a really strong design department.", 1]]}, {"label": "金句", "tone": "neu", "items": [["我喜歡同時擁有都市便利與大自然的地方——這就是為什麼內湖一直讓我有家的感覺。", "I love a place that gives me city convenience and nature at the same time – that's why Neihu has always felt like home.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["土生土長", "born and raised"], ["兩全其美", "the best of both worlds"], ["尖峰時段的壅塞", "rush-hour congestion"], ["下班後放鬆", "unwind after work"], ["一頭栽進去、欲罷不能", "go down a rabbit hole"], ["對…情有獨鍾", "have a soft spot for"], ["較慢的生活步調", "a slower pace of life"], ["生活機能就在家門口", "have everything on your doorstep"]]}, {"label": "單字", "tone": "pos", "items": [["生活機能；便利設施", "amenities"], ["熙熙攘攘的", "bustling"], ["壅塞；塞車", "congestion"], ["悠閒的", "leisurely"], ["悠閒隨性的", "laid-back"], ["有觸感的", "tactile"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我在內湖土生土長，我很喜歡這裡，因為它兩全其美：既有都市的便利，又有很多自然環境。", "I was born and raised in Neihu, and I love it because it gives me the best of both worlds: city convenience and plenty of nature.", 1], ["我是處理大規模位置資料的資料工程師，COVID 期間我們的資料其實被用來協助疫調。", "I work as a data engineer handling large-scale location data, and during COVID our data was actually used to support contact tracing.", 1], ["大部分的早上都是我們家的狗跳上床把我叫醒，這是很愉快的一天開始。", "Most mornings it's our dog who wakes me up by jumping onto my bed, which is a pretty cheerful way to start the day.", 1], ["如果可以住在任何地方，我會選步調慢但依然方便的城市，國內像台南，國外的話就是京都。", "If I could live anywhere, I'd choose somewhere slower-paced but still convenient, like Tainan in Taiwan or Kyoto if I moved abroad.", 1]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "Oakley（我的狗）", "en": "家人・寵物・2026-10 自己補充", "groups": [{"label": "細節", "tone": "neu", "items": [["Oakley 是我的狗，公的喜樂蒂；個性很膽小，陌生人突然摸他會緊張。", "Oakley is my dog, a male Shetland Sheepdog. He's quite timid and gets nervous when strangers touch him suddenly.", 1], ["大部分的早上都是 Oakley 跳上床把我叫醒。", "Most mornings, it's Oakley jumping onto my bed that wakes me up."], ["我一週帶他去河濱公園散步兩三次；遛狗也是我出門透氣、讓自己不無聊的方式。", "I take him for walks in the riverside park two or three times a week; walking him is also how I get some fresh air and stop myself feeling bored.", 1], ["媽媽康復後的河邊野餐他也在，開心地在我們和河邊之間跑來跑去。", "He was with us at the riverside picnic after my mum got the all-clear, running happily between us and the water.", 1], ["有一次手機突然發出巨響嚇到他，他跳起來把手機撞到地上摔壞，我當天就買了新手機。", "Once my phone suddenly made a loud noise, which startled him; he jumped up and knocked it onto the floor, breaking it, so I bought a new phone that same day.", 1], ["在百貨公司，一個小女孩沒問就一直摸推車裡的他，媽媽提醒後還是一邊問一邊摸，我只好在他更害怕前帶他離開。", "At a department store, a little girl kept petting him in his pet stroller without asking, even after her mother told her to ask first, so I took him away before he got more frightened.", 1], ["因為全職工作，現在陪他的時間不多；如果有更多空閒，想多帶他出去、一起探索新地方。", "Because I work full-time, I don't have much time with him at the moment; if I had more free time, I'd take him on more outings and explore new places together.", 1]]}, {"label": "金句", "tone": "neu", "items": [["Oakley 雖然怕生，但在家裡他參與了每個家庭時刻，從早上叫我起床到全家的河邊野餐。", "Oakley may be timid with strangers, but at home he's part of every family moment, from waking me up in the morning to our family picnic by the river.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["帶他去散步", "take him for a walk"], ["寵物推車", "a pet stroller"], ["怕生", "be timid with strangers"], ["嚇到某人", "startle sb"], ["把某物撞到地上", "knock sth onto the floor"], ["尊重他的界線", "respect his boundaries"], ["家庭的一份子", "part of the family"], ["彌補失去的時間", "make up for lost time"]]}, {"label": "單字", "tone": "pos", "items": [["膽小的", "timid"], ["戒備的", "wary"], ["陪伴", "companionship"], ["忠誠的", "loyal"], ["親人的、深情的", "affectionate"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我的狗 Oakley 是喜樂蒂，大部分早上都是他跳上我的床把我叫醒。", "My dog, Oakley, is a Shetland Sheepdog, and most mornings he's the one who wakes me up by jumping onto my bed.", 1], ["他很怕生，所以我學到愛動物也代表要尊重牠們的界線。", "He's quite timid with strangers, so I've learnt that loving animals also means respecting their boundaries.", 1], ["有一次我的手機發出很大的聲響嚇到他，他把手機撞到地上摔壞了。", "Once my phone made such a loud noise that it startled him, and he knocked it onto the floor and broke it.", 1], ["全職工作讓我沒辦法像自己希望的那樣多陪他，所以我很想多帶他出去走走。", "Working full-time means I don't get to spend as much time with him as I'd like, so I'd love to take him on more outings.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "寵物／動物、早晨習慣、空閒時間、獨處、意外（手機摔壞）、熊孩子、家庭時光、公園／安靜的地方、無聊時做什麼"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "高中數學老師", "en": "人物", "groups": [{"label": "細節", "tone": "neu", "items": [["教學有條理但不死板，會依學生反應準備不同講法（contingency paths）。", "He taught in a very organised way without being rigid, and he would prepare different ways of explaining things depending on how we responded – contingency paths, basically.", 1], ["把每個學生當獨立個體，會記得學生半年前說過的話。", "He treated every student as an individual and would remember things we'd told him six months earlier.", 1], ["畢業後仍每年兩次約舊生吃飯，在他家聊職涯、家庭與人生。", "Even after we graduated, he still invited former students for dinner twice a year, and we'd talk about careers, family and life at his home.", 1], ["他家：書堆滿地、一張坐了多年的閱讀椅、牆上掛歷屆學生照片——你喜歡去但不想住。", "His home has books piled all over the floor, a reading chair he's sat in for years, and photos of past classes on the walls – I love visiting, but I wouldn't want to live there.", 1], ["他給的建議：“Don’t study a subject — study a question you can’t stop thinking about.” 讓你選了資工。", "His advice to me was: ‘Don’t study a subject — study a question you can’t stop thinking about.’ That's what led me to choose computer science.", 1]]}, {"label": "金句", "tone": "neu", "items": [["最好的建議不會告訴你該怎麼做，而是幫你聽見自己早已知道的答案。", "The best advice doesn’t tell you what to do; it helps you hear what you already know."]]}, {"label": "實用片語", "tone": "pos", "items": [["有條理但有彈性", "structured but flexible"], ["察言觀色、看場合調整", "read the room"], ["真心關心…", "take a genuine interest in"], ["保持聯絡", "keep in touch"], ["有生活感", "a lived-in feel"], ["為某人指引方向", "point someone in the right direction"], ["對…留下深遠影響", "leave a lasting mark on"], ["一個讓你放不下的問題", "a question you can't stop thinking about"]]}, {"label": "單字", "tone": "pos", "items": [["用心的；細心的", "attentive"], ["能隨機應變的", "adaptable"], ["敏銳的；有洞察力的", "perceptive"], ["雜亂的", "cluttered"], ["導師；人生前輩", "mentor"], ["對成長影響深遠的", "formative"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我高中的數學老師有條理但不死板；他總會準備好幾種不同的講法，看我們的反應來調整。", "My high school maths teacher was organised without being rigid; he always had a few different explanations ready, depending on how we reacted.", 1], ["最讓我印象深刻的是，他會記得你半年前提過的事，讓每個學生都覺得自己真正被看見。", "What struck me most was how he'd remember something you'd mentioned six months earlier, which made every student feel genuinely seen.", 1], ["他曾告訴我，不要讀一個科目，而是去研究一個讓你放不下的問題，老實說，這就是我選資工的原因。", "He once told me not to study a subject but a question I couldn't stop thinking about, and that's honestly why I chose computer science.", 1], ["他到現在每年還會兩次邀舊生到他家吃飯，我們會聊職涯、家庭和人生。", "Twice a year he still invites former students to his home for dinner, where we talk about careers, family and life in general.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "老師、幫助別人的人、善於計畫的人、給建議、重要決定、想拜訪的家、改變的計畫（你小時候想當老師）"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "高中合唱團：義大利與法國比賽", "en": "經歷", "groups": [{"label": "細節", "tone": "neu", "items": [["六年合唱團，參加義大利（羅馬附近國際比賽）與法國比賽，約 60 名團員。", "I was in the choir for six years, and we competed in Italy – at an international competition near Rome – and in France, with around 60 members.", 1], ["比賽前後台規定手機收起來，60 人安靜走廊、只剩鞋子踩在石地上的聲音。", "Before and after performing, we had to put our phones away backstage, so 60 of us stood in a silent corridor where the only sound was our shoes on the stone floor.", 1], ["演出結束先是一片寂靜，接著全場起立鼓掌、大家都在笑。", "When we finished, there was a moment of complete silence, then the whole audience rose to give us a standing ovation, and everyone was smiling.", 1], ["空檔參觀競技場（Colosseum）與龐貝古城；搭火車經過托斯卡尼的柏樹、紅瓦農舍與葡萄園。", "In our free time we visited the Colosseum and Pompeii, and took a train through Tuscany, past cypress trees, red-roofed farmhouses and vineyards.", 1], ["你負責團體協調：有人忘了正式鞋、巴士遲到、場地聲音太乾，都一一解決。", "I was in charge of group coordination – whether someone forgot their formal shoes, the bus was late or the venue's acoustics were too dry, I sorted out each problem.", 1]]}, {"label": "金句", "tone": "neu", "items": [["成功的活動不是什麼都沒出錯，而是大家解決問題的速度比問題累積得更快。", "Successful events aren’t ones where nothing goes wrong — they’re ones where people solve problems faster than the problems accumulate.", 1]]}, {"label": "實用片語", "tone": "pos", "items": [["起立鼓掌", "a standing ovation"], ["安靜到連針掉下來都聽得到", "you could hear a pin drop"], ["在幕後", "behind the scenes"], ["臨場應變", "think on my feet"], ["處理突發狀況（救火）", "put out fires"], ["把事情處理好", "sort things out"], ["沉浸在氛圍中", "soak up the atmosphere"], ["一生難得的經驗", "a once-in-a-lifetime experience"]]}, {"label": "單字", "tone": "pos", "items": [["音響效果；聲學條件", "acoustics"], ["後勤安排", "logistics"], ["期待；緊張的等待", "anticipation"], ["寂靜的；屏息的", "hushed"], ["風景如畫的", "picturesque"], ["排解問題", "troubleshoot"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["後台的手機都收起來了，我們六十個人在安靜的走廊等待，只聽得到鞋子踩在石地上的聲音。", "Backstage our phones were put away, and sixty of us waited in a silent corridor where all you could hear was shoes on stone.", 1], ["最後一個音消失時，全場先是一片寂靜，接著整個大廳的人都起立鼓掌。", "When the last note faded, there was a moment of complete silence, and then the whole hall rose to its feet and applauded.", 1], ["我負責團體的後勤，所以不管是有人忘了正式鞋，還是巴士遲到，都是我要解決的。", "I handled the group's logistics, so whether someone forgot their formal shoes or the bus turned up late, it was my job to sort it out.", 1], ["空檔時我們參觀了競技場和龐貝古城，而搭火車經過托斯卡尼的柏樹和葡萄園，更是令人難忘。", "In our free time we visited the Colosseum and Pompeii, and the train ride through Tuscany, past cypress trees and vineyards, was unforgettable.", 1]]}, {"label": "可用題型", "tone": "neu", "items": [["", "開心的活動、很多人微笑的場合、不能用手機的場合、有趣的建築、喜歡的城市、旅行、團隊合作"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "合唱團好友", "en": "人物", "groups": [{"label": "細節", "tone": "neu", "items": [["高一第一週認識；她很外向，你一開始覺得有點壓迫感。", "We met in our first week of senior high school; she was really outgoing, and at first I found her a bit overwhelming.", 1], ["兩人一起唱不好同一段高音、相視大笑後成為朋友。", "We became friends after we both struggled with the same high note, looked at each other and burst out laughing.", 1], ["一起去義大利、法國比賽；去托斯卡尼的火車上兩小時沒說話也不尷尬。", "We went to the competitions in Italy and France together, and on the train to Tuscany we didn't talk for two hours, yet it wasn't awkward at all.", 1], ["她教你：不能躲在緊張後面表演，要願意暴露自己。至今仍保持聯絡。", "She taught me that you can't hide behind your nerves when you perform – you have to be willing to make yourself vulnerable. We're still in touch today.", 1]]}, {"label": "金句", "tone": "neu", "items": [["你能和一個人共享什麼樣的沉默，是檢驗友誼的好方法之一。", "The kind of silence you can share with someone is one of the better tests of friendship."]]}, {"label": "實用片語", "tone": "pos", "items": [["一開始給人有點壓迫感", "come on a bit strong"], ["第一印象可能會誤導人", "first impressions can be misleading"], ["忍不住大笑", "burst out laughing"], ["一拍即合", "hit it off"], ["自在的沉默", "a comfortable silence"], ["躲在緊張後面", "hide behind your nerves"], ["勇敢展現自己", "put yourself out there"], ["保持聯絡", "stay in touch"]]}, {"label": "單字", "tone": "pos", "items": [["外向的", "extroverted"], ["令人有壓迫感的", "intimidating"], ["願意敞開的；脆弱的", "vulnerable"], ["同伴情誼", "camaraderie"], ["相處自在的", "companionable"], ["真誠的", "genuine"]]}, {"label": "可直接說的句子", "tone": "pos", "items": [["我們高一剛認識時，她外向到老實說我一開始覺得有點壓迫感。", "When we first met in senior high, she was so outgoing that I honestly found her a little intimidating at first.", 1], ["我們兩個都唱不好同一段高音，相視之後忍不住大笑，就這樣成了朋友。", "We became friends when we both struggled with the same high note, looked at each other and just burst out laughing.", 1], ["去托斯卡尼的火車上，我們兩小時沒說一句話，卻一點也不尷尬，這很能說明我們的友誼。", "On the train to Tuscany we didn't say a word for two hours, and it wasn't aw
