<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雅思口說題庫導圖 9–12 月（講義修訂版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#fbfbf9; --surface:#ffffff; --line:#e7e5e0; --line-soft:#f0efeb;
    --ink:#1c1b19; --ink-2:#4a4844; --ink-3:#8c8880;
    --pos:#2f8f5b; --pos-bg:#f1f9f4;
    --neg:#c0503f; --neg-bg:#fdf3f1;
    --neu:#3f6fa8; --neu-bg:#f1f5fa;
    --focus:#1c1b19; --mark:#ffe9a8; --mark-ink:#1c1b19;
    --tint:11%; --tint-strong:18%; --wire:.55;
    --sans:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --han:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14140f; --surface:#1c1c17; --line:#2e2e27; --line-soft:#25251f;
      --ink:#f2f1ec; --ink-2:#c3c1b9; --ink-3:#8a877e;
      --pos:#69c48d; --pos-bg:#18251d;
      --neg:#e2887a; --neg-bg:#271b19;
      --neu:#82aad9; --neu-bg:#1a2029;
      --focus:#f2f1ec; --mark:#5c4a12; --mark-ink:#f6f2e4;
      --tint:15%; --tint-strong:26%; --wire:.6;
    }
  }

  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
       line-height:1.55;-webkit-font-smoothing:antialiased}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}
  .head-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:20px 0 12px}
  h1{font-family:var(--han);font-size:20px;font-weight:700;letter-spacing:.01em}
  .sub{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}
  .head-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-bottom:11px}

  .search{position:relative;flex:1 1 200px;max-width:300px}
  .search input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 34px;outline:none;
    transition:border-color .15s}
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus{border-color:var(--focus)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;
    stroke:var(--ink-3);fill:none;stroke-width:2}
  .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;
    color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    pointer-events:none;transition:opacity .15s}
  .search input:focus ~ .kbd{opacity:0}

  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
  .seg button,.ghost{font:inherit;font-family:var(--han);font-size:13px;color:var(--ink-2);
    background:none;border:none;padding:8px 13px;cursor:pointer;transition:background .15s,color .15s}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button:hover,.ghost:hover{background:var(--line-soft)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .ghost{border:1px solid var(--line);border-radius:8px;background:var(--surface);white-space:nowrap}

  .count{font-size:12.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap;
    font-variant-numeric:tabular-nums}

  nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{font:inherit;font-family:var(--han);font-size:13px;color:var(--ink-2);cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 13px;
    white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
  nav button:hover{border-color:var(--ink-3)}
  nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  nav .sep{width:1px;background:var(--line);margin:2px 4px;flex:0 0 1px}

  main{max-width:1240px;margin:0 auto;padding:30px 24px 60px}

  /* ---------- category ---------- */
  .catsec{margin-bottom:40px}
  .cat-head{display:flex;align-items:baseline;gap:11px;padding-bottom:16px}
  .cat-zh{font-family:var(--han);font-size:14px;font-weight:700;letter-spacing:.06em}
  .cat-en{font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
  .cat-rule{flex:1;height:1px;background:var(--line)}

  .topic-head{display:flex;align-items:baseline;gap:11px}
  .topic-num{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .topic-zh{font-family:var(--han);font-size:18px;font-weight:700}
  .topic-en{font-size:12px;color:var(--ink-3);letter-spacing:.06em}

  /* ---------- list view ---------- */
  #listView .catgrid{display:flex;flex-direction:column;gap:34px}
  #listView .topic-head{padding-bottom:13px;border-bottom:1px solid var(--line)}
  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:26px;padding-top:18px}
  .group-label{display:inline-flex;align-items:center;gap:7px;font-family:var(--han);font-size:13px;
    font-weight:500;letter-spacing:.02em;padding:3px 10px;border-radius:6px;margin-bottom:11px}
  .group-label::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
  [data-tone="pos"] .group-label{color:var(--pos);background:var(--pos-bg)}
  [data-tone="neg"] .group-label{color:var(--neg);background:var(--neg-bg)}
  [data-tone="neu"] .group-label{color:var(--neu);background:var(--neu-bg)}

  #listView ul{list-style:none;display:flex;flex-direction:column;gap:2px}
  #listView li{position:relative}
  .item{width:100%;display:block;text-align:left;font:inherit;cursor:pointer;background:none;
    border:none;transition:background .13s,border-color .13s}
  #listView .item{border-left:2px solid var(--line);padding:7px 12px 8px 14px;border-radius:0 6px 6px 0}
  #listView .item:hover{background:var(--surface)}
  #listView [data-tone="pos"] .item:hover{border-left-color:var(--pos)}
  #listView [data-tone="neg"] .item:hover{border-left-color:var(--neg)}
  #listView [data-tone="neu"] .item:hover{border-left-color:var(--neu)}
  .item:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  .en{display:block;font-size:14.5px;color:var(--ink);line-height:1.45}
  .zh{display:block;font-family:var(--han);font-size:12.5px;color:var(--ink-3);margin-top:2px}
  mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}

  .copied{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--han);
    font-size:11px;color:var(--pos);background:var(--pos-bg);border-radius:4px;padding:2px 7px;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .is-copied .copied{opacity:1}

  /* ---------- map view ---------- */
  #mapView .catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(540px,1fr));
    gap:30px 28px;align-items:start}
  .mapwrap{--acc:var(--acc-l)}
  @media (prefers-color-scheme:dark){.mapwrap{--acc:var(--acc-d)}}
  .mapwrap .topic-head{padding-bottom:11px;border-bottom:1px solid var(--line)}
  .mapwrap .topic-num{color:var(--acc)}

  .map{position:relative;overflow-x:auto;padding:16px 4px 4px;scrollbar-width:thin}
  .map > svg{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
  .map path{fill:none;stroke:var(--acc);stroke-width:1.15;stroke-opacity:var(--wire);
    stroke-linejoin:round;stroke-linecap:round}
  .tree{position:relative;z-index:1;display:flex;align-items:center;gap:40px;width:max-content}

  .root{font:inherit;font-family:var(--han);font-size:16px;font-weight:700;color:var(--ink);
    padding:9px 15px;border-radius:9px;border:none;cursor:pointer;max-width:260px;text-align:left;
    background:var(--surface);background:color-mix(in srgb,var(--acc) var(--tint-strong),var(--surface));
    transition:filter .13s}
  .root:hover{filter:brightness(.96)}
  .branches{display:flex;flex-direction:column;gap:20px}
  .branch{display:flex;align-items:center;gap:32px}
  .group-node{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;
    font-family:var(--han);font-size:12.5px;color:var(--acc);text-align:left;
    padding:4px 9px 4px 11px;border-radius:6px;border:1px solid var(--acc);max-width:210px;
    background:var(--surface);align-self:center;transition:background .13s}
  .group-node:hover{background:color-mix(in srgb,var(--acc) 10%,var(--surface))}
  .group-node .lb{flex:1}
  .group-node .n{font-family:var(--sans);font-style:normal;font-size:11px;opacity:.75;
    font-variant-numeric:tabular-nums}
  .group-node::after{content:'▸';font-size:9px;opacity:.7;transition:transform .15s;
    display:inline-block;flex:0 0 auto}
  .branch[data-open="true"] .group-node::after{transform:rotate(90deg)}
  .branch[data-open="false"] .leaves{display:none}

  .leaves{display:flex;flex-direction:column;gap:5px}
  .leafrow{position:relative}
  .leaf{display:block;text-align:left;font:inherit;cursor:pointer;border:none;width:330px;
    padding:6px 11px;border-radius:7px;background:var(--surface);
    background:color-mix(in srgb,var(--acc) var(--tint),var(--surface));
    transition:transform .13s,box-shadow .13s}
  .leaf:hover{transform:translateX(2px);box-shadow:0 1px 0 var(--line),0 2px 8px rgba(0,0,0,.05)}
  .leaf .en{font-size:13.5px;line-height:1.4}
  .leaf .zh{font-size:11.5px;color:var(--ink-2);opacity:.72;margin-top:1px}
  .leaf.long{width:520px}
  .leaf.long .en{font-size:12.5px;line-height:1.5}
  .leafrow .copied{right:-58px;background:var(--surface);border:1px solid var(--line)}

  /* ---------- prompt view ---------- */
  #promptView .ptype{margin-bottom:34px}
  .plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:10px;padding-top:16px}
  .prow{position:relative}
  .pcard{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;background:var(--surface);
    border:1px solid var(--line);border-radius:9px;padding:12px 14px;transition:border-color .13s}
  .pcard:hover{border-color:var(--ink-3)}
  .pnum{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .pzh{display:block;font-family:var(--han);font-size:14px;font-weight:500;color:var(--ink);margin:3px 0 5px}
  .pq{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.55}
  .prow .copied{right:10px;top:12px;transform:none}

  .empty{color:var(--ink-3);font-family:var(--han);font-size:14px;padding:60px 0;text-align:center}
  footer{border-top:1px solid var(--line);max-width:1240px;margin:10px auto 0;padding:22px 24px 60px}
  footer p{font-family:var(--han);font-size:12px;color:var(--ink-3);line-height:1.8}

  [hidden]{display:none !important}
  @media (max-width:640px){
    .wrap,main,footer{padding-left:16px;padding-right:16px}
    .groups,.plist{grid-template-columns:1fr;gap:22px}
    .count{width:100%;margin-left:0}
    .leaf{width:238px}.leaf.long{width:262px}
    .tree{gap:24px}.branch{gap:18px}
  }
  @media print{
    header{position:static;border-bottom:1px solid #ccc}
    .head-tools,nav,.copied{display:none}
    .mapwrap,#listView .topic,.prow{break-inside:avoid}
    #mapView .catgrid{grid-template-columns:1fr}
    .map{overflow:visible}
    .branch[data-open="false"] .leaves{display:flex}
  }
  .leaf.long .en{white-space:pre-line}

/* Mobile memorisation mode */
.study-screen{max-width:760px;margin:0 auto;padding:4px 0 48px}
.study-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 18px}
.study-controls select,.study-controls button,.study-actions button,.study-nav button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer}
.study-controls select{flex:1;min-width:160px;max-width:100%}
.study-controls label{display:flex;align-items:center;gap:6px;font-size:13px}
.study-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:clamp(18px,4vw,30px);box-shadow:0 4px 24px rgba(0,0,0,.035)}
.study-meta{font-size:12px;color:var(--ink-3);margin-bottom:15px}
.study-question{font-size:clamp(20px,4.5vw,28px);line-height:1.5;font-weight:700;white-space:pre-wrap}
.study-hint{font-size:13px;color:var(--ink-3);margin-top:12px}
.study-reveal{width:100%;margin-top:24px;padding:15px!important;border:0!important;border-radius:11px;background:var(--ink)!important;color:var(--bg)!important;font-weight:700!important}
.study-answer{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}
.study-answer h3{font-size:13px;color:var(--ink-3);margin:0 0 10px}
.study-answer p{font-size:17px;line-height:1.8;white-space:pre-wrap;margin:0 0 20px}
.study-vocab{display:grid;gap:10px}
.study-vocab div{border-bottom:1px solid var(--line-soft);padding-bottom:9px}
.study-vocab strong{display:block;font-size:14px;font-weight:500}
.study-vocab span{display:block;font-size:13px;color:var(--ink-3);margin-top:3px}
.study-cue{margin-top:14px;font-size:14px;color:var(--ink-2)}
.study-cue ul{margin:6px 0 0 20px;padding:0}
.study-cue li{margin:2px 0}
.study-label{font-size:12px;font-weight:600;color:var(--ink-3);margin:0 0 6px}
.study-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.study-actions button{flex:1;min-width:125px;font-weight:600}
.study-actions button[aria-pressed=true]{border-color:var(--pos);background:var(--pos-bg);color:var(--pos)}
.study-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.study-nav button{min-width:90px}
.study-stats{font-size:13px;color:var(--ink-2);text-align:center}
.study-progress{height:6px;background:var(--line);border-radius:20px;overflow:hidden;margin-bottom:15px}
.study-progress div{height:100%;background:var(--pos);transition:width .2s}
.study-note{font-size:12px;color:var(--ink-3);margin-top:16px;line-height:1.7}
@media(max-width:640px){.study-controls{align-items:stretch}.study-controls select{width:100%;flex-basis:100%}.study-card{padding:20px}.study-actions button{min-width:0}.head-top{padding-top:12px}.head-tools{gap:6px}}

</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-top">
      <h1>雅思口說題庫導圖 · 9–12 月</h1>
      <span class="sub">IELTS Speaking · 2026 9–12 月題庫（IDP 面對面）</span>
    </div>
    <div class="head-tools">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋中英關鍵字…" autocomplete="off" spellcheck="false" aria-label="搜尋">
        <span class="kbd">/</span>
      </label>
      <div class="seg" id="viewSeg" role="group" aria-label="檢視方式"></div>
      <div class="seg" id="setSeg" role="group" aria-label="資料來源" hidden></div>
      <div class="seg" id="toneSeg" role="group" aria-label="觀點傾向" hidden>
        <button data-tone="all" aria-pressed="true">全部</button>
        <button data-tone="pos" aria-pressed="false">正面</button>
        <button data-tone="neg" aria-pressed="false">負面</button>
      </div>
      <button class="ghost" id="expandBtn">全部展開</button>
      <span class="count" id="count"></span>
    </div>
    <nav id="nav" aria-label="分類"></nav>
  </div>
</header>

<main>
  <div id="mapView" hidden></div>
  <div id="listView" hidden></div>
  <div id="promptView" hidden></div>
  <div id="studyView" class="study-screen"></div>
</main>

<footer><p>Part 1 143 題、Part 2 51 題、Part 3 308 題、延伸練習 28 題、核心故事 4 則、素材庫 47 項，共 4280 條內容。預設收起：點分支標籤展開，點主題名展開整張圖——先看題目自己講，再展開答案與好用詞彙對照。點任一條目複製英文；按 <b>/</b> 搜尋。<br>資料來源：IELTS_Speaking_9-12月題庫_IDP面對面.docx（主檔），更新 docx 後可重新產生。</p></footer>

<script>

do something I enjoy, even a short break can be satisfying. For example, spending a little time with family or friends can help me relax. How I use the time matters more than how much I have.", 1], ["不一定", "Not necessarily"], ["只要", "As long as"], ["令人滿足的", "satisfying"], ["比……更重要", "matters more than"]]}, {"label": "Q4 What would you do if you had mor…", "tone": "neu", "items": [["題目", "What would you do if you had more free time?"], ["自己準備", "I’d spend more time improving my English, especially through language exchanges. I’d also like to exercise regularly and take my dog on more outings. Those are things I enjoy but don’t always have enough time for.", 1], ["語言交換", "language exchanges"], ["規律運動", "exercise regularly"], ["多帶狗出去走走", "take my dog on more outings"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "Being busy", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 Is your life busier now than whe…", "tone": "neu", "items": [["題目", "Is your life busier now than when you were younger?"], ["自己準備", "Yes, much busier. When I was younger, I mainly had to think about studying and having fun. Now I have work and more interests, like travelling, exercising and taking classes. Although I have less free time, my life feels more fulfilling.", 1], ["忙碌許多", "much busier"], ["上課進修", "taking classes"], ["感覺更充實", "feels more fulfilling"]]}, {"label": "Q2 When was the last time you were…", "tone": "neu", "items": [["題目", "When was the last time you were busy?"], ["自己準備・講義修訂", "The first half of this year was especially busy because my company was working on a major product upgrade. We had a heavy workload, so we had to work overtime and fix technical issues. I was even in the office late on my birthday, helping get the new version running.", 1], ["重大產品升級", "a major product upgrade"], ["★ 沉重的工作量（講義 14 天片語）", "a heavy workload"], ["加班", "work overtime"], ["讓新版本上線運作", "get the new version running"]]}, {"label": "Q3 Are you busy with your work or s…", "tone": "neu", "items": [["題目", "Are you busy with your work or studies at the moment?"], ["自己準備", "Yes, quite busy. I’m working on technical issues, improving system performance and finding ways to use AI at work. There’s always something to follow up on, so it can be hard to switch off completely.", 1], ["提升系統效能", "improving system performance"], ["後續追蹤", "follow up on"], ["完全放鬆、不想工作", "switch off completely"]]}, {"label": "Q4 Do you like to be busy when you'…", "tone": "neu", "items": [["題目", "Do you like to be busy when you're on holiday?"], ["自己準備", "Not really. I prefer taking things at my own pace when I'm on holiday. I love waking up without rushing, taking my time to do my makeup, and going out for a relaxing walk. I don't like having a packed schedule or feeling pressured to get everything done. For me, holidays are about slowing down and enjoying the little things in life.", 1], ["按照自己的步調", "at my own pace"], ["排得滿滿的行程", "a packed schedule"], ["感到有壓力", "feeling pressured"], ["享受生活中的小事", "enjoying the little things in life"]]}, {"label": "Q5 Which do you think is worse: bei…", "tone": "neu", "items": [["題目", "Which do you think is worse: being too busy, or not having enough to do?"], ["自己準備", "I think being too busy is worse because constant pressure leaves me exhausted. While having too little to do can be boring, at least there’s time to relax. I’d rather have an occasional quiet day than feel rushed all the time.", 1], ["持續的壓力", "constant pressure"], ["讓我筋疲力盡", "leaves me exhausted"], ["偶爾清閒的一天", "an occasional quiet day"], ["感到匆忙", "feel rushed"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "List", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 Do you normally make a list when…", "tone": "neu", "items": [["題目", "Do you normally make a list when you go shopping?"], ["自己準備", "Not really. I usually keep everything in my head, especially when I only need to buy a few things. However, if I have a lot of items to buy or I'm planning to cook a special dish, I'll make a shopping list to make sure I don't forget anything. I think it's useful when there's a lot to remember.", 1], ["全部記在腦子裡", "keep everything in my head"], ["特別的料理", "a special dish"], ["確保", "make sure"]]}, {"label": "Q2 Do you find lists useful when yo…", "tone": "neu", "items": [["題目", "Do you find lists useful when you're working or studying?"], ["自己準備", "Yes, especially at work. Lists help me keep track of unfinished tasks and decide what needs doing first. By checking my list, I can see whether I’m making progress and adjust my plans if I’m falling behind.", 1], ["追蹤、掌握", "keep track of"], ["★ 講義句型", "By + V-ing, I can…"], ["有進展", "making progress"], ["進度落後", "falling behind"]]}, {"label": "Q3 Do you prefer to use a piece of…", "tone": "neu", "items": [["題目", "Do you prefer to use a piece of paper or your phone when making a list?"], ["自己準備", "For shopping, I prefer my phone because I can update the list on the go. During meetings, though, I’d rather write things down on paper. It helps me avoid getting distracted by my phone, and I feel it’s more polite.", 1], ["隨時隨地", "on the go"], ["寫下來", "write things down"], ["分心", "getting distracted"]]}, {"label": "Q4 Why do you think some people don…", "tone": "neu", "items": [["題目", "Why do you think some people don't like making lists?"], ["自己準備", "Some people feel they can remember everything without writing it down. Others just don’t want to spend time making a list, especially for only a few items. Whether a list feels useful depends on how much they need to keep track of.", 1], ["寫下來", "writing it down"], ["★ 是否……取決於……（講義句型）", "Whether … depends on …"], ["記住、掌握", "keep track of"]]}, {"label": "Q5 What are the benefits of making…", "tone": "neu", "items": [["題目", "What are the benefits of making plans?"], ["自己準備", "Making plans helps me manage my time and prepare for things in advance. It also gives me something to look forward to. For example, knowing I have a holiday coming up helps me stay motivated during a busy period at work.", 1], ["事先", "in advance"], ["值得期待的事", "something to look forward to"], ["即將到來", "coming up"], ["★ 保持動力（講義搭配詞）", "stay motivated"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "Staying up", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 Do you often stay up late at nig…", "tone": "neu", "items": [["題目", "Do you often stay up late at night?"], ["自己準備", "Yes, quite often, actually. I usually get home pretty late after work, and by the time I've had dinner, there's not much time left in the evening. I still need to study, so I often end up staying awake longer than I intended. Sometimes, I also get carried away watching a TV series and lose track of time.", 1], ["等到……的時候", "by the time"], ["最後變成", "end up"], ["太投入而忘我", "get carried away"], ["忘了時間", "lose track of time"]]}, {"label": "Q2 Did you stay up late more often…", "tone": "neu", "items": [["題目", "Did you stay up late more often when you were younger?"], ["自己準備", "No, actually, it's the other way around. I stay up much later now than I used to. When I was younger, I had a more regular routine and could manage my time better. But nowadays, I sometimes have to work overtime, which makes it difficult to stick to a consistent sleep schedule.", 1], ["正好相反", "it's the other way around"], ["較規律的作息", "a more regular routine"], ["加班", "work overtime"], ["穩定的睡眠時間", "a consistent sleep schedule"]]}, {"label": "Q3 What do you usually do when you…", "tone": "neu", "items": [["題目", "What do you usually do when you stay up late?"], ["自己準備", "Most of the time, I'm either studying or scrolling through my phone. If I'm not preparing for an exam, I might be watching a TV series or browsing online shopping websites. Sometimes I lose track of time, especially when I find something interesting to watch or buy.", 1], ["滑手機", "scrolling through my phone"], ["逛購物網站", "browsing online shopping websites"], ["忘了時間", "lose track of time"]]}, {"label": "Q4 How do you feel the day after yo…", "tone": "neu", "items": [["題目", "How do you feel the day after you have stayed up late?"], ["自己準備・講義修訂", "I usually feel completely exhausted because I haven't had enough sleep. I struggle to concentrate, and I often feel sleepy throughout the day. I normally regret staying up so late and tell myself I should have gone to bed earlier.", 1], ["筋疲力盡", "completely exhausted"], ["★ 很難專心（講義）", "struggle to concentrate"], ["一整天", "throughout the day"], ["早該早點睡", "should have gone to bed earlier"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "Different things you keep", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 Have you kept a lot of things fr…", "tone": "neu", "items": [["題目", "Have you kept a lot of things from your childhood?"], ["自己準備", "Yes, especially birthday cards from friends, as well as some stuffed animals and stickers. They remind me of people and moments from my childhood. I find them hard to throw away because they have sentimental value.", 1], ["絨毛玩偶", "stuffed animals"], ["讓我想起", "remind me of"], ["捨不得丟", "hard to throw away"], ["情感價值、紀念意義", "sentimental value"]]}, {"label": "Q2 Do you prefer to keep things for…", "tone": "neu", "items": [["題目", "Do you prefer to keep things for a long time, or to throw them away?"], ["自己準備", "I prefer keeping things, especially if they’re well made or mean something to me. For example, the first handbag and phone I bought with my own money remind me of important moments in my life. I’d rather look after them than replace them quickly.", 1], ["做工精良", "well made"], ["對我有意義", "mean something to me"], ["用自己的錢", "with my own money"], ["愛惜、照顧", "look after"]]}, {"label": "Q3 Where do you usually keep things…", "tone": "neu", "items": [["題目", "Where do you usually keep things that you need every day?"], ["自己準備", "I keep most of my everyday essentials in a small tray on my dressing table. Since I do my makeup there every morning, I see them before I leave the house. That helps me remember what to take, and I put everything back when I get home.", 1], ["日常必需品", "everyday essentials"], ["梳妝台", "dressing table"], ["把東西放回原位", "put everything back"]]}, {"label": "Q4 Do you usually keep all the phot…", "tone": "neu", "items": [["題目", "Do you usually keep all the photos you take, or do you delete some of them?"], ["自己準備・講義修訂", "Ideally, I'd love to keep every photo I take because they all capture little moments of my life. However, my phone has limited storage space, so I sometimes have to delete blurry pictures or ones I don't look good in. I usually keep the ones that bring back good memories.", 1], ["捕捉生活小片刻", "capture little moments"], ["有限的儲存空間", "limited storage space"], ["★ that 子句（講義關係子句）", "the ones that bring back good memories"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "Sitting down", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 Do you usually have to sit for l…", "tone": "neu", "items": [["題目", "Do you usually have to sit for long time?"], ["自己準備", "Yes, definitely. As an engineer, I spend most of my working day sitting in front of a computer, writing code and typing. I can easily spend eight hours at my desk, so I try to get up and stretch whenever I have a chance.", 1], ["大部分工作時間", "most of my working day"], ["坐在辦公桌前", "at my desk"], ["起身伸展", "get up and stretch"]]}, {"label": "Q2 Did you like sitting on the floo…", "tone": "neu", "items": [["題目", "Did you like sitting on the floor when you were young?"], ["自己準備", "Not particularly. Even when I was little, I preferred sitting on the sofa because the cushions were softer and it was much more comfortable. I also liked having something to support my back, rather than sitting directly on the hard floor.", 1], ["不怎麼喜歡", "Not particularly"], ["支撐我的背", "support my back"], ["而不是", "rather than"]]}, {"label": "Q3 Can you easily fall asleep when…", "tone": "neu", "items": [["題目", "Can you easily fall asleep when you are sitting in a chair?"], ["自己準備・講義修訂", "Not usually, because I find it hard to get comfortable in a chair. I prefer somewhere with better support for my back. That said, if I’m completely exhausted, I can probably fall asleep almost anywhere.", 1], ["坐得舒服", "get comfortable"], ["對背部更好的支撐", "better support for my back"], ["話雖如此", "That said"], ["幾乎任何地方", "almost anywhere"]]}, {"label": "Q4 Do you have a favourite place to…", "tone": "neu", "items": [["題目", "Do you have a favourite place to sit?"], ["自己準備", "Yes, definitely. My favourite spot is the corner of our L-shaped sofa at home. I can lean against both sides, which makes it really comfortable. I love curling up there to watch TV, scroll through my phone, or simply zone out for a while without doing anything in particular.", 1], ["靠著", "lean against"], ["蜷縮著", "curling up"], ["放空", "zone out"], ["不特別做什麼", "without doing anything in particular"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "Evenings", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 What do you usually do in the ev…", "tone": "neu", "items": [["題目", "What do you usually do in the evening?"], ["原題（A1-077）・講義修訂", "I often go for an evening walk around the Zhongshan area, which has lots of boutiques and independent cafes to look around. If I'm home, I'll spend time with my dog, listen to music, or watch something on my phone.", 1], ["傍晚散步", "go for an evening walk"], ["★ which 子句（講義關係子句）", "the Zhongshan area, which has…"], ["獨立咖啡店", "independent cafes"]]}, {"label": "Q2 On weekdays and at weekends, do…", "tone": "neu", "items": [["題目", "On weekdays and at weekends, do you spend your evenings in the same way?"], ["自己準備", "Not really. On weekdays, I'm usually quite busy with work, so when I get home, I just want to have dinner and get some rest. At weekends, though, I'm much more likely to go out and have fun. Friday evenings are especially enjoyable because I can finally unwind after a long working week.", 1], ["休息一下", "get some rest"], ["更有可能", "much more likely to"], ["放鬆", "unwind"], ["漫長的工作週", "a long working week"]]}, {"label": "Q3 When you were younger, how did y…", "tone": "neu", "items": [["題目", "When you were younger, how did you spend your evenings?"], ["原題（A1-078）・講義修訂", "As a child, I'd do my homework, have dinner with my family, then watch TV together. My evenings had a very regular routine. My mum would sometimes sit with me while I studied, which was quite comforting.", 1], ["很規律的作息", "a very regular routine"], ["★ which 子句（講義關係子句）", "…, which was quite comforting"], ["令人安心的", "comforting"]]}, {"label": "Q4 Is there anything you don’t like…", "tone": "neu", "items": [["題目", "Is there anything you don’t like to do in the evenings?"], ["相近題・可延用（A1-080）・講義修訂", "I don't like overthinking. At night, my brain sometimes replays the day again and again, like what I said and what I should have said. I've learned to stop that with music or reading, because otherwise it ruins my evening.", 1], ["想太多", "overthinking"], ["腦中一直重播當天", "replay the day"], ["我當時應該說的話", "what I should have said"], ["毀了我的晚上", "ruin my evening"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "Reading habits", "en": "生活方式、日常活動與休閒愛好", "groups": [{"label": "Q1 Do you read more now than when y…", "tone": "neu", "items": [["題目", "Do you read more now than when you were younger?"], ["自己準備", "Yes. When I was younger, I often read because I had to for school. Now I choose books about things I’m interested in, which makes reading much more enjoyable. I’m reading out of curiosity rather than just to finish an assignment.", 1], ["有趣得多", "much more enjoyable"], ["出於好奇", "out of curiosity"], ["而不是", "rather than"], ["完成作業", "finish an assignment"]]}, {"label": "Q2 Have you ever watched a film and…", "tone": "neu", "items": [["題目", "Have you ever watched a film and then read the book?"], ["自己準備", "Yes, I watched The Devotion of Suspect X and then read the novel. The mystery was so interesting that I wanted to explore the story in more detail. Reading it gave me a different view of the characters and plot.", 1], ["如此……以致於……", "so … that …"], ["更詳細地", "in more detail"], ["對……不同的看法", "a different view of"]]}, {"label": "Q3  "items": [["題目", "When an advertisement comes on TV or the internet, what do you usually do?"], ["自己準備", "If an ad pops up while I’m watching a video, I skip it as soon as I can. I’d rather get back to the video because that’s what I chose to watch. Ads interrupt that, which can be annoying.", 1], ["跳出來", "pop up"], ["一有機會就跳過", "skip it as soon as I can"], ["回到……", "get back to"], ["★ 這很煩人（which 子句）", "…, which can be annoying"]]}, {"label": "Q3 Have you seen an advertisement t…", "tone": "neu", "items": [["題目", "Have you seen an advertisement that you didn’t like?"], ["自己準備", "Yes, quite often. I dislike ads that exaggerate what a product can do. Sometimes the demonstration looks staged rather than showing how the product is actually used. That makes it hard for me to trust the ad.", 1], ["★ 誇大產品功能的廣告（that 子句）", "ads that exaggerate what a product can do"], ["看起來是安排好的", "looks staged"], ["產品實際使用的情形", "how the product is actually used"], ["讓我難以信任", "hard for me to trust"]]}, {"label": "Q4 Would you like to be in an adver…", "tone": "neu", "items": [["題目", "Would you like to be in an advertisement one day?"], ["自己準備・講義修訂", "No, I don’t think I would. I’m quite shy in front of a camera, so I’d feel uncomfortable being filmed. I also wouldn’t like the idea of photos or videos of me being shared online. I’d much rather avoid being the centre of attention.", 1], ["在鏡頭前害羞", "shy in front of a camera"], ["被拍攝", "being filmed"], ["在網路上流傳", "being shared online"], ["眾人注目的焦點", "the centre of attention"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "Flowers", "en": "自然、環境與動物", "groups": [{"label": "Q1 Do you love flowers?", "tone": "neu", "items": [["題目", "Do you love flowers?"], ["自己準備・講義修訂", "Yes, I do. Seeing flowers always lifts my mood, especially when I come across an unusual kind that I haven’t seen before. There’s just something about them that brightens my day.", 1], ["提振心情", "lift my mood"], ["偶然遇到", "come across"], ["★ 關係子句 that", "an unusual kind that I haven’t seen before"], ["讓我一整天心情變好", "brighten my day"]]}, {"label": "Q2 Do you know anyone who really li…", "tone": "neu", "items": [["題目", "Do you know anyone who really likes flowers?"], ["自己準備・講義修訂", "Yes, two of my friends really love flowers. One of them is someone who hopes to get a bouquet on almost every special occasion. The other runs a flower shop, so they know a lot about different types of flowers and flower arrangements.", 1], ["一束花", "a bouquet"], ["★ 關係子句 who", "someone who…"], ["經營花店", "run a flower shop"], ["花藝、插花", "flower arrangements"]]}, {"label": "Q3 Are there many flowers growing n…", "tone": "neu", "items": [["題目", "Are there many flowers growing near where you live?"], ["自己準備", "Not that many. There are a few small planted areas along the streets, but I only see flowers here and there. I wouldn’t say my neighbourhood is full of them.", 1], ["植栽區", "planted areas"], ["零星、到處零散地", "here and there"], ["我不會說……", "I wouldn’t say ..."], ["社區、住家附近", "neighbourhood"]]}, {"label": "Q4 Have you ever taken a photo of f…", "tone": "neu", "items": [["題目", "Have you ever taken a photo of flowers?"], ["自己準備", "Yes, quite often. Whenever I see flowers that look particularly beautiful, I like to take a photo of them. I also take pictures when someone gives me a bouquet. It’s a nice way to capture how lovely it looks and keep a memory of the gift.", 1], ["特別漂亮", "particularly beautiful"], ["一束花", "a bouquet"], ["捕捉它美麗的樣子", "capture how lovely it looks"], ["留下……的回憶", "keep a memory of"]]}, {"label": "Q5 Do people often give each other…", "tone": "neu", "items": [["題目", "Do people often give each other flowers in your country?"], ["自己準備・講義修訂", "Not that often, I’d say. It depends on the person, but people usually give flowers on special occasions, like Valentine’s Day or birthdays. It’s less common to give someone flowers for no particular reason.", 1], ["因人而異", "It depends on the person"], ["在特殊場合", "on special occasions"], ["沒有特別原因地", "for no particular reason"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "Memory", "en": "抽象概念、心理與情感", "groups": [{"label": "Q1 What sort of things do you find…", "tone": "neu", "items": [["題目", "What sort of things do you find difficult to remember?"], ["自己準備", "I find it hard to remember things that don’t have much to do with my own life, especially things I rarely come across. For example, I struggle to remember the steps in a recipe. If something isn’t familiar to me, it just doesn’t stick in my mind as easily.", 1], ["★ 很難做到（講義）", "struggle to"], ["與……很有關係", "have much to do with"], ["很少碰到", "rarely come across"], ["記在腦海裡", "stick in my mind"]]}, {"label": "Q2 What do you do when you need to…", "tone": "neu", "items": [["題目", "What do you do when you need to remember something important?"], ["自己準備", "I usually make a note on my phone so I won’t forget. If it’s really important and I’m worried it might slip my mind, I sometimes write a reminder on my hand. That way, I keep seeing it when I’m out and about.", 1], ["記下來", "make a note"], ["忘記", "slip my mind"], ["寫個提醒", "write a reminder"], ["在外走動、外出", "out and about"]]}, {"label": "Q3 Did you find it easier to rememb…", "tone": "neu", "items": [["題目", "Did you find it easier to remember things when you were a child?"], ["自己準備", "Yes, I think so. Compared with now, I seemed to remember things more easily as a child. I also had fewer things to keep track of, and they were usually less complicated. That probably made a difference.", 1], ["★ 和現在相比（講義句型）", "compared with now"], ["記住、掌握", "keep track of"], ["比較不複雜", "less complicated"], ["有影響", "make a difference"]]}, {"label": "Q4 Do you think having a good memor…", "tone": "neu", "items": [["題目", "Do you think having a good memory will be important in your future job or studies?"], ["自己準備", "Definitely. I think a good memory is valuable for both work and study. In my job, for example, remembering product details and problems I’ve dealt with before helps me spot connections and solve similar issues more quickly. It makes it easier to put what I’ve learned into practice.", 1], ["處理", "deal with"], ["發現關聯", "spot connections"], ["解決類似問題", "solve similar issues"], ["把所學付諸實踐", "put what I’ve learned into practice"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "Patience", "en": "抽象概念、心理與情感", "groups": [{"label": "Q1 Are you usually a patient person?", "tone": "neu", "items": [["題目", "Are you usually a patient person?"], ["自己準備", "Yes, I’d say I’m very patient, especially with other people. I find it hard to say no when someone needs help. If they’re struggling with something or need time to think, I’m happy to wait and give them the time they need rather than rush them.", 1], ["很難拒絕", "find it hard to say no"], ["處理……很吃力", "struggle with"], ["給他們所需的時間", "give them the time they need"], ["催促他們", "rush them"]]}, {"label": "Q2 What is it that makes you feel i…", "tone": "neu", "items": [["題目", "What is it that makes you feel impatient?"], ["自己準備", "I get impatient when I have to explain the same thing over and over, especially if someone keeps making the same mistake. I’m happy to give people time to learn, but after several chances, I start to feel frustrated if nothing changes.", 1], ["一再地", "over and over"], ["一直犯同樣的錯", "keep making the same mistake"], ["給了好幾次機會之後", "after several chances"], ["感到挫折、煩躁", "feel frustrated"]]}, {"label": "Q3 How do you feel when you have to…", "tone": "neu", "items": [["題目", "How do you feel when you have to wait for something?"], ["自己準備", "I find it quite frustrating, to be honest. I don’t like being stuck waiting for something to happen, especially when there’s an issue that needs to be resolved. I’d much rather get it sorted out quickly so I can move on.", 1], ["老實說", "to be honest"], ["被困著等待", "be stuck waiting"], ["把事情解決", "get it sorted out"], ["繼續往下進行", "move on"]]}, {"label": "Q4 Do you need to be patient in you…", "tone": "neu", "items": [["題目", "Do you need to be patient in your work or studies?"], ["自己準備", "Definitely. As an engineer, I often deal with problems that are difficult and complex. I need to understand what’s happening before I can find a solution. If I rush, it’s easy to miss an important detail.", 1], ["★ that 關係子句（講義）", "problems that are difficult and complex"], ["處理", "deal with"], ["找到解決方法", "find a solution"], ["漏掉重要細節", "miss an important detail"]]}, {"label": "Q5 Were you more or less patient wh…", "tone": "neu", "items": [["題目", "Were you more or less patient when you were younger?"], ["自己準備", "I was less patient when I was younger because I tended to focus on my own needs. As I’ve grown older, I’ve learned to see things from other people’s perspectives. That’s made it easier to give them the time they need.", 1], ["★ 從別人的角度看事情（講義）", "see things from other people’s perspectives"], ["往往會", "tend to"], ["只關注自己的需求", "focus on my own needs"], ["隨著年紀增長", "as I’ve grown older"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "Praise", "en": "抽象概念、心理與情感", "groups": [{"label": "Q1 How do you feel when someone say…", "tone": "neu", "items": [["題目", "How do you feel when someone says that you've done something well?"], ["自己準備", "I feel happy, though a little embarrassed as well. It’s nice to know someone recognises my effort. At the same time, it motivates me to keep improving rather than feel that I’ve already done enough.", 1], ["有點不好意思", "a little embarrassed"], ["肯定我的努力", "recognise my effort"], ["激勵我去……", "motivate me to"], ["持續進步", "keep improving"]]}, {"label": "Q2 Have you told anyone recently th…", "tone": "neu", "items": [["題目", "Have you told anyone recently that they did something well?"], ["自己準備", "Yes, I recently told a colleague they’d handled a task really well. I thought they’d done a good job and wanted to let them know. It was a simple compliment about their work.", 1], ["處理一項任務", "handle a task"], ["做得很好", "do a good job"], ["一句簡單的稱讚", "a simple compliment"]]}, {"label": "Q3 Do you remember a teacher tellin…", "tone": "neu", "items": [["題目", "Do you remember a teacher telling you that you'd done something really well?"], ["自己準備", "Yes, I remember getting positive feedback on an English essay. My teacher said they liked the way I’d written it. That’s one example of praise from a teacher that has stayed with me.", 1], ["正面回饋", "positive feedback"], ["英文作文", "an English essay"], ["讚美", "praise"], ["令我一直記得", "stay with me"]]}, {"label": "Q4 Is it important for parents to t…", "tone": "neu", "items": [["題目", "Is it important for parents to tell children when they do things well?"], ["自己準備", "Yes, because it helps children understand what they’ve done well. When parents recognise their effort, children have a reason to keep trying. That can encourage them to improve and repeat the positive behaviour.", 1], ["肯定他們的努力", "recognise their effort"], ["持續嘗試", "keep trying"], ["鼓勵他們……", "encourage them to"], ["正向行為", "positive behaviour"]]}, {"label": "Q5 Have you received any praise rec…", "tone": "neu", "items": [["題目", "Have you received any praise recently?"], ["自己準備", "Yes, someone recently said they liked my outfit. It was a compliment about the way I’d put my clothes together. That’s the most recent example I can think of.", 1], ["穿搭", "outfit"], ["稱讚", "a compliment"], ["搭配衣服", "put my clothes together"], ["我能想到最近的例子", "the most recent example I can think of"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "Spending time by yourself", "en": "抽象概念、心理與情感", "groups": [{"label": "Q1 Do you usually spend time by you…", "tone": "neu", "items": [["題目", "Do you usually spend time by yourself?"], ["自己準備", "Yes, quite often. I like shopping or going for walks on my own because it gives me time to think. I can also watch the people around me without having to keep a conversation going. I’m comfortable spending time by myself.", 1], ["去散步", "go for walks"], ["獨自", "on my own"], ["讓對話持續下去", "keep a conversation going"], ["自在地獨處", "be comfortable spending time by myself"]]}, {"label": "Q2 What did you do last time you we…", "tone": "neu", "items": [["題目", "What did you do last time you were by yourself?"], ["自己準備", "The last time I spent some time on my own, I went shopping. I really enjoy exploring new shops by myself and checking out different clothing designs and styles. It’s something I like doing alone.", 1], ["獨自", "on my own"], ["探索新店家", "explore new shops"], ["看看、逛逛", "check out"], ["服裝設計與風格", "clothing designs and styles"]]}, {"label": "Q3 How do you usually spend your ti…", "tone": "neu", "items": [["題目", "How do you usually spend your time by yourself?"], ["自己準備", "I usually watch funny videos or scroll through Instagram. I particularly enjoy videos where people share outfit ideas or makeup tutorials. Those are the kinds of things I tend to watch when I have some time to myself.", 1], ["滑 IG", "scroll through Instagram"], ["穿搭靈感", "outfit ideas"], ["化妝教學", "makeup tutorials"], ["有屬於自己的時間", "have some time to myself"]]}, {"label": "Q4 Do you like spending time by you…", "tone": "neu", "items": [["題目", "Do you like spending time by yourself?"], ["自己準備", "Yes, I do. Being alone lets me think things through at my own pace without being interrupted. I can focus on what I want to do, which makes it feel quite relaxing. I enjoy having that space to myself.", 1], ["把事情想清楚", "think things through"], ["按照自己的步調", "at my own pace"], ["不被打擾", "without being interrupted"], ["擁有自己的空間", "have that space to myself"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "Feeling bored", "en": "抽象概念、心理與情感", "groups": [{"label": "Q1 Do you often feel bored?", "tone": "neu", "items": [["題目", "Do you often feel bored?"], ["自己準備", "Not really. Work keeps me busy, and I usually have things I want to do afterwards. I might exercise, go shopping or go out for a meal. Since I have plenty of interests, I rarely feel I have nothing to do.", 1], ["讓我很忙碌", "keep me busy"], ["出去吃飯", "go out for a meal"], ["很多興趣", "plenty of interests"], ["很少", "rarely"]]}, {"label": "Q2 Did you ever find school boring…", "tone": "neu", "items": [["題目", "Did you ever find school boring when you were a child?"], ["自己準備", "Yes, especially in subjects I wasn’t interested in. For example, I didn’t enjoy Chinese lessons because I felt some of the vocabulary wasn’t useful in everyday life. That made it hard to stay interested.", 1], ["我不感興趣的科目", "subjects I wasn’t interested in"], ["在日常生活中有用", "useful in everyday life"], ["保持興趣", "stay interested"]]}, {"label": "Q3 What kinds of things do you find…", "tone": "neu", "items": [["題目", "What kinds of things do you find most boring now?"], ["自己準備・講義修訂", "I find it boring when someone talks about themselves for too long, especially when it starts to sound like they’re showing off. Sometimes what they’re saying isn’t very meaningful, so I find it hard to stay interested in the conversation.", 1], ["炫耀", "show off"], ["沒什麼內容", "isn’t very meaningful"], ["對對話保持興趣", "stay interested in the conversation"]]}, {"label": "Q4 What do you do to stop yourself…", "tone": "neu", "items": [["題目", "What do you do to stop yourself feeling bored?"], ["自己準備", "I usually make plans with friends and go out for a bit. We might go shopping together, or I’ll take my dog for a walk. Getting out of the house gives me something to do and helps break up the routine.", 1], ["和朋友約", "make plans with friends"], ["帶狗去散步", "take my dog for a walk"], ["出門", "get out of the house"], ["打破一成不變的生活", "break up the routine"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "Talents", "en": "抽象概念、心理與情感", "groups": [{"label": "Q1 What kinds of things do you thin…", "tone": "neu", "items": [["題目", "What kinds of things do you think you’re good at?"], ["自己準備", "I think I’m good at analysing problems logically. At the same time, I can listen to how people feel and offer emotional support. I like being able to understand both the practical and personal sides of a situation.", 1], ["有邏輯地分析問題", "analyse problems logically"], ["★ 提供情感支持（講義 provide emotional support）", "offer emotional support"], ["實際面與個人情感面", "the practical and personal sides"]]}, {"label": "Q2 Do you have the same talents as…", "tone": "neu", "items": [["題目", "Do you have the same talents as your family member?"], ["自己準備", "Yes, my mum and I are both good at singing. That’s one talent we have in common. I think I take after her in that way.", 1], ["★ 有共同點（講義）", "have in common"], ["像（長輩）", "take after"], ["在這方面", "in that way"]]}, {"label": "Q3 Is there a talent you already ha…", "tone": "neu", "items": [["題目", "Is there a talent you already have that you’d like to improve?"], ["自己準備", "Yes, I’d like to improve my singing. In particular, I want to understand how to use my voice properly and develop better vocal technique. Ideally, I’d like to sing more comfortably and with less effort.", 1], ["特別是", "in particular"], ["正確地用聲", "use my voice properly"], ["培養更好的發聲技巧", "develop better vocal technique"], ["更省力地", "with less effort"]]}, {"label": "Q4 Do you think you will use your t…", "tone": "neu", "items": [["題目", "Do you think you will use your talents in a future job?"], ["自己準備", "Probably not, at least when it comes to singing. My work is in engineering, so it doesn’t really involve that talent. I think singing will remain something I enjoy outside work rather than something I use professionally.", 1], ["說到……", "when it comes to"], ["需要用到那項才能", "involve that talent"], ["工作之外", "outside work"], ["用在工作上", "use professionally"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "熊孩子", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time when you saw a young child behaving badly in a public place."], ["提示點", "Where you were"], ["提示點", "What the young child was doing"], ["提示點", "What you or other people did"], ["提示點", "And explain how you felt when you saw the young child behaving badly."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "One weekend, I took my dog, Oakley, an adorable Shetland Sheepdog, to a department store. I felt thirsty, so I decided to buy some bubble tea. Oakley was sitting in his pet stroller while I waited in line. A little girl noticed him and immediately reached out to pet him without asking me first.\n\nOakley is quite timid, which means he gets nervous when strangers touch him suddenly. I politely asked the girl to stop and explained that my dog was uncomfortable. Her mother noticed and told her she needed to ask for permission before touching someone else's dog. She said okay, but then she started asking while she was still petting Oakley.\n\nI couldn't help laughing, because she had heard the rule but didn't really understand it. Asking for permission means waiting for an answer! In the end, I took Oakley away before he became more frightened. I wasn't upset that the child liked dogs, but I felt frustrated that she kept touching him.\n\nI think children should learn to respect animals' boundaries. Not every dog enjoys being petted, and an experience like this can have a negative impact on a nervous dog, making him even more afraid of strangers. Parents who teach their kids to ask first and wait for an answer can easily prevent situations like this.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["伸手去摸牠", "reached out to pet him"], ["★ Oakley 很膽小，這代表……（which 子句）", "Oakley is quite timid, which means…"], ["我忍不住笑出來", "I couldn't help laughing"], ["尊重動物的界線", "respect animals' boundaries"], ["★ 對……造成負面影響", "have a negative impact on"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "有趣的老人", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a very old person you enjoy talking to who has had an interesting life."], ["提示點", "Who this very old person is"], ["提示點", "What this very old person is like"], ["提示點", "What you know about his/her life"], ["提示點", "And explain why you enjoy talking to this very old person."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "An elderly person who I enjoy talking to is my friend's grandmother. I sometimes visit my friend's house to have tea with her, and we chat about little things that have happened in our daily lives. Sometimes, we also take her out to exercise. What makes her interesting is how curious she is about younger people's lives.\n\nShe watches YouTube and enjoys making videos, even though she isn't very familiar with smartphones. One of my favourite stories about her is the time she accidentally started an Instagram livestream. She wanted to video-call my friend to show them how messy their bedroom was and remind them to tidy it up. Instead, she went live and showed everyone the clothes all over the floor and bed.\n\nMy friend was extremely embarrassed and begged her to end the livestream, but she didn't know how. People watching started joking that if she couldn't stop the livestream, they might as well tidy the room together! Whenever I think about that story, I still can't help laughing. I enjoy her company because she's open to new experiences, which gives us plenty to talk about. Despite her age, she's still willing to learn and step outside her comfort zone, and I really admire that attitude.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 我喜歡聊天的長輩（who 子句）", "An elderly person who I enjoy talking to"], ["不小心開了 IG 直播", "accidentally started an Instagram livestream"], ["★ 這讓我們有很多話題（which 子句）", "…, which gives us plenty to talk about"], ["乾脆一起整理房間", "might as well tidy the room together"], ["★ 走出舒適圈", "step outside her comfort zone"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "聰明的人", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a person you know who you think is very intelligent."], ["提示點", "Who this person is"], ["提示點", "How you know this person"], ["提示點", "Why you think this person is very intelligent"], ["提示點", "And explain how you feel about this person."]]}, {"label": "我的答案", "tone": "pos", "items": [["相近題・可延用（MAP-021｜原題：Describe one of your friends who learned something without a teacher）・講義修訂", "The person I'd like to describe is a colleague and friend who I met early in my data engineering career. I think he's very intelligent, mainly because he taught himself everything he knows.\n\nHe never studied computer science. His degree was in business. But he was curious about data systems, so he started learning on his own through online resources, technical documents and open-source projects, which he contributed to and learned from. By the time I met him, he was one of the most capable engineers on our team.\n\nWhat made him different wasn't just technical skill. It was the way he thought. Because he had learned by solving real problems rather than by following a course, he was very practical. Before asking how something should be built, he'd always ask, 'What does this actually need to do?' That sounds obvious, but it's surprisingly rare.\n\nHe also wasn't afraid of failure. When you teach yourself, you fail all the time, so he was never afraid of being wrong at work. He'd suggest ideas, listen to people's questions and improve them quickly. I've tried to bring that attitude into my own work, and to change my solutions quickly when new information comes in.\n\nHe's now a team lead. The company doesn't even know that he learned everything on his own, and it doesn't need to, because his work speaks for itself. I really admire him, because to me, that's what real intelligence looks like: being curious, practical and not afraid to be wrong.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 我認識的同事兼朋友（who 子句）", "a colleague and friend who I met…"], ["★ 他參與貢獻的開源專案（which 子句）", "open-source projects, which he contributed to…"], ["★ 而不是", "rather than"], ["自學", "learn on his own"], ["成果說明一切", "his work speaks for itself"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "被勸說的時刻", "en": "人物與人際關係", "groups": [{"label": "題卡（1）", "tone": "neu", "items": [["題目", "Describe a time when you were happy that someone persuaded you to do something."], ["提示點", "Who persuaded you"], ["提示點", "What he/she persuaded you to do"], ["提示點", "What reasons he/she gave you for doing this"], ["提示點", "And explain why you were happy that he/she persuaded you to do this."]]}, {"label": "題卡（2）", "tone": "neu", "items": [["題目", "Describe a person who inspired you to do something interesting."], ["提示點", "Who the person is"], ["提示點", "What interesting thing you did"], ["提示點", "How this person inspired you to do this thing"], ["提示點", "And explain how you felt after this person inspired you to do something interesting."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備（依你的描述撰寫）（題卡 1）（素材：媽媽鼓勵我出國念書）・講義修訂", "The person I'd like to talk about is my mum, who persuaded me to study abroad. It's something I'm now actively preparing for.\n\nFor years, studying overseas felt like an impossible dream. I've been working as a data engineer for about three years, and whenever the idea came up, I talked myself out of it, mainly because I didn't think I could afford it. It seemed far too expensive, and I didn't want to put a financial strain on my family.\n\nMy mum was the one who changed my mind. Her reason was simple: I'm still young, and this is exactly the right time to try something like this. She told me not to wait until it was too late and then live with regret. What touched me most was that she didn't just encourage me with words. She made it clear that she'd support me, which took a huge weight off my shoulders.\n\nSo I've started preparing step by step. I'm studying for IELTS, and I'm in the middle of my applications, so nothing is confirmed yet.\n\nI'm really glad she persuaded me, because without her push, I would probably have kept putting it off until it was too late. Even before getting an offer, the decision itself has made me feel more hopeful about my future. Honestly, it's also made me appreciate her even more, because she believed in the plan before I did.", 1], ["自己準備（依你的描述撰寫）（題卡 2）（素材：媽媽鼓勵我出國念書）・講義修訂", "The person who inspired me to do something interesting is my mum, and the interesting thing is that I'm preparing to study abroad.\n\nStudying overseas had always been a dream of mine, but I'd more or less given up on it because I didn't think I could afford it. When I mentioned it to my mum, she encouraged me to go for it. She said I was still young, and that it would be far worse to look back one day and regret never trying.\n\nWhat I did was finally take the first steps. I started preparing seriously by studying for IELTS and putting together my applications, which I'm still working on now.\n\nHer words inspired me because they shifted my focus from what could go wrong to what I might miss out on. Before that conversation, I could only see the cost. Afterwards, I could see how it might open up new possibilities for me. Knowing that she was willing to support me made all the difference.\n\nLooking back, I feel excited, a little nervous and, above all, grateful. Nothing is confirmed yet, but I feel I've already grown just by deciding to step outside my comfort zone. I know I wouldn't have started without her encouragement.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 說服我……的媽媽（who 子句）", "my mum, who persuaded me to…"], ["說服自己打消念頭", "talk myself out of it"], ["★ 對……造成經濟壓力", "put a financial strain on"], ["★ 這讓我卸下心中大石（which 子句）", "…, which took a huge weight off my shoulders"], ["一再拖延", "keep putting it off"], ["放手去做", "go for it"], ["★ 我還在準備的申請（which 子句）", "my applications, which I'm still working on"], ["錯過", "miss out on"], ["★ 開啟新的可能性", "open up new possibilities"], ["★ 走出舒適圈", "step outside my comfort zone"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "由不喜歡到喜歡的朋友", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a person who you did not like when you first met, but who then became your friend."], ["提示點", "Where and when you met this person"], ["提示點", "What you did not like about him/her at first"], ["提示點", "Why you changed your mind about him/her and became friends"], ["提示點", "And explain how you feel about this person becoming your friend."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：合唱團朋友（MAP-015））・講義修訂", "The person I'd like to describe is a friend who I met in my high school choir. We met in the very first week of our first year.\n\nTo be honest, I didn't like her very much at first. She was extremely outgoing. She always had the loudest voice in the room, and she always volunteered to sing first. I was much more reserved, and I focused on getting the technical details right, so her confidence came across as a bit showy. I remember thinking we had nothing in common.\n\nWhat changed my mind was a rehearsal a few weeks later. We were both struggling to hit the same long high note, which needed more breath control than either of us had. We failed it again and again. At some point we looked at each other and burst out laughing. In that moment I realised she wasn't arrogant. She was just as unsure as I was, but she was more open about it.\n\nAfter that we became close. Over the next six years we travelled to Italy and France together for international competitions. I remember sitting next to her on a train to Tuscany for two hours. We barely spoke, but it didn't feel awkward at all.\n\nLooking back, I'm really glad I was wrong about her. She taught me that first impressions often say more about us than about the other person. We're still in touch today.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who 補充人", "a friend who I met in my high school choir"], ["★ 關係子句 which 補充事物", "a long high note, which needed more breath control…"], ["★ 很難做到……", "struggle to + V"], ["給人……的感覺", "come across as"], ["突然大笑", "burst out laughing"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "朋友的爭論", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an occasion when two of your friends disagreed about something."], ["提示點", "When the disagreement happened"], ["提示點", "What the two friends disagreed about"], ["提示點", "How the disagreement ended"], ["提示點", "And explain how you felt about this disagreement."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "I remember a time when two of my friends, Maggie and Mina, disagreed about how boyfriends should celebrate special occasions. Maggie said that for birthdays and anniversaries, she expected five things: flowers, a cake, a restaurant meal, a gift and a card. For Valentine's Day or Christmas, she wanted at least four of those things. She felt these gestures would make her feel happy and loved.\n\nMina thought this was too much to ask. She pointed out that it could cost a lot of money, which could put a financial strain on a couple. She also said that spending money didn't necessarily mean someone had put much thought into it. Someone who has enough money could simply pay another person to arrange everything. I was there, and I could see Mina's point.\n\nPersonally, I'd feel uncomfortable expecting someone to buy me so many things. The effort someone puts into a relationship every day matters more to me than the number of presents they give me. Neither friend was willing to change her mind, so eventually we agreed to leave it there. It was something for Maggie and her boyfriend to work out.\n\nAs long as they were both happy, that was what mattered.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 對……造成經濟壓力", "put a financial strain on"], ["★ 關係子句 who", "someone who has enough money"], ["要求太多", "too much to ask"], ["我能理解 Mina 的觀點", "I could see Mina's point"], ["就此打住", "leave it there"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "有趣的討論", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an interesting conversation that you remember well."], ["提示點", "Who you were talking to"], ["提示點", "Where you had the conversation"], ["提示點", "What the conversation was about"], ["提示點", "And explain why you remember this conversation so well."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：媽媽鼓勵我出國念書）・講義修訂", "The conversation I remember most clearly is one I had with my mum at home. It's actually the reason I'm taking this exam today.\n\nAt the time, I'd been working as a data engineer for a few years. Studying abroad had always felt like an impossible dream, something which only other people did. My mum was the one who brought it up. She told me, very calmly, that I'm still young, so I should give it a try now rather than wait until it's too late and live with regret.\n\nMy first reaction was to talk myself out of it. I said I couldn't afford it, especially because I'd be giving up a steady salary, which would put a financial strain on me. That's when she said something I didn't expect at all: she would support me. It was only one sentence, but it completely changed how I saw the decision.\n\nAfter that, I did what I always do with big decisions. I listed the pros and cons and weighed them up carefully. I realised the long-term benefits were bigger than the short-term cost, so I decided to go for it. I'm now preparing for IELTS step by step, and I'm still in the middle of my applications.\n\nI remember it so well because it was the moment a dream turned into a real plan. It wasn't a long conversation, but it changed the direction of my life. I'm really grateful to her, not just for encouraging me, but for believing in me when I couldn't quite believe in myself.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who", "My mum was the one who brought it up"], ["★ which 子句＋經濟壓力", "a steady salary, which would put a financial strain on me"], ["說服自己打消念頭", "talk myself out of it"], ["權衡利弊", "weigh up the pros and cons"], ["放手去做", "go for it"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "幫助小孩", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time you helped child."], ["提示點", "Who the child was"], ["提示點", "When you helped the child"], ["提示點", "How you helped the child"], ["提示點", "And explain how you felt about it"]]}, {"label": "我的答案", "tone": "pos", "items": [["相近題・可延用（MAP-025｜原題：Describe a child who loves drawing/painting）・講義修訂", "I'd like to talk about a time I helped a boy during my volunteer teaching trip to Lesotho, a small country inside South Africa.\n\nI was there for two weeks in high school, teaching maths, basic Chinese and computer skills to middle-school students. Most students were curious and keen to learn, but there was one boy who wasn't. For the whole first week he sat at the back and refused to join in. It was clear that he found both me and the lessons boring.\n\nThen I noticed something. During breaks, he drew small, detailed pictures on any paper he could find, like animals, people and machines. They were really good, and they showed how carefully he looked at things.\n\nSo I decided to bring drawing into my lessons. In a geometry class, instead of using shapes on the board, I asked students to draw buildings and find the angles. He was the first to join in, and the next day he arrived before the bell. By the end of the second week, he was one of the most active students in the class.\n\nOn the last day, he came up and handed me a drawing which showed me standing in front of a blackboard, surrounded by students. He didn't say anything. He just gave it to me and walked away.\n\nI still have that drawing. It reminds me that helping a child starts with understanding what they care about, and that connection comes before content.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who", "one boy who wasn't (keen to learn)"], ["★ 關係子句 which", "a drawing which showed me…"], ["拒絕參與", "refuse to join in"], ["把畫畫帶進課堂", "bring drawing into my lessons"], ["先建立連結，再談內容", "connection comes before content"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "有趣的鄰居", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe an interesting neighbor."], ["提示點", "Who the neighbor is"], ["提示點", "How you knew him/her"], ["提示點", "How often you see him/her"], ["提示點", "And explain why you find this neighbor interesting."]]}, {"label": "我的答案", "tone": "pos", "items": [["自己準備・講義修訂", "An interesting neighbour I'd like to describe is a father whose family is close to mine. His older son is my age, and his twins, a boy and a girl, are the same age as my younger sister, so our families often go out together. He's an interior designer who runs his own company. When we chat, he shares stories about his work and explains the ideas behind his designs.\n\nI enjoy hearing how he thinks about different spaces and comes up with creative solutions. What impresses me most, though, is his interest in fitness. After injuring his back, he realised that he needed to exercise regularly to stay strong as he got older. He started learning about strength training and eventually became an amateur fitness coach.\n\nHe now teaches older adults at a sports centre, which helps them build strength for everyday activities. I admire the fact that he didn't just learn something for his own benefit. He also found a way to share it with others. I think I could learn a lot from him, both about developing professional skills and about making time to maintain a healthy lifestyle.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who", "an interior designer who runs his own company"], ["★ 關係子句 which", "…, which helps them build strength"], ["★ 維持健康生活方式", "maintain a healthy lifestyle"], ["想出有創意的解決方法", "come up with creative solutions"], ["為了自己的好處", "for his own benefit"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "聊得來的朋友", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a friend you enjoy talking to."], ["提示點", "How you knew him/her"], ["提示點", "What kind of person this friend is"], ["提示點", "What you talk about with this friend"], ["提示點", "And explain why you enjoy talking with this friend."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（素材：合唱團朋友（MAP-015））・講義修訂", "The friend I most enjoy talking to is someone who I met in my high school choir. We've known each other for over ten years now.\n\nWe met in the first week of first year. I actually found her a little intimidating at first because she was so outgoing. But we became close after we both failed the same difficult high note in rehearsal and laughed about it. Over the next six years we competed together in Italy and France, and those trips turned us from teammates into real friends.\n\nShe's warm, curious and very direct. She's the kind of person who asks a second question after you answer the first one, which is surprisingly rare. She's also honest. If she thinks I'm overthinking something, she'll tell me.\n\nThese days we usually talk about work, our families, music and places we'd like to travel. She works in a completely different field from me, so when I explain a data problem, she asks simple but smart questions. Sometimes they help me see the problem more clearly.\n\nI enjoy talking with her because I never have to act or worry about how I sound. We're also comfortable with silence. I remember a two-hour train journey through Tuscany when we barely spoke, and it was one of the most relaxing moments of the trip. I think when you can be quiet with someone, the conversations get better too.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who", "someone who I met in my high school choir"], ["★ who + which 升級法", "the kind of person who…, which is surprisingly rare"], ["讓我們從隊友變成真朋友", "turn us from teammates into real friends"], ["能自在地沉默", "be comfortable with silence"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "別人詢問你意見", "en": "人物與人際關係", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a time when someone asked you for your opinion."], ["提示點", "Who asked you for your opinion?"], ["提示點", "Why this person wanted to know your opinion"], ["提示點", "What opinion you gave this person"], ["提示點", "And explain how you felt when this person asked for your opinion."]]}, {"label": "我的答案", "tone": "pos", "items": [["相近題・可延用（MAP-047｜原題：Describe a time when you gave advice to others）・講義修訂", "I'd like to talk about a time when a close friend asked for my opinion about a relationship. It was a while ago, but I still remember the conversation clearly.\n\nMy friend really liked a guy who they had gone on lots of dates with. Sometimes my friend took the initiative, but a lot of the time they waited for him to make the next move. The problem was that he often pretended not to notice. He even disappeared suddenly around Valentine's Day, which was really confusing for my friend.\n\nSo my friend asked me what I thought. Based on my own past experience, I believe that if the 'getting to know each other' stage goes on for too long, the spark between two people starts to fade, and in the end nobody makes a move. So I gave a very direct answer: 'If he hasn't told you how he feels after three months, he probably isn't that into you.'\n\nUnfortunately, my friend didn't take my advice. I told them the same thing several times, but they kept falling for him anyway.\n\nLooking back, I think my advice was honest, but I also learned that it's hard to see clearly when you really like someone. I can't make decisions for my friends. All I can do is tell them what I really think and be there for them.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 關係子句 who", "a guy who they had gone on lots of dates with"], ["★ which 補充整件事", "…, which was really confusing"], ["主動", "take the initiative"], ["採取下一步", "make the next move"], ["火花漸漸消失", "the spark starts to fade"], ["沒那麼喜歡你", "isn't that into you"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "想再去一次的城市", "en": "地點、建築、旅遊與交通", "groups": [{"label": "題卡", "tone": "neu", "items": [["題目", "Describe a city you have visited which you would like to go back to again."], ["提示點", "Which city you visited"], ["提示點", "When you visited this city"], ["提示點", "What you did there"], ["提示點", "And explain why you would like to go back to this city again."]]}, {"label": "我的答案", "tone": "pos", "items": [["相近題・可延用（MAP-036｜原題：Describe your favourite city that you have visited）・講義修訂", "The place I'd love to go back to is Sicily, in the south of Italy. I know it's an island rather than one city, but it's the place from my travels that I miss the most.\n\nI went there in high school with my choir for a music festival competition. It was my first trip abroad without my parents, so I was both excited and a bit nervous. Apart from the competition, we had some free time to walk around and explore.\n\nWhat I remember most is the scenery. The air was fresh, and the sea was incredibly blue. The food was amazing too. I loved the seafood and pasta, which tasted really fresh and simple. And the people who we met were really friendly and welcoming.\n\nI'd go back in a heartbeat, mainly because of the pace of life. Compared with Taipei, where everyone is always in a hurry, life in Sicily felt slow and relaxed. Next time, I'd like to go without a competition schedule, so I can really slow down, enjoy the sea and eat as much as I can. It was a rewarding experience, and it still makes me smile when I think about it.", 1]]}, {"label": "好用詞彙", "tone": "neu", "items": [["★ 和……相比", "Compared with…, …"], ["★ 關係子句 who", "the people who we met"], ["★ 關係子句 which", "seafood and pasta, which tasted…"], ["毫不猶豫地回去", "go back in a heartbeat"], ["★ 有收穫的經驗", "a rewarding experience"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "安靜的地方", "en": "地點、建築、旅遊與交通", "groups": [{"label": "題卡（1）", "tone": "neu", "items": [["題目", "Describe a place you enjoyed visiting that was very quiet"], ["提示點", "Where this place is and why you wanted to visit it"], ["提示點", "Why this place was very quiet"], ["提示點", "What you did there"], ["提示點", "And explain why you enjoyed visiting this place that was very quiet."]]}, {"label": "題卡（2）", "tone": "neu", "items": [["題目", "Describe a quiet place where you like to go."], ["提示點", "Where it is"], ["提示點", "How you found it"], ["提示點", "How often you go there"], ["提示點", "And explain why you like going in this quite place."]]}, {"label": "我的答案", "tone": "pos", "items": [["新撰寫・含個人素材（題卡 1）（素材：賴索托（MAP-035））・講義修訂", "The quiet place I'd like to talk about is Lesotho, a small mountainous country which is completely surrounded by South Africa. I went there for two weeks when I was seventeen, as a volunteer teacher through a school programme. I wanted to go because I hoped to do something really useful, and I was curious about a place very few people even know about.\n\nIt was quiet mainly because of the landscape and the way of life. The area where we stayed was surrounded by open hills, with very few cars and no city noise at all. In the evenings it was almost completely silent. There was just the wind, the occasional animal and a huge sky.\n\nDuring the day I taught maths, basic Chinese and computer skills at a local middle school, so the classroom was lively. But after classes I'd often sit outside and just watch the light change over the mountains.\n\nI enjoyed it because the quietness changed how I felt about time. Coming from Taipei, where everything is fast and crowded, it was the first time I'd felt time really slow down. It gave me space to think about everything I was learning, about the students and about myself. I think that silence is part of the reason the trip has stayed with me so clearly. It's definitely a place I'd love to go back to one day, just to sit outside and enjoy that silence again.", 1], ["新撰寫・含個人素材（題卡 2）（素材：S04 河濱公園（MAP-032／A1-006））・講義修訂", "The quiet place I like to go to is a riverside park along the Danshui River in Taipei.\n\nI found it years ago almost by accident, when I was looking for somewhere new to walk my dog, Oakley, who is a Shetland Sheepdog. Most parks in Taipei are small and surrounded by traffic, so when I came across this wide open area of grass next to the water, it felt like a real discovery.\n\nI go there two or three times a week, usuall
