eaming on the supermarket floor because they can't have a toy. Kids also run around in restaurants or kick the seat in front of them on the MRT. This is mainly because young children struggle to understand other people's boundaries. For example, while I was queuing for bubble tea, a little girl kept petting my dog, Oakley, even after her mother told her to ask first. So it's often less about being naughty and more about not understanding the rules yet.", 1], ["★ 這主要是因為……（Part 3 架構）", "This is mainly because…"], ["★ 很難理解", "struggle to understand"], ["在公共場合發脾氣", "tantrums in public"], ["與其說是……不如說是……", "less about … and more about …"]]}, {"label": "Q2 What can parents do to stop thei…", "tone": "neu", "items": [["題目", "What can parents do to stop their children from misbehaving?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "I think being consistent matters more than being strict. This is mainly because if a rule is used on Monday but ignored on Friday, children quickly learn that rules can be broken. By explaining the reason behind a rule, parents can help children understand it, which makes them more likely to follow it. For example, a little girl once kept petting my dog, Oakley, without asking. When her mother told her to ask first, she simply asked while still petting him. She'd heard the rule, but she hadn't understood it. Praising good behaviour helps too, although no single method works for every child.", 1], ["★ 藉由解釋……，父母可以……（By + V-ing 句型）", "By explaining…, parents can…, which…"], ["★ 這主要是因為……", "This is mainly because…"], ["規則背後的理由", "the reason behind a rule"], ["沒有一種方法適用所有孩子", "no single method works for every child"]]}, {"label": "Q3 Do you agree that parents used t…", "tone": "neu", "items": [["題目", "Do you agree that parents used to be stricter with their children than they are today?"], ["新撰寫・含個人素材（素材：媽媽鼓勵我出國念書）・講義修訂", "Broadly, yes. My parents' generation in Taiwan grew up with physical punishment at home and at school, and children were expected to obey. Compared with the past, parents today are more likely to explain things rather than just give orders. For example, my mum encouraged me to study abroad by explaining that I'm still young and should try it now rather than wait and live with regret. However, when it comes to schoolwork, I'd say many Taiwanese parents are still just as demanding as before.", 1], ["★ 跟過去相比，……比較會……而不是……（7+ 句型）", "Compared with the past, … are more likely to … rather than …"], ["體罰", "physical punishment"], ["帶著遺憾過日子", "live with regret"], ["說到……", "when it comes to"]]}, {"label": "Q4 Who has more influence on a youn…", "tone": "neu", "items": [["題目", "Who has more influence on a young person’s behaviour—family or friends?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "Whether young people are more influenced by family or friends depends on their age. Young children are mainly influenced by their family, because parents shape their daily routines and values. Once kids become teenagers, though, friends become more important, since teenagers really care about fitting in. For example, a friend I met in my first week in the high-school choir taught me not to let my nerves stop me when I perform, and I still think about that. So I'd say family builds the foundation, while friends test it.", 1], ["★ 是……還是……取決於……（7+ 句型）", "Whether … or … depends on…"], ["★ 受……影響", "be influenced by"], ["融入群體", "fitting in"], ["打下基礎", "builds the foundation"]]}, {"label": "Q5 Is setting a good example the mo…", "tone": "neu", "items": [["題目", "Is setting a good example the most effective way to change someone’s behaviour?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "Setting a good example is probably the way that lasts longest, although it isn't always the fastest. This is mainly because people, especially children, are influenced by what they see far more than what they're told. For example, I saw this with my mum. Watching her go through chemotherapy and still choose to be kind every day changed how I see strength, more than any advice could. Still, an example alone isn't enough when someone lacks the skills, so clear guidance is sometimes needed too.", 1], ["以身作則", "setting a good example"], ["★ 受……影響", "be influenced by"], ["★ 這主要是因為……", "This is mainly because…"], ["接受化療", "go through chemotherapy"], ["明確的指導", "clear guidance"]]}, {"label": "Q6 What do you think of the idea th…", "tone": "neu", "items": [["題目", "What do you think of the idea that people will only change their behaviour if they want to?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "I think it's largely true, at least for long-term change. You can force someone to follow a rule, but once the pressure is gone, they often go back to their old habits. That said, the wish to change doesn't always come naturally. Sometimes a crisis can trigger it. For example, when my mum was diagnosed with cancer, our whole family's routine changed around her treatment almost overnight, and nobody needed persuading. As a result, I'd say people do need to want it, but outside events can create that motivation.", 1], ["回到老習慣", "go back to their old habits"], ["幾乎一夜之間", "almost overnight"], ["不需要任何人勸", "nobody needed persuading"], ["★ Part 3 架構舉例與結果", "For example… / As a result…"]]}], "acc": ["#a86bc0", "#c294d6"]}, {"zh": "有趣的老人", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 Do you think it’s good for child…", "tone": "neu", "items": [["題目", "Do you think it’s good for children to spend a lot of time with their grandparents?"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "Generally, yes. This is mainly because grandparents tend to have more time and patience than working parents. They can also pass on things that schools don't teach, like family history, Taiwanese Hokkien and traditional cooking. For example, in my family we still make dumplings together at celebrations, which used to be my grandma's job. It helps us strengthen family bonds. The only problem is that grandparents sometimes spoil children and ignore the parents' rules, so it works best when the adults agree on some basic rules.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["傳承", "pass on"], ["★ 加強家庭關係", "strengthen family bonds"], ["寵壞小孩", "spoil children"]]}, {"label": "Q2 Which do you think is easier—bei…", "tone": "neu", "items": [["題目", "Which do you think is easier—being a parent or being a grandparent?"], ["新撰寫・含個人素材（素材：媽媽的其他素材）・講義修訂", "In most cases, being a grandparent is easier. While grandparents get the fun parts of childcare, parents have the final responsibility and a heavy workload. They have to deal with discipline, school, money and their careers at the same time. For example, in my family, making dumplings for celebrations used to be my grandma's job, which was the fun side of family life. However, in Taiwan many grandparents are actually full-time carers because both parents work long hours. For them, it can be physically exhausting.", 1], ["★ 雖然……，但……（7+ 句型）", "While…, …"], ["★ 沉重的工作量", "a heavy workload"], ["最終的責任", "the final responsibility"], ["全職照顧者", "full-time carers"]]}, {"label": "Q3 Is it always better for older pe…", "tone": "neu", "items": [["題目", "Is it always better for older people to live with their families?"], ["新撰寫・含個人素材（素材：我的家與房間）・講義修訂", "Not always. Living with family can provide emotional support and practical help, which is why many families in Taiwan still live together. But it can also cause conflicts, because people have different routines and different ideas about privacy. For example, I live with my parents, my younger sister and our dog, but having my own room, decorated my own way, is what makes it comfortable. Older people need personal space too. As a result, living close by can sometimes work better than living under the same roof.", 1], ["★ 提供情緒支持", "provide emotional support"], ["對隱私有不同看法", "different ideas about privacy"], ["住在附近", "live close by"], ["同住一個屋簷下", "under the same roof"]]}, {"label": "Q4 What benefits can a company get…", "tone": "neu", "items": [["題目", "What benefits can a company get from hiring older employees?"], ["新撰寫・含個人素材（素材：我的主管）・講義修訂", "Quite a few. Older employees bring a lot of experience. They've seen projects fail, so they know which shortcuts are dangerous. They also tend to be more loyal, and they can be excellent mentors for younger staff. For example, my manager works through problems with me and guides me towards a solution, but then lets me solve them myself. That kind of guidance usually comes with experience. One potential downside is that some may be reluctant to use new tools, but that's a matter of training rather than ability.", 1], ["★ 潛在缺點", "a potential downside"], ["★ 不願意……", "be reluctant to"], ["引導我找到解法", "guide me towards a solution"], ["是訓練問題而非能力問題", "a matter of training rather than ability"]]}, {"label": "Q5 Why do most countries set a spec…", "tone": "neu", "items": [["題目", "Why do most countries set a specific age for retirement?"], ["新撰寫・一般論述・講義修訂", "Mainly for planning. A fixed retirement age not only helps governments work out how much they need to pay in pensions but also helps companies plan ahead, allowing younger workers to move up. In the past, it also reflected the idea that physical work gets harder with age. However, since people now live much longer, pensions have become a heavy financial burden, resulting in pressure to change the system. For example, Taiwan is one of the countries debating whether the retirement age should be raised.", 1], ["★ 不僅……也……，讓……（7+ 句型）", "not only … but also …, allowing…"], ["★ 由於……，導致……（7+ 句型）", "since…, …, resulting in…"], ["★ 經濟負擔", "a financial burden"], ["事先規劃", "plan ahead"]]}, {"label": "Q6 Do you think it’s more beneficia…", "tone": "neu", "items": [["題目", "Do you think it’s more beneficial or harmful for older people to keep working after they retire?"], ["新撰寫・一般論述・講義修訂", "On balance, I think it's more beneficial, as long as it's their own choice. By staying active, older people can keep their minds sharp and stay in touch with others, which can boost their mental well-being. For example, part-time jobs or consulting can give retirees a daily routine without too much stress. However, it becomes harmful when people have to do physically demanding jobs because of financial strain. In that case, it's a sign that the pension system isn't good enough, not a sign of a healthy lifestyle.", 1], ["★ 藉由保持活躍，長者可以……（By + V-ing 句型）", "By staying active, older people can…, which…"], ["★ 促進心理健康", "boost their mental well-being"], ["★ 與……保持聯絡", "stay in touch with"], ["耗體力的工作", "physically demanding jobs"]]}], "acc": ["#5b78cc", "#8ba2e0"]}, {"zh": "聰明的人", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What kinds of games can help chi…", "tone": "neu", "items": [["題目", "What kinds of games can help children become more intelligent?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "Strategy games like chess, Go or even Minecraft are probably the most useful. This is mainly because they train planning and problem-solving, while puzzles and Lego help children understand shapes and space. I'd also include group games, because working together builds social skills. For example, when I volunteered in Lesotho, I started lessons with simple games and songs. They helped me break the ice with students who weren't used to structured lessons. However, the game itself matters less than whether the child is actively thinking rather than just watching.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["★ 而不是……", "… rather than …"], ["打破僵局", "break the ice"], ["培養社交能力", "builds social skills"]]}, {"label": "Q2 Do you agree that talking to chi…", "tone": "neu", "items": [["題目", "Do you agree that talking to children is the best way to help them develop their intelligence?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "Talking is definitely one of the most important ways, especially in the early years. This is mainly because conversation helps children develop language, and open-ended questions push them to think and explain. For example, my high-school maths teacher would prepare different explanations depending on how we reacted, so talking with him felt like thinking together. However, I wouldn't say it's the best way on its own. Children also become smarter through hands-on activities, reading and making mistakes.", 1], ["★ 這主要是因為……", "This is mainly because…"], ["開放式問題", "open-ended questions"], ["動手做的活動", "hands-on activities"], ["單靠它本身", "on its own"]]}, {"label": "Q3 Do you think spending too much t…", "tone": "neu", "items": [["題目", "Do you think spending too much time on modern technology can make children less intelligent?"], ["新撰寫・含個人素材（素材：YouTube 雅典民主影片）・講義修訂", "To some extent, yes. Children today are constantly exposed to short videos, which can lead to a short attention span. Also, if every answer is just one search away, they may never learn to think things through. But technology isn't always harmful. For example, I've watched one YouTube video about the birth of Athenian democracy three times and taken notes on it. That's screen time, but I was really thinking. So the problem isn't the screen itself but how it's used. Passive scrolling makes the mind lazy, while active, curious use can make it sharper.", 1], ["★ 不斷接觸到……", "be constantly exposed to"], ["★ 注意力持續時間短", "a short attention span"], ["把事情想透徹", "think things through"], ["被動地滑手機", "passive scrolling"]]}, {"label": "Q4 What types of jobs require a hig…", "tone": "neu", "items": [["題目", "What types of jobs require a high level of intelligence?"], ["新撰寫・含個人素材（素材：我的主管）・講義修訂", "The obvious ones are medicine, law, engineering and research. These are jobs that involve complex information and important decisions. But intelligence isn't only about grades. Teachers, negotiators and diplomats need emotional intelligence to understand people and adapt quickly. For example, whenever I run into a problem, my manager sits down and analyses it with me, then guides me towards a solution rather than just giving me the answer. That kind of intelligence is often harder to train than technical knowledge.", 1], ["★ 涉及……的工作（關係子句）", "jobs that involve…"], ["情緒智商", "emotional intelligence"], ["★ 而不是……", "… rather than …"], ["引導某人找到解法", "guide sb towards a solution"]]}, {"label": "Q5 Do you think managers should use…", "tone": "neu", "items": [["題目", "Do you think managers should use intelligence tests when hiring new employees?"], ["新撰寫・含個人素材（素材：自學的同事）・講義修訂", "Only as one part of the process. Tests can measure reasoning ability fairly and help companies deal with large numbers of applicants. A major drawback is that they can't show someone's curiosity or how hard they work, which often matter more. For example, one of my colleagues originally studied business and taught himself data engineering through online resources and open-source projects. He's now a team lead, but a strict test might have filtered him out. As a result, I think a practical task related to the actual job is usually a better way to judge people than an IQ test.", 1], ["★ 主要缺點", "a major drawback"], ["把某人篩掉", "filter sb out"], ["跟實際工作相關的實作任務", "a practical task related to the actual job"], ["★ Part 3 架構舉例與結果", "For example… / As a result…"]]}, {"label": "Q6 Do you agree that being very int…", "tone": "neu", "items": [["題目", "Do you agree that being very intelligent can sometimes be a disadvantage at work?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "Sometimes, yes. Very intelligent people sometimes struggle to be patient with colleagues who think more slowly. Some also make simple problems too complicated, because they look for a clever solution instead of a reliable one. For example, I learned this during a database migration across about 1,200 servers. What worked wasn't cleverness but careful mapping and small, safe steps. So these are really problems of attitude rather than intelligence. Someone who's both smart and humble is usually a huge asset to any team.", 1], ["★ 很難做到……", "struggle to"], ["把簡單的問題複雜化", "make simple problems too complicated"], ["小而安全的步驟", "small, safe steps"], ["是態度問題而不是聰明與否", "problems of attitude rather than intelligence"]]}], "acc": ["#6b7a8c", "#9aa8b8"]}, {"zh": "被勸說的時刻", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What impact does advertising hav…", "tone": "neu", "items": [["題目", "What impact does advertising have on children and their parents?"], ["新撰寫・含個人素材（素材：朴寶劍）・講義修訂", "Quite a big one. Children today are constantly exposed to advertisements, especially when YouTubers casually promote toys or snacks. This is mainly because they can't easily tell entertainment from marketing, so they're easily influenced by ads. While some ads can spark their imagination, many encourage unnecessary spending and create unrealistic expectations. As a result, kids keep asking their parents until they give in, which causes money pressure and arguments at home. That said, not every ad is bad. When Park Bo-gum promoted a skincare brand, it came across as sincere, so parents can use examples like that to teach children how marketing works.", 1], ["★ 不斷接觸廣告", "constantly exposed to advertisements"], ["★ 受……影響", "be influenced by"], ["★ 激發想像力", "spark their imagination"], ["★ 鼓勵不必要的消費", "encourage unnecessary spending"], ["★ 造成不切實際的期待", "create unrealistic expectations"]]}, {"label": "Q2 What do parents often persuade t…", "tone": "neu", "items": [["題目", "What do parents often persuade their children to do?"], ["新撰寫・含個人素材（素材：妹妹）・講義修訂", "Mostly everyday things, like eating vegetables, going to bed on time and limiting screen time. In Taiwan, parents also try hard to persuade children to go to cram schools or stick with difficult subjects. When children struggle to keep up, persuasion works best when it helps them see the problem differently. For example, when my younger sister wanted to drop a statistics course in her first year, I told her the difficulty showed she was learning, not failing, and she stayed. Of course, it only works if the child makes the final decision for themselves.", 1], ["★ 跟不上、很吃力", "struggle to keep up"], ["補習班", "cram schools"], ["堅持念困難的科目", "stick with difficult subjects"], ["換個角度看問題", "see the problem differently"]]}, {"label": "Q3 Who do children listen to more,…", "tone": "neu", "items": [["題目", "Who do children listen to more, their parents or their teachers?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "It depends on their age and the topic. Young children often listen to teachers more easily. This is mainly because teachers seem fair and neutral, and kids tend to test boundaries more at home. As they grow older, though, they're more influenced by whoever they have a real connection with. For example, my maths teacher would remember something you'd said six months earlier, so we really listened to him. As a result, I think respect doesn't come with a title. It's earned through the relationship, whether that's with a parent or a teacher.", 1], ["★ 受……影響", "be influenced by"], ["★ 這主要是因為……", "This is mainly because…"], ["試探底線", "test boundaries"], ["真誠的連結", "a real connection"]]}, {"label": "Q4 What are the good ways to persua…", "tone": "neu", "items": [["題目", "What are the good ways to persuade children?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "The most effective way is to explain the reason rather than just give orders. This is mainly because children cooperate much more when they understand why. But persuasion also starts with building a connection. For example, in Lesotho, one boy refused to join any of my lessons. I spent time with him one-on-one and found out he loved drawing, so I used that to bring him in. By the last week, he was arriving early. Offering simple choices and praise helps too, but nothing works if the child doesn't feel understood.", 1], ["★ 而不是……", "… rather than …"], ["★ 這主要是因為……", "This is mainly because…"], ["一對一", "one-on-one"], ["下命令", "give orders"]]}, {"label": "Q5 What advice should young people…", "tone": "neu", "items": [["題目", "What advice should young people follow?"], ["新撰寫・含個人素材（素材：高中數學老師）・講義修訂", "I think young people should listen to advice from people who've actually been through the same experience, like a mentor or an older relative. The best advice, though, doesn't decide for you. For example, my high-school maths teacher told me not to study a subject, but a question I couldn't stop thinking about, and that's why I chose computer science. Practical advice about money and health is valuable too. However, young people should think carefully about advice rather than follow it blindly, because it's based on the giver's own experience in a different time.", 1], ["★ 真正經歷過的人（who 子句）", "people who've actually been through…"], ["不會替你做決定", "doesn't decide for you"], ["★ 而不是……", "… rather than …"], ["盲目聽從", "follow it blindly"]]}], "acc": ["#3d9c8f", "#6fc4b7"]}, {"zh": "由不喜歡到喜歡的朋友", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What do you think of making frie…", "tone": "neu", "items": [["題目", "What do you think of making friends online?"], ["相近題・可延用（F3-200）・講義修訂", "I think it's a good thing overall, but it has limits. This is mainly because the internet lets people find others who share the same interests, even in another country. However, online friends only see the side of you that you choose to show, so it's harder to develop mutual trust. For example, people may hide part of their identity or give false information. As a result, the strongest online friendships usually become real ones when people finally meet in person.", 1], ["★ 建立相互信任", "develop mutual trust"], ["★ 關係子句 who", "people who share the same interests"], ["隱藏部分身分", "hide part of their identity"], ["當面見面", "meet in person"]]}, {"label": "Q2 Is it a good idea to make friend…", "tone": "neu", "items": [["題目", "Is it a good idea to make friends with people who are much older than you?"], ["相近題・可延用（F3-052）・講義修訂", "Yes, I think it's a good idea. This is mainly because older friends have more life experience, so they can help you see things from a different perspective and give calmer advice. Younger friends, on the other hand, bring energy and new ideas. For example, an older friend who has already changed careers can tell you what to expect. As a result, having friends of different ages can broaden your horizons more than a social circle where everyone is the same.", 1], ["★ 拓展視野", "broaden your horizons"], ["★ 從不同角度看事情", "see things from a different perspective"], ["人生經驗", "life experience"], ["社交圈", "a social circle"]]}, {"label": "Q3 Do the people in your country en…", "tone": "neu", "items": [["題目", "Do the people in your country enjoy meeting new people?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "To some extent, yes, but more slowly than in Western cultures. Taiwanese people are friendly, but many are reluctant to start a conversation with a complete stranger. This is mainly because deeper friendships usually form through school, work or shared hobbies. For example, a good friend of mine is someone from my school choir. I found her a bit too much at first, but we clicked after we both failed the same high note and burst out laughing. As a result, we enjoy meeting people, but we prefer a shared activity rather than a random meeting.", 1], ["★ 不太願意主動開啟對話", "be reluctant to start a conversation"], ["共同嗜好", "shared hobbies"], ["一拍即合", "click"], ["突然大笑", "burst out laughing"]]}, {"label": "Q4 Do you think friendship is impor…", "tone": "neu", "items": [["題目", "Do you think friendship is important?"], ["相近題・可延用（F3-050）・講義修訂", "Yes, very important. This is mainly because close friends can provide emotional support when people go through difficult times. Friendships also teach us basic skills, like loyalty, how to handle disagreements and how to forgive. For example, children who have strong friendships usually find it easier to deal with relationships as adults, because they've had more practice. As a result, people with good friends often feel a stronger sense of belonging and cope better with stress.", 1], ["★ 提供情緒支持", "provide emotional support"], ["★ 感受到歸屬感", "feel a sense of belonging"], ["★ 關係子句 who", "children who have strong friendships"], ["應付壓力", "cope with stress"]]}, {"label": "Q5 Why is it difficult for some peo…", "tone": "neu", "items": [["題目", "Why is it difficult for some people to make friends with others?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "There are several reasons. Some people are naturally introverted, so starting a conversation feels tiring. I'm fairly introverted myself, and I really need some me time to recharge, so after a long working day, meeting new people isn't always easy. Others simply lack opportunities, because adults with a heavy workload have little time to meet anyone outside the office. Also, although we're constantly connected online, many people struggle to talk face to face, which makes new friendships harder to start.", 1], ["★ 沉重的工作量", "a heavy workload"], ["★ 很難面對面交談", "struggle to talk face to face"], ["內向的", "introverted"], ["充電、恢復精力", "recharge"]]}, {"label": "Q6 Do we benefit from having friend…", "tone": "neu", "items": [["題目", "Do we benefit from having friends with different personalities?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "Definitely. This is mainly because friends who think differently help us see things from other people's perspectives, and they make us more open-minded. For example, when I joined my high-school choir, one girl was so outgoing that I found her a bit too much at first. But after we both failed the same high note and burst out laughing, we became close friends, and we still keep in touch. As a result, I learned a lot from someone who was very different from me. Of course, some shared values are still needed; otherwise the friendship won't last.", 1], ["★ 從別人的角度看事情", "see things from other people's perspectives"], ["★ 心胸開放的", "open-minded"], ["★ 關係子句 who", "friends who think differently"], ["保持聯絡", "keep in touch"]]}], "acc": ["#5aa04a", "#84c473"]}, {"zh": "朋友的爭論", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What are some small things that…", "tone": "neu", "items": [["題目", "What are some small things that family members often argue about?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Usually very small, everyday things, like whose turn it is to do the dishes, leaving the lights on, or what to watch on TV. In Taiwanese families, food is a common cause too, like parents insisting you eat more. This is mainly because family members spend so much time together. In my family, for example, we take turns cooking, so everyone shares the responsibility, which probably prevents a few arguments. As a result, these arguments are rarely about the issue itself. They're usually a way to relieve everyday stress, and most are forgotten within an hour.", 1], ["★ 紓解壓力", "relieve stress"], ["輪流", "take turns"], ["分擔責任", "share the responsibility"], ["一小時內就忘了", "be forgotten within an hour"]]}, {"label": "Q2 Do people tend to have more disa…", "tone": "neu", "items": [["題目", "Do people tend to have more disagreements with family or with friends?"], ["新撰寫・含個人素材（素材：妹妹）・講義修訂", "Most people argue more with family. Compared with friends, family members are more likely to say exactly what they think rather than stay polite. This is mainly because we spend more time with them, and we know they'll always be there. With friends, we're more careful, since a friendship can end if things go too far. For example, with my younger sister, I can be very direct. When she wanted to drop her statistics course, I told her plainly that finding it difficult means you're learning, not failing, and she stayed. As a result, family arguments happen more often, but they're also sorted out quickly, because people can't simply walk away.", 1], ["★ 講義 7+ 句型", "Compared with…, … rather than…"], ["太過分", "go too far"], ["退選課程", "drop a course"], ["一走了之", "walk away"]]}, {"label": "Q3 Do you think conversations are m…", "tone": "neu", "items": [["題目", "Do you think conversations are more interesting when people have different opinions?"], ["新撰寫・含個人素材（素材：決定離職、出國念書）・講義修訂", "Generally, yes, as long as everyone stays respectful. This is mainly because hearing a different view makes you explain your own reasons clearly, and sometimes you realise you were wrong. It also helps you see things from other people's perspectives. For example, when I decided to leave my job to study abroad, I listened to my parents' and friends' views and weighed up the pros and cons before making the decision myself. As a result, I felt much more confident about my choice. The problem is that many online discussions turn into a fight to win rather than a real conversation.", 1], ["★ 從別人的角度看事情", "see things from other people's perspectives"], ["權衡利弊", "weigh up the pros and cons"], ["只要", "as long as"], ["而不是……", "… rather than…"]]}, {"label": "Q4 When people can’t agree on somet…", "tone": "neu", "items": [["題目", "When people can’t agree on something, do you think it’s a good idea to ask someone else to help?"], ["新撰寫・含個人素材（素材：Email 四天沒回）・講義修訂", "It can be, especially when both sides are too emotional to see clearly. This is mainly because a neutral third party can calm things down and help each person feel heard. However, sometimes the real problem is a communication breakdown rather than a real disagreement. For example, during a big migration project, I once heard nothing for four days about a proposal I'd emailed. When I went to see the head of operations in person, it was sorted in five minutes. As a result, I think it's worth talking face to face first, before involving other people.", 1], ["★ 溝通失靈", "a communication breakdown"], ["中立的第三方", "a neutral third party"], ["感到被傾聽", "feel heard"], ["解決了", "sorted"]]}, {"label": "Q5 Why do some people find it hard…", "tone": "neu", "items": [["題目", "Why do some people find it hard to accept opinions that are different from theirs?"], ["新撰寫・含個人素材（素材：自學的同事）・講義修訂", "Mostly because some people take disagreements personally. Their opinions become part of who they are, so when someone challenges their views, it feels like a personal attack. Also, people tend to read things that support what they already believe, and social media shows them more of the same. As a result, they struggle to see things from other people's perspectives. The people I admire do the opposite. For example, a self-taught colleague of mine, who is now a team lead, isn't afraid of being wrong and changes direction quickly. Sadly, not everyone is that open-minded.", 1], ["★ 把意見不合當成針對自己", "take disagreements personally"], ["★ 從別人的角度看事情", "see things from other people's perspectives"], ["★ 心胸開放的", "open-minded"], ["★ 很難做到……", "struggle to + V"], ["人身攻擊", "a personal attack"]]}, {"label": "Q6 Do you agree that sometimesit’s…", "tone": "neu", "items": [["題目", "Do you agree that sometimesit’s right to stick to your opinion,even if others disagree?"], ["新撰寫・含個人素材（素材：物流科技創業者（化名 Wei））・講義修訂", "Yes, especially when the issue involves right and wrong, or solid evidence. The key is the difference between being confident and being stubborn. For example, I once advised a logistics start-up on a data project. The founder always asked what would break first if traffic tripled. Although his approach meant slower progress, he still stuck to it because he'd rather spend twice as long doing it properly the first time. So if you've really considered the other side's arguments, standing firm is admirable. But refusing to listen at all is just stubbornness.", 1], ["★ 講義 7+ 句型", "Although…, … still… because…"], ["確鑿的證據", "solid evidence"], ["堅持", "stick to"], ["立場堅定", "standing firm"]]}], "acc": ["#c96b96", "#dc95b5"]}, {"zh": "有趣的討論", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What kinds of things do young pe…", "tone": "neu", "items": [["題目", "What kinds of things do young people usually talk about with their friends?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "Mostly entertainment and everyday life, like the latest series, music, games and whatever's popular on Instagram or TikTok. This is mainly because these are things they all have in common. For example, I've noticed that young people in Taiwan have recently been playing Pikmin Bloom, a mobile game which encourages you to walk and grow virtual flowers. So even exercise has become something to chat about. As they get older, they talk more about careers, salaries and housing costs, which are big worries in Taipei. As a result, the topics change, but the purpose stays the same: to strengthen their friendships.", 1], ["★ 有共同點", "have something in common"], ["★ 關係子句 which", "a mobile game which encourages you to walk"], ["可以聊的話題", "something to chat about"], ["房價、居住成本", "housing costs"]]}, {"label": "Q2 Do you think friends talk to eac…", "tone": "neu", "items": [["題目", "Do you think friends talk to each other more or less now than they did in the past?"], ["相近題・可延用（錄音逐字稿 Technology & Communication Q1）・講義修訂", "I'd say they talk more often, but less deeply. Compared with the past, friends nowadays tend to chat online rather than meet in person. Since the internet is everywhere, people send messages all day, which allows them to stay in touch regardless of distance. In the past, people relied more on face-to-face meetings or phone calls. As a result, although we talk more often now, face-to-face conversations still feel more personal and help build stronger emotional connections.", 1], ["★ 講義 7+ 句型", "Compared with…, … tend to… rather than…"], ["★ 保持聯絡", "stay in touch"], ["不論距離遠近", "regardless of distance"], ["情感連結", "emotional connections"]]}, {"label": "Q3 Do you agree that good friends d…", "tone": "neu", "items": [["題目", "Do you agree that good friends don’t need to meet and talk in person?"], ["相近題・可延用（錄音逐字稿 Technology & Communication Q3）・講義修訂", "I partly agree. Compared with online friendships, face-to-face friendships tend to feel more personal. This is mainly because when people spend time together in person, they build stronger emotional connections. Online, it can be hard to know if someone is being completely honest, since people can hide part of their identity. That said, I don't think online friendships are always less genuine. Some friendships start online, and as people build trust over time, they become long-lasting friendships. So whether good friends need to meet in person depends on the individual and the situation.", 1], ["★ 講義 7+ 句型", "Whether… depends on…"], ["★ 與……相比", "Compared with…"], ["隨時間建立信任", "build trust over time"], ["長久的", "long-lasting"]]}, {"label": "Q4 Why is good communication import…", "tone": "neu", "items": [["題目", "Why is good communication important in the workplace?"], ["新撰寫・含個人素材（素材：S03 資料庫遷移）・講義修訂", "Because almost every workplace problem is, in some way, a communication problem. This is mainly because a communication breakdown leads to repeated work, missed deadlines and costly mistakes. For example, when I led a database change across about 1,200 servers, the hardest part wasn't the code. It was making sure every team knew when the changes would happen and how we'd undo them if something went wrong. As a result, good communication builds trust, which makes people more willing to raise problems early.", 1], ["★ 溝通失靈", "a communication breakdown"], ["★ 準時完成／錯過期限", "meet deadlines / missed deadlines"], ["代價高昂的錯誤", "costly mistakes"], ["及早提出問題", "raise problems early"]]}, {"label": "Q5 What things can make communicati…", "tone": "neu", "items": [["題目", "What things can make communication difficult at work?"], ["新撰寫・含個人素材（素材：Email 四天沒回）・講義修訂", "Hierarchy is a big one, especially in Asian workplaces, where junior staff are often reluctant to question a manager. Remote work also makes it harder, because tone gets lost in text messages. And information overload means important messages get buried. For example, a proposal I'd emailed to an operations manager got no reply for four days. It turned out to be stuck in his boss's inbox, and a five-minute talk in person solved it. As a result, I now follow up face to face by day three.", 1], ["★ 不願意……", "be reluctant to + V"], ["★ 資訊超載", "information overload"], ["語氣無法傳達", "tone gets lost"], ["追進度", "follow up"]]}, {"label": "Q6 Do you think managers should alw…", "tone": "neu", "items": [["題目", "Do you think managers should always ask their employees for their opinions?"], ["新撰寫・含個人素材（素材：我的主管）・講義修訂", "Not always, but more often than many managers do. This is mainly because front-line employees often understand problems better, and asking them improves both decisions and team spirit. Also, many employees are reluctant to express their opinions unless they're asked. For example, my own manager analyses problems with me and guides me towards a solution, but then lets me sort it out myself, which makes me feel trusted. However, in an emergency, asking everyone would slow things down. So if a manager decides alone, they should at least explain why.", 1], ["★ 不願表達意見", "be reluctant to express their opinions"], ["第一線員工", "front-line employees"], ["團隊士氣", "team spirit"], ["自己解決", "sort it out"]]}], "acc": ["#b0559b", "#c982bb"]}, {"zh": "幫助小孩", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What kind of help can people giv…", "tone": "neu", "items": [["題目", "What kind of help can people give to their neighbors?"], ["新撰寫・含個人素材（素材：S02 媽媽抗癌）・講義修訂", "Mostly small, practical things, like collecting parcels when someone's away, watering plants, or checking on an elderly neighbour who lives alone. In Taiwan, sharing food during festivals is also common. This is mainly because these small actions make daily life easier for people who are busy or unwell. I learned that when my mum was having cancer treatment: something as simple as taking over the evening meals on treatment days let her rest. As a result, I think help works best when it's offered freely rather than expected.", 1], ["★ 關係子句 who", "an elderly neighbour who lives alone"], ["探望、關心", "check on"], ["接手", "take over"], ["自願給予而非被期待", "offered freely rather than expected"]]}, {"label": "Q2 How do schools encourage young p…", "tone": "neu", "items": [["題目", "How do schools encourage young people to help others?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "Taiwanese schools do it in quite organised ways. Students are given cleaning duties for classrooms and shared spaces, which teaches them to be responsible for their community. Many high schools also require service-learning hours, so students volunteer at hospitals, libraries or charities. Some schools even organise overseas service trips; that's how I ended up in Lesotho at seventeen. However, a major drawback is that when volunteering is required, it can feel like just another task, unless teachers help students think about why it matters.", 1], ["★ 主要缺點", "a major drawback"], ["打掃工作", "cleaning duties"], ["服務學習時數", "service-learning hours"], ["最後到了……", "end up in"]]}, {"label": "Q3 Do you think people are naturall…", "tone": "neu", "items": [["題目", "Do you think people are naturally willing to help others?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "To some extent, yes. Even very young children will help an adult who drops something, which suggests that kindness is partly natural. But this willingness is easily influenced by the situation. People help less when they're in a hurry, or when they're in a crowd and assume someone else will step in. That's why I think habits matter. If I could, I'd make all students do at least two weeks of community service, an idea that comes from my time volunteering in Lesotho. So the instinct exists, but whether people act on it depends on the situation.", 1], ["★ 受……影響", "be influenced by"], ["★ 講義 7+ 句型", "whether… depends on…"], ["出手幫忙", "step in"], ["社區服務", "community service"]]}, {"label": "Q4 Do you think everyone should do…", "tone": "neu", "items": [["題目", "Do you think everyone should do some volunteer work in their community?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "Ideally, yes. This is mainly because volunteering not only broadens people's horizons but also connects them with groups they'd normally never meet. For students, I'd even make it a requirement, at least two weeks of community service, because volunteering in Lesotho at seventeen changed how I see helping others. For adults, though, I wouldn't force it, since a single parent working two jobs may simply not have the time. As a result, flexible options, like mentoring or sharing skills online, are probably better than forcing people.", 1], ["★ 講義 7+ 句型", "not only… but also…"], ["★ 拓展視野", "broaden people's horizons"], ["社區服務", "community service"], ["彈性的選擇", "flexible options"]]}, {"label": "Q5 What is the importance of volunt…", "tone": "neu", "items": [["題目", "What is the importance of volunteering time and donating money to help others?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "Both are important because they fill gaps that governments can't cover. Donations pay for medical research, disaster relief and scholarships. Volunteering, though, offers something money can't buy. By spending time with people, volunteers can build real human connections, which donations alone can't do. For example, when I taught in Lesotho for just two weeks, many students cried when we said goodbye. That showed me that being there mattered as much as anything we brought. As a result, they work well together: money provides resources, while time builds relationships.", 1], ["★ 講義 7+ 句型", "By + V-ing, people can…, which…"], ["填補缺口", "fill gaps"], ["救災", "disaster relief"], ["金錢買不到的東西", "something money can't buy"]]}, {"label": "Q6 Who do you think benefits more,…", "tone": "neu", "items": [["題目", "Who do you think benefits more, the volunteers or the people they help?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "I'd say the volunteers, at least in the long run. The people being helped get immediate, practical support, which obviously matters. But volunteering is also a rewarding experience, and volunteers often gain something that lasts longer, like empathy and a new sense of what's important. For example, when I taught in Lesotho, I probably learned more than the children did. A boy who didn't want to join in at first loved drawing, and he gave me a picture on my last day. It taught me that connection comes before content. Ideally, of course, both sides benefit.", 1], ["★ 有收穫的經驗", "a rewarding experience"], ["★ 關係子句 who", "a boy who didn't want to join in"], ["長遠來看", "in the long run"], ["實質的幫助", "practical support"]]}], "acc": ["#6a9e3f", "#96c46e"]}, {"zh": "有趣的鄰居", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 How well do people usually know…", "tone": "neu", "items": [["題目", "How well do people usually know their neighbors in your country?"], ["新撰寫・一般論述・講義修訂", "It really depends on where you live. In the countryside and older neighbourhoods, people often know each other well and chat at the local market or temple. In Taipei's apartment buildings, though, many people hardly recognise the people next door. This is mainly because everyone is busy, so the main point of contact is often the building's security guard. That said, building committees and LINE groups keep some connection alive, even if they're mostly about rubbish collection and repairs.", 1], ["★ 講義 Part 3 架構", "This is mainly because…"], ["聯絡窗口", "point of contact"], ["維繫", "keep something alive"], ["幾乎認不出", "hardly recognise"]]}, {"label": "Q2 Is it more difficult for neighbo…", "tone": "neu", "items": [["題目", "Is it more difficult for neighbors to get to know each other in large cities?"], ["新撰寫・含個人素材（素材：當業餘健身教練的室內設計師鄰居）・講義修訂", "Generally, yes. This is mainly because people in cities work long hours, have long commutes and move often, so they have little time to get to know their neighbours. Living in tall buildings also means fewer chance meetings; you might share a lift for thirty seconds and that's it. That said, it isn't impossible. For example, my family is close to the family next door. Their older son is my age and their twins are the same age as my younger sister, so our two families often go out together. As a result, I think having something in common, like children of similar ages, really helps.", 1], ["★ 有共同點", "have something in common"], ["認識", "get to know"], ["偶然碰面", "chance meetings"], ["同搭電梯", "share a lift"]]}, {"label": "Q3 What are the benefits of living…", "tone": "neu", "items": [["題目", "What are the benefits of living in a place where neighbors know each other well?"], ["新撰寫・含個人素材（素材：Oakley（我的狗））・講義修訂", "The most obvious one is safety. When neighbours recognise each other, they notice strangers or unusual activity, which helps prevent crime. There's also mutual support: someone can water your plants or check on an elderly neighbour. For example, we have a dog, Oakley, so knowing a neighbour who could look after him while we're away would be a real comfort. People in close communities also feel a stronger sense of belonging. The only potential downside is less privacy, because everyone tends to know everyone else's business.", 1], ["★ 感受到歸屬感", "feel a sense of belonging"], ["★ 潛在缺點", "a potential downside"], ["互相支援", "mutual support"], ["照顧", "look after"]]}, {"label": "Q4 What can people do to make their…", "tone": "neu", "items": [["題目", "What can people do to make their neighborhood a better place to live?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "Small actions add up. By keeping shared spaces clean, keeping noise down and greeting neighbours, people can make the area friendlier, which makes everyone feel more at home. Supporting local shops also keeps the area lively. On a bigger level, people can push for better parks. I grew up near a riverside park, so I see green space as something a city really needs, not just a nice extra. I'd even make green corridors compulsory in big cities. Of course, that needs long-term planning, not just goodwill.", 1], ["★ 講義 7+ 句型", "By + V-ing, people can…, which…"], ["積少成多", "small actions add up"], ["爭取、推動", "push for"], ["長期規劃", "long-term planning"]]}, {"label": "Q5 How can businesses help support…", "tone": "neu", "items": [["題目", "How can businesses help support local communities?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Businesses can not only hire local people but also buy from local suppliers, which keeps money in the area. They can also sponsor community events or school programmes. For example, I work as a data engineer at a telecom and analytics company, and during COVID, location data like ours was used for contact tracing. That was a much bigger contribution than a donation. As a result, I think the key is real involvement rather than doing it just for good publicity, while also protecting people's personal information.", 1], ["★ 講義 7+ 句型", "not only… but also…, which…"], ["★ 個人資訊", "personal information"], ["疫調、接觸者追蹤", "contact tracing"], ["而不是……", "… rather than…"]]}, {"label": "Q6 What negative effects does moder…", "tone": "neu", "items": [["題目", "What negative effects does modern technology have on local communities?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Technology can make people physically present but mentally somewhere else. Instead of chatting with neighbours outside, many people tend to spend their evenings on screens because it's easier. Online shopping has also had a negative impact on local shops, which used to be places where neighbours met. I'm guilty of this myself. In my open-plan office I wear noise-cancelling headphones so I can focus, but it does put a small barrier between me and the people around me. Still, neighbourhood LINE groups organise help quickly during typhoons, so it's a double-edged sword.", 1], ["★ 講義 7+ 句型", "Instead of + V-ing, people tend to… because…"], ["★ 對……造成負面影響", "have a negative impact on"], ["降噪耳機", "noise-cancelling headphones"], ["雙面刃", "a double-edged sword"]]}], "acc": ["#7f6ad0", "#a292e0"]}, {"zh": "聊得來的朋友", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What do young people usually tal…", "tone": "neu", "items": [["題目", "What do young people usually talk about with their friends?"], ["新撰寫・含個人素材（素材：Stranger Things）・講義修訂", "Their conversations tend to revolve around things they have in common, like gaming, K-pop, sports and whatever series everyone is watching. But with close friends, young people also talk about relationships, stress and worries about the future. For example, I binge-watched the first season of Stranger Things in two days during a stressful time, and what stayed with me was the loyalty between the friends, not the horror. As a result, I think fun topics are how they start, but deeper topics keep them close. Many of these conversations now happen through memes and voice messages rather than face to face.", 1], ["★ 有共同點", "have something in common"], ["圍繞著", "revolve around"], ["追劇、狂看", "binge-watch"], ["而不是……", "… rather than…"]]}, {"label": "Q2 Do you think talking face to fac…", "tone": "neu", "items": [["題目", "Do you think talking face to face is always better than talking on the phone or online?"], ["相近題・可延用（F3-198）・講義修訂", "Not always, but usually for important conversations. Face-to-face communication carries tone, body language and eye contact, which words alone can miss. On the other hand, talking online is faster and more convenient, and it leaves a record. However, a major drawback is that it can make us feel connected while making our relationships less deep. For example, you can message a hundred people and still feel lonely. So whether talking face to face is better depends on what you're talking about.", 1], ["★ 主要缺點", "a major drawback"], ["★ 講義 7+ 句型", "Whether… depends on…"], ["肢體語言", "body language"], ["留下紀錄", "leave a record"]]}, {"label": "Q3 Why is it important to listen ca…", "tone": "neu", "items": [["題目", "Why is it important to listen carefully when talking with friends?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "Because listening is how people feel valued. If you're just waiting for your turn to speak, friends can tell, and eventually they stop sharing anything important. Careful listening also helps you notice what isn't said. For example, a close friend from choir and I once sat on a two-hour train ride through Tuscany without speaking, and it wasn't awkward at all. That kind of comfort comes from really knowing each other. As a result, good listening helps friends develop mutual trust. I'd say a good listener is rarer than a good talker.", 1], ["★ 建立相互信任", "develop mutual trust"], ["感到被重視", "feel valued"], ["等著輪到自己說話", "wait for your turn to speak"], ["好的傾聽者", "a good listener"]]}, {"label": "Q4 In what situations do people nee…", "tone": "neu", "items": [["題目", "In what situations do people need to talk to strangers in daily life?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "Quite often, actually. People ask for directions, deal with shop assistants and taxi drivers, or call customer service. At work, meeting clients or new colleagues means talking to strangers all the time. This is mainly because daily life depends on lots of small services. I learned this quickly when I organised my high-school choir's competition trip to Italy. When our bus was late or the concert hall's sound wasn't right, I had to sort things out with people I'd never met. And in emergencies, asking strangers for help becomes essential.", 1], ["★ 講義 Part 3 架構", "This is mainly because…"], ["問路", "ask for directions"], ["把事情處理好", "sort things out"], ["從未見過的人", "people I'd never met"]]}, {"label": "Q5 Why do some people find it hard…", "tone": "neu", "items": [["題目", "Why do some people find it hard to talk to people they don’t know?"], ["新撰寫・含個人素材（素材：學英文：Friends 與 About Time）・講義修訂", "Shyness and social anxiety are the main reasons. People worry about saying something awkward or being judged. Culture plays a part too. Taiwanese children are often told not to talk to strangers, and that habit can last into adulthood. Language barriers matter as well. For example, when I started watching Friends without Chinese subtitles, I missed about sixty per cent of the jokes, so I understand how scary real conversations with foreigners can feel. As a result, many people are reluctant to start a conversation, and since apps do so much now, they get even less practice.", 1], ["★ 不願意……", "be reluctant to + V"], ["社交焦慮", "social anxiety"], ["被評判", "being judged"], ["語言障礙", "language barriers"]]}, {"label": "Q6 Do people talk to strangers the…", "tone": "neu", "items": [["題目", "Do people talk to strangers the same way they talk to friends?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "Not at all. Compared with talking to friends, people are more likely to be polite and formal with strangers rather than relaxed, and they stick to safe topics. With friends, we use slang, inside jokes and teasing that might seem rude to an outsider. Real friendship even makes silence easy. For example, on a train through Tuscany, a choir friend and I didn't talk for two hours, but it wasn't awkward at all. With a stranger, that would probably feel uncomfortable. That said, people who are warm and friendly can make strangers feel like friends quite quickly.", 1], ["★ 講義 7+ 句型", "Compared with…, … more likely to… rather than…"], ["★ 關係子句 who", "people who are warm and friendly"], ["自己人才懂的笑話", "inside jokes"], ["只聊安全話題", "stick to safe topics"]]}], "acc": ["#d08a3a", "#e0aa6b"]}, {"zh": "別人詢問你意見", "en": "Part 3 · 人物與人際關係", "groups": [{"label": "Q1 What kinds of jobs often require…", "tone": "neu", "items": [["題目", "What kinds of jobs often require people to give their opinions?"], ["新撰寫・含個人素材（素材：物流科技創業者（化名 Wei））・講義修訂", "Consultants, critics and analysts are paid mostly for their opinions, and doctors and lawyers give professional advice that clients rely on heavily. This is true in tech as well. For example, when I advised a logistics start-up on a data project, the founder kept asking what would break first if traffic tripled. So my whole job was to give a clear, well-reasoned view on whether the system could grow. As a result, the more senior you become in any field, the more people pay for your opinion.", 1], ["★ 講義 7+ 句型", "The more…, the more…"], ["高度依賴", "rely on heavily"], ["有理有據的看法", "a well-reasoned view"], ["因……拿報酬", "be paid for"]]}, {"label": "Q2 Do people give their opinions ab…", "tone": "neu", "items": [["題目", "Do people give their opinions about products and services more frequently nowadays?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Definitely. Almost every purchase is now followed by a request to rate the product, the delivery and even the customer service chat. This is mainly because platforms like Google Maps and Shopee make reviewing so easy, with just one click. Personally, I dislike adverts that exaggerate what a product can do, so I can see why people trust other customers' opinions more. However, a major drawback is that people are asked so often that many ignore these requests, unless they're either very happy or really angry.", 1], ["★ 主要缺點", "a major drawback"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["只要按一下", "with just one click"], ["誇大", "exaggerate"]]}, {"label": "Q3 Why do some people not like givi…", "tone": "neu", "items": [["題目", "Why do some people not like giving their opinion?"], ["新撰寫・含個人素材（素材：我的主管）・講義修訂", "Some people are reluctant to give their opinion because they're afraid of conflict or being judged, especially if their view goes against the majority. This is mainly because, in Taiwanese culture, harmony and saving face matter a lot, so people may stay quiet rather than risk offending someone, especially a boss. A good manager can change that. For example, mine actively analyses problems with me and protects me from unreasonable tasks, so I feel comfortable raising issues. Others, though, simply lack confidence and worry they don't know enough about the topic.", 1], ["★ 不願意……", "be reluctant to + V"], ["顧面子", "saving face"], ["與多數人意見相反", "go against the majority"], ["保護某人免於", "protect someone from"]]}, {"label": "Q4 What do people usually write abo…", "tone": "neu", "items": [["題目", "What do people usually write about in online reviews?"], ["新撰寫・含個人素材（素材：中山區精品小店的外套）・講義修訂", "Mostly service quality, value for money and whether a product matches its description. Restaurant reviews cover food, portion sizes and staff attitude, while hotel reviews focus on cleanliness and location. Bad experiences make people want to write much more than good ones, so many reviews are complaints. But value isn't always about price. For example, a coat I bought in a small shop in Zhongshan cost far more than my budget, but it's what I wear most, so it's now worth the money. Reviews rarely show that long-term view.", 1], ["★ 物有所值", "value for money"], ["★ 值得花這筆錢", "worth the money"], ["份量", "portion sizes"], ["跟描述相符", "match its description"]]}, {"label": "Q5 Do people express their opinions…", "tone": "neu", "items": [["題目", "Do people express their opinions more strongly online than in face-to-face situations?"], ["新撰寫・含個人素材（素材：遠距離戀愛）・講義修訂", "Generally, yes. This is mainly because when people are anonymous and far away, they can't see the other person's reaction, so they don't soften their words. Also, algorithms reward extreme, emotional posts with more attention. Face to face, most people are far more polite. However, online communication isn't always harsh. For example, my boyfriend and I are in a long-distance relationship, and we send each other photos of what we're eating almost every day. It's a simple way to stay in touch. As a result, I think the internet makes whatever people bring to it bigger, good or bad.", 1], ["★ 保持聯絡", "stay in touch"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["說話放軟", "soften their words"], ["遠距離戀愛", "a long-distance relationship"]]}, {"label": "Q6 To what extent do online opinion…", "tone": "neu", "items": [["題目", "To what extent do online opinions reflect the general opinions of society?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Only partly. This is mainly because online opinions come mostly from people who are young, active on social media and have strong views. The quiet majority rarely posts. Also, what we see is influenced by algorithms, which push the most extreme voices, so debates look much more divided online than in real life. Fake accounts make it even worse. As someone who works with data, I'd call it a classic sampling problem. As a result, online trends are a useful sign, but they don't represent the whole of society.", 1], ["★ 受……影響", "be influenced by"], ["★ 關係子句 who", "people who are young…"], ["沉默的大多數", "the quiet majority"], ["代表", "represent"]]}], "acc": ["#c09227", "#d9b155"]}, {"zh": "想再去一次的城市", "en": "Part 3 · 地點、建築、旅遊與交通", "groups": [{"label": "Q1 What’s the difference between li…", "tone": "neu", "items": [["題目", "What’s the difference between living in the city and in the countryside?"], ["相近題・可延用（錄音逐字稿 Family & Society Q3）・講義修訂", "I think living in a big city usually exposes people to a wide range of cultures and lifestyles, which can make them more open-minded. Cities also offer more career opportunities and entertainment, although the fast pace of life can feel stressful. In contrast, people in the countryside often live in close communities, so it's easier for neighbours to know and support each other. As a result, cities offer more variety and opportunities, while the countryside gives a stronger sense of community and a more relaxed lifestyle.", 1], ["★ 接觸到", "be exposed to"], ["★ 心胸開放的", "open-minded"], ["社區歸屬感", "a sense of community"], ["快節奏生活", "the fast pace of life"]]}, {"label": "Q2 Do you think living in the count…", "tone": "neu", "items": [["題目", "Do you think living in the countryside is healthier than living in a city?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "In some ways, yes, but it isn't that simple. The countryside usually has cleaner air, less noise and a slower pace of life, which I'd say lowers stress. However, people in cities have much better access to healthcare. For example, growing up in Neihu showed me you can get some of both. There are hiking trails and riverside parks right next to the tech park, though rush-hour traffic and scooters are a daily downside. As a result, the countryside is better for everyday health, but cities win when you actually need treatment.", 1], ["★ 能取得、使用", "have access to"], ["較慢的生活步調", "a slower pace of life"], ["尖峰時段車潮", "rush-hour traffic"], ["每天都有的缺點", "a daily downside"]]}, {"label": "Q3 Do people in the countryside soc…", "tone": "neu", "items": [["題目", "Do people in the countryside socialize more than those in cities?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "Generally, yes, though it's a different kind of socialising. In villages, people know their neighbours and run into each other at the temple or market, while in cities people often don't even know who lives next door. This is mainly because city people tend to make friends through things they have in common instead. For example, one of my best friends isn't a neighbour at all. We met in the first week of high school choir and became close after we both failed the same high note. As a result, rural life offers more frequent contact, while city life offers more choice.", 1], ["★ 有共同點", "have something in common"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["巧遇", "run into"], ["更頻繁的接觸", "more frequent contact"]]}, {"label": "Q4 What makes a city attractive to…", "tone": "neu", "items": [["題目", "What makes a city attractive to visitors?"], ["相近題・可延用（F3-098）・講義修訂", "I think there are three main things. First, a city needs a clear identity, like its own food, architecture or history, which makes it different from other places. This is mainly because visitors want experiences they can't get at home. Second, a city that looks good in photos attracts more travellers, especially through social media and recommendations from friends. Finally, cost and transport matter. As a result, cities where visitors have easy access to public transport and affordable hotels are usually more popular.", 1], ["★ 容易取得／使用", "have easy access to"], ["★ 負擔得起的", "affordable"], ["★ 關係子句 that", "a city that looks good in photos"], ["鮮明的特色", "a clear identity"]]}, {"label": "Q5 Some people say large cities are…", "tone": "neu", "items": [["題目", "Some people say large cities are more suitable for old people.Do you agree?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "To a large extent, I'd agree. In big cities, older people have easy access to hospitals, reliable public transport and home delivery, so they can stay independent without driving. However, what cities often lack is green space that's easy to reach, which matters a lot for older people. That's partly why I'd support a law requiring green corridors in every city with over half a million people. As a result, cities are more suitable in practical terms, but only if they treat nature as something essential, not an optional extra.", 1], ["★ 容易取得／使用", "have easy access to"], ["保持獨立自主", "stay independent"], ["綠色廊道", "green corridors"], ["可有可無的附加物", "an optional extra"]]}, {"label": "Q6 What are the differences between…", "tone": "neu", "items": [["題目", "What are the differences between cities now and 20 years ago?"], ["新撰寫・含個人素材（素材：台北101）・講義修訂", "Quite big ones, at least in Taiwan. Compared with twenty years ago, Taipei has far more MRT lines now, and YouBike stations are everywhere. Daily life has also gone digital, from mobile payments to real-time bus apps. Taipei 101 has become the city's most famous landmark. Personally, I'm not moved by its design, but when I see it, I know I'm nearly home. However, a major drawback is that housing has become much less affordable, which I'd say matters more than any shiny new building.", 1], ["★ 與……相比", "Compared with…"], ["★ 主要缺點", "a major drawback"], ["★ 負擔得起的", "affordable"], ["數位化", "go digital"]]}], "acc": ["#9366c8", "#b28fdb"]}, {"zh": "安靜的地方", "en": "Part 3 · 地點、建築、旅遊與交通", "groups": [{"label": "Q1 What are some places people go t…", "tone": "neu", "items": [["題目", "What are some places people go to when they want peace and quiet?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Most people go to nature, like mountain trails or hot spring towns such as Beitou. Others find quiet in libraries, temples or a riverside park early in the morning. Interestingly, some people don't go anywhere at all. In my case, noise-cancelling headphones help me reduce distractions and stay focused in an open-plan office, so I can find calm without leaving my desk. I'd say the key isn't the place itself. It's being somewhere nobody expects anything from you, even for an hour.", 1], ["★ 減少干擾", "reduce distractions"], ["★ 保持專注", "stay focused"], ["降噪耳機", "noise-cancelling headphones"], ["開放式辦公室", "open-plan office"]]}, {"label": "Q2 Why do some people enjoy noisy r…", "tone": "neu", "items": [["題目", "Why do some people enjoy noisy restaurants more than quiet ones?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "Mostly because noise creates atmosphere. A lively restaurant shows that the food is popular, and a bit of background noise makes people less worried about others hearing their conversation. Think of a Taiwanese hot pot place on a Friday night. Even though I'm fairly introverted, I prefer going with friends for trips or special outings, because it's livelier and more memorable. However, whether people choose a noisy or quiet place depends on the occasion. For a serious conversation or a first date, most people would still choose somewhere calmer.", 1], ["★ 講義 7+ 句型", "Whether… or… depends on…"], ["營造氣氛", "create atmosphere"], ["背景的聲音", "background noise"], ["難忘的", "memorable"]]}, {"label": "Q3 Do you agree that there’s more n…", "tone": "neu", "items": [["題目", "Do you agree that there’s more noise outside cities than inside them?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Not really. I'd say the opposite is usually true. Since cities have much more traffic, construction and crowds, they're noisy all day, resulting in a much higher noise level overall. For example, where I live in Neihu, rush hour brings a constant stream of scooters and traffic jams. That said, the countryside isn't silent. It just has a different kind of noise, like insects, frogs and roosters at dawn. As a result, rural areas may have some loud sounds, but cities have a background hum that you can never fully escape.", 1], ["★ 講義 7+ 句型", "Since…, …, resulting in…"], ["源源不絕的", "a constant stream of"], ["塞車", "traffic jams"], ["背景嗡嗡聲", "background hum"]]}, {"label": "Q4 Do you think silence is necessar…", "tone": "neu", "items": [["題目", "Do you think silence is necessary for someone to fully relax?"], ["新撰寫・含個人素材（素材：合唱團好友）・講義修訂", "Not necessarily. Whether people relax better in silence or with some background sound depends on their personality. Some people find silence calming, but for others it leads to overthinking, so they relax better with music, rain or the sounds of a café. The kind of silence matters too. For example, on a two-hour train ride through Tuscany with my choir friend, we barely spoke, and it felt completely comfortable rather than awkward. As a result, silence you choose can be relaxing, while noise that is forced on you is stressful even at a low level.", 1], ["★ 講義 7+ 句型", "Whether… or… depends on…"], ["想太多", "overthinking"], ["而不是……", "… rather than…"], ["強加在你身上", "forced on you"]]}, {"label": "Q5 Why do some people believe it’s…", "tone": "neu", "items": [["題目", "Why do some people believe it’s helpful for students to study in complete silence?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Mainly because silence helps students reduce distractions and stay focused. Difficult tasks like maths or memorising need long periods of focus, and even small interruptions can break it. Taiwanese parents also tend to link a silent study room with discipline. I understand the logic. Although I listen to instrumental music when I'm focusing, I keep things completely quiet when I'm debugging, because that's when I need every bit of concentration. However, students are different, so making silence a rule for everyone ignores different learning styles.", 1], ["★ 減少干擾", "reduce distractions"], ["★ 保持專注", "stay focused"], ["★ 講義 7+ 句型", "Although…, … because…"], ["學習方式", "learning styles"]]}, {"label": "Q6 What do you think about the idea…", "tone": "neu", "items": [["題目", "What do you think about the idea that teachers should sometimes stay silent and just listen to their students?"], ["新撰寫・含個人素材（素材：S01 賴索托志工）・講義修訂", "I strongly support it. This is mainly because when teachers listen, they discover what students actually misunderstand, rather than what they assume. Students who feel heard are also much more willing to try. For example, when I volunteered in Lesotho at seventeen, one boy sat at the back and refused to join in. Only after some one-on-one time did I find out he loved drawing, which finally brought him into the lessons. As a result, he became one of the most active students. Of course, teachers still need to guide, so listening shouldn't become an excuse for having no structure.", 1], ["★ 關係子句 who", "students who feel heard"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["一對一的時間", "one-on-one time"], ["……的藉口", "an excuse for"]]}, {"label": "Q1 Why is the countryside generally…", "tone": "neu", "items": [["題目", "Why is the countryside generally quieter than cities?"], ["新撰寫・含個人素材（素材：倫敦聖誕節塞車）・講義修訂", "Mostly because fewer people live there. Since there are fewer people, there are fewer cars, construction sites and businesses, resulting in much less noise. Cities, by contrast, are busy around the clock. I noticed this in London at Christmas. Near Piccadilly Circus, the traffic was so bad that a five-minute bus ride took almost an hour, and the driver eventually let everyone off halfway. That said, places near highways or factories can be surprisingly noisy, so it's really about human activity rather than location.", 1], ["★ 講義 7+ 句型（本題正好是 why 題）", "Since…, …, resulting in…"], ["日夜不停", "around the clock"], ["讓某人下車", "let someone off"], ["而不是……", "… rather than…"]]}, {"label": "Q2 Is it easy to find a quiet place…", "tone": "neu", "items": [["題目", "Is it easy to find a quiet place in a big city?　（原題：在大城市裡找到安靜的地方容易嗎?）"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Easier than people think, if you know where to look. Taipei has libraries, temples, riverside parks and small alleys just a block from main roads, which feel surprisingly calm. The problem is that these places are often crowded, and homes are rarely silent because the walls are thin. That's why I rely on noise-cancelling headphones at work. They help me reduce distractions, even in an open-plan office. As a result, quiet places do exist, but they're often short escapes rather than something you can count on.", 1], ["★ 減少干擾", "reduce distractions"], ["依靠", "rely on"], ["依賴、指望", "count on"], ["而不是……", "… rather than…"]]}, {"label": "Q3 Do older people prefer quiet pla…", "tone": "neu", "items": [["題目", "Do older people prefer quiet places more than younger people do?"], ["新撰寫・含個人素材（素材：周天成羽球比賽）・講義修訂", "On the whole, yes, though it's not true for everyone. As people get older, their hearing often gets worse, so they struggle to follow a conversation when there's background noise. However, plenty of older people in Taiwan love noisy places, like morning markets, temple festivals and karaoke. For example, when Chou Tien-chen played at the Olympics, my whole family watched in the living room and gasped together when he saved a match point. As a result, it's less about age and more about whether the noise feels friendly or tiring.", 1], ["★ 很難做到……", "struggle to + V"], ["整體而言", "on the whole"], ["倒抽一口氣", "gasp"], ["與其說是……不如說是……", "less about… and more about…"]]}, {"label": "Q4 Are homes nowadays noisier than…", "tone": "neu", "items": [["題目", "Are homes nowadays noisier than they used to be?"], ["新撰寫・含個人素材（素材：狗狗撞壞手機）・講義修訂", "In some ways, yes. More people live in crowded apartment buildings, so they're exposed to more noise from neighbours, lifts and traffic. Homes are also full of devices, like TVs, phone notifications and robot vacuums, which create a constant low hum. In my case, my phone once made such a loud noise that it scared my dog, who jumped up and knocked it onto the floor, and it broke. On the other hand, modern buildings often have better soundproofing, so the type of noise has changed rather than simply increased.", 1], ["★ 接觸到、暴露於", "be exposed to"], ["★ 關係子句 who", "my dog, who jumped up…"], ["持續低沉的嗡嗡聲", "a constant low hum"], ["而不是……", "… rather than…"]]}, {"label": "Q5 Why do many people prefer to hav…", "tone": "neu", "items": [["題目", "Why do many people prefer to have some kind of noise when they are studying or working?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Partly because total silence can feel strangely uncomfortable. It makes people notice every small sound. Steady background music covers those distractions and gives a sense of rhythm. For example, I use music to manage my mood: instrumental tracks when I need to stay focused, ONE OK ROCK when I need energy, and Lizzy McAlpine when I'm tired. That said, for the hardest problems, like debugging, I prefer silence. As a result, I'd say background noise helps with routine work more than with complex thinking.", 1], ["★ 保持專注", "stay focused"], ["調整心情", "manage my mood"], ["節奏感", "a sense of rhythm"], ["例行工作", "routine work"]]}, {"label": "Q6 What are some problems that nois…", "tone": "neu", "items": [["題目", "What are some problems that noisy neighbors can cause?"], ["新撰寫・含個人素材（素材：音樂與降噪耳機）・講義修訂", "Quite serious ones, actually. The most obvious is poor sleep, which over time has a negative impact on people's health, mood and work. Ongoing noise is also a constant source of stress, because you can't control it. In Taiwan's apartment buildings, arguments over renovation noise or late-night karaoke are common. Personally, I use noise-cancelling headphones to focus in our open-plan office, and I need silence when I'm debugging, so I can imagine how tiring noise at home would be. In extreme cases, it even pushes people to move.", 1], ["★ 對……造成負面影響", "have a negative impact on"], ["★ 持續的壓力來源", "a constant source of stress"], ["降噪耳機", "noise-cancelling headphones"], ["逼人搬家", "push people to move"]]}], "acc": ["#cf6b7f", "#e094a4"]}, {"zh": "鄉村一隅", "en": "Part 3 · 地點、建築、旅遊與交通", "groups": [{"label": "Q1 What are some special villages i…", "tone": "neu", "items": [["題目", "What are some special villages in your country that people like to visit?"], ["新撰寫・含個人素材（素材：個性與休閒）・講義修訂", "Taiwan has quite a few. Jiufen is probably the most famous. It's an old gold-mining town which is full of narrow lanes, teahouses and red lanterns. Shifen is known for its sky lanterns, and Hakka villages like Beipu attract visitors with lei cha and traditional buildings. However, the popular ones can feel quite crowded and commercial. On holiday, I like a slow pace rather than a packed schedule. Although the famous villages are fun, I prefer the quieter ones because they feel more relaxing and authentic.", 1], ["窄巷", "narrow lanes"], ["慢步調而不是滿檔行程", "a slow pace rather than a packed schedule"], ["★ 講義 7+ 句型", "Although…, I prefer… because…"], ["道地的", "authentic"]]}, {"label": "Q2 What kind of natural views can p…", "tone": "neu", "items": [["題目", "What kind of natural views can people usually enjoy in the countryside?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "In Taiwan, there's a lot of variety for such a small island, like rice terraces, tea farms on misty hills and beautiful coastlines in the east. Compared with cities, the countryside has much less light pollution, so at night people can see the stars rather than just street lights. Rural views abroad can be just as memorable. For example, I still remember taking the train through Tuscany on a choir competition trip, past cypress trees, red-roofed farmhouses and vineyards. Of course, the views also change with the seasons. The rice fields are greenest in spring and golden before harvest.", 1], ["梯田", "rice terraces"], ["★ 講義 7+ 句型", "Compared with…, … rather than…"], ["光害", "light pollution"], ["葡萄園", "vineyards"]]}, {"label": "Q3 Where do people like to visit in…", "tone": "neu", "items": [["題目", "Where do people like to visit in the countryside?"], ["新撰寫・含個人素材（素材：高中合唱團：義大利與法國比賽）・講義修訂", "Where people go usually depends on their age and the season. Families often go to leisure farms, where kids can pick strawberries. Younger people prefer hiking trails and mountain cafés, while older people enjoy hot springs and tea-growing areas like Alishan. This is mainly because they all want to slow down and relieve stress. I understand this feeling myself. For example, with my school choir, I took a train through Tuscany, past cypress trees, red-roofed farmhouses and vineyards, and I still remember how calm it felt. As a result, places with fresh air and good food are usually the most popular.", 1], ["休閒農場", "leisure farm"], ["★ 講義 Part 3 架構", "This is mainly because…"], ["★ 紓解壓力（講義搭配詞）", "relieve stress"], ["★ 講義 Part 3 架構", "As a result, …"]]}, {"label": "Q4 Do you think everyone likes the…", "tone": "neu", "items": [["題目", "Do you think everyone likes the countryside?"], ["新撰寫・含個人素材（素材：個人基本資料）・講義修訂", "Definitely not. Many people enjoy the countryside for a short trip, but they're reluctant to live there. This is mainly because rural areas have limited public transport, fewer jobs and very little nightlife. Some people also dislike insects, mud or feeling isolated. For example, I love taking my dog to the riverside park, but I'd struggle to live without the convenience of the city. My ideal is a slower-paced city which still has good facilities, like Tainan or Kyoto. As a result, most people like the idea of the countryside more than actually living there.", 1], ["★ 不願意（講義，本題指定）", "be reluctant to"], ["★ 很難做到（講義）", "struggle to"], ["步調較慢的", "slower-paced"], ["生活機能好", "good facilities"]]}, {"label": "Q5 What are the advantages and disa…", "tone": "neu", "items": [["題目", "What are the advantages and disadvantages of living in the countryside?"], ["相近題・可延用（F3-097）・講義修訂", "Living in the countryside has clear advantages. The air is cleaner, life is slower and people have more space, which can help them relieve stress. For example, when I volunteered in Lesotho, the evenings were so quiet that I had space to think. However, a major drawback is that people in rural areas may not have easy access to good jobs, schools or healthcare. Public transport is also limited, so people struggle to get around without a car. As a result, I think the countryside suits people who want a peaceful life rather than young people who are building their careers.", 1], ["★ 主要缺點（講義 14 天片語）", "a major drawback"], ["★ 容易取得（講義，本題指定）", "have easy access to"], ["★ 紓解壓力（講義）", "relieve stress"], ["★ 很難做到（講義）", "struggle to"]]}, {"label": "Q6 Do people travel to the countrys…", "tone": "neu", "items": [["題目", "Do people travel to the countryside more now than they did in the past?"], ["新撰寫・含個人素材（素材：想推動的法律）・講義修訂", "I'd say yes, much more. Since roads and high-speed rail have improved, rural areas are much easier to reach, resulting in more weekend trips. Social media has also turned unknown villages into popular places to visit. COVID played a role too, because people couldn't travel abroad, so they explored Taiwan instead. This shows how much city people need nature, which is why I'd like every big city to have green corridors, like the riverside parks along the Tamsui River. However, most trips are short and by car, so people may not connect with the countryside as deeply as before.", 1], ["★ 講義 7+ 句型", "Since…, …, resulting in…"], ["熱門景點", "popular places to visit"], ["綠色廊道", "green corridors"], ["與……建立連結", "connect with"]]}], "acc": ["#4b82c4", "#7dabdf"]}, {"zh": "交通擁堵的時刻", "en": "Part 3 · 地點、建築、旅遊與交通", "groups": [{"label": "Q1 When is the traffic usually the…", "tone": "neu", "items": [["題目", "When is the traffic usually the worst in most cities?"], ["新撰寫・含個人素材（素材：倫敦聖誕節塞車）・講義修訂", "Usually during rush hour, which is roughly 7:30 to 9 in the morning and 5:30 to 7 in the evening. This is mainly because people are going to work and parents are taking their kids to school at the same time. In Taipei, rain makes everything wo
